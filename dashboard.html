<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        .icon-card {
            background: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e5e7eb;
        }
        .icon-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: #3b82f6;
        }
        .icon-wrapper {
            transition: transform 0.3s ease;
        }
        .icon-card:hover .icon-wrapper {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<a href="https://hammad57.github.io/POS/index.html" class="top-home-btn" title="Go to Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    Home
</a>

<style>
    .top-home-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: linear-gradient(135deg, #4f46e5, #3b82f6);
        color: #ffffff !important;
        text-decoration: none !important;
        padding: 10px 20px;
        border-radius: 50px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        z-index: 9999;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .top-home-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        background: linear-gradient(135deg, #4338ca, #2563eb);
        color: #ffffff !important;
    }

    .top-home-btn svg {
        width: 18px;
        height: 18px;
    }

    /* Mobile screens ke liye thoda adjust karne ke liye */
    @media (max-width: 768px) {
        .top-home-btn {
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            font-size: 14px;
        }
    }
</style>
    <nav class="bg-slate-900 text-white p-4 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-6">
            <a href="https://hammad57.github.io/POS/index.html" target="_self" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full flex items-center font-medium transition-all shadow-lg active:scale-95">
                <i class="fas fa-house-chimney mr-2"></i> Home
            </a>
            <div class="h-8 w-[1px] bg-slate-700 hidden md:block"></div>
            <h1 class="text-lg font-bold tracking-widest uppercase hidden sm:block">POS System Control</h1>
        </div>
        <div id="status" class="flex items-center text-xs font-mono text-green-400">
            <span class="relative flex h-2 w-2 mr-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
            SYSTEM LIVE
        </div>
    </nav>

    <div class="container mx-auto p-8">
        <div id="dashboard-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-8">
            
            <div onclick="toggleModal(true)" class="cursor-pointer border-2 border-dashed border-indigo-300 rounded-3xl flex flex-col items-center justify-center p-6 text-indigo-500 hover:bg-indigo-50 hover:border-indigo-500 transition-all min-h-[160px] group">
                <div class="bg-indigo-100 p-4 rounded-full group-hover:bg-indigo-200 transition-colors">
                    <i class="fas fa-plus text-3xl"></i>
                </div>
                <span class="mt-4 font-bold text-sm">New Module</span>
            </div>

            </div>
    </div>

    <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-indigo-600 p-6 text-white text-center">
                <i class="fas fa-cube text-4xl mb-2"></i>
                <h2 class="text-xl font-bold">Add Dynamic Icon</h2>
            </div>
            
            <div class="p-8 space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Module Name</label>
                    <input type="text" id="itemName" placeholder="e.g. Orders, Stock, Sales..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Target Link</label>
                    <input type="url" id="itemLink" placeholder="https://..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                </div>
                
                <div class="flex space-x-3 pt-4">
                    <button onclick="saveToFirebase()" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">CREATE ICON</button>
                    <button onclick="toggleModal(false)" class="flex-1 bg-gray-100 text-gray-600 py-4 rounded-xl font-bold hover:bg-gray-200 transition-all">CLOSE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function getIconClass(name) {
            const n = name.toLowerCase();
            if (n.includes('order') || n.includes('cart') || n.includes('buy')) return 'fa-basket-shopping';
            if (n.includes('sale') || n.includes('bill') || n.includes('invoice')) return 'fa-file-invoice-dollar';
            if (n.includes('stock') || n.includes('inventory') || n.includes('item')) return 'fa-boxes-stacked';
            if (n.includes('user') || n.includes('customer') || n.includes('staff')) return 'fa-user-gear';
            if (n.includes('report') || n.includes('chart') || n.includes('stat')) return 'fa-chart-pie';
            if (n.includes('setting') || n.includes('config')) return 'fa-sliders';
            if (n.includes('cash') || n.includes('money') || n.includes('pay')) return 'fa-money-bill-transfer';
            if (n.includes('food') || n.includes('menu')) return 'fa-utensils';
            if (n.includes('print')) return 'fa-print';
            
            return 'fa-shapes';
        }

        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            modal.classList.toggle('hidden', !show);
            if(!show) {
                document.getElementById('itemName').value = '';
                document.getElementById('itemLink').value = '';
            }
        }

        function saveToFirebase() {
            const name = document.getElementById('itemName').value;
            const link = document.getElementById('itemLink').value;

            if (name && link) {
                database.ref('pos_icons').push({
                    name: name,
                    link: link
                }).then(() => toggleModal(false));
            } else {
                alert("Donon boxes bharna lazmi hain!");
            }
        }

        database.ref('pos_icons').on('value', (snapshot) => {
            const grid = document.getElementById('dashboard-grid');
            // Hum "New Module" button ko mehfooz rakhte hain
            const addButton = grid.firstElementChild.outerHTML;
            grid.innerHTML = addButton;

            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                const iconType = getIconClass(data.name);
                
                // TAB FIX: Yahan 'target="_blank"' ko hata kar 'target="_self"' kar diya hy
                const iconHtml = `
                    <a href="${data.link}" target="_self" class="icon-card rounded-3xl p-6 flex flex-col items-center justify-center text-center">
                        <div class="icon-wrapper w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl flex items-center justify-center mb-4 shadow-md shadow-indigo-100">
                            <i class="fas ${iconType} text-2xl"></i>
                        </div>
                        <span class="font-bold text-slate-700 text-sm tracking-tight break-words w-full">${data.name}</span>
                    </a>
                `;
                grid.innerHTML += iconHtml;
            });
        });
    </script>
<script>
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () {
        window.location.href = "https://hammad57.github.io/POS/index.html";
    };
</script>
</body>
</html>
