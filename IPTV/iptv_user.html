<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional IPTV Player</title>
    <!-- Clappr Player Script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --primary: #3b82f6;
            --text-light: #f8fafc;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }
        
        /* Login Screen */
        #login-screen { display: flex; height: 100vh; justify-content: center; align-items: center; }
        .login-box { background-color: var(--bg-panel); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box h2 { margin-bottom: 1.5rem; text-align: center; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; background-color: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #2563eb; }
        .btn-danger { background-color: var(--danger); width: auto; padding: 0.5rem 1rem; }
        
        /* Main App Screen */
        #app-screen { display: none; height: 100vh; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: var(--bg-panel); border-bottom: 1px solid #334155; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar (Channels) */
        .sidebar { width: 300px; background-color: var(--bg-panel); overflow-y: auto; border-right: 1px solid #334155; }
        .channel-item { padding: 1rem; border-bottom: 1px solid #334155; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .channel-item:hover { background-color: #334155; }
        .channel-icon { width: 40px; height: 40px; background: #0f172a; border-radius: 4px; object-fit: contain; }
        
        /* Video Area */
        .player-area { flex: 1; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .video-container { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: black; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #status-msg { margin-top: 1rem; color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2>IPTV Portal</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" value="hammad" />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" value="hammad789" />
            </div>
            <div class="input-group">
                <label>Server URL</label>
                <input type="text" id="server" value="http://myott.to:8080" />
            </div>
            <button class="btn" onclick="login()">Login</button>
            <p id="login-error" style="color: var(--danger); margin-top: 10px; text-align: center; display: none;">Login Failed.</p>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen">
        <header>
            <h2>My IPTV Dashboard</h2>
            <div>
                <span id="user-info" style="margin-right: 20px; font-weight: bold;"></span>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="sidebar" id="channel-list">
                <div style="padding: 20px; text-align: center; color: #94a3b8;">Loading channels...</div>
            </div>
            
            <div class="player-area">
                <!-- Clappr Player Div -->
                <div class="video-container" id="player-wrapper"></div>
                
                <h3 id="current-channel-name" style="margin-top: 1.5rem;">Select a channel to play</h3>
                <p id="status-msg"></p>
            </div>
        </div>
    </div>

    <script>
        let player = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginState();
        });

        function checkLoginState() {
            const storedUser = localStorage.getItem('iptv_user');
            if (storedUser) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('user-info').innerText = `Welcome, ${localStorage.getItem('iptv_username')}`;
                fetchChannels();
            }
        }

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            let url = document.getElementById('server').value;
            
            if(url.endsWith('/')) url = url.slice(0, -1);
            const authUrl = `${url}/player_api.php?username=${user}&password=${pass}`;

            try {
                const response = await fetch(authUrl);
                const data = await response.json();

                if (data && data.user_info && data.user_info.auth === 1) {
                    localStorage.setItem('iptv_user', 'true');
                    localStorage.setItem('iptv_username', user);
                    localStorage.setItem('iptv_password', pass);
                    localStorage.setItem('iptv_server', url);
                    
                    document.getElementById('login-error').style.display = 'none';
                    checkLoginState();
                } else {
                    showError("Invalid Credentials");
                }
            } catch (error) {
                showError("Network Error. CORS might be blocking the request.");
            }
        }

        function logout() {
            localStorage.clear();
            if(player) {
                player.destroy();
                player = null;
            }
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('channel-list').innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">Loading channels...</div>';
            document.getElementById('current-channel-name').innerText = "Select a channel to play";
            document.getElementById('status-msg').innerText = "";
        }

        function showError(msg) {
            const err = document.getElementById('login-error');
            err.innerText = msg;
            err.style.display = 'block';
        }

        async function fetchChannels() {
            const user = localStorage.getItem('iptv_username');
            const pass = localStorage.getItem('iptv_password');
            const server = localStorage.getItem('iptv_server');
            
            const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
            
            try {
                const response = await fetch(apiUrl);
                const channels = await response.json();
                
                const sidebar = document.getElementById('channel-list');
                sidebar.innerHTML = ''; 

                const displayChannels = channels.slice(0, 100); 

                if(displayChannels.length === 0) {
                    sidebar.innerHTML = '<div style="padding: 20px;">No channels found.</div>';
                    return;
                }

                displayChannels.forEach(channel => {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    
                    // Standard Xtream HLS Format
                    const streamUrl = `${server}/live/${user}/${pass}/${channel.stream_id}.m3u8`;
                    
                    div.onclick = () => playStream(streamUrl, channel.name);
                    
                    const iconUrl = channel.stream_icon ? channel.stream_icon : 'https://via.placeholder.com/40x40?text=TV';
                    
                    div.innerHTML = `
                        <img src="${iconUrl}" class="channel-icon" onerror="this.src='https://via.placeholder.com/40x40?text=TV'">
                        <div>
                            <div style="font-weight: bold; font-size: 0.95rem;">${channel.name}</div>
                            <div style="font-size: 0.8rem; color: #94a3b8;">ID: ${channel.stream_id}</div>
                        </div>
                    `;
                    sidebar.appendChild(div);
                });
                
            } catch (error) {
                document.getElementById('channel-list').innerHTML = '<div style="padding: 20px; color: var(--danger);">Failed to load channels.</div>';
            }
        }

        function playStream(url, name) {
            document.getElementById('current-channel-name').innerText = `Playing: ${name}`;
            document.getElementById('status-msg').innerText = "Connecting...";
            document.getElementById('status-msg').style.color = "#facc15";

            // Purana player remove karein agar chal raha ho
            if (player) {
                player.destroy();
            }

            // Naya Clappr instance banayein
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: '100%',
                height: '100%',
                autoPlay: true,
                mute: false,
                events: {
                    onPlay: function() {
                        document.getElementById('status-msg').innerText = "Live";
                        document.getElementById('status-msg').style.color = "#22c55e"; 
                    },
                    onError: function(e) {
                        console.error("Playback error:", e);
                        document.getElementById('status-msg').innerText = "Error: CORS Block ya Channel Offline hy.";
                        document.getElementById('status-msg').style.color = "var(--danger)";
                    }
                }
            });
        }
    </script>
</body>
</html>
