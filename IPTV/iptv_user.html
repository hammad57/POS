<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Premium IPTV</title>
    
    <!-- Tailwind CSS (Aap ki user.html ki tarah) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Libraries (user.html wali same versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- HLS.js Library: IPTV streams (m3u8) play karne ke liye -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body { 
            background-color: #0f172a; /* Dark theme TV ke liye best hai */
            color: #f8fafc;
            margin: 0;
            overflow: hidden; /* TV par body scroll rokne ke liye */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Android TV Remote (D-Pad) Focus Navigation Styling */
        .focusable:focus, .focusable:hover {
            outline: 3px solid #10b981; /* Emerald outline jaise user.html mein thi */
            background-color: #1e293b;
            transform: scale(1.02);
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header Section -->
    <header class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-bold text-emerald-400">📺 Live Streams Portal</h1>
        <button id="authBtn" class="focusable text-sm bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded font-bold transition" tabindex="1">
            Login
        </button>
    </header>

    <!-- Main App Layout -->
    <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
        
        <!-- Channels List Section (Mobile pe pehle, TV/Desktop pe left side) -->
        <div class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col h-1/2 md:h-auto order-2 md:order-1">
            <div class="p-4 border-b border-slate-800">
                <input type="text" id="searchInput" class="focusable w-full bg-slate-800 text-white rounded px-3 py-2 text-sm focus:outline-none placeholder-slate-400 border border-slate-700" placeholder="Search channels..." tabindex="2">
            </div>
            
            <!-- Channels List Container -->
            <div id="channelList" class="flex-1 overflow-y-auto custom-scroll p-2 space-y-2">
                <!-- Ye channels Firebase Database se aayenge -->
                <p class="text-slate-400 text-center mt-4 text-xs italic">Connecting to Firebase...</p>
            </div>
        </div>

        <!-- Video Player Section (TV/Desktop pe right side) -->
        <div class="flex-1 bg-black flex flex-col items-center justify-center p-0 md:p-4 order-1 md:order-2 relative">
            <div class="w-full h-full bg-slate-950 md:rounded-xl overflow-hidden shadow-2xl relative border border-slate-800 flex items-center justify-center">
                
                <video id="videoPlayer" class="focusable w-full h-full object-contain z-10" controls tabindex="3"></video>
                
                <!-- Player Placeholder (Jab koi channel select na ho) -->
                <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0">
                    <span class="text-6xl mb-2">🎬</span>
                    <p class="text-sm">Select a channel from the list to play</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 1. Firebase Configuration (user.html wali same config)
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web-default.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/",
            projectId: "own-live-steam-web-default",
            storageBucket: "own-live-steam-web-default.appspot.com",
            messagingSenderId: "xxxxxxxxxxx",
            appId: "xxxxxxxxxxx"
        };

        // 2. Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 3. Video Player Setup (HLS.js)
        const video = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('playerPlaceholder');
        let hls; // Global variable taa ke purani stream destroy ki ja sake

        function playChannel(streamUrl) {
            placeholder.style.display = 'none'; // Placeholder chupayen
            
            if (hls) {
                hls.destroy(); // Agar pehle se koi channel chal raha hai to usay band karein
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For native HLS support (jaise Apple devices Safari mein)
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                alert("Your device doesn't support this IPTV stream format.");
            }
        }

        // Demo Channel Test function
        // playChannel("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8");
    </script>
</body>
</html>
