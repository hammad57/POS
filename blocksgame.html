<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Block Blast Pro</title>
<style>
  :root{
    --bg1:#0b0f1e; --bg2:#1a1140;
    --panel:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12);
    --text:#eef2ff; --muted:#9aa4c7;
    --gold:#ffc83d; --ok:#34d399; --bad:#f43f5e; --cyan:#22d3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--text);
    background:
      radial-gradient(1200px 800px at 10% -10%,#2b1f6b 0,transparent 60%),
      radial-gradient(900px 700px at 110% 110%,#0f4c5c 0,transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none;
  }
  .hidden{display:none !important}
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite}
  .orb.a{width:340px;height:340px;background:#7c5cff;top:-80px;left:-60px}
  .orb.b{width:300px;height:300px;background:#22d3ee;bottom:-90px;right:-60px;animation-delay:-6s}
  .orb.c{width:220px;height:220px;background:#f472b6;top:40%;left:55%;animation-delay:-11s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.1)}}

  .app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px;max-width:520px;margin:0 auto}
  header{width:100%;display:flex;align-items:center;justify-content:space-between}
  .brand h1{font-size:clamp(20px,5vw,28px);letter-spacing:2px;font-weight:800;
    background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9,#fff);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
  @keyframes shimmer{to{background-position:300% 0}}
  .brand small{color:var(--muted);font-size:11px;letter-spacing:3px}
  .right{display:flex;gap:8px}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    cursor:pointer;font-size:18px;backdrop-filter:blur(8px);transition:transform .15s,background .2s}
  .iconbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}

  .glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .userbar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
  .user{display:flex;align-items:center;gap:10px;min-width:0}
  .avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:grid;place-items:center;font-weight:800;
    background:conic-gradient(#7c5cff,#22d3ee,#f472b6,#7c5cff);box-shadow:0 0 16px rgba(124,92,255,.6)}
  #username{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
  .sline{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#facc15;color:#facc15;box-shadow:0 0 8px currentColor;transition:background .3s}
  .dot.ok{background:var(--ok);color:var(--ok)}
  .dot.err{background:var(--bad);color:var(--bad)}
  .coinbox{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--gold)}
  .coin{width:20px;height:20px;border-radius:50%;display:inline-block;flex:0 0 20px;
    background:radial-gradient(circle at 30% 30%,#fff7b0,#ffc83d 45%,#b7791f);box-shadow:inset 0 0 0 2px #b7791f,0 0 10px rgba(255,200,61,.5)}
  .bump{animation:bump .4s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  .muted{color:var(--muted);font-size:13px}

  /* ---------- MAP ---------- */
  #mapScreen{width:100%;display:flex;flex-direction:column;gap:12px}
  .moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mood-btn{padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-weight:800;letter-spacing:1px;cursor:pointer;transition:transform .15s,box-shadow .2s}
  .mood-btn:hover{transform:translateY(-2px)}
  .mood-btn.on{background:linear-gradient(135deg,#7c5cff,#22d3ee);border-color:transparent;box-shadow:0 8px 22px rgba(124,92,255,.45)}
  .mapinfo{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .mapinfo b{font-size:17px}
  .stage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding-bottom:30px}
  .tile{position:relative;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:18px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .2s;backdrop-filter:blur(8px)}
  .tile:hover{transform:translateY(-3px)}
  .tile i{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:12px}
  .tile.done{background:linear-gradient(145deg,#34d399,#0d9488);border-color:transparent;box-shadow:0 6px 16px rgba(52,211,153,.35)}
  .tile.next{border-color:var(--cyan);animation:pulse 1.8s infinite}
  .tile.locked{opacity:.45}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.45)}50%{box-shadow:0 0 0 5px rgba(34,211,238,.15),0 0 26px rgba(34,211,238,.7)}}

  /* ---------- GAME ---------- */
  #gameScreen{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
  .stagebar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stagechip{padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px}
  .mood-badge{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px;font-size:11px;letter-spacing:2px}
  .hard{background:linear-gradient(90deg,#f43f5e,#fb923c);padding:3px 9px;border-radius:999px;font-size:11px;letter-spacing:2px;
    box-shadow:0 0 14px rgba(244,63,94,.6);animation:pulse-red 1.2s infinite}
  @keyframes pulse-red{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{text-align:center;padding:10px 6px}
  .stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}
  .stat b{font-size:22px;font-weight:800}

  .board-wrap{position:relative;padding:10px;border-radius:22px;width:min(92vw,400px);touch-action:none;
    background:rgba(10,12,30,.55);border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(124,92,255,.15);transition:box-shadow .2s}
  .board-wrap.targeting{box-shadow:0 0 0 2px var(--cyan),0 0 30px rgba(34,211,238,.5)}
  .board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;aspect-ratio:1}
  .cell{border-radius:7px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4);transition:background .15s}
  .cell.filled{background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.35)}
  .cell.filled.black{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 3px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.6)}
  .cell.preview{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
  .cell.pop{animation:pop .32s ease}
  .cell.clearing{animation:clear .34s forwards}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes clear{0%{transform:scale(1);filter:brightness(1.7)}100%{transform:scale(.1);opacity:0}}
  .board-wrap.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  .tray-title{color:var(--muted);font-size:13px;letter-spacing:1px}
  .tray{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .slot{display:grid;place-items:center;min-height:120px;border-radius:16px;background:var(--panel);
    border:1px dashed var(--line);touch-action:none;cursor:grab;transition:transform .2s,opacity .2s}
  .slot:hover{transform:translateY(-3px)}
  .slot.used{opacity:.2;pointer-events:none}
  .slot.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.2) both}
  .slot.nope{animation:nope .35s}
  @keyframes enter{from{transform:translateY(24px) scale(.8);opacity:0}to{transform:none;opacity:1}}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shape{display:grid}
  .mini{border-radius:5px;background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
  .mini.black{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 2px 0 rgba(255,255,255,.12)}
  .mini.empty{background:none;box-shadow:none}

  .items{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
  .item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;transition:transform .15s,box-shadow .2s}
  .item:hover{transform:translateY(-2px)}
  .item .ie{font-size:24px}
  .item .in{font-size:12px;font-weight:700;letter-spacing:1px}
  .item .ic{font-size:12px;color:var(--gold);font-weight:800}
  .item.armed{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.5),0 0 18px rgba(34,211,238,.5);animation:pulse 1.4s infinite}
  .item.empty{opacity:.5}

  .ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.95;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
  .particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:40;animation:burst .75s ease-out forwards}
  @keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
  .popup{position:fixed;transform:translateX(-50%);font-weight:900;font-size:24px;color:var(--gold);
    text-shadow:0 0 14px rgba(255,200,61,.7);pointer-events:none;z-index:45;animation:up .9s ease-out forwards}
  @keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);z-index:70;
    background:rgba(15,18,40,.95);border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:14px;
    max-width:90vw;text-align:center;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .overlay{position:fixed;inset:0;background:rgba(5,6,15,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;padding:16px}
  .card{padding:28px 24px;width:min(90vw,380px);text-align:center;animation:pop-in .5s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop-in{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{font-size:26px;letter-spacing:2px;margin-bottom:8px;background:linear-gradient(90deg,#fff,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{padding:12px 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff;
    font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 24px rgba(124,92,255,.45);transition:transform .15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghostbtn{background:var(--panel);border:1px solid var(--line);box-shadow:none}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.small{padding:8px 12px;font-size:13px}

  .shoplist{display:flex;flex-direction:column;gap:10px;margin:14px 0;text-align:left}
  .shopcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .shopcard .se{font-size:30px;width:44px;text-align:center}
  .sinfo{flex:1;display:flex;flex-direction:column;gap:2px}
  .sinfo b{font-size:15px}
  .sinfo small{color:var(--muted);font-size:12px}
  .shopcoins{font-weight:800;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px}
  .final{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .final small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}
  .final b{font-size:20px}

  @media (max-width:380px){ .tray{gap:6px} .slot{min-height:100px} .stage-grid{gap:7px} }
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<div class="app">
  <header>
    <div class="brand"><h1>BLOCK BLAST</h1><small>PRO EDITION</small></div>
    <div class="right">
      <button class="iconbtn" id="shopBtn" title="Shop">🛒</button>
      <button class="iconbtn" id="mapBtn" title="Stage map">🗺️</button>
      <button class="iconbtn" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <div class="glass userbar">
    <div class="user">
      <div class="avatar" id="avatar">?</div>
      <div style="min-width:0">
        <div id="username">Loading…</div>
        <div class="sline"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      </div>
    </div>
    <div class="coinbox"><span class="coin"></span><span id="coins">0</span></div>
  </div>

  <!-- MAP SCREEN -->
  <section id="mapScreen" class="hidden">
    <div class="moods">
      <button class="mood-btn" data-mood="easy">EASY</button>
      <button class="mood-btn" data-mood="medium">MEDIUM</button>
      <button class="mood-btn" data-mood="hard">HARD</button>
    </div>
    <div class="glass mapinfo">
      <div>
        <b id="mapProgress">Cleared 0 / 100</b>
        <div class="muted" id="mapBest">Best score: 0</div>
      </div>
      <div class="muted" style="text-align:right" id="moodDesc"></div>
    </div>
    <div id="stageGrid" class="stage-grid"></div>
  </section>

  <!-- GAME SCREEN -->
  <section id="gameScreen" class="hidden">
    <div class="stagebar">
      <div class="glass stagechip">
        <span id="stageLabel">STAGE 1</span>
        <span id="moodBadge" class="mood-badge">EASY</span>
        <span id="hardBadge" class="hard hidden">HARD STAGE</span>
      </div>
      <button class="iconbtn" id="restartBtn" title="Restart stage">↻</button>
    </div>

    <div class="stats">
      <div class="glass stat"><small>SCORE</small><b id="score">0</b></div>
      <div class="glass stat"><small>TARGET</small><b id="target">0</b></div>
      <div class="glass stat"><small>BLASTS</small><b id="lines">0</b></div>
    </div>

    <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>

    <div class="tray-title">Block ko board par drag karein</div>
    <div class="tray" id="tray"></div>

    <div class="items" id="items"></div>
  </section>
</div>

<div id="ghost" class="ghost hidden"></div>
<div id="toast" class="toast"></div>

<!-- STAGE FAILED -->
<div id="failOverlay" class="overlay hidden">
  <div class="glass card">
    <h2>STAGE FAILED</h2>
    <p class="muted" id="failText"></p>
    <div class="btnrow">
      <button class="btn" id="failRetry">Retry</button>
      <button class="btn ghostbtn" id="failMap">Map</button>
    </div>
  </div>
</div>

<!-- STAGE CLEAR -->
<div id="winOverlay" class="overlay hidden">
  <div class="glass card">
    <h2 id="winTitle">STAGE CLEAR!</h2>
    <p class="muted" id="winText"></p>
    <div class="btnrow">
      <button class="btn" id="winNext">Next Stage</button>
      <button class="btn ghostbtn" id="winMap">Map</button>
    </div>
  </div>
</div>

<!-- SHOP -->
<div id="shopOverlay" class="overlay hidden">
  <div class="glass card">
    <h2>SHOP</h2>
    <div class="shopcoins"><span class="coin"></span><span id="shopCoins">0</span></div>
    <div class="shoplist" id="shopList"></div>
    <div class="btnrow"><button class="btn ghostbtn" id="shopClose">Close</button></div>
  </div>
</div>

<script>
/* ==================== CONFIG ==================== */
const DB_URL  = "https://dailytasktracker-1851b-default-rtdb.firebaseio.com";
const DB_PATH = "/blockblast/players";
const DATA_KEY = "bb_data";      // whole account + current game, saved on the device
const N = 8;
const BLACK = 5;                 // black blocks: never match in a line, only power-ups break them
const COLOR_COUNT = 5;           // 1 Red, 2 Yellow, 3 Green, 4 Blue, 5 Black
const STAGE_COUNT = 100;
const ITEM_PRICE = 600;

const COLORS = [
  ["#ff5b6e", "#b5122e"],   // 1 Red
  ["#ffe066", "#e09a00"],   // 2 Yellow
  ["#6ee07a", "#15803d"],   // 3 Green
  ["#6cb8ff", "#1d4ed8"],   // 4 Blue
  ["#4b5063", "#050608"]    // 5 Black
];

// Easy keeps the current game feel. Medium and Hard mix colours inside pieces
// and bring more hard stages, hard waves and stones.
const MOODS = {
  easy:   { name: "Easy",   desc: "Aasan mode",           mixChance: 0,    hardStageChance: 0.20, waveChance: 0.07, targetMul: 1.00, obstacleMul: 1.0 },
  medium: { name: "Medium", desc: "Kabhi kabhi rang mix", mixChance: 0.35, hardStageChance: 0.20, waveChance: 0.10, targetMul: 1.10, obstacleMul: 1.2 },
  hard:   { name: "Hard",   desc: "Zyada tar rang mix",   mixChance: 0.75, hardStageChance: 0.35, waveChance: 0.15, targetMul: 1.30, obstacleMul: 1.5 }
};

// X = block, . = empty, | = new row
const SHAPE_DEFS = [
  "X","XX","XXX","XXXX","XXXXX",
  "X|X","X|X|X","X|X|X|X",
  "XX|XX","XX|X.","XX|.X","X.|X.|XX","XX|X.|X.",
  "XXX|.X.","XX.|.XX",".XX|XX.","XXX|X..","XXX|..X","XXX|XX.","XXX|XXX"
];

const ITEMS = {
  hammer:    { emoji: "🔨", name: "Hammer",    desc: "Ek block tod deta hai (black bhi)" },
  lightning: { emoji: "⚡", name: "Lightning", desc: "Block ki poori row aur column saaf" },
  bomb:      { emoji: "💣", name: "Bomb",      desc: "Block ke aas paas 3x3 area saaf" }
};

const ADJ  = ["Swift","Brave","Lucky","Crimson","Silent","Turbo","Neon","Cosmic","Golden","Shadow","Frost","Solar"];
const NOUN = ["Tiger","Falcon","Panda","Wolf","Phoenix","Otter","Lynx","Raven","Dragon","Hawk","Fox","Bear"];

/* ==================== HELPERS ==================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const SHAPES = SHAPE_DEFS.map(def => {
  const rows = def.split("|");
  const w = Math.max(...rows.map(r => r.length));
  const h = rows.length;
  const cells = [];
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === "X") cells.push([r, c]); }));
  return { w, h, cells };
});

function makePiece(mixChance) {
  const s = SHAPES[rnd(SHAPES.length)];
  const piece = { w: s.w, h: s.h, cells: s.cells.map(p => [...p]), color: 1 + rnd(COLOR_COUNT) };
  if (mixChance && Math.random() < mixChance) {
    piece.colors = piece.cells.map(() => 1 + rnd(COLOR_COUNT));   // mixed-colour piece
  }
  return piece;
}
function colorOf(piece, k) { return piece.colors ? piece.colors[k] : piece.color; }
function newTray(mixChance) { return [makePiece(mixChance), makePiece(mixChance), makePiece(mixChance)]; }
function emptyGrid() { return Array.from({ length: N }, () => Array(N).fill(0)); }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randomName() { return ADJ[rnd(ADJ.length)] + NOUN[rnd(NOUN.length)] + (100 + rnd(900)); }
function makeId() {
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

let toastT = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 1900);
}

/* ==================== FIREBASE (REST) ==================== */
async function dbGet(id) {
  const r = await fetch(`${DB_URL}${DB_PATH}/${id}.json`);
  if (!r.ok) throw new Error("GET " + r.status);
  return r.json();
}
async function dbPut(id, data) {
  const r = await fetch(`${DB_URL}${DB_PATH}/${id}.json`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error("PUT " + r.status);
}

/* ==================== AUDIO ==================== */
let AC = null;
let muted = localStorage.getItem("bb_muted") === "1";
let musicTimer = null, musicStep = 0;

function ctx() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
  }
  return AC;
}
function tone(f, d = 0.12, type = "sine", vol = 0.15, slideTo = null, delay = 0) {
  const a = ctx();
  if (!a || muted) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination);
  o.start(t);
  o.stop(t + d + 0.03);
}
const sfx = {
  pick:    () => tone(660, .06, "sine", .12),
  place:   () => { tone(300, .09, "triangle", .22, 520); tone(600, .05, "sine", .08, null, .02); },
  clear:   (n, streak) => {
    const base = [523, 659, 784, 1046, 1318];
    for (let i = 0; i < Math.min(5, n + 2); i++) tone(base[i], .22, "sine", .16, null, i * .06);
    if (streak > 1) tone(1568, .3, "triangle", .12, null, .25);
  },
  invalid: () => tone(140, .16, "square", .07, 90),
  boom:    () => tone(120, .45, "sawtooth", .2, 40),
  zap:     () => { tone(1400, .08, "square", .08, 300); tone(900, .12, "triangle", .1, 200, .05); },
  win:     () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .3, "triangle", .18, null, i * .12)),
  over:    () => [392, 330, 262, 196].forEach((f, i) => tone(f, .35, "sawtooth", .09, null, i * .2))
};
const chords = [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (muted || !AC) return;
    const ch = chords[Math.floor(musicStep / 3) % chords.length];
    tone(ch[musicStep % 3], .7, "sine", .035);
    musicStep++;
  }, 380);
}
function unlockAudio() {
  const a = ctx();
  if (a && a.state === "suspended") a.resume();
  if (!muted) startMusic();
}
document.addEventListener("pointerdown", unlockAudio);
function refreshMuteButton() { $("muteBtn").textContent = muted ? "🔇" : "🔊"; }
$("muteBtn").addEventListener("click", () => {
  muted = !muted;
  localStorage.setItem("bb_muted", muted ? "1" : "0");
  refreshMuteButton();
  if (!muted) unlockAudio();
});

/* ==================== STATE ==================== */
let uid = null;
let data = null;      // { profile, game, updatedAt, dirty } - everything is kept on the device first
let profile = null;   // = data.profile
let S = null;         // current stage
let busy = false;
let syncT = null;
let autoNext = null;

function newProfile() {
  return {
    name: randomName(), coins: 0, bestScore: 0, gamesPlayed: 0, totalLines: 0,
    progress: { easy: 0, medium: 0, hard: 0 }, mood: "easy",
    items: { hammer: 0, lightning: 0, bomb: 0 }, createdAt: Date.now()
  };
}
function normalizeProfile() {
  const d = newProfile();
  profile.name = profile.name || d.name;
  profile.coins = profile.coins || 0;
  profile.bestScore = profile.bestScore || 0;
  profile.gamesPlayed = profile.gamesPlayed || 0;
  profile.totalLines = profile.totalLines || 0;
  profile.progress = Object.assign({ easy: 0, medium: 0, hard: 0 }, profile.progress || {});
  if (typeof profile.cleared === "number") {           // migrate old single-progress saves
    profile.progress.easy = Math.max(profile.progress.easy, profile.cleared);
    delete profile.cleared;
  }
  if (!MOODS[profile.mood]) profile.mood = "easy";
  profile.items = Object.assign({ hammer: 0, lightning: 0, bomb: 0 }, profile.items || {});
}
function curProgress() { return profile.progress[profile.mood]; }

/* ==================== SAVE (device first, then Firebase) ==================== */
function persistLocal() { localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(DATA_KEY) || "null"); } catch (e) { return null; }
}

// Called after every change. Saves on the device immediately, then tries Firebase.
function touch() {
  data.profile = profile;
  data.game = (S && !S.over) ? JSON.stringify(S) : null;
  data.updatedAt = Date.now();
  data.dirty = true;
  persistLocal();
  setStatus(navigator.onLine ? "saving" : "offline");
  clearTimeout(syncT);
  syncT = setTimeout(syncNow, 1200);
}

async function syncNow() {
  if (!uid || !data || !data.dirty) return;
  if (!navigator.onLine) { setStatus("offline"); return; }
  const stamp = data.updatedAt;
  const payload = { profile: data.profile, game: data.game || null, updatedAt: stamp };
  try {
    await dbPut(uid, payload);
    if (data.updatedAt === stamp) { data.dirty = false; persistLocal(); }
    setStatus("synced");
  } catch (e) {
    console.warn(e);
    setStatus("offline");
  }
}

function setStatus(kind) {
  const map = {
    connecting: ["Connecting…", ""],
    saving:     ["Saving…", ""],
    synced:     ["Synced to cloud", "ok"],
    offline:    ["Offline – data device par save ho raha hai", "err"]
  };
  $("statusText").textContent = map[kind][0];
  $("dot").className = "dot " + map[kind][1];
}

/* ==================== BOARD / TRAY UI ==================== */
const boardEl = $("board");
const cellEls = [];
for (let i = 0; i < N * N; i++) {
  const d = document.createElement("div");
  d.className = "cell";
  boardEl.appendChild(d);
  cellEls.push(d);
}

function renderBoard() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = S.grid[r][c];
    const el = cellEls[r * N + c];
    if (v) {
      if (el.dataset.v !== String(v)) {
        el.style.setProperty("--c1", COLORS[v - 1][0]);
        el.style.setProperty("--c2", COLORS[v - 1][1]);
        el.dataset.v = v;
      }
      el.classList.toggle("black", v === BLACK);
      el.classList.add("filled");
    } else {
      el.classList.remove("filled", "black", "pop", "clearing");
      delete el.dataset.v;
    }
  }
}

function shapeEl(piece, size, gap) {
  const wrap = document.createElement("div");
  wrap.className = "shape";
  wrap.style.gridTemplateColumns = `repeat(${piece.w}, ${size}px)`;
  wrap.style.gap = gap + "px";
  const idxMap = new Map(piece.cells.map(([r, c], k) => [r * piece.w + c, k]));
  for (let r = 0; r < piece.h; r++) for (let c = 0; c < piece.w; c++) {
    const el = document.createElement("div");
    const k = idxMap.get(r * piece.w + c);
    el.style.width = el.style.height = size + "px";
    if (k === undefined) {
      el.className = "mini empty";
    } else {
      const col = colorOf(piece, k);
      el.className = "mini" + (col === BLACK ? " black" : "");
      el.style.setProperty("--c1", COLORS[col - 1][0]);
      el.style.setProperty("--c2", COLORS[col - 1][1]);
    }
    wrap.appendChild(el);
  }
  return wrap;
}

function renderTray(enter = false) {
  const t = $("tray");
  t.innerHTML = "";
  S.tray.forEach((p, i) => {
    const slot = document.createElement("div");
    slot.className = "slot" + (enter && p ? " enter" : "");
    slot.dataset.idx = i;
    slot.style.animationDelay = (i * 0.08) + "s";
    if (p) slot.appendChild(shapeEl(p, 26, 3));
    else slot.classList.add("used");
    t.appendChild(slot);
  });
}

function renderItems() {
  const box = $("items");
  box.innerHTML = "";
  Object.keys(ITEMS).forEach(k => {
    const b = document.createElement("button");
    b.className = "item" + (S && S.armed === k ? " armed" : "") + (profile.items[k] < 1 ? " empty" : "");
    b.dataset.key = k;
    b.innerHTML = `<span class="ie">${ITEMS[k].emoji}</span><span class="in">${ITEMS[k].name}</span><span class="ic">x${profile.items[k]}</span>`;
    box.appendChild(b);
  });
  $("boardWrap").classList.toggle("targeting", !!(S && S.armed));
}

function cellRect(r, c) { return cellEls[r * N + c].getBoundingClientRect(); }

/* ==================== RULES ==================== */
function canPlace(piece, r, c) {
  if (!piece) return false;
  return piece.cells.every(([dr, dc]) => {
    const rr = r + dr, cc = c + dc;
    return rr >= 0 && rr < N && cc >= 0 && cc < N && S.grid[rr][cc] === 0;
  });
}
function anyFit(pieces) {
  for (const p of pieces) {
    if (!p) continue;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (canPlace(p, r, c)) return true;
  }
  return false;
}

// A blast is a straight line (horizontal or vertical) of 3+ same-colour blocks that
// goes through a newly placed block AND reaches at least one block already on the board.
// Black blocks never blast this way.
function findClears(placed) {
  const placedSet = new Set(placed);
  const seen = new Set();
  const set = new Set();
  let groups = 0;

  const tryRun = cells => {
    if (cells.length < 3) return;
    if (!cells.some(i => !placedSet.has(i))) return;   // a lone new piece never blasts
    const key = cells.join(",");
    if (seen.has(key)) return;
    seen.add(key);
    groups++;
    cells.forEach(i => set.add(i));
  };

  for (const p of placed) {
    const r = Math.floor(p / N), c = p % N;
    const v = S.grid[r][c];
    if (!v || v === BLACK) continue;

    let a = c, b = c;
    while (a - 1 >= 0 && S.grid[r][a - 1] === v) a--;
    while (b + 1 < N && S.grid[r][b + 1] === v) b++;
    const h = [];
    for (let k = a; k <= b; k++) h.push(r * N + k);
    tryRun(h);

    let top = r, bot = r;
    while (top - 1 >= 0 && S.grid[top - 1][c] === v) top--;
    while (bot + 1 < N && S.grid[bot + 1][c] === v) bot++;
    const vert = [];
    for (let k = top; k <= bot; k++) vert.push(k * N + c);
    tryRun(vert);
  }
  return { groups, cells: [...set] };
}

// Black blocks dropped onto the board (stones / hard waves)
function addBlack(k) {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (S.grid[r][c] === 0) empty.push([r, c]);
  for (let i = empty.length - 1; i > 0; i--) { const j = rnd(i + 1); [empty[i], empty[j]] = [empty[j], empty[i]]; }
  empty.slice(0, k).forEach(([r, c]) => { S.grid[r][c] = BLACK; });
}

/* ==================== STAGES ==================== */
function stageTarget(n, hard, M) { return Math.round((150 + n * 35) * M.targetMul * (hard ? 1.25 : 1)); }

// Same layout every time a stage is played (seeded), so cleared stages look the same
function baseBlack(n, M) {
  const rng = mulberry32(n * 7919 + 17);
  const cells = [];
  for (let r = 3; r < N; r++) for (let c = 0; c < N; c++) cells.push(r * N + c);
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  const count = Math.min(14, Math.round(Math.min(10, Math.floor(n / 6)) * M.obstacleMul));
  return cells.slice(0, count);
}

function startStage(n) {
  const M = MOODS[profile.mood];
  const hard = Math.random() < M.hardStageChance;
  S = {
    stage: n, mood: profile.mood, hard,
    target: stageTarget(n, hard, M),
    grid: emptyGrid(), tray: newTray(M.mixChance),
    score: 0, streak: 0, moves: 0, over: false, gameCoins: 0, armed: null
  };
  baseBlack(n, M).forEach(i => { S.grid[Math.floor(i / N)][i % N] = BLACK; });
  if (hard) addBlack(4);
  busy = false;
  $("winOverlay").classList.add("hidden");
  $("failOverlay").classList.add("hidden");
  clearTimeout(autoNext);
  showScreen("game");
  renderBoard();
  renderTray(true);
  updateUI();
  touch();
  if (hard) toast("⚠ HARD STAGE! Target barha diya gaya hai");
}

function openStage(n) {
  if (n > curProgress() + 1) {
    toast(`Pehle Stage ${curProgress() + 1} clear karein (${MOODS[profile.mood].name})`);
    return;
  }
  if (S && !S.over && S.stage === n && S.mood === profile.mood) { showScreen("game"); return; }
  startStage(n);
}

function stageClear() {
  S.over = true;
  const first = S.stage > profile.progress[S.mood];
  const reward = first ? 100 + S.stage * 5 + (S.hard ? 100 : 0) : 20;
  if (first) profile.progress[S.mood] = S.stage;
  profile.coins += reward;
  S.gameCoins += reward;
  sfx.win();

  const last = S.stage >= STAGE_COUNT;
  $("winTitle").textContent = `STAGE ${S.stage} CLEAR!`;
  $("winText").textContent = (last ? "Tamam 100 stages complete! " : "") +
    `+${reward} coins${S.hard && first ? " (Hard bonus!)" : ""}`;
  $("winNext").textContent = last ? "Map par jao" : "Next Stage";
  $("winOverlay").classList.remove("hidden");
  clearTimeout(autoNext);
  if (!last) autoNext = setTimeout(nextStage, 3000);
  updateUI();
  touch();
}

function nextStage() {
  clearTimeout(autoNext);
  $("winOverlay").classList.add("hidden");
  if (S.stage >= STAGE_COUNT) { showMap(); return; }
  startStage(S.stage + 1);
}

function gameOver() {
  S.over = true;
  busy = false;
  profile.gamesPlayed++;
  sfx.over();
  $("failText").textContent = `Stage ${S.stage} · Score ${S.score} / ${S.target}. Dobara try karein!`;
  $("failOverlay").classList.remove("hidden");
  updateUI();
  touch();
}

function showScreen(which) {
  $("mapScreen").classList.toggle("hidden", which !== "map");
  $("gameScreen").classList.toggle("hidden", which !== "game");
  window.scrollTo(0, 0);
}

function showMap() {
  clearTimeout(autoNext);
  $("winOverlay").classList.add("hidden");
  $("failOverlay").classList.add("hidden");
  renderMap();
  showScreen("map");
}

function renderMap() {
  document.querySelectorAll(".mood-btn").forEach(b => b.classList.toggle("on", b.dataset.mood === profile.mood));
  $("moodDesc").textContent = MOODS[profile.mood].desc;
  $("mapProgress").textContent = `${MOODS[profile.mood].name}: Cleared ${curProgress()} / ${STAGE_COUNT}`;
  $("mapBest").textContent = `Best score: ${profile.bestScore}`;
  const g = $("stageGrid");
  g.innerHTML = "";
  const done = curProgress();
  for (let n = 1; n <= STAGE_COUNT; n++) {
    const st = n <= done ? "done" : (n === done + 1 ? "next" : "locked");
    const b = document.createElement("button");
    b.className = "tile " + st;
    b.innerHTML = `<span>${n}</span>` + (st === "done" ? "<i>✓</i>" : st === "locked" ? "<i>🔒</i>" : "");
    b.addEventListener("click", () => openStage(n));
    g.appendChild(b);
  }
}

/* ==================== POWER-UPS ==================== */
function useItem(idx) {
  if (busy || !S || S.over || !S.armed) return;
  const r = Math.floor(idx / N), c = idx % N;
  const key = S.armed;
  let targets = [];

  if (key === "hammer") {
    targets = [idx];
  } else if (key === "bomb") {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) targets.push(rr * N + cc);
    }
  } else if (key === "lightning") {
    for (let k = 0; k < N; k++) { targets.push(r * N + k); targets.push(k * N + c); }
  }

  const cells = [...new Set(targets)].filter(i => S.grid[Math.floor(i / N)][i % N] !== 0);
  if (!cells.length) { toast("Yahan kuch nahi hai, kisi block par tap karein"); return; }

  profile.items[key]--;
  S.armed = null;
  busy = true;
  if (key === "lightning") sfx.zap(); else sfx.boom();
  renderItems();
  clearCells(cells, cells.length * 10);
}

/* ==================== GAME FLOW ==================== */
function flash(indices, cls, ms) {
  indices.forEach(i => { const el = cellEls[i]; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); });
  setTimeout(() => indices.forEach(i => cellEls[i].classList.remove(cls)), ms);
}
function spawnParticles(i) {
  const v = S.grid[Math.floor(i / N)][i % N];
  const color = v ? COLORS[v - 1][0] : "#8a90a8";
  const r = cellEls[i].getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let k = 0; k < 6; k++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = (cx - 4) + "px";
    p.style.top = (cy - 4) + "px";
    p.style.background = color;
    p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    p.style.setProperty("--dy", (Math.random() * 100 - 80) + "px");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}
function showPopup(text) {
  const r = $("boardWrap").getBoundingClientRect();
  const p = document.createElement("div");
  p.className = "popup";
  p.textContent = text;
  p.style.left = (r.left + r.width / 2) + "px";
  p.style.top = (r.top + r.height / 3) + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}
function shake() {
  const b = $("boardWrap");
  b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
}
function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

function clearCells(cells, pts) {
  cells.forEach(i => { cellEls[i].classList.add("clearing"); spawnParticles(i); });
  if (cells.length >= 4) shake();
  setTimeout(() => {
    cells.forEach(i => { S.grid[Math.floor(i / N)][i % N] = 0; });
    renderBoard();
    S.score += pts;
    if (pts) showPopup("+" + pts);
    afterMove();
  }, 340);
}

function commit(idx, r, c) {
  busy = true;
  const piece = S.tray[idx];
  piece.cells.forEach(([dr, dc], k) => { S.grid[r + dr][c + dc] = colorOf(piece, k); });
  const placed = piece.cells.map(([dr, dc]) => (r + dr) * N + (c + dc));
  S.tray[idx] = null;
  S.moves++;
  sfx.place();
  renderBoard();
  flash(placed, "pop", 320);
  renderTray();

  const res = findClears(placed);
  if (res.cells.length) {
    S.streak++;
    const pts = placed.length + res.cells.length * 10 + res.groups * 15 + (S.streak > 1 ? S.streak * 20 : 0);
    const coins = res.groups * 3 + (S.streak > 1 ? S.streak * 2 : 0);
    profile.totalLines += res.groups;
    profile.coins += coins;
    S.gameCoins += coins;
    if (coins) bump($("coins"));
    sfx.clear(res.groups, S.streak);
    clearCells(res.cells, pts);
  } else {
    S.streak = 0;
    const pts = placed.length;
    S.score += pts;
    showPopup("+" + pts);
    afterMove();
  }
}

function afterMove() {
  busy = false;
  const M = MOODS[S.mood];
  if (S.tray.every(p => !p)) { S.tray = newTray(M.mixChance); renderTray(true); }
  if (S.moves >= 3 && Math.random() < M.waveChance) {
    addBlack(3);
    renderBoard();
    toast("⚠ Hard wave! Board par black blocks aa gaye");
  }
  profile.bestScore = Math.max(profile.bestScore, S.score);
  updateUI();
  if (S.score >= S.target) { stageClear(); return; }
  if (!anyFit(S.tray)) { gameOver(); return; }
  touch();
}

function updateUI() {
  if (S) {
    $("score").textContent = S.score;
    $("target").textContent = S.target;
    $("stageLabel").textContent = `STAGE ${S.stage}`;
    $("moodBadge").textContent = MOODS[S.mood].name.toUpperCase();
    $("hardBadge").classList.toggle("hidden", !S.hard);
  }
  $("lines").textContent = profile.totalLines;
  $("coins").textContent = profile.coins;
  $("username").textContent = profile.name;
  $("avatar").textContent = profile.name.charAt(0).toUpperCase();
  $("mapBest").textContent = `Best score: ${profile.bestScore}`;
  renderItems();
}

/* ==================== SHOP ==================== */
function openShop() {
  renderShop();
  $("shopOverlay").classList.remove("hidden");
}
function renderShop() {
  $("shopCoins").textContent = profile.coins;
  const box = $("shopList");
  box.innerHTML = "";
  Object.keys(ITEMS).forEach(k => {
    const it = ITEMS[k];
    const can = profile.coins >= ITEM_PRICE;
    const card = document.createElement("div");
    card.className = "shopcard";
    card.innerHTML = `
      <div class="se">${it.emoji}</div>
      <div class="sinfo"><b>${it.name}</b><small>${it.desc}</small><small>Aapke paas: ${profile.items[k]}</small></div>
      <button class="btn small" ${can ? "" : "disabled"} data-buy="${k}">${ITEM_PRICE} <span class="coin"></span></button>`;
    box.appendChild(card);

}
function buy(k) {
  if (profile.coins < ITEM_PRICE) { toast("Coins kam hain"); return; }
  profile.coins -= ITEM_PRICE;
  profile.items[k]++;
  sfx.pick();
  updateUI();
  renderShop();
  touch();
  toast(`${ITEMS[k].name} kharid liya`);
}

/* ==================== AUTO LOGIN + LOAD ==================== */
async function init() {
  uid = localStorage.getItem("bb_uid");
  if (!uid) { uid = makeId(); localStorage.setItem("bb_uid", uid); }

  // 1) Device data first: the game works fully offline from here
  data = loadLocal();
  if (!data || !data.profile) data = { profile: newProfile(), game: null, updatedAt: Date.now(), dirty: true };
  profile = data.profile;
  normalizeProfile();
  persistLocal();
  setStatus(navigator.onLine ? "connecting" : "offline");

  // 2) Firebase: adopt newer remote data, or keep the device copy if it has unsynced changes
  try {
    const remote = await dbGet(uid);
    if (remote && remote.profile) {
      const remoteStamp = remote.updatedAt || 0;
      if (!data.dirty || remoteStamp > data.updatedAt) {
        data = { profile: remote.profile, game: remote.game || null, updatedAt: remoteStamp, dirty: false };
        profile = data.profile;
        normalizeProfile();
        persistLocal();
      }
    }
  } catch (e) {
    console.warn(e);
    setStatus("offline");
  }

  // 3) Restore the in-progress stage if any
  S = null;
  if (data.game) {
    try {
      const g = JSON.parse(data.game);
      if (g && Array.isArray(g.grid) && !g.over) { S = g; S.armed = null; }
    } catch (e) { S = null; }
  }
  renderMap();
  updateUI();
  if (S) {
    renderBoard();
    renderTray();
    showScreen("game");
  } else {
    showScreen("map");
  }

  // 4) Push anything still pending
  await syncNow();
}

// Keep trying to sync in the background; stays offline-friendly
setInterval(() => { if (data && data.dirty) syncNow(); }, 8000);
window.addEventListener("online", syncNow);
window.addEventListener("offline", () => setStatus("offline"));

/* ==================== DRAG & DROP ==================== */
let drag = null;

$("tray").addEventListener("pointerdown", e => {
  const slot = e.target.closest(".slot");
  if (!slot || busy || !S || S.over || S.armed) return;
  const idx = +slot.dataset.idx;
  const piece = S.tray[idx];
  if (!piece) return;
  e.preventDefault();
  sfx.pick();

  const c0 = cellRect(0, 0), c1 = cellRect(0, 1);
  const step = c1.left - c0.left;
  const size = c0.width;
  const gap = step - size;

  const ghost = $("ghost");
  ghost.innerHTML = "";
  ghost.appendChild(shapeEl(piece, size, gap));
  ghost.style.width = (piece.w * step - gap) + "px";
  ghost.style.height = (piece.h * step - gap) + "px";
  ghost.classList.remove("hidden");

  drag = {
    idx, piece, slot, step, origin: c0,
    lift: e.pointerType === "touch" ? 90 : 0,
    row: -1, col: -1, valid: false
  };
  moveGhost(e.clientX, e.clientY);

  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragEnd);
  window.addEventListener("pointercancel", onDragEnd);
});

function onDragMove(e) { if (drag) moveGhost(e.clientX, e.clientY); }

function moveGhost(x, y) {
  const g = $("ghost");
  const gw = parseFloat(g.style.width), gh = parseFloat(g.style.height);
  const left = x - gw / 2;
  const top = y - gh / 2 - drag.lift;
  g.style.transform = `translate(${left}px, ${top}px)`;

  drag.col = Math.round((left - drag.origin.left) / drag.step);
  drag.row = Math.round((top - drag.origin.top) / drag.step);
  drag.valid = canPlace(drag.piece, drag.row, drag.col);

  document.querySelectorAll(".cell.preview").forEach(el => el.classList.remove("preview"));
  if (drag.valid) {
    drag.piece.cells.forEach(([dr, dc]) =>
      cellEls[(drag.row + dr) * N + (drag.col + dc)].classList.add("preview"));
  }
}

function onDragEnd() {
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", onDragEnd);
  window.removeEventListener("pointercancel", onDragEnd);
  $("ghost").classList.add("hidden");
  document.querySelectorAll(".cell.preview").forEach(el => el.classList.remove("preview"));

  if (drag && drag.valid && !busy && S && !S.over) {
    commit(drag.idx, drag.row, drag.col);
  } else if (drag) {
    drag.slot.classList.remove("nope"); void drag.slot.offsetWidth; drag.slot.classList.add("nope");
    sfx.invalid();
  }
  drag = null;
}

/* ==================== ITEM & BOARD CLICKS ==================== */
$("items").addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (!b || busy || !S || S.over) return;
  const k = b.dataset.key;
  if (profile.items[k] < 1) {
    toast(`${ITEMS[k].name} khatam ho gaya. Shop se ${ITEM_PRICE} coins mein kharidein`);
    return;
  }
  S.armed = S.armed === k ? null : k;
  renderItems();
  if (S.armed) toast(`${ITEMS[k].name}: board par block par tap karein`);
});

boardEl.addEventListener("click", e => {
  const cell = e.target.closest(".cell");
  if (!cell || !S || !S.armed) return;
  useItem(cellEls.indexOf(cell));
});

/* ==================== BUTTONS ==================== */
$("shopBtn").addEventListener("click", openShop);
$("shopClose").addEventListener("click", () => $("shopOverlay").classList.add("hidden"));
$("shopList").addEventListener("click", e => {
  const b = e.target.closest("[data-buy]");
  if (b) buy(b.dataset.buy);
});
$("mapBtn").addEventListener("click", () => { if (!busy) showMap(); });
$("restartBtn").addEventListener("click", () => { if (!busy && S) startStage(S.stage); });
$("failRetry").addEventListener("click", () => { if (S) startStage(S.stage); });
$("failMap").addEventListener("click", showMap);
$("winNext").addEventListener("click", nextStage);
$("winMap").addEventListener("click", showMap);
document.querySelectorAll(".mood-btn").forEach(b => b.addEventListener("click", () => {
  if (profile.mood === b.dataset.mood) return;
  profile.mood = b.dataset.mood;
  touch();
  renderMap();
  updateUI();
}));

/* ==================== START ==================== */
refreshMuteButton();
init();
</script>
</body>
</html>
