<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Master - 100 Levels Adventure</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(59, 130, 246, 0.8); }
        }
        .glow-btn { animation: pulse-glow 2s infinite; }
        .block-tile { transition: all 0.2s ease; cursor: pointer; user-select: none; }
        .block-tile:active { transform: scale(0.92); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Top Header / Stats Bar -->
    <header class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg shadow-md" id="userAvatar">U</div>
            <div>
                <h2 id="userNameDisplay" class="text-sm font-bold text-blue-400">Loading...</h2>
                <span class="text-xs text-slate-400">Level <span id="currentLevelDisplay">1</span> / 100</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 shadow-inner">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span id="coinCount" class="font-bold text-yellow-400">0</span>
            </div>
        </div>
    </header>

    <!-- Main Game Arena -->
    <main class="w-full max-w-md flex flex-col items-center my-4">
        <!-- Level Progress & Mission Info -->
        <div class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 mb-4 flex justify-between items-center text-sm">
            <div>
                <p class="text-slate-400">Mission Target:</p>
                <p class="font-bold text-emerald-400" id="missionText">Clear 10 Blocks</p>
            </div>
            <div class="text-right">
                <p class="text-slate-400">Progress:</p>
                <p class="font-bold text-blue-400" id="progressText">0 / 10</p>
            </div>
        </div>

        <!-- 6x6 Game Grid -->
        <div id="gameGrid" class="grid grid-cols-6 gap-2 bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-2xl w-full aspect-square">
            <!-- Dynamic Blocks Generated by JS -->
        </div>

        <!-- Power-ups Bar -->
        <div class="w-full grid grid-cols-3 gap-3 mt-4">
            <button onclick="usePowerUp('hammer')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold shadow-md transition">
                <i class="fa-solid fa-hammer text-amber-500"></i> Hammer (<span id="hammerCount">2</span>)
            </button>
            <button onclick="usePowerUp('bomb')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold shadow-md transition">
                <i class="fa-solid fa-bomb text-red-500"></i> Bomb (<span id="bombCount">1</span>)
            </button>
            <button onclick="usePowerUp('lightning')" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold shadow-md transition">
                <i class="fa-solid fa-bolt text-yellow-400"></i> Lightning (<span id="lightningCount">1</span>)
            </button>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-md text-center text-xs text-slate-500 pb-2">
        <p>Hammad Mart Gaming Hub &bull; Powered by Firebase & GitHub</p>
    </footer>

    <!-- Level Complete Modal -->
    <div id="winModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-1">Level Cleared!</h3>
            <p class="text-slate-400 text-sm mb-4">Great job! You earned rewards.</p>
            <div class="bg-slate-950 p-3 rounded-xl mb-6 flex justify-around border border-slate-800">
                <div>
                    <p class="text-xs text-slate-400">Reward</p>
                    <p class="font-bold text-yellow-400">+50 Coins</p>
                </div>
            </div>
            <button onclick="nextLevel()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl glow-btn transition">Next Level</button>
        </div>
    </div>

    <!-- Firebase SDKs & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Pre-configured with your Firebase Database URL
        const firebaseConfig = {
            apiKey: "AIzaSyPlaceholderKey-ReplaceIfRequired",
            authDomain: "dailytasktracker-1851b.firebaseapp.com",
            databaseURL: "https://dailytasktracker-1851b-default-rtdb.firebaseio.com/",
            projectId: "dailytasktracker-1851b",
            storageBucket: "dailytasktracker-1851b.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:blockmaster"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Game State Variables
        let userData = {
            username: "",
            coins: 100,
            level: 1,
            hammer: 2,
            bomb: 1,
            lightning: 1
        };

        let currentScore = 0;
        let targetScore = 10;
        let activePowerUp = null;

        // Initialize User / Auto Login & Firebase Sync
        async function initUser() {
            let savedUsername = localStorage.getItem("block_game_username");

            if (!savedUsername) {
                // Generate unique random name (e.g., Player_4829)
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                savedUsername = `Player_${randomNum}`;
                localStorage.setItem("block_game_username", savedUsername);
                userData.username = savedUsername;

                // Save new user to Firebase database under users/
                await set(ref(db, 'users/' + savedUsername), userData);
            } else {
                userData.username = savedUsername;
                // Fetch existing data from Firebase
                try {
                    const snapshot = await get(ref(db, 'users/' + savedUsername));
                    if (snapshot.exists()) {
                        userData = snapshot.val();
                    } else {
                        await set(ref(db, 'users/' + savedUsername), userData);
                    }
                } catch (e) {
                    console.log("Offline mode or sync notice:", e);
                }
            }

            updateUI();
            generateBoard();
        }

        window.updateUI = function() {
            document.getElementById("userNameDisplay").innerText = userData.username;
            document.getElementById("userAvatar").innerText = userData.username.charAt(0).toUpperCase();
            document.getElementById("coinCount").innerText = userData.coins;
            document.getElementById("currentLevelDisplay").innerText = userData.level;
            document.getElementById("hammerCount").innerText = userData.hammer;
            document.getElementById("bombCount").innerText = userData.bomb;
            document.getElementById("lightningCount").innerText = userData.lightning;
            
            targetScore = 10 + (userData.level * 2);
            document.getElementById("missionText").innerText = `Clear ${targetScore} Blocks`;
            document.getElementById("progressText").innerText = `${currentScore} / ${targetScore}`;
        }

        window.syncToFirebase = async function() {
            try {
                await update(ref(db, 'users/' + userData.username), {
                    coins: userData.coins,
                    level: userData.level,
                    hammer: userData.hammer,
                    bomb: userData.bomb,
                    lightning: userData.lightning
                });
            } catch (err) {
                console.error("Firebase sync error:", err);
            }
        }

        // Generate 6x6 Board
        const colors = ["bg-blue-600", "bg-purple-600", "bg-emerald-600", "bg-amber-600", "bg-rose-600"];
        
        function generateBoard() {
            const grid = document.getElementById("gameGrid");
            grid.innerHTML = "";
            currentScore = 0;

            for (let i = 0; i < 36; i++) {
                const tile = document.createElement("div");
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                tile.className = `block-tile ${randomColor} rounded-xl shadow-md flex items-center justify-center text-white text-xs`;
                tile.innerHTML = `<i class="fa-solid fa-cube opacity-70"></i>`;
                tile.onclick = () => handleTileClick(tile);
                grid.appendChild(tile);
            }
            updateUI();
        }

        function handleTileClick(tile) {
            if (activePowerUp) {
                executePowerUp(tile);
                return;
            }

            // Normal click action
            if (!tile.classList.contains("opacity-20")) {
                tile.classList.add("opacity-20", "scale-90");
                currentScore++;
                updateUI();

                if (currentScore >= targetScore) {
                    triggerWin();
                }
            }
        }

        window.usePowerUp = function(type) {
            if (userData[type] > 0) {
                activePowerUp = type;
                alert(`Select a tile on the board to use ${type.toUpperCase()}!`);
            } else {
                alert(`You have no ${type} left!`);
            }
        }

        function executePowerUp(tile) {
            if (activePowerUp === 'hammer') {
                tile.remove();
                userData.hammer--;
                currentScore += 3;
            } else if (activePowerUp === 'bomb') {
                tile.remove();
                userData.bomb--;
                currentScore += 6;
            } else if (activePowerUp === 'lightning') {
                tile.remove();
                userData.lightning--;
                currentScore += 5;
            }

            activePowerUp = null;
            updateUI();
            syncToFirebase();

            if (currentScore >= targetScore) {
                triggerWin();
            }
        }

        function triggerWin() {
            userData.coins += 50;
            document.getElementById("winModal").classList.remove("hidden");
            document.getElementById("winModal").classList.add("flex");
            syncToFirebase();
        }

        window.nextLevel = function() {
            if (userData.level < 100) {
                userData.level++;
            } else {
                alert("Congratulations! You have completed all 100 Levels!");
                userData.level = 1;
            }
            userData.coins += 20; // Bonus reward
            document.getElementById("winModal").classList.add("hidden");
            document.getElementById("winModal").classList.remove("flex");
            syncToFirebase();
            generateBoard();
        }

        // Run initialization on load
        initUser();
    </script>
</body>
</html>
