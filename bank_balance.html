<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no">
    <title>3D Money Vault Pro | Professional Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root {
            --bg-body: #f0f4f8;
            --card-main: #ffffff;
            --text-color: #2d3436;
            --shadow-3d: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
            --accent-blue: #0984e3;
            --blue-3d-grad: linear-gradient(145deg, #0984e3, #0056b3);
            --danger-grad: linear-gradient(145deg, #ff7675, #d63031);
        }

        [data-theme="dark"] {
            --bg-body: #1e272e;
            --card-main: #2d3436;
            --text-color: #f5f6fa;
            --shadow-3d: 6px 6px 12px #151a1e, -4px -4px 10px #3c444b;
        }

        body { background-color: var(--bg-body); font-family: 'Poppins', sans-serif; color: var(--text-color); padding: 25px; transition: 0.3s; }
        .main-container { width: 1150px; margin: 0 auto; }

        .card-3d {
            background: var(--card-main);
            border-radius: 20px;
            box-shadow: var(--shadow-3d);
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px;
            cursor: pointer;
        }
        .card-3d:hover { transform: translateY(-5px); }

        .error-toast-3d {
            background: var(--danger-grad) !important;
            border-radius: 15px !important;
            box-shadow: 0 10px 30px rgba(214, 48, 49, 0.4) !important;
            border: none !important;
            color: white !important;
        }

        .bank-card-mini { min-width: 190px; border-left: 5px solid var(--accent-blue); padding: 15px; }
        .bank-card-mini .bal-amt { font-size: 1.1rem; font-weight: 700; color: var(--accent-blue); }
        .bank-card-mini .acc-num { font-size: 0.75rem; color: #636e72; display: block; }

        .grad-balance { background: var(--blue-3d-grad); color: white; }
        .grad-income { background: linear-gradient(145deg, #00b894, #008967); color: white; }
        .grad-expense { background: linear-gradient(145deg, #d63031, #a91e1e); color: white; }

        .history-card { overflow: hidden; padding: 0 !important; cursor: default; }
        .history-header-3d {
            background: var(--blue-3d-grad);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .history-filter-bar {
            padding: 15px 25px;
            background: rgba(9, 132, 227, 0.08);
            display: flex; gap: 20px; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .filter-input-group { display: flex; align-items: center; gap: 10px; }
        .filter-input-group label { font-size: 0.85rem; font-weight: 600; margin: 0; color: var(--accent-blue); }
        .date-input { border: 1px solid #ced4da; border-radius: 8px; padding: 5px 10px; font-size: 0.9rem; outline: none; }

        .history-stats-bar { padding: 15px 25px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .stat-btn-box { background: none; border: none; padding: 0 20px; font-weight: 800; cursor: pointer; transition: 0.2s; text-align: left; }
        .stat-btn-box:hover { transform: scale(1.05); opacity: 0.8; }
        .stat-btn-box.active { border-bottom: 3px solid var(--accent-blue); }

        .inc-text { color: #000000; font-size: 1.5rem; }
        .exp-text { color: #d63031; font-size: 1.5rem; }
        .adj-text { color: #0984e3; font-size: 1.5rem; }
        [data-theme="dark"] .inc-text { color: #ffffff; }

        .table-custom thead th { background: #f8f9fa; color: #636e72; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; padding: 15px; border-bottom: 2px solid #edf2f7; }
        [data-theme="dark"] .table-custom thead th { background: #34495e; color: #ecf0f1; border-color: #2c3e50; }

        .chart-wrapper { background: var(--card-main); border-radius: 25px; padding: 25px; box-shadow: var(--shadow-3d); }
        
        /* Floating Buttons Style */
        .fab-btn {
            position: fixed; bottom: 40px; right: 40px; width: 75px; height: 75px; border-radius: 50%;
            background: var(--accent-blue); color: white; border: none; font-size: 35px; box-shadow: 0 10px 25px rgba(9, 132, 227, 0.4);
            z-index: 1000; transition: 0.3s;
        }

        .fab-home {
            position: fixed; bottom: 130px; right: 47px; width: 60px; height: 60px; border-radius: 50%;
            background: #2d3436; color: white; display: flex; align-items: center; justify-content: center;
            font-size: 26px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-decoration: none; z-index: 1000; transition: 0.3s;
        }
        .fab-home:hover { transform: scale(1.1); color: #00d2ff; background: #000; }
        [data-theme="dark"] .fab-home { background: #0984e3; }
    </style>
</head>
<body data-theme="light">

<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 2000;">
    <div id="errorToast" class="toast error-toast-3d" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-3 py-3 px-4">
                <i class="bi bi-exclamation-octagon-fill fs-3"></i>
                <div id="errorMessage" style="font-weight: 500;"></div>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<a href="https://hammad57.github.io/POS/index.html" class="fab-home" title="Go to Dashboard">
    <i class="bi bi-house-door-fill"></i>
</a>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <div class="card-3d p-2 rounded-circle" style="width:50px; height:50px; display:flex; align-items:center; justify-content:center;">
                <i class="bi bi-bank2 text-primary fs-4"></i>
            </div>
            <h2 class="fw-bold mb-0">Money Vault <span class="text-primary">3D Pro</span></h2>
        </div>
        <div class="d-flex gap-3">
            <button class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm" onclick="openTransferModal()">
                <i class="bi bi-arrow-left-right me-2"></i> Transfer
            </button>
            <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="openBankModal()">
                <i class="bi bi-plus-circle me-2"></i> Add Bank
            </button>
            <select id="themeSelector" class="form-select border-0 shadow-sm rounded-pill" style="width: 130px;" onchange="changeTheme(this.value)">
                <option value="light">☀️ Light</option>
                <option value="dark">🌙 Dark</option>
            </select>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4" onclick="resetChartToAll()"><div class="card-3d grad-balance"><h6>Total Balance</h6><h2 id="totalBalance">Rs. 0</h2></div></div>
        <div class="col-md-4" onclick="updateView('Income')"><div class="card-3d grad-income"><h6>Total Income</h6><h2 id="totalIncome">Rs. 0</h2></div></div>
        <div class="col-md-4" onclick="updateView('Expense')"><div class="card-3d grad-expense"><h6>Total Expense</h6><h2 id="totalExpense">Rs. 0</h2></div></div>
    </div>

    <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 me-2"></i>Bank Accounts (Click to filter Chart)</h5>
    <div id="bankCardsContainer" class="d-flex flex-wrap gap-3 mb-5"></div>

    <div class="chart-wrapper mb-5">
        <h6 id="chartTitle" class="fw-bold text-muted mb-3">Showing: All Accounts</h6>
        <div style="height: 380px;"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="card-3d history-card mb-5" id="bankDetailSection" style="display:none;">
        <div class="history-header-3d">
            <h4 id="selectedBankTitle" class="fw-bold m-0"><i class="bi bi-clock-history me-2"></i>History</h4>
            <button class="btn btn-link text-white p-0" onclick="closeHistory()"><i class="bi bi-x-circle-fill fs-3"></i></button>
        </div>

        <div class="history-filter-bar">
            <div class="filter-input-group">
                <label><i class="bi bi-calendar-event me-1"></i> From:</label>
                <input type="date" id="filterFromDate" class="date-input" onchange="applyFilters()">
            </div>
            <div class="filter-input-group">
                <label>To:</label>
                <input type="date" id="filterToDate" class="date-input" onchange="applyFilters()">
            </div>
            <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="resetDateFilters()">Clear Filter</button>
        </div>
        
        <div class="history-stats-bar d-flex align-items-center">
            <button onclick="filterByType('Income')" id="statInc" class="stat-btn-box inc-text">Income: Rs. 0</button>
            <button onclick="filterByType('Expense')" id="statExp" class="stat-btn-box exp-text">Expense: Rs. 0</button>
            <button onclick="filterByType('Adjustment')" id="statAdj" class="stat-btn-box adj-text">Adjustment: Rs. 0</button>
        </div>

        <div class="p-4">
            <div class="table-responsive">
                <table class="table table-custom align-middle">
                    <thead>
                        <tr><th>Date</th><th>Type</th><th>Amount</th><th>Remarks</th><th class="text-center">Actions</th></tr>
                    </thead>
                    <tbody id="transactionBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<button class="fab-btn" onclick="openTransactionModal()"><i class="bi bi-plus-lg"></i></button>

<div class="modal fade" id="bankModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4 border-0">
            <h5 class="fw-bold mb-3">Add New Bank</h5>
            <form id="bankForm">
                <input type="text" id="newBankName" class="form-control mb-3" placeholder="Bank Name" required>
                <input type="text" id="newBankNumber" class="form-control mb-3" placeholder="Account Number">
                <button type="submit" class="btn btn-primary w-100">Save Bank</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4 border-0">
            <h5 class="fw-bold mb-4 text-warning"><i class="bi bi-arrow-left-right me-2"></i>Inter-Bank Transfer</h5>
            <form id="transferForm">
                <div class="mb-3"><label class="small fw-bold">From Bank</label><select id="fromBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">To Bank</label><select id="toBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">Amount</label><input type="number" id="transferAmt" class="form-control" required></div>
                <div class="mb-3"><label class="small fw-bold">Date</label><input type="date" id="transferDate" class="form-control" required></div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">Transfer Now</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4 border-0">
            <h5 class="fw-bold mb-4 text-primary" id="modalTitle">New Transaction</h5>
            <form id="entryForm">
                <input type="hidden" id="editKey">
                <div class="mb-3"><label class="small fw-bold">Select Bank</label><select id="entryBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">Type</label><select id="entryType" class="form-select"><option value="Income">Income</option><option value="Expense">Expense</option></select></div>
                <div class="mb-3"><label class="small fw-bold">Amount</label><input type="number" id="entryAmt" class="form-control" required></div>
                <div class="mb-3"><label class="small fw-bold">Date</label><input type="date" id="entryDate" class="form-control" required></div>
                <div class="mb-4"><label class="small fw-bold">Remarks</label><textarea id="entryRemarks" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save Record</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    Chart.register(ChartDataLabels);
    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allBanks = [];
    let allTransactions = [];
    let currentFilter = 'All';
    let historyTypeFilter = 'All';
    let myChart = null;
    let selectedBankId = null;
    let chartBankId = null; 

    const bModal = new bootstrap.Modal(document.getElementById('bankModal'));
    const eModal = new bootstrap.Modal(document.getElementById('entryModal'));
    const tModal = new bootstrap.Modal(document.getElementById('transferModal'));
    
    const errorToast = new bootstrap.Toast(document.getElementById('errorToast'), { delay: 5000 });

    onValue(ref(db, 'settings/theme'), (snap) => {
        const savedTheme = snap.val() || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeSelector').value = savedTheme;
        if(myChart) initChart();
    });

    onValue(ref(db, 'bank_accounts'), (snap) => {
        allBanks = []; snap.forEach(c => { allBanks.push({ id: c.key, ...c.val() }); });
        renderBanks();
    });

    onValue(ref(db, 'bank_transactions'), (snap) => {
        allTransactions = [];
        snap.forEach(bNode => { bNode.forEach(tNode => { allTransactions.push({ id: tNode.key, bankId: bNode.key, ...tNode.val() }); }); });
        renderBanks();
        updateSummary();
        initChart();
        if(selectedBankId || chartBankId === null) window.applyFilters();
    });

    function renderBanks() {
        const container = document.getElementById('bankCardsContainer');
        container.innerHTML = '';
        allBanks.forEach(bank => {
            const balance = allTransactions.filter(t => t.bankId === bank.id).reduce((s, t) => {
                const amt = parseFloat(t.amount);
                if(t.type === 'Income' || t.type === 'Adjustment In') return s + amt;
                if(t.type === 'Expense' || t.type === 'Adjustment Out') return s - amt;
                return s;
            }, 0);
            container.innerHTML += `<div class="card-3d bank-card-mini" onclick="selectBank('${bank.id}')"><h6>${bank.name}</h6><span class="acc-num">${bank.number || '---'}</span><div class="bal-amt">Rs. ${balance.toLocaleString()}</div></div>`;
        });
        const options = allBanks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        document.getElementById('entryBank').innerHTML = options; document.getElementById('fromBank').innerHTML = options; document.getElementById('toBank').innerHTML = options;
    }

    function updateSummary() {
        let tI = allTransactions.filter(t => t.type === 'Income').reduce((s, t) => s + parseFloat(t.amount), 0);
        let tE = allTransactions.filter(t => t.type === 'Expense').reduce((s, t) => s + parseFloat(t.amount), 0);
        let tAdjIn = allTransactions.filter(t => t.type === 'Adjustment In').reduce((s, t) => s + parseFloat(t.amount), 0);
        let tAdjOut = allTransactions.filter(t => t.type === 'Adjustment Out').reduce((s, t) => s + parseFloat(t.amount), 0);
        document.getElementById('totalIncome').innerText = `Rs. ${tI.toLocaleString()}`;
        document.getElementById('totalExpense').innerText = `Rs. ${tE.toLocaleString()}`;
        document.getElementById('totalBalance').innerText = `Rs. ${(tI + tAdjIn - tE - tAdjOut).toLocaleString()}`;
    }

    window.initChart = () => {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        let chartData = chartBankId ? allTransactions.filter(t => t.bankId === chartBankId) : allTransactions;
        const bankName = chartBankId ? allBanks.find(b => b.id === chartBankId)?.name : 'All Accounts';
        document.getElementById('chartTitle').innerText = `Showing: ${bankName}`;
        const dates = [...new Set(chartData.filter(t => t.type === 'Income' || t.type === 'Expense').map(t => t.date))].sort();
        const incData = dates.map(d => chartData.filter(t => t.date === d && t.type === 'Income').reduce((s, c) => s + parseFloat(c.amount), 0));
        const expData = dates.map(d => chartData.filter(t => t.date === d && t.type === 'Expense').reduce((s, c) => s + parseFloat(c.amount), 0));
        myChart = new Chart(ctx, { 
            type: 'bar', 
            data: { labels: dates, datasets: [{ label: 'Income', data: incData, backgroundColor: '#00b894', borderRadius: 8, hidden: currentFilter === 'Expense', barThickness: 25, minBarLength: 5 }, { label: 'Expense', data: expData, backgroundColor: '#d63031', borderRadius: 8, hidden: currentFilter === 'Income', barThickness: 25, minBarLength: 5 }] }, 
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { y: { type: 'logarithmic', beginAtZero: false, ticks: { callback: function(value) { if (value === 0) return "0"; if ([1, 10, 100, 1000, 10000, 100000, 1000000, 2500000].includes(value)) return 'Rs.' + value.toLocaleString(); } } } },
                plugins: { datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold', size: 10 }, formatter: (v) => v > 0 ? 'Rs.' + v.toLocaleString() : '', clip: false, padding: 4 } },
                onClick: (e, elements) => {
                    if (elements.length > 0) {
                        const element = elements[0]; const datasetIndex = element.datasetIndex; const index = element.index;
                        const clickedDate = myChart.data.labels[index]; const clickedType = myChart.data.datasets[datasetIndex].label;
                        document.getElementById('bankDetailSection').style.display = 'block';
                        const bName = chartBankId ? allBanks.find(b => b.id === chartBankId)?.name : 'All Accounts';
                        document.getElementById('selectedBankTitle').innerHTML = `<i class="bi bi-clock-history me-2"></i> ${bName} - ${clickedType} (${clickedDate})`;
                        document.getElementById('filterFromDate').value = clickedDate; document.getElementById('filterToDate').value = clickedDate;
                        historyTypeFilter = clickedType; window.applyFilters();
                        document.getElementById('bankDetailSection').scrollIntoView({ behavior: 'smooth' });
                    }
                }
            } 
        });
    };

    window.selectBank = (id) => {
        selectedBankId = id; chartBankId = id;
        document.getElementById('bankDetailSection').style.display = 'block';
        const bank = allBanks.find(b => b.id === id);
        document.getElementById('selectedBankTitle').innerHTML = `<i class="bi bi-clock-history me-2"></i> ${bank.name} History`;
        window.resetAllFilters(); window.applyFilters(); initChart();
    };

    window.resetChartToAll = () => { chartBankId = null; currentFilter = 'All'; initChart(); document.getElementById('bankDetailSection').style.display = 'none'; };

    window.applyFilters = () => {
        let filteredTrans = chartBankId ? allTransactions.filter(t => t.bankId === chartBankId) : [...allTransactions];
        const fromDate = document.getElementById('filterFromDate').value; const toDate = document.getElementById('filterToDate').value;
        if(fromDate) filteredTrans = filteredTrans.filter(t => t.date >= fromDate);
        if(toDate) filteredTrans = filteredTrans.filter(t => t.date <= toDate);
        const bInc = filteredTrans.filter(t => t.type === 'Income').reduce((s, t) => s + parseFloat(t.amount), 0);
        const bExp = filteredTrans.filter(t => t.type === 'Expense').reduce((s, t) => s + parseFloat(t.amount), 0);
        const bAdj = filteredTrans.filter(t => t.type.includes('Adjustment')).reduce((s, t) => s + parseFloat(t.amount), 0);
        document.getElementById('statInc').innerText = `Income: Rs. ${bInc.toLocaleString()}`;
        document.getElementById('statExp').innerText = `Expense: Rs. ${bExp.toLocaleString()}`;
        document.getElementById('statAdj').innerText = `Adjustment: Rs. ${bAdj.toLocaleString()}`;
        if(historyTypeFilter !== 'All') filteredTrans = filteredTrans.filter(t => historyTypeFilter === 'Adjustment' ? t.type.includes('Adjustment') : t.type === historyTypeFilter);
        document.getElementById('transactionBody').innerHTML = filteredTrans.map(t => {
            let tCls = (t.type === 'Income' || t.type === 'Adjustment In') ? 'text-success' : 'text-danger';
            let bName = allBanks.find(b => b.id === t.bankId)?.name || 'Unknown';
            let displayRemarks = chartBankId ? (t.remarks || '---') : `<span class="badge bg-light text-dark border me-1">${bName}</span> ${t.remarks || '---'}`;
            return `<tr><td>${t.date}</td><td class="${tCls} fw-bold">${t.type.replace('Adjustment ','')}</td><td>Rs. ${parseFloat(t.amount).toLocaleString()}</td><td>${displayRemarks}</td><td class="text-center"><button class="btn btn-sm btn-outline-primary me-1" onclick="editEntry('${t.id}')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="deleteEntry('${t.bankId}','${t.id}')"><i class="bi bi-trash"></i></button></td></tr>`
        }).join('');
    };

    window.editEntry = (tId) => {
        const t = allTransactions.find(trans => trans.id === tId); if (!t) return;
        document.getElementById('editKey').value = t.id; document.getElementById('entryBank').value = t.bankId; document.getElementById('entryBank').disabled = true;
        document.getElementById('entryType').value = t.type; document.getElementById('entryAmt').value = t.amount;
        document.getElementById('entryDate').value = t.date; document.getElementById('entryRemarks').value = t.remarks || '';
        document.getElementById('modalTitle').innerText = 'Edit Transaction'; eModal.show();
    };

    window.filterByType = (type) => { historyTypeFilter = (historyTypeFilter === type) ? 'All' : type; window.applyFilters(); };
    window.resetDateFilters = () => { document.getElementById('filterFromDate').value = ''; document.getElementById('filterToDate').value = ''; window.applyFilters(); };
    window.resetAllFilters = () => { historyTypeFilter = 'All'; document.getElementById('filterFromDate').value = ''; document.getElementById('filterToDate').value = ''; };

    document.getElementById('transferForm').onsubmit = (e) => {
        e.preventDefault();
        const from = document.getElementById('fromBank').value; 
        const to = document.getElementById('toBank').value;
        const amt = parseFloat(document.getElementById('transferAmt').value); 
        const dt = document.getElementById('transferDate').value;
        
        const fromBankObj = allBanks.find(b => b.id === from);
        const fromName = fromBankObj.name; 
        const toName = allBanks.find(b => b.id === to).name;

        if(from === to) {
            document.getElementById('errorMessage').innerText = "Select different banks for transfer!";
            errorToast.show();
            return;
        }

        const currentFromBalance = allTransactions.filter(t => t.bankId === from).reduce((s, t) => {
            const tAmt = parseFloat(t.amount);
            if(t.type === 'Income' || t.type === 'Adjustment In') return s + tAmt;
            if(t.type === 'Expense' || t.type === 'Adjustment Out') return s - tAmt;
            return s;
        }, 0);

        if(amt > currentFromBalance) {
            document.getElementById('errorMessage').innerText = `Insufficient Balance! Your current balance in ${fromName} is Rs. ${currentFromBalance.toLocaleString()}. You cannot transfer Rs. ${amt.toLocaleString()}.`;
            errorToast.show();
            return;
        }

        push(ref(db, `bank_transactions/${from}`), { type: 'Adjustment Out', amount: amt, date: dt, remarks: `Transfer To ${toName}` });
        push(ref(db, `bank_transactions/${to}`), { type: 'Adjustment In', amount: amt, date: dt, remarks: `Transfer From ${fromName}` });
        
        tModal.hide(); 
        document.getElementById('transferForm').reset();
    };

    window.openTransferModal = () => { document.getElementById('transferDate').value = new Date().toISOString().split('T')[0]; tModal.show(); };
    window.deleteEntry = (bId, tId) => { if(confirm("Delete record?")) remove(ref(db, `bank_transactions/${bId}/${tId}`)); };
    window.openBankModal = () => bModal.show();
    window.openTransactionModal = () => { document.getElementById('entryForm').reset(); document.getElementById('editKey').value = ''; document.getElementById('entryBank').disabled = false; document.getElementById('entryDate').value = new Date().toISOString().split('T')[0]; eModal.show(); };
    
    document.getElementById('bankForm').onsubmit = (e) => { e.preventDefault(); push(ref(db, 'bank_accounts'), { name: document.getElementById('newBankName').value, number: document.getElementById('newBankNumber').value }); bModal.hide(); };
    
    document.getElementById('entryForm').onsubmit = (e) => { 
        e.preventDefault(); const bId = document.getElementById('entryBank').value; const tId = document.getElementById('editKey').value;
        const data = { type: document.getElementById('entryType').value, amount: document.getElementById('entryAmt').value, date: document.getElementById('entryDate').value, remarks: document.getElementById('entryRemarks').value }; 
        if (tId) update(ref(db, `bank_transactions/${bId}/${tId}`), data); else push(ref(db, `bank_transactions/${bId}`), data); eModal.hide(); 
    };

    window.updateView = (v) => { 
        currentFilter = v; initChart(); document.getElementById('bankDetailSection').style.display = 'block';
        const bName = chartBankId ? allBanks.find(b => b.id === chartBankId)?.name : 'All Accounts';
        document.getElementById('selectedBankTitle').innerHTML = `<i class="bi bi-clock-history me-2"></i> ${bName} - ${v} Details`;
        document.getElementById('filterFromDate').value = ''; document.getElementById('filterToDate').value = '';
        historyTypeFilter = v; window.applyFilters(); document.getElementById('bankDetailSection').scrollIntoView({ behavior: 'smooth' });
    };
    
    window.changeTheme = (v) => { set(ref(db, 'settings/theme'), v); };
    window.closeHistory = () => { document.getElementById('bankDetailSection').style.display = 'none'; selectedBankId = null; chartBankId = null; initChart(); };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
