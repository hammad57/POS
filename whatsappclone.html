<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WhatsApp Clone</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}
html,body{height:100%;background:#d1d7db}
button{cursor:pointer;border:0;background:none;font-size:20px}
#login{position:fixed;inset:0;background:#00a884;display:flex;align-items:center;justify-content:center;z-index:50}
#login div{background:#fff;padding:28px;border-radius:12px;width:320px;max-width:92%;text-align:center}
#login h2{color:#008069;margin-bottom:16px}
input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px;font-size:15px}
.btn{background:#00a884;color:#fff;padding:11px;border-radius:8px;width:100%;font-size:16px}
#app{display:none;height:100%;max-width:1400px;margin:auto;background:#fff;position:relative;overflow:hidden}
#side{width:380px;height:100%;border-right:1px solid #ddd;display:flex;flex-direction:column;float:left}
#main{margin-left:380px;height:100%;display:flex;flex-direction:column;background:#efeae2}
.top{background:#008069;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.top b{flex:1;font-size:17px}
.top button{color:#fff;font-size:20px}
.tabs{display:flex;background:#008069}
.tabs div{flex:1;text-align:center;color:#cfe;padding:10px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent}
.tabs .on{color:#fff;border-color:#fff}
#q{margin:8px;width:calc(100% - 16px)}
#list{flex:1;overflow:auto}
.row{display:flex;gap:12px;padding:11px 14px;cursor:pointer;align-items:center;border-bottom:1px solid #f0f0f0}
.row:hover{background:#f5f6f6}
.av{width:46px;height:46px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.av.st{box-shadow:0 0 0 3px #fff,0 0 0 5px #25d366}
.inf{flex:1;min-width:0}
.inf b{display:block;font-size:16px;color:#111}
.inf small{color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.meta{text-align:right;font-size:12px;color:#667781}
.badge{background:#25d366;color:#fff;border-radius:12px;padding:1px 7px;font-size:12px;display:inline-block;margin-top:4px}
#msgs{flex:1;overflow:auto;padding:14px 8%;display:flex;flex-direction:column;gap:4px}
.m{max-width:75%;padding:6px 8px 4px;border-radius:8px;font-size:15px;position:relative;box-shadow:0 1px 1px #0002;word-wrap:break-word}
.m.out{align-self:flex-end;background:#d9fdd3}
.m.in{align-self:flex-start;background:#fff}
.m img,.m video{max-width:300px;width:100%;border-radius:6px;display:block;cursor:pointer}
.m audio{width:240px;max-width:100%}
.m .t{font-size:11px;color:#667781;text-align:right;margin-top:2px}
.tk{color:#8696a0}.tk.s{color:#53bdeb}
.file{display:flex;gap:8px;align-items:center;background:#0000000d;padding:8px;border-radius:6px;text-decoration:none;color:#111}
#bar{display:flex;gap:8px;padding:8px 12px;background:#f0f2f5;align-items:center}
#bar input{margin:0;flex:1;border-radius:22px;border:0;padding:12px 16px}
#empty{flex:1;display:flex;align-items:center;justify-content:center;color:#667781;font-size:18px;text-align:center;padding:20px}
#chat{display:none;flex-direction:column;height:100%}
#back{display:none}
#viewer{position:fixed;inset:0;background:#111;z-index:60;display:none;align-items:center;justify-content:center;color:#fff;flex-direction:column}
#viewer .vb{position:absolute;top:0;left:0;right:0;display:flex;gap:4px;padding:10px}
#viewer .vb i{flex:1;height:3px;background:#fff5;border-radius:2px}
#viewer .vb i.d{background:#fff}
#vc{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:28px}
#vc img,#vc video{max-width:100%;max-height:90%}
#vh{position:absolute;top:22px;left:14px;font-size:14px}
#vx{position:absolute;top:18px;right:14px;color:#fff;font-size:28px}
@media(max-width:760px){
#side{width:100%;float:none;position:absolute;inset:0;z-index:2;background:#fff}
#main{margin-left:0;position:absolute;inset:0}
#app.open #side{display:none}
#back{display:block}
#msgs{padding:10px 8px}
}
</style></head><body>

<div id="login"><div>
<h2>WhatsApp Clone</h2>
<input id="ln" placeholder="Aap ka naam">
<input id="lp" placeholder="Phone number (e.g. 923001234567)" inputmode="numeric">
<button class="btn" onclick="login()">Shuru karein</button>
</div></div>

<div id="app">
<div id="side">
<div class="top"><div class="av" id="myav" style="width:36px;height:36px;font-size:15px;background:#fff3"></div><b id="myname"></b>
<button title="New chat" onclick="allMode=!allMode;renderList()">💬</button><button title="Logout" onclick="logout()">⎋</button></div>
<div class="tabs"><div id="t1" class="on" onclick="setTab('chats')">CHATS</div><div id="t2" onclick="setTab('status')">STATUS</div></div>
<input id="q" placeholder="Search ya naya chat..." oninput="renderList()">
<div id="list"></div>
</div>
<div id="main">
<div id="empty">WhatsApp Clone<br>Chat shuru karne ke liye kisi contact ko select karein</div>
<div id="chat">
<div class="top"><button id="back" onclick="closeChat()">←</button><div class="av" id="cav" style="width:38px;height:38px;font-size:15px;background:#fff3"></div>
<div style="flex:1"><b id="cname" style="font-size:16px;display:block"></b><small id="csub" style="opacity:.85"></small></div></div>
<div id="msgs"></div>
<div id="bar">
<button onclick="$('#fi').click()" title="Attach">📎</button>
<input id="fi" type="file" hidden onchange="pick(this)">
<input id="txt" placeholder="Message likhein" oninput="typing()" onkeydown="if(event.key=='Enter')sendText()">
<button id="mic" onclick="rec()">🎤</button>
<button onclick="sendText()" title="Send">➤</button>
</div></div></div></div>

<div id="viewer"><div class="vb" id="vbar"></div><div id="vh"></div><button id="vx" onclick="closeV()">✕</button><div id="vc"></div></div>
<input id="sf" type="file" accept="image/*,video/*" hidden onchange="postStatusFile(this)">

<script>
// ====== FIREBASE CONFIG (aap ka project) ======
firebase.initializeApp({
  databaseURL:"https://earn-platform-76c26-default-rtdb.firebaseio.com",
  projectId:"earn-platform-76c26"
});
const db=firebase.database(),TS=firebase.database.ServerValue.TIMESTAMP;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cid=(a,b)=>[a,b].sort().join('_');
const fmt=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const day=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?fmt(t):d.toLocaleDateString([], {day:'numeric',month:'short'})};
const ini=n=>(n||'?').trim()[0].toUpperCase();
let me=JSON.parse(localStorage.wa_me||'null'),cur=null,users={},inbox={},statuses={},tab='chats',allMode=false,off=null,oseen=0,tmr=null,mr=null,chunks=[];

function login(){
  const name=$('#ln').value.trim(),phone=$('#lp').value.replace(/\D/g,'');
  if(!name||phone.length<6)return alert('Naam aur sahi phone number likhein');
  me={name,phone};localStorage.wa_me=JSON.stringify(me);start();
}
function logout(){
  if(!confirm('Logout karein?'))return;
  db.ref('wa_users/'+me.phone).update({online:false,lastSeen:TS});
  localStorage.removeItem('wa_me');location.reload();
}
function start(){
  $('#login').style.display='none';$('#app').style.display='block';
  $('#myname').textContent=me.name;$('#myav').textContent=ini(me.name);
  db.ref('.info/connected').on('value',s=>{
    if(!s.val())return;
    const r=db.ref('wa_users/'+me.phone);
    r.update({name:me.name,phone:me.phone,online:true});
    r.onDisconnect().update({online:false,lastSeen:TS});
  });
  db.ref('wa_users').on('value',s=>{users=s.val()||{};renderList();head()});
  db.ref('wa_inbox/'+me.phone).on('value',s=>{inbox=s.val()||{};renderList()});
  db.ref('wa_status').orderByChild('ts').startAt(Date.now()-864e5).on('value',s=>{statuses=s.val()||{};renderList()});
}
function setTab(t){tab=t;$('#t1').className=t=='chats'?'on':'';$('#t2').className=t=='status'?'on':'';$('#q').style.display=t=='chats'?'':'none';renderList()}

function renderList(){
  const L=$('#list');if(!me)return;
  if(tab=='status')return renderStatus(L);
  const q=$('#q').value.trim().toLowerCase();let h='';
  if(q||allMode){
    Object.values(users).filter(u=>u.phone!=me.phone&&(!q||(u.name||'').toLowerCase().includes(q)||u.phone.includes(q)))
    .forEach(u=>h+=row(u.phone,u.name,u.online?'online':'tap karke chat karein','',0));
    if(!h)h='<div style="padding:20px;color:#667781">Koi user nahi mila. Doosre user ko pehle login karna hoga.</div>';
  }else{
    Object.entries(inbox).filter(([k,v])=>v.ts).sort((a,b)=>b[1].ts-a[1].ts).forEach(([k,v])=>{
      const u=users[k]||{name:k};
      h+=row(k,u.name,(v.from==me.phone?'✓ ':'')+v.last,day(v.ts),v.unread||0);
    });
    if(!h)h='<div style="padding:20px;color:#667781">Abhi koi chat nahi. Upar 💬 dabayein ya search karein.</div>';
  }
  L.innerHTML=h;
}
function row(p,n,sub,t,u){
  return `<div class="row" onclick="openChat('${p}')"><div class="av">${esc(ini(n))}</div><div class="inf"><b>${esc(n||p)}</b><small>${esc(sub)}</small></div><div class="meta">${t}${u?`<br><span class="badge">${u}</span>`:''}</div></div>`;
}

function openChat(p){
  cur=p;allMode=false;$('#q').value='';
  $('#empty').style.display='none';$('#chat').style.display='flex';$('#app').classList.add('open');
  $('#msgs').innerHTML='';oseen=0;head();
  if(off)off();
  const id=cid(me.phone,p);
  mr=db.ref(`wa_chats/${id}/messages`).limitToLast(80);
  const h=mr.on('child_added',s=>addMsg(s.key,s.val()));
  const sr=db.ref(`wa_seen/${id}/${p}`);
  const sh=sr.on('value',s=>{oseen=s.val()||0;ticks()});
  const tr=db.ref(`wa_typing/${id}/${p}`);
  const th=tr.on('value',s=>{$('#csub').textContent=s.val()?'typing…':sub()});
  off=()=>{mr.off('child_added',h);sr.off('value',sh);tr.off('value',th)};
  markSeen();renderList();
}
function closeChat(){$('#app').classList.remove('open');if(off)off();off=null;cur=null;$('#chat').style.display='none';$('#empty').style.display='flex'}
function sub(){
  const u=users[cur]||{};
  return u.online?'online':(u.lastSeen?'last seen '+day(u.lastSeen):'');
}
function head(){
  if(!cur)return;const u=users[cur]||{name:cur};
  $('#cname').textContent=u.name||cur;$('#cav').textContent=ini(u.name);$('#csub').textContent=sub();
}
function markSeen(){
  if(!cur)return;
  db.ref(`wa_seen/${cid(me.phone,cur)}/${me.phone}`).set(TS);
  if(inbox[cur]&&inbox[cur].unread)db.ref(`wa_inbox/${me.phone}/${cur}/unread`).set(0);
}
function addMsg(k,m){
  const out=m.from==me.phone,d=document.createElement('div');
  d.className='m '+(out?'out':'in');
  let c='';
  if(m.type=='image')c=`<img src="${m.data}" onclick="zoom(this.src)">`;
  else if(m.type=='video')c=`<video src="${m.data}" controls></video>`;
  else if(m.type=='audio')c=`<audio src="${m.data}" controls></audio>`;
  else if(m.type=='file')c=`<a class="file" href="${m.data}" download="${esc(m.name)}">📄<span>${esc(m.name)}<br><small>${(m.size/1024).toFixed(0)} KB</small></span></a>`;
  else c=esc(m.text).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>');
  d.innerHTML=c+`<div class="t">${fmt(m.ts)} ${out?`<span class="tk" data-ts="${m.ts||0}">✓✓</span>`:''}</div>`;
  const box=$('#msgs');box.appendChild(d);box.scrollTop=box.scrollHeight;
  if(!out)markSeen();ticks();
}
function ticks(){document.querySelectorAll('.tk').forEach(e=>e.classList.toggle('s',+e.dataset.ts<=oseen&&oseen>0))}
function zoom(s){$('#vbar').innerHTML='';$('#vh').textContent='';$('#vc').innerHTML=`<img src="${s}">`;$('#viewer').style.display='flex';vq=[]}

function send(m){
  if(!cur)return;
  m.from=me.phone;m.to=cur;m.ts=TS;
  db.ref(`wa_chats/${cid(me.phone,cur)}/messages`).push(m);
  const last=m.type=='text'?m.text:({image:'📷 Photo',video:'🎥 Video',audio:'🎤 Voice message'})[m.type]||'📄 '+m.name;
  const o={last:last.slice(0,80),ts:TS,from:me.phone};
  db.ref(`wa_inbox/${me.phone}/${cur}`).update(o);
  db.ref(`wa_inbox/${cur}/${me.phone}`).update(o);
  db.ref(`wa_inbox/${cur}/${me.phone}/unread`).transaction(n=>(n||0)+1);
  db.ref(`wa_typing/${cid(me.phone,cur)}/${me.phone}`).set(false);
}
function sendText(){const t=$('#txt').value.trim();if(!t)return;$('#txt').value='';send({type:'text',text:t})}
function typing(){
  const r=db.ref(`wa_typing/${cid(me.phone,cur)}/${me.phone}`);r.set(true);r.onDisconnect().set(false);
  clearTimeout(tmr);tmr=setTimeout(()=>r.set(false),2000);
}

function readFile(f,cb){
  if(f.type.startsWith('image/')){
    const img=new Image();img.onload=()=>{
      const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.75),'image');
    };img.src=URL.createObjectURL(f);return;
  }
  if(f.size>5*1024*1024)return alert('File 5MB se choti honi chahiye (Realtime Database ki limit)');
  const r=new FileReader();
  r.onload=()=>cb(r.result,f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':'file');
  r.readAsDataURL(f);
}
function pick(i){const f=i.files[0];i.value='';if(!f)return;readFile(f,(d,t)=>send({type:t,data:d,name:f.name,size:f.size}))}

async function rec(){
  const b=$('#mic');
  if(mr2&&mr2.state=='recording'){mr2.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mr2=new MediaRecorder(st);chunks=[];
    mr2.ondataavailable=e=>chunks.push(e.data);
    mr2.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());b.textContent='🎤';
      const bl=new Blob(chunks,{type:'audio/webm'});
      if(bl.size>5e6)return alert('Voice note bohot lamba hai');
      const r=new FileReader();r.onload=()=>send({type:'audio',data:r.result,name:'voice.webm',size:bl.size});r.readAsDataURL(bl);
    };
    mr2.start();b.textContent='⏹';
  }catch(e){alert('Microphone ki ijazat chahiye')}
}
let mr2=null;

// ===== STATUS =====
let vq=[],vi=0,vt=null;
function renderStatus(L){
  const g={};Object.entries(statuses).forEach(([k,s])=>(g[s.from]=g[s.from]||[]).push({k,...s}));
  let h=`<div class="row" style="cursor:default"><div class="av ${g[me.phone]?'st':''}" onclick="${g[me.phone]?`viewStatus('${me.phone}')`:''}">${esc(ini(me.name))}</div><div class="inf"><b>My status</b><small>${g[me.phone]?g[me.phone].length+' update(s)':'Update daalein'}</small></div><button onclick="statusText()" title="Text">✏️</button><button onclick="$('#sf').click()" title="Photo/Video">📷</button></div>`;
  h+='<div style="padding:8px 14px;color:#008069;font-size:13px;font-weight:700">RECENT UPDATES</div>';
  const o=Object.keys(g).filter(p=>p!=me.phone).sort((a,b)=>g[b].at(-1).ts-g[a].at(-1).ts);
  o.forEach(p=>{const u=users[p]||{name:p};
    h+=`<div class="row" onclick="viewStatus('${p}')"><div class="av st">${esc(ini(u.name))}</div><div class="inf"><b>${esc(u.name)}</b><small>${day(g[p].at(-1).ts)}</small></div></div>`});
  if(!o.length)h+='<div style="padding:14px;color:#667781">Koi recent status nahi.</div>';
  L.innerHTML=h;
}
const colors=['#128c7e','#8e44ad','#c0392b','#2980b9','#d35400','#16a085'];
function statusText(){
  const t=prompt('Status likhein:');if(!t)return;
  db.ref('wa_status').push({from:me.phone,type:'text',text:t,bg:colors[Math.random()*6|0],ts:TS});
}
function postStatusFile(i){
  const f=i.files[0];i.value='';if(!f)return;
  readFile(f,(d,t)=>{if(t!='image'&&t!='video')return alert('Sirf photo ya video');
    db.ref('wa_status').push({from:me.phone,type:t,data:d,ts:TS})});
}
function viewStatus(p){
  vq=Object.entries(statuses).filter(([k,s])=>s.from==p).sort((a,b)=>a[1].ts-b[1].ts).map(e=>e[1]);
  vi=0;$('#viewer').style.display='flex';showS();
}
function showS(){
  clearTimeout(vt);
  if(vi>=vq.length)return closeV();
  const s=vq[vi],u=users[s.from]||{name:s.from};
  $('#vbar').innerHTML=vq.map((_,i)=>`<i class="${i<=vi?'d':''}"></i>`).join('');
  $('#vh').textContent=u.name+' • '+fmt(s.ts);
  const c=$('#vc');c.onclick=()=>{vi++;showS()};
  c.style.background=s.type=='text'?s.bg:'';
  if(s.type=='text'){c.textContent=s.text;vt=setTimeout(()=>{vi++;showS()},5000)}
  else if(s.type=='image'){c.innerHTML=`<img src="${s.data}">`;vt=setTimeout(()=>{vi++;showS()},5000)}
  else{c.innerHTML=`<video src="${s.data}" autoplay playsinline></video>`;c.firstChild.onended=()=>{vi++;showS()}}
}
function closeV(){clearTimeout(vt);$('#viewer').style.display='none';$('#vc').innerHTML='';$('#vc').style.background=''}

if(me)start();
</script></body></html>
