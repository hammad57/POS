<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Card Vault | Muluk Hussain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modal visibility logic */
        .modal { display: none; transition: all 0.3s ease; }
        .modal.active { display: flex; z-index: 100; }
        
        /* Custom UI Enhancements */
        .glass-nav { background: rgba(79, 70, 229, 0.95); backdrop-filter: blur(10px); }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .floating-btn { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .floating-btn:hover { transform: scale(1.1) rotate(90deg); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <nav class="glass-nav text-white shadow-lg sticky top-0 z-50 h-16 flex items-center px-6 justify-between">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-vault text-2xl"></i>
            <h1 class="text-xl font-bold tracking-tight">Card Vault</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="userEmail" class="text-xs font-medium hidden sm:block opacity-80"></span>
            <button id="authBtn" class="bg-white text-indigo-600 px-5 py-1.5 rounded-full text-sm font-bold shadow-md hover:bg-indigo-50 transition-all active:scale-95">
                Login
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-10 mb-24">
        <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div id="loadingStatus" class="col-span-full text-center py-20">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600 mb-4"></i>
                <p class="text-slate-500 font-medium">Syncing with Firebase...</p>
            </div>
        </div>
    </main>

    <button id="addCardBtn" title="Add New Card" class="floating-btn fixed bottom-8 right-8 bg-indigo-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center z-50 text-2xl">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="addModal" class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800">Add New Secure Card</h2>
                <button id="closeAddModal" class="text-slate-400 hover:text-red-500 text-3xl transition-colors">&times;</button>
            </div>
            
            <form id="cardForm" class="p-6 space-y-4 overflow-y-auto max-h-[70vh]">
                <label class="block text-xs font-bold text-slate-500 uppercase">Select Category</label>
                <select id="cardType" class="w-full border-2 border-slate-100 rounded-xl p-3 focus:border-indigo-500 outline-none transition">
                    <option value="payment">Bank / Payment Card</option>
                    <option value="cnic">CNIC / ID Card</option>
                    <option value="visiting">Visiting / Business Card</option>
                    <option value="other">Other Documents</option>
                </select>

                <div id="dynamicFields" class="space-y-4">
                    </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all mt-6">
                    SECURELY SAVE
                </button>
            </form>
        </div>
    </div>

    <div id="viewModal" class="modal fixed inset-0 bg-slate-900/80 backdrop-blur-md items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden relative shadow-2xl">
            <button id="closeViewModal" class="absolute top-4 right-5 text-3xl text-slate-400 z-10 hover:text-red-500">&times;</button>
            <div id="viewContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Permanent Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com",
            projectId: "own-live-steam-web",
            storageBucket: "own-live-steam-web.firebasestorage.app",
            messagingSenderId: "132045886996",
            appId: "1:132045886996:web:8a6d937c3548afd2477901",
            measurementId: "G-SMRFNHZ8FQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let userSession = null;
        const ADMIN_EMAIL = "mysw786@gmail.com";

        // DOM Elements
        const container = document.getElementById('cardsContainer');
        const addBtn = document.getElementById('addCardBtn');
        const addModal = document.getElementById('addModal');
        const cardType = document.getElementById('cardType');
        const dynamicFields = document.getElementById('dynamicFields');
        const cardForm = document.getElementById('cardForm');
        const authBtn = document.getElementById('authBtn');

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            userSession = user;
            if(user) {
                authBtn.innerText = "Logout";
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userEmail').classList.remove('hidden');
            } else {
                authBtn.innerText = "Login";
                document.getElementById('userEmail').classList.add('hidden');
            }
        });

        authBtn.onclick = async () => {
            if(userSession) await signOut(auth);
            else {
                try {
                    await signInWithPopup(auth, provider);
                } catch (e) {
                    alert("Authentication Error: Please enable Google Auth in Firebase Console.");
                }
            }
        };

        // Modal Controls
        addBtn.onclick = () => addModal.classList.add('active');
        document.getElementById('closeAddModal').onclick = () => addModal.classList.remove('active');
        document.getElementById('closeViewModal').onclick = () => document.getElementById('viewModal').classList.remove('active');

        // Dynamic Form UI
        const renderForm = () => {
            const type = cardType.value;
            let fields = `<input type="text" id="title" placeholder="Entry Title (e.g. HBL Debit)" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none focus:border-indigo-500" required>`;
            
            if(type === 'payment') {
                fields += `
                    <input type="text" id="acc_num" placeholder="Card / Account Number" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none">
                    <input type="text" id="holder" placeholder="Holder Name" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="expiry" placeholder="Expiry (MM/YY)" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none">
                        <input type="password" id="cvv" placeholder="CVV" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none">
                    </div>`;
            } else if(type === 'cnic') {
                fields += `<input type="text" id="cnic_num" placeholder="13 Digit CNIC Number" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none">`;
            } else {
                fields += `<textarea id="notes" placeholder="Enter card details or notes..." class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none h-24"></textarea>`;
            }
            dynamicFields.innerHTML = fields;
        };
        cardType.onchange = renderForm;
        renderForm();

        // Database: Save
        cardForm.onsubmit = async (e) => {
            e.preventDefault();
            const data = { type: cardType.value, date: new Date().toLocaleDateString() };
            cardForm.querySelectorAll('input, select, textarea').forEach(el => data[el.id] = el.value);

            try {
                await push(ref(db, 'cards/'), data);
                cardForm.reset();
                renderForm();
                addModal.classList.remove('active');
            } catch (err) { alert("Save failed: " + err.message); }
        };

        // Database: Sync & Display
        onValue(ref(db, 'cards/'), (snapshot) => {
            document.getElementById('loadingStatus').style.display = 'none';
            container.innerHTML = '';
            const data = snapshot.val();
            
            if(!data) {
                container.innerHTML = '<div class="col-span-full text-center text-slate-400 py-10"><i class="fa-regular fa-folder-open text-5xl mb-4 block"></i> No cards found. Start by clicking the "+" button.</div>';
                return;
            }

            Object.keys(data).forEach(key => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-100 card-hover transition-all cursor-pointer relative group";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-indigo-50 text-indigo-600 text-[10px] font-extrabold uppercase px-3 py-1 rounded-full">${item.type}</span>
                        <button onclick="window.delCard('${key}')" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <h3 class="font-bold text-slate-800 text-lg mb-1">${item.title}</h3>
                    <p class="text-slate-400 text-xs font-mono">${item.acc_num || item.cnic_num || 'Secure Content'}</p>
                `;
                card.onclick = (e) => { if(!e.target.closest('button')) showDetails(item); };
                container.appendChild(card);
            });
        });

        // Delete Card
        window.delCard = (id) => {
            if(confirm("Are you sure you want to delete this card?")) remove(ref(db, 'cards/' + id));
        };

        // Details View Logic
        const showDetails = (item) => {
            const isAdmin = userSession && userSession.email === ADMIN_EMAIL;
            let detailBody = `
                <div class="bg-indigo-600 p-8 text-white">
                    <h2 class="text-2xl font-bold mb-1">${item.title}</h2>
                    <p class="text-indigo-200 text-xs uppercase tracking-widest font-bold">${item.type} | ${item.date}</p>
                </div>
                <div class="p-8 space-y-5">
            `;

            Object.entries(item).forEach(([k, v]) => {
                if(['title', 'type', 'date', 'cvv'].includes(k)) return;
                detailBody += `<div><label class="text-[10px] font-bold text-slate-400 uppercase">${k.replace('_',' ')}</label><p class="text-slate-800 font-semibold">${v}</p></div>`;
            });

            if(item.type === 'payment') {
                detailBody += `
                    <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">CVV / Security Pin</label>
                        <p class="text-indigo-600 font-bold text-xl tracking-tighter">${isAdmin ? (item.cvv || '---') : '•••• (Restricted)'}</p>
                    </div>`;
            }

            detailBody += `</div>`;
            document.getElementById('viewContent').innerHTML = detailBody;
            document.getElementById('viewModal').classList.add('active');
        };

    </script>
</body>
</html>
