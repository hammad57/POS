<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Card Vault | Muluk Hussain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        .modal { display: none; transition: all 0.3s ease; }
        .modal.active { display: flex; z-index: 1000; }
        .card-grad { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <header class="card-grad text-white p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
                <h1 class="text-xl font-bold uppercase tracking-widest">Card Vault</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="adminBadge" class="hidden bg-yellow-400 text-black text-[10px] font-bold px-2 py-1 rounded">ADMIN</span>
                <button id="loginBtn" class="bg-white text-indigo-600 px-5 py-1.5 rounded-full font-bold text-sm shadow-md">Login</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loader" class="col-span-full text-center py-20">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600"></i>
                <p class="mt-4 text-slate-500">Cards load ho rahay hain...</p>
            </div>
        </div>
    </main>

    <button id="openAddModal" class="fixed bottom-8 right-8 w-16 h-16 card-grad text-white rounded-full shadow-2xl flex items-center justify-center text-2xl z-50 hover:scale-110 transition">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="addModal" class="modal fixed inset-0 bg-black/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b bg-slate-50 flex justify-between items-center">
                <h2 class="font-bold text-lg">Add New Card</h2>
                <button id="closeAddModal" class="text-2xl hover:text-red-500">&times;</button>
            </div>
            
            <form id="cardForm" class="p-6 overflow-y-auto space-y-4">
                <div class="flex gap-2">
                    <select id="typeSelect" class="flex-1 border-2 border-slate-100 p-3 rounded-xl outline-none focus:border-indigo-500 bg-slate-50 font-bold">
                        <option value="payment">💳 Payment Card</option>
                        <option value="visiting">📇 Visiting Card</option>
                        <option value="cnic">🆔 CNIC Card</option>
                        <option value="other">📄 Other Document</option>
                    </select>
                    <button type="button" id="startScan" class="bg-indigo-100 text-indigo-600 px-4 rounded-xl hover:bg-indigo-200">
                        <i class="fa-solid fa-qrcode"></i>
                    </button>
                </div>

                <div id="reader" class="hidden rounded-xl overflow-hidden border-2 border-indigo-200"></div>

                <div id="formFields" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

                <div class="grid grid-cols-2 gap-4 border-t pt-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Front Side Image</label>
                        <input type="file" id="imgFront" accept="image/*" class="text-xs mt-1 block w-full">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Back Side Image</label>
                        <input type="file" id="imgBack" accept="image/*" class="text-xs mt-1 block w-full">
                    </div>
                </div>

                <button type="submit" id="saveBtn" class="w-full card-grad text-white py-4 rounded-2xl font-bold shadow-lg mt-4 disabled:opacity-50">
                    <span id="btnText">SAVE TO VAULT</span>
                </button>
            </form>
        </div>
    </div>

    <div id="viewModal" class="modal fixed inset-0 bg-black/90 backdrop-blur-md items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl relative">
            <button id="closeViewModal" class="absolute top-5 right-6 text-slate-400 hover:text-red-500 text-3xl z-10">&times;</button>
            <div id="cardDetailContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // Firebase Configuration (As per your details)
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com",
            projectId: "own-live-steam-web",
            storageBucket: "own-live-steam-web.firebasestorage.app",
            messagingSenderId: "132045886996",
            appId: "1:132045886996:web:8a6d937c3548afd2477901"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "mysw786@gmail.com";
        let currentUser = null;

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('loginBtn').innerText = user ? "Logout" : "Login";
            document.getElementById('adminBadge').style.display = (user && user.email === ADMIN_EMAIL) ? "block" : "none";
        });

        document.getElementById('loginBtn').onclick = () => currentUser ? signOut(auth) : signInWithPopup(auth, provider);

        // UI Generation
        const typeSelect = document.getElementById('typeSelect');
        const formFields = document.getElementById('formFields');

        const renderForm = () => {
            const t = typeSelect.value;
            let fields = `<div class="col-span-full"><input type="text" id="title" placeholder="Card Title" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none" required></div>`;
            
            if(t === 'payment') {
                fields += `<input type="text" id="acc_num" placeholder="Account Number" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="holder" placeholder="Holder Name" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="issue" placeholder="Issue Date" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="expiry" placeholder="Expiry Date" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="sec_date" placeholder="Security Date (MM/YY)" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="password" id="sec_code" placeholder="Security Code" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">`;
            } else if(t === 'visiting') {
                fields += `<input type="text" id="name" placeholder="Name" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="num1" placeholder="Contact 1" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="num2" placeholder="Contact 2" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="num3" placeholder="Contact 3" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="email" id="email" placeholder="Email" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="loc" placeholder="Location" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">`;
            } else if(t === 'cnic') {
                fields += `<input type="text" id="name" placeholder="Name on CNIC" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="cnic_num" placeholder="CNIC Number" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="dob" placeholder="DOB" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="issue" placeholder="Issue Date" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="expiry" placeholder="Expiry Date" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">`;
            } else {
                fields += `<input type="text" id="name" placeholder="Name" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="num" placeholder="Contact" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="address" placeholder="Address" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="issue" placeholder="Issue Date" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <input type="text" id="expiry" placeholder="Expiry Date" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none">
                           <textarea id="remarks" placeholder="Remarks" class="col-span-full border-2 border-slate-100 p-3 rounded-xl outline-none h-20"></textarea>`;
            }
            formFields.innerHTML = fields;
        };

        typeSelect.onchange = renderFields;
        renderForm();

        // Image Upload Helper
        const uploadFile = async (file, path) => {
            if(!file) return null;
            const storageRef = sRef(storage, `vault/${Date.now()}_${path}`);
            await uploadBytes(storageRef, file);
            return await getDownloadURL(storageRef);
        };

        // Form Submit
        const cardForm = document.getElementById('cardForm');
        cardForm.onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            const btnText = document.getElementById('btnText');
            
            saveBtn.disabled = true;
            btnText.innerText = "UPLOADING...";

            const data = { type: typeSelect.value, timestamp: Date.now() };
            cardForm.querySelectorAll('input:not([type="file"]), textarea').forEach(i => data[i.id] = i.value);

            try {
                // Handle Images
                const frontFile = document.getElementById('imgFront').files[0];
                const backFile = document.getElementById('imgBack').files[0];
                
                data.frontURL = await uploadFile(frontFile, 'front.jpg');
                data.backURL = await uploadFile(backFile, 'back.jpg');

                await push(ref(db, 'cards/'), data);
                cardForm.reset();
                renderForm();
                document.getElementById('addModal').classList.remove('active');
            } catch (err) { alert(err.message); }
            
            saveBtn.disabled = false;
            btnText.innerText = "SAVE TO VAULT";
        };

        // Sync Data
        onValue(ref(db, 'cards/'), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            const data = snapshot.val();
            if(!data) { grid.innerHTML = '<p class="col-span-full text-center py-10 opacity-50">Vault is empty.</p>'; return; }

            Object.keys(data).forEach(id => {
                const item = data[id];
                const div = document.createElement('div');
                div.className = "bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 group relative cursor-pointer hover:shadow-xl transition-all";
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <span class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-3 py-1 rounded-full uppercase">${item.type}</span>
                        <button onclick="window.delCard('${id}')" class="text-slate-300 hover:text-red-500 transition opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800">${item.title}</h3>
                    <p class="text-indigo-600 font-mono text-sm mt-1">${item.acc_num || item.cnic_num || item.name || '---'}</p>
                    <div class="mt-8 flex justify-between text-[11px] font-bold text-slate-400 border-t pt-4">
                        <span>ISSUE: ${item.issue || 'N/A'}</span>
                        <span class="text-red-400">EXPIRY: ${item.expiry || 'N/A'}</span>
                    </div>
                `;
                div.onclick = (e) => { if(!e.target.closest('button')) showDetails(item); };
                grid.appendChild(div);
            });
        });

        window.delCard = (id) => confirm("Hamesha ke liye delete karein?") && remove(ref(db, 'cards/' + id));

        const showDetails = (item) => {
            const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
            let html = `
                <div class="card-grad p-8 text-white">
                    <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">${item.type}</p>
                    <h2 class="text-3xl font-black">${item.title}</h2>
                </div>
                <div class="p-8 space-y-4 max-h-[60vh] overflow-y-auto">
            `;

            Object.entries(item).forEach(([k, v]) => {
                if(['title', 'type', 'timestamp', 'frontURL', 'backURL', 'sec_code'].includes(k)) return;
                html += `<div><label class="text-[10px] font-bold text-slate-400 uppercase">${k}</label><p class="font-bold text-slate-800">${v}</p></div>`;
            });

            if(item.type === 'payment') {
                html += `<div class="bg-red-50 p-4 rounded-2xl border-2 border-dashed border-red-100">
                    <label class="text-[10px] font-bold text-red-400 uppercase">Security Code</label>
                    <p class="text-2xl font-black text-red-600">${isAdmin ? (item.sec_code || '---') : '••••'}</p>
                </div>`;
            }

            html += `
                <div class="grid grid-cols-2 gap-3 mt-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Front Pic</label>
                        <div class="aspect-video bg-slate-100 rounded-xl overflow-hidden border">
                            ${item.frontURL ? `<img src="${item.frontURL}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[10px] text-slate-400">NO IMAGE</div>`}
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Back Pic</label>
                        <div class="aspect-video bg-slate-100 rounded-xl overflow-hidden border">
                            ${item.backURL ? `<img src="${item.backURL}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[10px] text-slate-400">NO IMAGE</div>`}
                        </div>
                    </div>
                </div>
            </div>`;
            
            document.getElementById('cardDetailContent').innerHTML = html;
            document.getElementById('viewModal').classList.add('active');
        };

        // Modal Controls
        document.getElementById('openAddModal').onclick = () => document.getElementById('addModal').classList.add('active');
        document.getElementById('closeAddModal').onclick = () => document.getElementById('addModal').classList.remove('active');
        document.getElementById('closeViewModal').onclick = () => document.getElementById('viewModal').classList.remove('active');

    </script>
</body>
</html>
