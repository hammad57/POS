<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muluk Hussain - Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f1f5f9; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .app-card { transition: transform 0.2s; border: 1px solid rgba(255, 255, 255, 0.05); position: relative; z-index: 10; }
        .app-card:active { transform: scale(0.95); background: rgba(59, 130, 246, 0.1); }
        
        #appOverlay { position: fixed; inset: 0; background: #000; z-index: 99998; display: none; }
        #closeAppBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 99999; display: none; }
        
        /* Notifications - Sab Se Ooper Set Kar Diya */
        .notify-badge { position: absolute; top: -2px; right: -2px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 5px; font-size: 10px; font-weight: bold; border: 2px solid #0f172a; }
        
        #notifDropdown { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 65px; 
            width: calc(100vw - 32px); 
            max-width: 400px; 
            z-index: 100000 !important; /* Extremely high priority */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #notifDropdown.active { display: block; animation: slideDown 0.3s ease-out; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* Privacy/Blur State */
        .balance-hidden { filter: blur(15px); pointer-events: none; user-select: none; transition: filter 0.4s ease; }
    </style>
</head>
<body class="p-4">

    <div id="installBanner" class="fixed bottom-6 left-4 right-4 glass p-5 rounded-2xl shadow-2xl border-t-4 border-blue-500 hidden items-center justify-between gap-4 z-[100001]">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center"><i class="fas fa-rocket text-white"></i></div>
            <div><p class="text-sm font-bold">Install Hub</p><p class="text-[10px] text-slate-400">Add to your home screen</p></div>
        </div>
        <div class="flex gap-2">
            <button id="installBtn" class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold">Install</button>
            <button onclick="document.getElementById('installBanner').style.display='none'" class="text-slate-400 p-2"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <button id="closeAppBtn" onclick="closeApp()" class="bg-red-600 text-white px-8 py-3 rounded-full shadow-2xl font-bold flex items-center gap-2">
        <i class="fas fa-home"></i> Close App
    </button>
    <div id="appOverlay"><iframe id="appFrame" class="w-full h-full border-none"></iframe></div>

    <header class="flex justify-between items-center mb-6 glass p-4 rounded-2xl relative z-[50]">
        <h1 class="text-xl font-extrabold tracking-tight">Muluk Hussain <span class="text-blue-500">Hub</span></h1>
        
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="p-2.5 bg-slate-800 rounded-xl cursor-pointer" onclick="toggleNotif()">
                    <i class="fas fa-bell text-lg text-yellow-500"></i>
                    <span id="notifBadge" class="notify-badge">0</span>
                </div>
                
                <div id="notifDropdown" class="glass rounded-2xl overflow-hidden shadow-2xl">
                    <div class="p-4 border-b border-white/10 bg-slate-800 flex justify-between items-center">
                        <span class="font-bold text-sm">Notifications</span>
                        <button onclick="toggleNotif()"><i class="fas fa-times text-slate-500"></i></button>
                    </div>
                    <div id="notifList" class="max-h-[70vh] overflow-y-auto p-3 space-y-3 bg-slate-900/90">
                        </div>
                </div>
            </div>
            <button onclick="toggleModal('addAppModal')" class="bg-blue-600 w-11 h-11 rounded-xl shadow-lg shadow-blue-900/20"><i class="fas fa-plus"></i></button>
        </div>
    </header>

    <main class="space-y-6">
        
        <div class="glass p-8 rounded-[2.5rem] bg-gradient-to-br from-blue-600/20 to-transparent border-t border-blue-500/40 text-center relative z-10">
            <h3 class="text-xs font-bold text-blue-400 mb-3 uppercase tracking-[0.2em] flex justify-center items-center gap-2">
                Available Balance
                <i id="eyeIcon" class="fas fa-eye-slash text-slate-500 cursor-pointer text-lg p-1" onclick="togglePrivacy()"></i>
            </h3>
            <p id="mainNetBalance" class="text-4xl font-black balance-hidden">Rs. 0</p>
        </div>

        <div class="grid grid-cols-2 gap-4" id="appsGrid"></div>

        <div class="flex justify-center mt-6 pb-6">
            <button id="bottomInstallBtn" class="bg-slate-800/80 text-slate-300 border border-slate-700 px-5 py-2.5 rounded-full text-xs font-bold hidden items-center gap-2 hover:bg-slate-700 transition-all shadow-lg">
                <i class="fas fa-download text-blue-400"></i> Install Hub App
            </button>
        </div>
    </main>

    <div id="addAppModal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center p-6 z-[200000]">
        <div class="glass p-6 rounded-3xl w-full max-w-sm">
            <h2 class="text-lg font-bold mb-4 text-center">Add Shortcut</h2>
            <input type="text" id="newAppName" placeholder="App Name" class="w-full p-4 bg-slate-900 rounded-xl mb-3 outline-none text-sm border border-slate-700">
            <input type="text" id="newAppLink" placeholder="Link (e.g. data.html)" class="w-full p-4 bg-slate-900 rounded-xl mb-3 outline-none text-sm border border-slate-700">
            <div id="iconGrid" class="grid grid-cols-4 gap-2 max-h-32 overflow-y-auto mb-4 p-2 bg-slate-950 rounded-xl"></div>
            <input type="hidden" id="selectedIcon" value="fa-cube">
            <div class="flex gap-2">
                <button onclick="saveApp()" class="flex-1 bg-blue-600 p-4 rounded-xl font-bold">Save</button>
                <button onclick="toggleModal('addAppModal')" class="flex-1 bg-slate-800 p-4 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
        const fbApp = initializeApp(firebaseConfig);
        const db = getDatabase(fbApp);

        // --- Core Functions ---
        window.openApp = (url) => {
            document.getElementById('appFrame').src = url;
            document.getElementById('appOverlay').style.display = 'block';
            document.getElementById('closeAppBtn').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        window.closeApp = () => {
            document.getElementById('appOverlay').style.display = 'none';
            document.getElementById('closeAppBtn').style.display = 'none';
            document.getElementById('appFrame').src = '';
            document.body.style.overflow = 'auto';
        };
        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');
        window.toggleNotif = () => document.getElementById('notifDropdown').classList.toggle('active');

        // Privacy Toggle (Starts Hidden)
        let isHidden = true;
        window.togglePrivacy = () => {
            isHidden = !isHidden;
            const bal = document.getElementById('mainNetBalance');
            const icon = document.getElementById('eyeIcon');
            if(isHidden) {
                bal.classList.add('balance-hidden');
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                bal.classList.remove('balance-hidden');
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        // --- Data Handling ---
        onValue(ref(db, 'notifications'), snap => {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            list.innerHTML = '';
            if(snap.exists()) {
                const data = Object.values(snap.val()).reverse();
                badge.innerText = data.length;
                data.forEach(n => {
                    list.innerHTML += `<div class="p-4 bg-white/5 border-l-4 border-blue-500 rounded-xl text-[12px] mb-2 shadow-lg">
                        <p class="text-slate-200 leading-relaxed font-medium">${n.text}</p>
                        <div class="flex justify-between items-center mt-2 opacity-40 text-[9px] uppercase font-bold tracking-wider">
                            <span>${n.date}</span><span>${n.time}</span>
                        </div>
                    </div>`;
                });
            } else {
                badge.innerText = "0";
                list.innerHTML = `<div class="py-12 text-center opacity-30 italic text-sm">No new updates</div>`;
            }
        });

        onValue(ref(db, 'bank_accounts'), snapBanks => {
            onValue(ref(db, 'bank_transactions'), snapTrans => {
                let total = 0;
                if(snapBanks.exists()) {
                    snapBanks.forEach(bSnap => {
                        const bId = bSnap.key;
                        let bBal = 0;
                        if(snapTrans.exists() && snapTrans.val()[bId]) {
                            Object.values(snapTrans.val()[bId]).forEach(t => {
                                const amt = parseFloat(t.amount || 0);
                                if(t.type.includes('In') || t.type.includes('Received')) bBal += amt;
                                else bBal -= amt;
                            });
                        }
                        total += bBal;
                    });
                }
                document.getElementById('mainNetBalance').innerText = "Rs. " + total.toLocaleString();
            });
        });

        // --- UI Rendering ---
        const iconsList = ['fa-barcode', 'fa-vault', 'fa-chart-line', 'fa-user-gear', 'fa-store', 'fa-hand-holding-dollar', 'fa-users', 'fa-sync', 'fa-wallet', 'fa-receipt'];
        document.getElementById('iconGrid').innerHTML = iconsList.map(i => `<div onclick="selectIcon('${i}')" class="p-3 bg-slate-800 rounded-lg text-center cursor-pointer hover:bg-blue-600"><i class="fas ${i}"></i></div>`).join('');
        window.selectIcon = (i) => { document.getElementById('selectedIcon').value = i; };

        onValue(ref(db, 'cpanel_apps'), snap => {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            const defaults = [
                {name: 'Scanner', link: 'index.html', icon: 'fa-barcode'},
                {name: 'Money', link: 'Money.html', icon: 'fa-vault'},
                {name: 'Manager', link: 'manager.html', icon: 'fa-user-gear'},
                {name: 'Expenses', link: 'expense.html', icon: 'fa-chart-line'},
                {name: 'Shops', link: 'Shops_Manager.html', icon: 'fa-store'},
                {name: 'Loans', link: 'Loan.html', icon: 'fa-hand-holding-dollar'},
                {name: 'Salers', link: 'Saler.html', icon: 'fa-users'},
                {name: 'Sync', link: 'data.html', icon: 'fa-sync'}
            ];
            defaults.forEach(a => {
                const d = document.createElement('div');
                d.className = 'app-card glass p-6 rounded-[2rem] flex flex-col items-center gap-3 text-center cursor-pointer';
                d.onclick = () => openApp(a.link);
                d.innerHTML = `<div class="w-16 h-16 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-3xl shadow-inner"><i class="fas ${a.icon}"></i></div>
                               <span class="text-[11px] font-bold uppercase tracking-wider text-slate-300">${a.name}</span>`;
                grid.appendChild(d);
            });
        });

        window.saveApp = () => {
            const name = document.getElementById('newAppName').value;
            const link = document.getElementById('newAppLink').value;
            const icon = document.getElementById('selectedIcon').value;
            if(name && link) { push(ref(db, 'cpanel_apps'), {name, link, icon}); toggleModal('addAppModal'); }
        };

        // --- PWA Installation Logic ---
        let deferredPrompt;
        const bottomBtn = document.getElementById('bottomInstallBtn');
        const topBannerBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Button ko show karo jab browser allow kare
            bottomBtn.classList.remove('hidden');
            bottomBtn.classList.add('flex');
        });

        const handleInstallClick = async () => {
            if (deferredPrompt !== null) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                    bottomBtn.classList.add('hidden');
                    bottomBtn.classList.remove('flex');
                    document.getElementById('installBanner').style.display = 'none';
                }
            }
        };

        bottomBtn.addEventListener('click', handleInstallClick);
        if(topBannerBtn) topBannerBtn.addEventListener('click', handleInstallClick);

    </script>
</body>
</html>
