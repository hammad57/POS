<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muluk Hussain - Professional CPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .app-card { transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
        .app-card:hover { transform: translateY(-5px); border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        
        #appOverlay { position: fixed; inset: 0; background: #000; z-index: 9998; display: none; }
        #closeAppBtn { position: fixed; top: 20px; right: 20px; z-index: 9999; display: none; }
        
        .notify-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; border: 2px solid #0f172a; }
        
        /* Dropdown Animation */
        #notifDropdown { display: none; transform-origin: top right; transition: 0.2s; }
        #notifDropdown.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <button id="closeAppBtn" onclick="closeApp()" class="bg-red-600 hover:bg-red-700 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center transition-all">
        <i class="fas fa-times text-xl"></i>
    </button>

    <div id="appOverlay"><iframe id="appFrame" class="w-full h-full border-none"></iframe></div>

    <header class="max-w-7xl mx-auto flex justify-between items-center mb-8 glass p-6 rounded-2xl relative">
        <h1 class="text-2xl font-extrabold tracking-tight"><span class="text-blue-500">Muluk Hussain</span> Hub</h1>
        
        <div class="flex items-center gap-4">
            <div class="relative">
                <div class="p-3 bg-slate-800 rounded-full cursor-pointer hover:bg-slate-700" onclick="toggleNotif()">
                    <i class="fas fa-bell text-xl text-yellow-500"></i>
                    <span id="notifBadge" class="notify-badge">0</span>
                </div>
                <div id="notifDropdown" class="absolute right-0 mt-3 w-72 glass rounded-2xl overflow-hidden z-[1000]">
                    <div class="p-4 border-b border-white/10 flex justify-between">
                        <span class="font-bold">Notifications</span>
                        <button onclick="openApp('Notify.html')" class="text-xs text-blue-400">Manage</button>
                    </div>
                    <div id="notifList" class="max-h-60 overflow-y-auto p-2 space-y-2">
                        </div>
                </div>
            </div>
            <button onclick="toggleModal('addAppModal')" class="bg-blue-600 px-4 py-2 rounded-xl font-bold flex items-center gap-2"><i class="fas fa-plus"></i></button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="lg:col-span-1 space-y-4">
            <div class="glass p-5 rounded-2xl cursor-pointer hover:bg-slate-800 transition border-l-4 border-blue-500" onclick="toggleVaultDetails()">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-slate-400 text-xs font-bold uppercase">Vault Available</p>
                        <h2 class="text-xl font-black" id="statVault">Rs. 0</h2>
                    </div>
                    <i class="fas fa-chevron-down text-slate-500"></i>
                </div>
                <div id="bankList" class="hidden mt-4 pt-4 border-t border-white/10 space-y-2">
                    </div>
            </div>

            <div onclick="openApp('expense.html')" class="glass p-5 rounded-2xl cursor-pointer hover:bg-slate-800 border-l-4 border-emerald-500">
                <p class="text-slate-400 text-xs font-bold uppercase">Market Expenses</p>
                <h2 class="text-xl font-black" id="statExpense">Rs. 0</h2>
            </div>

            <div onclick="openApp('order.html')" class="glass p-5 rounded-2xl cursor-pointer hover:bg-slate-800 border-l-4 border-purple-500">
                <p class="text-slate-400 text-xs font-bold uppercase">Active Orders</p>
                <h2 class="text-xl font-black text-purple-400" id="statOrders">0</h2>
            </div>

            <div class="glass p-5 rounded-2xl border-l-4 border-orange-500">
                <p class="text-slate-400 text-xs font-bold uppercase">Est. Profit</p>
                <h2 class="text-xl font-black text-orange-400" id="statProfit">Rs. 0</h2>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-8">
            <div class="glass p-8 rounded-3xl bg-gradient-to-br from-blue-600/20 to-transparent border-t-4 border-blue-500">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                    <div>
                        <h3 class="text-lg font-bold text-blue-400 mb-1">Current Balance</h3>
                        <p class="text-sm text-slate-400">Combined balance after all adjustments</p>
                    </div>
                    <div class="text-center md:text-right">
                        <span class="text-4xl md:text-5xl font-black text-white" id="mainNetBalance">Rs. 0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="appsGrid">
                </div>
        </div>
    </div>

    <div id="addAppModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-[10000]">
        <div class="glass p-8 rounded-3xl w-full max-w-md">
            <h2 class="text-xl font-bold mb-6">Register New File</h2>
            <input type="text" id="newAppName" placeholder="App Name" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl mb-3 outline-none">
            <input type="text" id="newAppLink" placeholder="File Link (e.g. data.html)" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl mb-3 outline-none">
            <input type="text" id="iconSearch" onkeyup="filterIcons()" placeholder="Search icon..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl mb-3 outline-none">
            <div id="iconGrid" class="grid grid-cols-5 gap-2 max-h-32 overflow-y-auto mb-4"></div>
            <input type="hidden" id="selectedIcon" value="fa-cube">
            <div class="flex gap-2">
                <button onclick="saveApp()" class="flex-1 bg-blue-600 p-3 rounded-xl font-bold">Save</button>
                <button onclick="toggleModal('addAppModal')" class="flex-1 bg-slate-700 p-3 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Core Functions
        window.openApp = (url) => {
            document.getElementById('appFrame').src = url;
            document.getElementById('appOverlay').style.display = 'block';
            document.getElementById('closeAppBtn').style.display = 'flex';
        };
        window.closeApp = () => {
            document.getElementById('appOverlay').style.display = 'none';
            document.getElementById('closeAppBtn').style.display = 'none';
            document.getElementById('appFrame').src = '';
        };
        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');
        window.toggleNotif = () => document.getElementById('notifDropdown').classList.toggle('active');
        window.toggleVaultDetails = () => document.getElementById('bankList').classList.toggle('hidden');

        // Stats & Data Sync
        onValue(ref(db, 'orders'), snap => {
            document.getElementById('statOrders').innerText = snap.exists() ? Object.keys(snap.val()).length : 0;
        });

        onValue(ref(db, 'expenses'), snap => {
            let total = 0;
            if(snap.exists()) Object.values(snap.val()).forEach(e => total += parseFloat(e.amount || 0));
            document.getElementById('statExpense').innerText = "Rs. " + total.toLocaleString();
        });

        // Notifications Dropdown
        onValue(ref(db, 'notifications'), snap => {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            list.innerHTML = '';
            let count = 0;
            if(snap.exists()) {
                const data = Object.values(snap.val()).reverse();
                count = data.length;
                data.forEach(n => {
                    list.innerHTML += `<div class="p-3 bg-white/5 rounded-lg text-xs border-l-2 border-blue-500">
                        <p>${n.text}</p><small class="text-slate-500">${n.time || ''}</small>
                    </div>`;
                });
            } else {
                list.innerHTML = `<p class="text-center text-xs text-slate-500 py-4">No new notifications</p>`;
            }
            badge.innerText = count;
        });

        // Detailed Vault & Net Balance Logic
        onValue(ref(db, 'bank_accounts'), snapBanks => {
            onValue(ref(db, 'bank_transactions'), snapTrans => {
                const bList = document.getElementById('bankList');
                bList.innerHTML = '';
                let totalVault = 0;
                let totalIncome = 0;
                let totalExpense = 0;

                if(snapBanks.exists()) {
                    snapBanks.forEach(bSnap => {
                        const bId = bSnap.key;
                        const bData = bSnap.val();
                        let bBal = 0;
                        
                        if(snapTrans.exists() && snapTrans.val()[bId]) {
                            Object.values(snapTrans.val()[bId]).forEach(t => {
                                const amt = parseFloat(t.amount);
                                if(t.type.includes('In') || t.type.includes('Received') || t.type.includes('Adjustment In')) {
                                    bBal += amt; totalIncome += amt;
                                } else {
                                    bBal -= amt; totalExpense += amt;
                                }
                            });
                        }
                        totalVault += bBal;
                        bList.innerHTML += `<div class="flex justify-between text-xs py-1"><span>${bData.name}</span><span class="font-bold">${bBal.toLocaleString()}</span></div>`;
                    });
                }
                document.getElementById('statVault').innerText = "Rs. " + totalVault.toLocaleString();
                document.getElementById('mainNetBalance').innerText = "Rs. " + totalVault.toLocaleString();
                document.getElementById('statProfit').innerText = "Rs. " + (totalIncome - totalExpense).toLocaleString();
            });
        });

        // Apps Grid Restoration
        const iconList = ['fa-barcode', 'fa-vault', 'fa-chart-line', 'fa-user-gear', 'fa-store', 'fa-hand-holding-dollar', 'fa-users', 'fa-sync', 'fa-file-invoice', 'fa-box'];
        window.filterIcons = () => {
            const grid = document.getElementById('iconGrid');
            const q = document.getElementById('iconSearch').value.toLowerCase();
            grid.innerHTML = iconList.filter(i => i.includes(q)).map(i => `<div onclick="selectIcon('${i}')" class="p-2 bg-slate-800 rounded cursor-pointer text-center hover:bg-blue-600"><i class="fas ${i}"></i></div>`).join('');
        };

        window.selectIcon = (i) => { document.getElementById('selectedIcon').value = i; alert("Icon Selected!"); };

        onValue(ref(db, 'cpanel_apps'), snap => {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            const defaults = [
                {name: 'POS Scanner', link: 'index.html', icon: 'fa-barcode'},
                {name: 'Money Vault', link: 'Money.html', icon: 'fa-vault'},
                {name: 'Manager', link: 'manager.html', icon: 'fa-user-gear'},
                {name: 'Expenses', link: 'expense.html', icon: 'fa-chart-line'},
                {name: 'Shops Sync', link: 'Shops_Manager.html', icon: 'fa-store'},
                {name: 'Loan Manager', link: 'Loan.html', icon: 'fa-hand-holding-dollar'},
                {name: 'Saler Records', link: 'Saler.html', icon: 'fa-users'},
                {name: 'Data Sync', link: 'data.html', icon: 'fa-sync'}
            ];
            defaults.forEach(a => renderCard(a));
            if(snap.exists()) Object.values(snap.val()).forEach(a => renderCard(a));
        });

        function renderCard(a) {
            const d = document.createElement('div');
            d.className = 'app-card glass p-6 rounded-2xl flex flex-col items-center gap-3';
            d.onclick = () => openApp(a.link);
            d.innerHTML = `<div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-xl"><i class="fas ${a.icon}"></i></div>
                           <span class="text-xs font-bold">${a.name}</span>`;
            document.getElementById('appsGrid').appendChild(d);
        }

        window.saveApp = () => {
            const name = document.getElementById('newAppName').value;
            const link = document.getElementById('newAppLink').value;
            const icon = document.getElementById('selectedIcon').value;
            if(name && link) { push(ref(db, 'cpanel_apps'), {name, link, icon}); toggleModal('addAppModal'); }
        };
        
        window.filterIcons(); // Initial icon load
    </script>
</body>
</html>
