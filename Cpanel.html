<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muluk Hussain - Mobile Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .app-card { transition: transform 0.2s active; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
        .app-card:active { transform: scale(0.95); background: rgba(59, 130, 246, 0.2); }
        
        #appOverlay { position: fixed; inset: 0; background: #000; z-index: 9998; display: none; }
        #closeAppBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: none; }
        
        .notify-badge { position: absolute; top: -2px; right: -2px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 5px; font-size: 10px; font-weight: bold; border: 2px solid #0f172a; }
        
        #notifDropdown { display: none; transform-origin: top right; }
        #notifDropdown.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Install Popup Styling */
        #installBanner { display: none; position: fixed; bottom: 20px; left: 10px; right: 10px; z-index: 10001; }
    </style>
</head>
<body class="p-4">

    <div id="installBanner" class="glass p-5 rounded-2xl shadow-2xl border-t-4 border-blue-500 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-rocket text-white"></i>
            </div>
            <div>
                <p class="text-sm font-bold">Install App</p>
                <p class="text-[10px] text-slate-400">Install for better experience</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="installBtn" class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold">Install</button>
            <button onclick="hideInstall()" class="text-slate-400 p-2"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <button id="closeAppBtn" onclick="closeApp()" class="bg-red-600 text-white px-6 py-3 rounded-full shadow-2xl font-bold flex items-center gap-2">
        <i class="fas fa-home"></i> Back to Hub
    </button>

    <div id="appOverlay"><iframe id="appFrame" class="w-full h-full border-none"></iframe></div>

    <header class="flex justify-between items-center mb-6 glass p-4 rounded-2xl">
        <h1 class="text-xl font-extrabold"><span class="text-blue-500">M.H.</span> Hub</h1>
        
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="p-2 bg-slate-800 rounded-xl cursor-pointer" onclick="toggleNotif()">
                    <i class="fas fa-bell text-lg text-yellow-500"></i>
                    <span id="notifBadge" class="notify-badge">0</span>
                </div>
                <div id="notifDropdown" class="absolute right-0 mt-3 w-[85vw] max-w-sm glass rounded-2xl overflow-hidden z-[1000] shadow-2xl border border-white/10">
                    <div class="p-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                        <span class="font-bold text-sm">Notifications</span>
                        <button onclick="toggleNotif()" class="text-slate-500"><i class="fas fa-times"></i></button>
                    </div>
                    <div id="notifList" class="max-h-96 overflow-y-auto p-3 space-y-3"></div>
                </div>
            </div>
            <button onclick="toggleModal('addAppModal')" class="bg-blue-600 w-10 h-10 rounded-xl font-bold"><i class="fas fa-plus"></i></button>
        </div>
    </header>

    <main class="space-y-4">
        <div class="grid grid-cols-2 gap-4" id="appsGrid">
            </div>
    </main>

    <div id="addAppModal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center p-6 z-[10000]">
        <div class="glass p-6 rounded-3xl w-full">
            <h2 class="text-lg font-bold mb-4">Add New Shortcut</h2>
            <input type="text" id="newAppName" placeholder="App Name" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl mb-3 outline-none text-sm">
            <input type="text" id="newAppLink" placeholder="Link (e.g. data.html)" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl mb-3 outline-none text-sm">
            <div id="iconGrid" class="grid grid-cols-5 gap-2 max-h-32 overflow-y-auto mb-4 p-2 bg-slate-950 rounded-xl"></div>
            <input type="hidden" id="selectedIcon" value="fa-cube">
            <div class="flex gap-2 mt-4">
                <button onclick="saveApp()" class="flex-1 bg-blue-600 p-4 rounded-xl font-bold text-sm">Save</button>
                <button onclick="toggleModal('addAppModal')" class="flex-1 bg-slate-800 p-4 rounded-xl text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Core Navigation ---
        window.openApp = (url) => {
            document.getElementById('appFrame').src = url;
            document.getElementById('appOverlay').style.display = 'block';
            document.getElementById('closeAppBtn').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        window.closeApp = () => {
            document.getElementById('appOverlay').style.display = 'none';
            document.getElementById('closeAppBtn').style.display = 'none';
            document.getElementById('appFrame').src = '';
            document.body.style.overflow = 'auto';
        };
        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');
        window.toggleNotif = () => document.getElementById('notifDropdown').classList.toggle('active');

        // --- PWA Install Logic ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'flex';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') hideInstall();
                deferredPrompt = null;
            }
        });

        window.hideInstall = () => document.getElementById('installBanner').style.display = 'none';

        // --- Notifications ---
        onValue(ref(db, 'notifications'), snap => {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            list.innerHTML = '';
            if(snap.exists()) {
                const data = Object.values(snap.val()).reverse();
                badge.innerText = data.length;
                data.forEach(n => {
                    list.innerHTML += `<div class="p-3 bg-white/5 border-l-2 border-blue-500 rounded-lg text-xs">
                        <p class="text-slate-200">${n.text}</p>
                        <small class="opacity-40 mt-1 block">${n.date} ${n.time}</small>
                    </div>`;
                });
            } else {
                badge.innerText = "0";
                list.innerHTML = `<p class="text-center text-slate-500 text-xs py-6">No notifications</p>`;
            }
        });

        // --- Apps Load ---
        const icons = ['fa-barcode', 'fa-vault', 'fa-chart-line', 'fa-user-gear', 'fa-store', 'fa-hand-holding-dollar', 'fa-users', 'fa-sync'];
        const iconGrid = document.getElementById('iconGrid');
        iconGrid.innerHTML = icons.map(i => `<div onclick="selectIcon('${i}')" class="p-3 bg-slate-800 rounded-lg text-center"><i class="fas ${i}"></i></div>`).join('');
        window.selectIcon = (i) => { document.getElementById('selectedIcon').value = i; alert("Selected!"); };

        onValue(ref(db, 'cpanel_apps'), snap => {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            const defaults = [
                {name: 'POS Scanner', link: 'index.html', icon: 'fa-barcode'},
                {name: 'Money Vault', link: 'Money.html', icon: 'fa-vault'},
                {name: 'Manager', link: 'manager.html', icon: 'fa-user-gear'},
                {name: 'Expenses', link: 'expense.html', icon: 'fa-chart-line'},
                {name: 'Shops Sync', link: 'Shops_Manager.html', icon: 'fa-store'},
                {name: 'Loan Manager', link: 'Loan.html', icon: 'fa-hand-holding-dollar'},
                {name: 'Saler Records', link: 'Saler.html', icon: 'fa-users'},
                {name: 'Data Sync', link: 'data.html', icon: 'fa-sync'}
            ];
            defaults.forEach(a => renderCard(a));
            if(snap.exists()) Object.values(snap.val()).forEach(a => renderCard(a));
        });

        function renderCard(a) {
            const d = document.createElement('div');
            d.className = 'app-card glass p-6 rounded-3xl flex flex-col items-center gap-3 text-center';
            d.onclick = () => openApp(a.link);
            d.innerHTML = `<div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl shadow-inner"><i class="fas ${a.icon}"></i></div>
                           <span class="text-[11px] font-bold uppercase tracking-wider text-slate-300">${a.name}</span>`;
            document.getElementById('appsGrid').appendChild(d);
        }

        window.saveApp = () => {
            const name = document.getElementById('newAppName').value;
            const link = document.getElementById('newAppLink').value;
            const icon = document.getElementById('selectedIcon').value;
            if(name && link) { push(ref(db, 'cpanel_apps'), {name, link, icon}); toggleModal('addAppModal'); }
        };
    </script>
</body>
</html>
