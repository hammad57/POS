<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no">
    <title>Green Paultry Farm | Finance Manager</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root { 
            --bg-body: #f4f7f6; 
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --accent-green: #00b894; 
        }
        body { 
            background-color: var(--bg-body); 
            color: var(--text-color);
            font-family: 'Poppins', sans-serif; 
            padding: 25px; 
            transition: background-color 0.3s, color 0.3s;
        }
        .main-container { width: 1150px; margin: 0 auto; }
        .card-3d { 
            background: var(--card-bg); 
            color: var(--text-color);
            border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            padding: 25px; 
            margin-bottom: 20px; 
            transition: background-color 0.3s, color 0.3s;
        }
        .bal-amt { font-size: 2rem; font-weight: 800; color: var(--accent-green); }
        .fab-btn { position: fixed; bottom: 40px; right: 40px; width: 70px; height: 70px; border-radius: 50%; background: var(--accent-green); color: white; border: none; font-size: 30px; box-shadow: 0 10px 20px rgba(0,184,148,0.3); z-index: 1000; transition: transform 0.2s; }
        .fab-btn:hover { transform: scale(1.1); }
        
        /* Radio Button Styling */
        .radio-group { display: flex; gap: 15px; margin-top: 10px; }
        .radio-btn { display: none; }
        .radio-label { padding: 10px 25px; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; background: var(--card-bg); color: var(--text-color); }
        .radio-btn:checked + .radio-label { border-color: var(--accent-green); background: #e8f9f5; color: var(--accent-green); }

        /* Theme Selector Styling */
        .theme-select-box {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 5px 10px;
            font-weight: 500;
        }

        /* Table Theme Support Fixed */
        table { background-color: transparent !important; color: var(--text-color) !important; }
        th, td { background-color: transparent !important; color: var(--text-color) !important; border-bottom-color: rgba(150,150,150,0.2) !important; }
        .table-hover tbody tr:hover td { background-color: rgba(150,150,150,0.05) !important; }
        th { opacity: 0.8; }
        
        .accordion-button { background-color: var(--bg-body); color: var(--text-color); font-weight: bold; }
        .accordion-button:not(.collapsed) { background-color: #e8f9f5; color: var(--accent-green); box-shadow: none; }
        .accordion-item { background-color: var(--card-bg); border-color: rgba(150,150,150,0.2); }
        .accordion-body { color: var(--text-color); }
    </style>
</head>
<body>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">Green Paultry Farm Dashboard</h3>
        
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
                <label class="small fw-bold m-0"><i class="bi bi-palette2 me-1"></i> Theme:</label>
                <select id="themeSelect" class="theme-select-box form-select form-select-sm" style="width: 120px;">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                    <option value="green">Green</option>
                </select>
            </div>
        </div>
    </div>
    
    <div id="plansContainer">
        <div class="text-center text-muted my-5">Loading Green Paultry Farm Data...</div>
    </div>

</div>

<!-- Floating Action Button for New Entry -->
<button class="fab-btn" onclick="openEntryModal()"><i class="bi bi-plus-lg"></i></button>

<!-- Add Entry Modal -->
<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 border-0 rounded-4 shadow-lg" style="background: var(--card-bg); color: var(--text-color);">
            <h5 class="fw-bold mb-3 text-success">Add Income / Expense</h5>
            <form id="entryForm">
                <div class="mb-3">
                    <label class="small fw-bold">Active Plan</label>
                    <!-- Disabled dropdown to ensure only Green Paultry Farm is used -->
                    <select id="entryPlan" class="form-select" style="background: var(--bg-body); color: var(--text-color);" required disabled></select>
                </div>
                <div class="mb-3">
                    <label class="small fw-bold">Transaction Type</label>
                    <div class="radio-group">
                        <input type="radio" name="type" value="Income" id="inc" class="radio-btn" required>
                        <label for="inc" class="radio-label">Income</label>
                        
                        <input type="radio" name="type" value="Expense" id="exp" class="radio-btn" required>
                        <label for="exp" class="radio-label">Expense</label>
                    </div>
                </div>
                <!-- Person Dropdown Selection -->
                <div class="mb-3">
                    <label class="small fw-bold">Person Name (Optional Tag)</label>
                    <select id="entryPerson" class="form-select" style="background: var(--bg-body); color: var(--text-color);">
                        <option value="">None</option>
                        <option value="Muluk">Muluk</option>
                        <option value="Hammad">Hammad</option>
                    </select>
                </div>
                <div class="mb-3"><label class="small fw-bold">Amount (Rs.)</label><input type="number" id="entryAmt" class="form-control" style="background: var(--bg-body); color: var(--text-color);" required></div>
                <div class="mb-3"><label class="small fw-bold">Date</label><input type="date" id="entryDate" class="form-control" style="background: var(--bg-body); color: var(--text-color);" required></div>
                <div class="mb-3"><label class="small fw-bold">Remarks</label><input type="text" id="entryRemarks" class="form-control" style="background: var(--bg-body); color: var(--text-color);" placeholder="Tafseel likhein..."></div>
                <button type="submit" id="saveBtn" class="btn btn-success w-100 py-3 fw-bold rounded-pill" disabled>Save Transaction</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let accounts = {};
    let allTransactions = {};

    const themeSelect = document.getElementById('themeSelect');
    window.changeTheme = (themeName) => { set(ref(db, 'settings/gold_theme'), themeName); };
    themeSelect.addEventListener('change', (e) => { window.changeTheme(e.target.value); });
    onValue(ref(db, 'settings/gold_theme'), (snap) => {
        const theme = snap.val() || 'white';
        themeSelect.value = theme;
        applyThemeStyles(theme);
    });

    function applyThemeStyles(theme) {
        const root = document.documentElement;
        if (theme === 'black') {
            root.style.setProperty('--bg-body', '#121212');
            root.style.setProperty('--card-bg', '#1e1e1e');
            root.style.setProperty('--text-color', '#f5f5f5');
        } else if (theme === 'green') {
            root.style.setProperty('--bg-body', '#e8f9f5');
            root.style.setProperty('--card-bg', '#0b664e'); 
            root.style.setProperty('--text-color', '#ffffff');
        } else {
            root.style.setProperty('--bg-body', '#f4f7f6');
            root.style.setProperty('--card-bg', '#ffffff');
            root.style.setProperty('--text-color', '#2d3436');
        }
    }

    window.openEntryModal = () => {
        document.getElementById('entryForm').reset();
        document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('saveBtn').disabled = true;
        
        // Populate Plan Dropdown (Only Green Paultry Farm will be here due to filtering)
        const entryPlan = document.getElementById('entryPlan');
        entryPlan.innerHTML = Object.entries(accounts).map(([id, acc]) => `<option value="${id}">${acc.name}</option>`).join('');
        
        // Ensure plan is selected for submission even if disabled
        if(Object.keys(accounts).length > 0) {
            entryPlan.value = Object.keys(accounts)[0];
        }
        
        new bootstrap.Modal(document.getElementById('entryModal')).show();
    };

    // Form Event Listeners for enabling save btn
    document.getElementById('inc').addEventListener('change', () => { 
        document.getElementById('saveBtn').disabled = false; 
        if(!document.getElementById('entryRemarks').value) document.getElementById('entryRemarks').value = 'Profit';
    });
    document.getElementById('exp').addEventListener('change', () => { 
        document.getElementById('saveBtn').disabled = false; 
        if(!document.getElementById('entryRemarks').value) document.getElementById('entryRemarks').value = 'Purchasing';
    });

    // Save New Entry
    document.getElementById('entryForm').onsubmit = (e) => {
        e.preventDefault();
        const planId = document.getElementById('entryPlan').value;
        const selectedPerson = document.getElementById('entryPerson').value;
        let baseRemarks = document.getElementById('entryRemarks').value || 'Entry';
        if (selectedPerson) { baseRemarks = baseRemarks.trim() + " with " + selectedPerson; }
        
        const data = {
            type: document.querySelector('input[name="type"]:checked').value,
            amount: document.getElementById('entryAmt').value,
            date: document.getElementById('entryDate').value,
            remarks: baseRemarks,
            excludeFromBalance: false
        };
        
        if (planId) { push(ref(db, `bank_transactions/${planId}`), data); }
        bootstrap.Modal.getInstance(document.getElementById('entryModal')).hide();
    };

    // Fetch Data & Filter ONLY Green Paultry Farm
    onValue(ref(db, 'bank_accounts'), (snap) => {
        const allAccounts = snap.val() || {};
        accounts = {};
        for (const [id, acc] of Object.entries(allAccounts)) {
            // Sirf Green Paultry Farm ko filter karna hai
            if (acc.name === "Green Paultry Farm") {
                accounts[id] = acc;
            }
        }
        renderDashboard();
    });

    onValue(ref(db, 'bank_transactions'), (snap) => {
        allTransactions = snap.val() || {};
        renderDashboard();
    });

    function getMonthName(ym) {
        const d = new Date(ym + "-01");
        return d.toLocaleString('default', { month: 'long', year: 'numeric' });
    }

    function renderDashboard() {
        const container = document.getElementById('plansContainer');
        if (Object.keys(accounts).length === 0) {
            container.innerHTML = `<div class="text-center text-muted my-5">Green Paultry Farm account not found in database.</div>`;
            return;
        }

        let html = '';
        const currentDate = new Date();
        const currentMonthKey = currentDate.getFullYear() + "-" + String(currentDate.getMonth() + 1).padStart(2, '0'); 

        for (const [accId, acc] of Object.entries(accounts)) {
            const txsObj = allTransactions[accId] || {};
            const accTxs = Object.entries(txsObj).map(([tId, t]) => ({id: tId, ...t}));
            
            let totalInc = 0;
            let totalExp = 0;
            const openingBal = parseFloat(acc.openingBalance || 0);
            
            // Group transactions by month
            const monthsData = {}; 

            accTxs.forEach(t => {
                const amt = parseFloat(t.amount) || 0;
                const isInc = (t.type === 'Income' || t.type === 'Adjustment In');
                if (isInc) totalInc += amt; else totalExp += amt;
                
                const monthKey = t.date.slice(0, 7); 
                if (!monthsData[monthKey]) monthsData[monthKey] = { inc: 0, exp: 0, txs: [] };
                
                monthsData[monthKey].txs.push(t);
                if (isInc) monthsData[monthKey].inc += amt;
                else monthsData[monthKey].exp += amt;
            });

            const currentBal = openingBal + totalInc - totalExp;
            
            // Sort months descending
            const sortedMonthKeys = Object.keys(monthsData).sort((a, b) => b.localeCompare(a));
            
            // Generate Accordion HTML for Monthly History
            let accordionHtml = `<div class="accordion" id="accordion-${accId}">`;
            
            if(sortedMonthKeys.length === 0) {
                accordionHtml += `<div class="text-muted small p-2">No transactions yet.</div>`;
            } else {
                sortedMonthKeys.forEach((mKey, index) => {
                    const mData = monthsData[mKey];
                    const isCurrentMonth = (mKey === currentMonthKey);
                    const isExpanded = isCurrentMonth;
                    const collapseClass = isExpanded ? "show" : "";
                    const btnClass = isExpanded ? "" : "collapsed";
                    
                    const sortedTxs = mData.txs.sort((a,b) => new Date(b.date) - new Date(a.date));
                    
                    let tableRows = sortedTxs.map(t => `
                        <tr>
                            <td style="font-size: 0.9rem;">${t.date}</td>
                            <td class="fw-bold ${t.type.includes('In') || t.type === 'Income' ? 'text-success' : 'text-danger'}" style="font-size: 0.9rem;">${t.type}</td>
                            <td style="font-size: 0.9rem;">Rs. ${parseFloat(t.amount).toLocaleString()}</td>
                            <td style="font-size: 0.9rem;">${t.remarks || '-'}</td>
                        </tr>
                    `).join('');

                    accordionHtml += `
                        <div class="accordion-item mb-2 border rounded">
                            <h2 class="accordion-header" id="heading-${accId}-${mKey}">
                                <button class="accordion-button ${btnClass} rounded" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${accId}-${mKey}">
                                    <div class="d-flex justify-content-between w-100 pe-3">
                                        <span><i class="bi bi-calendar-event me-2"></i>${getMonthName(mKey)} ${isCurrentMonth ? '<span class="badge bg-success ms-2">Active</span>' : ''}</span>
                                        <span class="small">
                                            <span class="text-success me-3"><i class="bi bi-arrow-down-circle"></i> In: Rs. ${mData.inc.toLocaleString()}</span>
                                            <span class="text-danger"><i class="bi bi-arrow-up-circle"></i> Exp: Rs. ${mData.exp.toLocaleString()}</span>
                                        </span>
                                    </div>
                                </button>
                            </h2>
                            <div id="collapse-${accId}-${mKey}" class="accordion-collapse collapse ${collapseClass}" data-bs-parent="#accordion-${accId}">
                                <div class="accordion-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover m-0">
                                            <thead class="table-light">
                                                <tr><th>Date</th><th>Type</th><th>Amount</th><th>Remarks</th></tr>
                                            </thead>
                                            <tbody>${tableRows}</tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            accordionHtml += `</div>`;

            // Build Full Card
            html += `
            <div class="card-3d mb-4" style="border-left: 5px solid var(--accent-green);">
                <div class="row align-items-center mb-4">
                    <div class="col-md-6">
                        <h4 class="fw-bold mb-1">${acc.name}</h4>
                        <div class="text-muted small mb-2"><i class="bi bi-person me-1"></i>${acc.userName || 'Admin'} | <i class="bi bi-bank me-1"></i>A/c: ${acc.accountNo || 'N/A'}</div>
                        <h2 class="bal-amt mb-0">Rs. ${currentBal.toLocaleString()}</h2>
                        <div class="small text-muted mt-1">Opening Balance: Rs. ${openingBal.toLocaleString()}</div>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="fw-bold text-success"><i class="bi bi-graph-up-arrow me-1"></i>Total Income</span>
                            <span class="fw-bold text-success">Rs. ${totalInc.toLocaleString()}</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold text-danger"><i class="bi bi-graph-down-arrow me-1"></i>Total Expense</span>
                            <span class="fw-bold text-danger">Rs. ${totalExp.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
                
                <h6 class="fw-bold mb-3"><i class="bi bi-clock-history me-2"></i>Monthly History</h6>
                ${accordionHtml}
            </div>
            `;
        }
        
        container.innerHTML = html;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
