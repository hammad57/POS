<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no">
    <title>3D Money Vault Pro | Advanced Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root {
            --bg-body: #f0f4f8;
            --card-main: #ffffff;
            --text-color: #2d3436;
            --shadow-3d: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
            --accent-blue: #0984e3;
        }

        [data-theme="dark"] {
            --bg-body: #1e272e;
            --card-main: #2d3436;
            --text-color: #f5f6fa;
            --shadow-3d: 6px 6px 12px #151a1e, -4px -4px 10px #3c444b;
        }

        body { background-color: var(--bg-body); font-family: 'Poppins', sans-serif; color: var(--text-color); padding: 25px; transition: 0.3s; }
        .main-container { width: 1150px; margin: 0 auto; }

        .card-3d {
            background: var(--card-main);
            border-radius: 20px;
            box-shadow: var(--shadow-3d);
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px;
            cursor: pointer;
        }
        .card-3d:hover { transform: translateY(-5px); }

        .bank-card-mini { min-width: 190px; border-left: 5px solid var(--accent-blue); padding: 15px; }
        .bank-card-mini .bal-amt { font-size: 1.1rem; font-weight: 700; color: var(--accent-blue); }

        .grad-balance { background: linear-gradient(145deg, #0984e3, #0056b3); color: white; }
        .grad-income { background: linear-gradient(145deg, #00b894, #008967); color: white; }
        .grad-expense { background: linear-gradient(145deg, #d63031, #a91e1e); color: white; }

        .chart-wrapper { background: var(--card-main); border-radius: 25px; padding: 25px; box-shadow: var(--shadow-3d); }

        .fab-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--accent-blue); color: white; border: none;
            font-size: 35px; box-shadow: 0 10px 25px rgba(9, 132, 227, 0.4);
            z-index: 1000; transition: 0.3s;
        }
        .fab-btn:hover { transform: rotate(90deg) scale(1.1); }
    </style>
</head>
<body data-theme="light">

<div class="main-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <a href="https://hammad57.github.io/POS/index.html" class="card-3d p-2 rounded-circle" style="width:50px; height:50px; display:flex; align-items:center; justify-content:center; text-decoration:none;">
                <i class="bi bi-house-door-fill text-primary fs-4"></i>
            </a>
            <h2 class="fw-bold mb-0">Money Vault <span class="text-primary">3D Pro</span></h2>
        </div>
        <div class="d-flex gap-3">
            <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="openBankModal()">
                <i class="bi bi-plus-circle me-2"></i> Add Bank
            </button>
            <select class="form-select border-0 shadow-sm rounded-pill" style="width: 130px;" onchange="changeTheme(this.value)">
                <option value="light">☀️ Light</option>
                <option value="dark">🌙 Dark</option>
            </select>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4" onclick="updateView('All')"><div class="card-3d grad-balance"><h6>Current Balance</h6><h2 id="totalBalance">Rs. 0</h2></div></div>
        <div class="col-md-4" onclick="updateView('Income')"><div class="card-3d grad-income"><h6>Total Income</h6><h2 id="totalIncome">Rs. 0</h2></div></div>
        <div class="col-md-4" onclick="updateView('Expense')"><div class="card-3d grad-expense"><h6>Total Expense</h6><h2 id="totalExpense">Rs. 0</h2></div></div>
    </div>

    <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 me-2"></i>Bank Accounts</h5>
    <div id="bankCardsContainer" class="d-flex flex-wrap gap-3 mb-5"></div>

    <div class="chart-wrapper mb-5">
        <div style="height: 380px;"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="card-3d p-4" id="bankDetailSection" style="display:none;">
        <div class="d-flex justify-content-between mb-4">
            <h4 id="selectedBankTitle" class="fw-bold text-primary m-0">History</h4>
            <button class="btn btn-sm btn-light border rounded-pill" onclick="closeHistory()">Close</button>
        </div>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Remarks</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionBody"></tbody>
            </table>
        </div>
    </div>
</div>

<button class="fab-btn" onclick="openTransactionModal()"><i class="bi bi-plus-lg"></i></button>

<div class="modal fade" id="bankModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-3">
            <h5 class="fw-bold mb-3">Add New Bank</h5>
            <form id="bankForm">
                <input type="text" id="newBankName" class="form-control mb-3" placeholder="Bank Name" required>
                <button type="submit" class="btn btn-primary w-100">Save Bank</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4">
            <h5 class="fw-bold mb-4" id="modalTitle">New Transaction</h5>
            <form id="entryForm">
                <input type="hidden" id="editKey">
                <div class="mb-3"><label class="small fw-bold">Select Bank</label><select id="entryBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">Type</label><select id="entryType" class="form-select"><option value="Income">Income</option><option value="Expense">Expense</option></select></div>
                <div class="mb-3"><label class="small fw-bold">Amount</label><input type="number" id="entryAmt" class="form-control" required></div>
                <div class="mb-3"><label class="small fw-bold">Date</label><input type="date" id="entryDate" class="form-control" required></div>
                <div class="mb-4"><label class="small fw-bold">Remarks / Detail</label><textarea id="entryRemarks" class="form-control" rows="2" placeholder="Transaction details..."></textarea></div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save Record</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    Chart.register(ChartDataLabels);
    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allBanks = [];
    let allTransactions = [];
    let currentFilter = 'All';
    let myChart = null;
    let selectedBankId = null;

    const bModal = new bootstrap.Modal(document.getElementById('bankModal'));
    const eModal = new bootstrap.Modal(document.getElementById('entryModal'));

    onValue(ref(db, 'bank_accounts'), (snap) => {
        allBanks = [];
        snap.forEach(c => { allBanks.push({ id: c.key, ...c.val() }); });
        renderBanks();
    });

    onValue(ref(db, 'bank_transactions'), (snap) => {
        allTransactions = [];
        snap.forEach(bNode => {
            bNode.forEach(tNode => { allTransactions.push({ id: tNode.key, bankId: bNode.key, ...tNode.val() }); });
        });
        renderBanks();
        updateSummary();
        initChart();
        if(selectedBankId) window.selectBank(selectedBankId);
    });

    function renderBanks() {
        const container = document.getElementById('bankCardsContainer');
        container.innerHTML = '';
        allBanks.forEach(bank => {
            const balance = allTransactions.filter(t => t.bankId === bank.id).reduce((s, t) => s + (t.type === 'Income' ? parseFloat(t.amount) : -parseFloat(t.amount)), 0);
            container.innerHTML += `<div class="card-3d bank-card-mini" onclick="selectBank('${bank.id}')"><h6>${bank.name}</h6><div class="bal-amt">Rs. ${balance.toLocaleString()}</div></div>`;
        });
        document.getElementById('entryBank').innerHTML = allBanks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
    }

    function updateSummary() {
        let tI = allTransactions.filter(t => t.type === 'Income').reduce((s, t) => s + parseFloat(t.amount), 0);
        let tE = allTransactions.filter(t => t.type === 'Expense').reduce((s, t) => s + parseFloat(t.amount), 0);
        document.getElementById('totalIncome').innerText = `Rs. ${tI.toLocaleString()}`;
        document.getElementById('totalExpense').innerText = `Rs. ${tE.toLocaleString()}`;
        document.getElementById('totalBalance').innerText = `Rs. ${(tI - tE).toLocaleString()}`;
    }

    window.initChart = () => {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        const dates = [...new Set(allTransactions.map(t => t.date))].sort();
        const incData = dates.map(d => allTransactions.filter(t => t.date === d && t.type === 'Income').reduce((s, c) => s + parseFloat(c.amount), 0));
        const expData = dates.map(d => allTransactions.filter(t => t.date === d && t.type === 'Expense').reduce((s, c) => s + parseFloat(c.amount), 0));

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: dates,
                datasets: [
                    { label: 'Income', data: incData, backgroundColor: '#00b894', borderRadius: 8, hidden: currentFilter === 'Expense', barThickness: 20 },
                    { label: 'Expense', data: expData, backgroundColor: '#d63031', borderRadius: 8, hidden: currentFilter === 'Income', barThickness: 20 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' }, formatter: (v) => v > 0 ? 'Rs.' + v : '' }
                }
            }
        });
    };

    window.selectBank = (id) => {
        selectedBankId = id;
        const bank = allBanks.find(b => b.id === id);
        document.getElementById('bankDetailSection').style.display = 'block';
        document.getElementById('selectedBankTitle').innerText = bank.name + " History";
        document.getElementById('transactionBody').innerHTML = allTransactions.filter(t => t.bankId === id).map(t => `
            <tr>
                <td>${t.date}</td>
                <td class="${t.type==='Income'?'text-success':'text-danger'} fw-bold">${t.type}</td>
                <td>Rs. ${t.amount}</td>
                <td>${t.remarks || '---'}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editEntry('${t.id}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteEntry('${t.bankId}','${t.id}')"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`).join('');
    };

    window.deleteEntry = (bId, tId) => { if(confirm("Delete this record?")) remove(ref(db, `bank_transactions/${bId}/${tId}`)); };

    window.editEntry = (tId) => {
        const t = allTransactions.find(x => x.id === tId);
        document.getElementById('editKey').value = t.id;
        document.getElementById('entryBank').value = t.bankId;
        document.getElementById('entryType').value = t.type;
        document.getElementById('entryAmt').value = t.amount;
        document.getElementById('entryDate').value = t.date;
        document.getElementById('entryRemarks').value = t.remarks || "";
        document.getElementById('modalTitle').innerText = "Edit Transaction";
        eModal.show();
    };

    window.openTransactionModal = () => {
        document.getElementById('editKey').value = "";
        document.getElementById('entryForm').reset();
        document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('modalTitle').innerText = "New Transaction";
        eModal.show();
    };

    document.getElementById('entryForm').onsubmit = (e) => {
        e.preventDefault();
        const bId = document.getElementById('entryBank').value;
        const tId = document.getElementById('editKey').value;
        const data = {
            type: document.getElementById('entryType').value,
            amount: document.getElementById('entryAmt').value,
            date: document.getElementById('entryDate').value,
            remarks: document.getElementById('entryRemarks').value
        };
        tId ? set(ref(db, `bank_transactions/${bId}/${tId}`), data) : push(ref(db, `bank_transactions/${bId}`), data);
        eModal.hide();
    };

    window.openBankModal = () => bModal.show();
    document.getElementById('bankForm').onsubmit = (e) => {
        e.preventDefault();
        push(ref(db, 'bank_accounts'), { name: document.getElementById('newBankName').value });
        bModal.hide();
    };

    window.updateView = (v) => { currentFilter = v; initChart(); };
    window.changeTheme = (v) => { document.body.setAttribute('data-theme', v); initChart(); };
    window.closeHistory = () => { document.getElementById('bankDetailSection').style.display = 'none'; selectedBankId = null; };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
