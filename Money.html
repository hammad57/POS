<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no">
    <title>3D Money Vault Pro | Advanced Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root {
            --bg-body: #f0f4f8;
            --card-main: #ffffff;
            --text-color: #2d3436;
            --shadow-3d: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
            --accent-blue: #0984e3;
        }

        [data-theme="dark"] {
            --bg-body: #1e272e;
            --card-main: #2d3436;
            --text-color: #f5f6fa;
            --shadow-3d: 6px 6px 12px #151a1e, -4px -4px 10px #3c444b;
        }

        body { background-color: var(--bg-body); font-family: 'Poppins', sans-serif; color: var(--text-color); padding: 25px; transition: 0.3s; }
        
        /* NEW: Login Screen specific styles */
        #loginScreen { min-height: 90vh; display: flex; align-items: center; justify-content: center; }
        .google-btn-custom { background: var(--card-main); color: var(--text-color); border: 2px solid #ea4335; transition: 0.3s; }
        .google-btn-custom:hover { background: #ea4335; color: white; transform: translateY(-3px); }

        .main-container { width: 1150px; margin: 0 auto; }

        .card-3d {
            background: var(--card-main);
            border-radius: 20px;
            box-shadow: var(--shadow-3d);
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px;
            cursor: pointer;
        }
        .card-3d:hover { transform: translateY(-5px); }

        .bank-card-mini { min-width: 190px; border-left: 5px solid var(--accent-blue); padding: 15px; }
        .bank-card-mini .bal-amt { font-size: 1.1rem; font-weight: 700; color: var(--accent-blue); }
        .bank-card-mini .acc-num { font-size: 0.75rem; color: #636e72; display: block; }

        .grad-balance { background: linear-gradient(145deg, #0984e3, #0056b3); color: white; }
        .grad-income { background: linear-gradient(145deg, #00b894, #008967); color: white; }
        .grad-expense { background: linear-gradient(145deg, #d63031, #a91e1e); color: white; }

        .chart-wrapper { background: var(--card-main); border-radius: 25px; padding: 25px; box-shadow: var(--shadow-3d); }

        .fab-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--accent-blue); color: white; border: none;
            font-size: 35px; box-shadow: 0 10px 25px rgba(9, 132, 227, 0.4);
            z-index: 1000; transition: 0.3s;
        }
    </style>
</head>
<body data-theme="light">

<div id="loginScreen">
    <div class="card-3d text-center p-5" style="max-width: 450px; width: 100%;">
        <div class="mb-4">
            <i class="bi bi-safe2-fill text-primary" style="font-size: 3rem;"></i>
        </div>
        <h2 class="fw-bold mb-2">Money Vault <span class="text-primary">3D Pro</span></h2>
        <p class="text-muted mb-5 small">Secure your financial data. Session expires automatically after 30 minutes of inactivity.</p>
        
        <button id="googleLoginBtn" class="btn google-btn-custom rounded-pill py-3 px-4 fw-bold w-100 d-flex align-items-center justify-content-center gap-3 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
                <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z"/>
            </svg>
            Sign in with Google
        </button>
    </div>
</div>

<div id="appContent" style="display: none;">
    <div class="main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <a href="https://hammad57.github.io/POS/index.html" class="card-3d p-2 rounded-circle" style="width:50px; height:50px; display:flex; align-items:center; justify-content:center; text-decoration:none;">
                    <i class="bi bi-house-door-fill text-primary fs-4"></i>
                </a>
                <h2 class="fw-bold mb-0">Money Vault <span class="text-primary">3D Pro</span></h2>
            </div>
            <div class="d-flex gap-3">
                <button class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm" onclick="openTransferModal()">
                    <i class="bi bi-arrow-left-right me-2"></i> Transfer
                </button>
                <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="openBankModal()">
                    <i class="bi bi-plus-circle me-2"></i> Add Bank
                </button>
                <select class="form-select border-0 shadow-sm rounded-pill" style="width: 130px;" onchange="changeTheme(this.value)">
                    <option value="light">☀️ Light</option>
                    <option value="dark">🌙 Dark</option>
                </select>
                <button id="logoutBtn" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4" onclick="updateView('All')"><div class="card-3d grad-balance"><h6>Total Balance</h6><h2 id="totalBalance">Rs. 0</h2></div></div>
            <div class="col-md-4" onclick="updateView('Income')"><div class="card-3d grad-income"><h6>Total Income</h6><h2 id="totalIncome">Rs. 0</h2></div></div>
            <div class="col-md-4" onclick="updateView('Expense')"><div class="card-3d grad-expense"><h6>Total Expense</h6><h2 id="totalExpense">Rs. 0</h2></div></div>
        </div>

        <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 me-2"></i>Bank Accounts</h5>
        <div id="bankCardsContainer" class="d-flex flex-wrap gap-3 mb-5"></div>

        <div class="chart-wrapper mb-5">
            <div style="height: 380px;"><canvas id="mainChart"></canvas></div>
        </div>

        <div class="card-3d p-4" id="bankDetailSection" style="display:none;">
            <div class="d-flex justify-content-between mb-4">
                <h4 id="selectedBankTitle" class="fw-bold text-primary m-0">History</h4>
                <button class="btn btn-sm btn-light border rounded-pill" onclick="closeHistory()">Close</button>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr><th>Date</th><th>Type</th><th>Amount</th><th>Remarks</th><th class="text-center">Actions</th></tr>
                    </thead>
                    <tbody id="transactionBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <button class="fab-btn" onclick="openTransactionModal()"><i class="bi bi-plus-lg"></i></button>
</div> <div class="modal fade" id="bankModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4 border-0">
            <h5 class="fw-bold mb-3">Add New Bank</h5>
            <form id="bankForm">
                <input type="text" id="newBankName" class="form-control mb-3" placeholder="Bank Name" required>
                <input type="text" id="newBankNumber" class="form-control mb-3" placeholder="Account Number">
                <button type="submit" class="btn btn-primary w-100">Save Bank</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4 border-0">
            <h5 class="fw-bold mb-4 text-warning"><i class="bi bi-arrow-left-right me-2"></i>Inter-Bank Transfer</h5>
            <form id="transferForm">
                <div class="mb-3"><label class="small fw-bold">From Bank (Paisa Nikalega)</label><select id="fromBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">To Bank (Paisa Jayega)</label><select id="toBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">Amount</label><input type="number" id="transferAmt" class="form-control" required></div>
                <div class="mb-3"><label class="small fw-bold">Date</label><input type="date" id="transferDate" class="form-control" required></div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">Transfer Now</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-4 border-0">
            <h5 class="fw-bold mb-4 text-primary" id="modalTitle">New Transaction</h5>
            <form id="entryForm">
                <input type="hidden" id="editKey">
                <div class="mb-3"><label class="small fw-bold">Select Bank</label><select id="entryBank" class="form-select" required></select></div>
                <div class="mb-3"><label class="small fw-bold">Type</label><select id="entryType" class="form-select"><option value="Income">Income</option><option value="Expense">Expense</option></select></div>
                <div class="mb-3"><label class="small fw-bold">Amount</label><input type="number" id="entryAmt" class="form-control" required></div>
                <div class="mb-3"><label class="small fw-bold">Date</label><input type="date" id="entryDate" class="form-control" required></div>
                <div class="mb-4"><label class="small fw-bold">Remarks</label><textarea id="entryRemarks" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save Record</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    
    // NEW: Import Authentication modules
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    Chart.register(ChartDataLabels);
    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // NEW: Initialize Auth
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const SESSION_DURATION = 30 * 60 * 1000; // 30 minutes in milliseconds

    let allBanks = [];
    let allTransactions = [];
    let currentFilter = 'All';
    let myChart = null;
    let selectedBankId = null;

    const bModal = new bootstrap.Modal(document.getElementById('bankModal'));
    const eModal = new bootstrap.Modal(document.getElementById('entryModal'));
    const tModal = new bootstrap.Modal(document.getElementById('transferModal'));

    // NEW: Session & Auth Logic
    function handleLogout(showMsg = false) {
        signOut(auth).then(() => {
            localStorage.removeItem('money_vault_login_time');
            if(showMsg) alert("Session Expired! Please login again.");
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').style.display = 'none';
        });
    }

    function checkSessionTime() {
        const lastTime = localStorage.getItem('money_vault_login_time');
        if (lastTime && (Date.now() - parseInt(lastTime) > SESSION_DURATION)) {
            handleLogout(true);
        }
    }

    // Check session every 1 minute in the background
    setInterval(checkSessionTime, 60000);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            const lastTime = localStorage.getItem('money_vault_login_time');
            if (!lastTime || (Date.now() - parseInt(lastTime) > SESSION_DURATION)) {
                // User opened file after 30 mins
                handleLogout(true);
            } else {
                // Valid Session - Show App
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
            }
        } else {
            // Not logged in
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').style.display = 'none';
        }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        signInWithPopup(auth, provider).then((result) => {
            localStorage.setItem('money_vault_login_time', Date.now()); // Save time
            console.log("Welcome,", result.user.displayName);
        }).catch((error) => {
            console.error("Login Error: ", error);
        });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        if(confirm("Are you sure you want to logout?")) {
            handleLogout(false);
        }
    });

    // EXISTING LOGIC STARTS HERE
    onValue(ref(db, 'bank_accounts'), (snap) => {
        allBanks = [];
        snap.forEach(c => { allBanks.push({ id: c.key, ...c.val() }); });
        renderBanks();
    });

    onValue(ref(db, 'bank_transactions'), (snap) => {
        allTransactions = [];
        snap.forEach(bNode => {
            bNode.forEach(tNode => { allTransactions.push({ id: tNode.key, bankId: bNode.key, ...tNode.val() }); });
        });
        renderBanks();
        updateSummary();
        initChart();
        if(selectedBankId) window.selectBank(selectedBankId);
    });

    function renderBanks() {
        const container = document.getElementById('bankCardsContainer');
        container.innerHTML = '';
        allBanks.forEach(bank => {
            const balance = allTransactions.filter(t => t.bankId === bank.id).reduce((s, t) => s + (t.type === 'Income' ? parseFloat(t.amount) : -parseFloat(t.amount)), 0);
            container.innerHTML += `
                <div class="card-3d bank-card-mini" onclick="selectBank('${bank.id}')">
                    <h6>${bank.name}</h6>
                    <span class="acc-num">${bank.number || '---'}</span>
                    <div class="bal-amt">Rs. ${balance.toLocaleString()}</div>
                </div>`;
        });
        const options = allBanks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        document.getElementById('entryBank').innerHTML = options;
        document.getElementById('fromBank').innerHTML = options;
        document.getElementById('toBank').innerHTML = options;
    }

    function updateSummary() {
        let tI = allTransactions.filter(t => t.type === 'Income').reduce((s, t) => s + parseFloat(t.amount), 0);
        let tE = allTransactions.filter(t => t.type === 'Expense').reduce((s, t) => s + parseFloat(t.amount), 0);
        document.getElementById('totalIncome').innerText = `Rs. ${tI.toLocaleString()}`;
        document.getElementById('totalExpense').innerText = `Rs. ${tE.toLocaleString()}`;
        document.getElementById('totalBalance').innerText = `Rs. ${(tI - tE).toLocaleString()}`;
    }

    window.initChart = () => {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        const dates = [...new Set(allTransactions.map(t => t.date))].sort();
        const incData = dates.map(d => allTransactions.filter(t => t.date === d && t.type === 'Income').reduce((s, c) => s + parseFloat(c.amount), 0));
        const expData = dates.map(d => allTransactions.filter(t => t.date === d && t.type === 'Expense').reduce((s, c) => s + parseFloat(c.amount), 0));

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: dates,
                datasets: [
                    { label: 'Income', data: incData, backgroundColor: '#00b894', borderRadius: 8, hidden: currentFilter === 'Expense', barThickness: 20 },
                    { label: 'Expense', data: expData, backgroundColor: '#d63031', borderRadius: 8, hidden: currentFilter === 'Income', barThickness: 20 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' }, formatter: (v) => v > 0 ? 'Rs.' + v : '' }
                }
            }
        });
    };

    window.selectBank = (id) => {
        selectedBankId = id;
        const bank = allBanks.find(b => b.id === id);
        document.getElementById('bankDetailSection').style.display = 'block';
        document.getElementById('selectedBankTitle').innerText = bank.name + " History";
        document.getElementById('transactionBody').innerHTML = allTransactions.filter(t => t.bankId === id).map(t => `
            <tr>
                <td>${t.date}</td>
                <td class="${t.type==='Income'?'text-success':'text-danger'} fw-bold">${t.type}</td>
                <td>Rs. ${t.amount}</td>
                <td>${t.remarks || '---'}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editEntry('${t.id}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteEntry('${t.bankId}','${t.id}')"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`).join('');
    };

    document.getElementById('transferForm').onsubmit = (e) => {
        e.preventDefault();
        const from = document.getElementById('fromBank').value;
        const to = document.getElementById('toBank').value;
        const amt = document.getElementById('transferAmt').value;
        const dt = document.getElementById('transferDate').value;
        const fromName = allBanks.find(b => b.id === from).name;
        const toName = allBanks.find(b => b.id === to).name;

        if(from === to) return alert("Select different banks!");

        push(ref(db, `bank_transactions/${from}`), { type: 'Expense', amount: amt, date: dt, remarks: `Transfer To ${toName}` });
        push(ref(db, `bank_transactions/${to}`), { type: 'Income', amount: amt, date: dt, remarks: `Transfer From ${fromName}` });
        
        tModal.hide();
        document.getElementById('transferForm').reset();
    };

    window.openTransferModal = () => {
        document.getElementById('transferDate').value = new Date().toISOString().split('T')[0];
        tModal.show();
    };

    window.deleteEntry = (bId, tId) => { if(confirm("Delete record?")) remove(ref(db, `bank_transactions/${bId}/${tId}`)); };
    window.openBankModal = () => bModal.show();
    window.openTransactionModal = () => { document.getElementById('entryForm').reset(); document.getElementById('entryDate').value = new Date().toISOString().split('T')[0]; eModal.show(); };
    
    document.getElementById('bankForm').onsubmit = (e) => {
        e.preventDefault();
        push(ref(db, 'bank_accounts'), { name: document.getElementById('newBankName').value, number: document.getElementById('newBankNumber').value });
        bModal.hide();
    };

    document.getElementById('entryForm').onsubmit = (e) => {
        e.preventDefault();
        const bId = document.getElementById('entryBank').value;
        const data = { type: document.getElementById('entryType').value, amount: document.getElementById('entryAmt').value, date: document.getElementById('entryDate').value, remarks: document.getElementById('entryRemarks').value };
        push(ref(db, `bank_transactions/${bId}`), data);
        eModal.hide();
    };

    window.updateView = (v) => { currentFilter = v; initChart(); };
    window.changeTheme = (v) => { document.body.setAttribute('data-theme', v); initChart(); };
    window.closeHistory = () => { document.getElementById('bankDetailSection').style.display = 'none'; selectedBankId = null; };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
