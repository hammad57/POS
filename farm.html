@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background-color: #0f172a; 
    color: #f8fafc; 
    overflow: hidden; 
}

/* Premium Glassmorphism Card */
.glass-card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
}

/* Vibrant Text Gradient */
.gradient-text {
    background: linear-gradient(135deg, #f97316 0%, #fcd34d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Glowing Background Orbs */
.blob {
    position: absolute; 
    filter: blur(90px); 
    z-index: -1; 
    opacity: 0.3; 
    animation: float 8s ease-in-out infinite;
    border-radius: 50%;
}

@keyframes float { 
    0%, 100% { transform: translate(0, 0) scale(1); } 
    50% { transform: translate(20px, -20px) scale(1.1); } 
}

@keyframes pulse-dot { 
    0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); } 
    50% { transform: scale(1.2); opacity: 0.8; box-shadow: 0 0 10px 4px rgba(249, 115, 22, 0); } 
}
.dot { animation: pulse-dot 2s infinite; }

/* Interactive Button */
.btn-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.btn-hover:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 15px 30px -5px rgba(249, 115, 22, 0.4); 
}
.btn-hover:active { transform: scale(0.97); }
</style>
</head>
