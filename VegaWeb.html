<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vega Web — Live TV | Nadan-Prinda</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0f14; color: #e8edf2; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; }
  header { padding: 18px 20px 8px; text-align: center; }
  header h1 { font-size: 26px; letter-spacing: .5px; }
  header h1 span { color: #e11d48; }
  header p { color: #8b98a5; font-size: 13px; margin-top: 4px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 10px 14px 30px; }
  .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; }
  .player-box video { width: 100%; height: 100%; display: block; background: #000; }
  .now { display: flex; align-items: center; gap: 8px; margin: 12px 2px 4px; font-size: 15px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; display: inline-block; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .35; } 100% { opacity: 1; } }
  .now b { font-size: 16px; }
  .now span.cat { color: #8b98a5; font-size: 13px; }
  #status { color: #f59e0b; font-size: 13px; margin: 2px 2px 12px; min-height: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: #e11d48; transform: translateY(-2px); }
  .card.active { border-color: #e11d48; background: #1a1216; }
  .card.disabled { opacity: .55; cursor: default; }
  .card.disabled:hover { border-color: #1f2937; transform: none; }
  .card h3 { font-size: 17px; margin-bottom: 4px; }
  .card p { color: #8b98a5; font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 10px; }
  .badge.live { background: #dc2626; color: #fff; }
  .badge.mob { background: #374151; color: #d1d5db; }
  footer { text-align: center; color: #6b7280; font-size: 12px; padding: 18px 10px 26px; }
  footer a { color: #9ca3af; }
</style>
</head>
<body>
<header>
  <h1><span>▶</span> Vega Web — Live TV</h1>
  <p>Source: Nadan-Prinda &nbsp;•&nbsp; Live channels, no app needed</p>
</header>

<div class="wrap">
  <div class="player-box">
    <video id="player" controls playsinline muted></video>
  </div>
  <div class="now"><span class="live-dot"></span><b id="nowName">DW English</b><span class="cat" id="nowCat">News &bull; English</span></div>
  <div id="status"></div>

  <div class="grid" id="channels"></div>
</div>

<footer>
  Streams from <a href="https://github.com/Nadan-Prinda/vega-providers" target="_blank" rel="noopener">Nadan-Prinda/vega-providers</a> &nbsp;•&nbsp; Powered by HLS
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
var CHANNELS = [
  { name: "DW English", cat: "News \u2022 English",
    url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
  { name: "NASA TV", cat: "Science \u2022 English",
    url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8" },
  { name: "8XM", cat: "Music \u2022 Pakistani", mobileOnly: true,
    url: "http://116.90.120.149:8000/play/a0tw/index.m3u8" }
];

var video = document.getElementById("player");
var statusEl = document.getElementById("status");
var hls = null;

function setStatus(msg) { statusEl.textContent = msg || ""; }

function playChannel(ch) {
  document.getElementById("nowName").textContent = ch.name;
  document.getElementById("nowCat").textContent = ch.cat;
  document.querySelectorAll(".card").forEach(function (el) {
    el.classList.toggle("active", el.dataset.name === ch.name);
  });
  if (ch.mobileOnly) {
    setStatus("8XM ka stream http hai, is liye web page (https) par nahi chalega — ye sirf mobile app mein chalega.");
    return;
  }
  setStatus("Loading " + ch.name + "...");
  if (hls) { hls.destroy(); hls = null; }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      setStatus("");
      video.play().catch(function () { setStatus("Play dabayein — browser ne auto-play roka hai."); });
    });
    hls.on(Hls.Events.ERROR, function (e, data) {
      if (data.fatal) setStatus("Stream nahi chal raha — thodi der baad dobara try karein.");
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = ch.url;
    video.play().catch(function () { setStatus("Play dabayein — browser ne auto-play roka hai."); });
    setStatus("");
  } else {
    setStatus("Aapka browser live stream (HLS) support nahi karta — Chrome ya Safari use karein.");
  }
}

var grid = document.getElementById("channels");
CHANNELS.forEach(function (ch) {
  var card = document.createElement("div");
  card.className = "card" + (ch.mobileOnly ? " disabled" : "");
  card.dataset.name = ch.name;
  card.innerHTML = "<h3>" + ch.name + "</h3><p>" + ch.cat + "</p>" +
    (ch.mobileOnly
      ? '<span class="badge mob">Mobile app only</span>'
      : '<span class="badge live">\u25CF LIVE</span>');
  card.addEventListener("click", function () { playChannel(ch); });
  grid.appendChild(card);
});

// Start with the first channel (muted autoplay, unmute from the player controls)
playChannel(CHANNELS[0]);
video.addEventListener("click", function () { video.muted = false; });
</script>
</body>
</html>
