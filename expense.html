<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Income Tracker Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body { background-color: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .summary-card { border-radius: 12px; color: white; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 100px; }
        .bg-income { background: linear-gradient(45deg, #28a745, #85d36e); }
        .bg-expense { background: linear-gradient(45deg, #dc3545, #ff6b6b); }
        .bg-profit { background: linear-gradient(45deg, #007bff, #66b2ff); }
        .bg-balance { background: linear-gradient(45deg, #17a2b8, #71cedd); }
        .bg-total-inc { background: linear-gradient(45deg, #20c997, #26af94); }
        .bg-total-exp { background: linear-gradient(45deg, #fd7e14, #f8a059); }
        
        /* Floating Add Button - Moved to Right */
        .fab-add {
            position: fixed; right: 30px; bottom: 30px; width: 60px; height: 60px;
            border-radius: 50%; background: #0d6efd; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer; z-index: 1000; transition: 0.3s;
        }
        .fab-add:hover { transform: scale(1.1); background: #0b5ed7; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

        .chart-container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .chart-wrapper { position: relative; height: 350px; width: 100%; margin-bottom: 20px; }
        .detail-box { background: #fff3cd; border-left: 5px solid #ffca2c; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 0.95rem; max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="fab-add" data-bs-toggle="modal" data-bs-target="#entryModal" title="Add New Entry">
    <i class="bi bi-plus-lg"></i>
</div>

<div class="container-fluid">
    <h2 class="text-center mb-4 fw-bold text-dark"><i class="bi bi-wallet2"></i> Smart Financial Tracker</h2>

    <div class="row text-center mb-4">
        <div class="col-md-2 col-sm-4"><div class="summary-card bg-total-inc"><h6>Total Income</h6><h3 id="totalIncVal">0</h3></div></div>
        <div class="col-md-2 col-sm-4"><div class="summary-card bg-total-exp"><h6>Total Expense</h6><h3 id="totalExpVal">0</h3></div></div>
        <div class="col-md-2 col-sm-4"><div class="summary-card bg-income"><h6>Daily Profit</h6><h3 id="dailyVal">0</h3></div></div>
        <div class="col-md-2 col-sm-4"><div class="summary-card bg-expense"><h6>Weekly Profit</h6><h3 id="weeklyVal">0</h3></div></div>
        <div class="col-md-2 col-sm-4"><div class="summary-card bg-profit"><h6>Monthly Profit</h6><h3 id="monthlyVal">0</h3></div></div>
        <div class="col-md-2 col-sm-4"><div class="summary-card bg-balance"><h6>Yearly Profit</h6><h3 id="yearlyVal">0</h3></div></div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-11">
            <ul class="nav nav-pills mb-3 shadow-sm bg-white p-2 rounded">
                <li class="nav-item"><button class="nav-link active" onclick="setMode('All')">All Tracking</button></li>
                <li class="nav-item"><button class="nav-link" onclick="setMode('Income')">Income</button></li>
                <li class="nav-item"><button class="nav-link" onclick="setMode('Expense')">Expense</button></li>
            </ul>

            <div class="chart-container" id="pdfArea">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 id="chartTitle" class="fw-bold">Financial Analytics</h5>
                    <div class="d-flex gap-2">
                        <input type="date" id="filterDate" class="form-control form-control-sm" style="width:160px;">
                        <button class="btn btn-sm btn-primary" onclick="updateUI()"><i class="bi bi-search"></i> Load Data</button>
                        <button class="btn btn-sm btn-light border" onclick="clearFilter()">Reset</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="downloadPDF()"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
                    </div>
                </div>

                <div class="chart-wrapper">
                    <canvas id="myChart"></canvas>
                </div>

                <div id="summaryDetail" class="detail-box">
                    <div id="summaryTotalHeader" class="mb-2 fw-bold border-bottom pb-1 text-primary"></div>
                    <strong>Transaction Detail:</strong><br>
                    <span id="detailText">Loading data...</span>
                </div>

                <div class="table-responsive mt-4">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark"><tr><th>Date</th><th>Type</th><th>Amount</th><th>Remarks</th><th>Action</th></tr></thead>
                        <tbody id="dataTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="modalTitle">Add New Entry</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="trackerForm">
                    <input type="hidden" id="editId">
                    <div class="mb-3"><label class="form-label fw-bold">Date</label><input type="date" id="date" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label fw-bold">Amount</label><input type="number" id="amount" class="form-control" required></div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Type</label>
                        <select id="type" class="form-control" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label fw-bold">Remarks</label><textarea id="remarks" class="form-control" rows="3"></textarea></div>
                    <div class="modal-footer px-0 pb-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4" id="saveBtn">Save Entry</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/",
      projectId: "own-live-steam-web"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'transactions');

    let transactions = [];
    let myChart;
    let currentMode = 'All';
    const bModal = new bootstrap.Modal(document.getElementById('entryModal'));

    // Helper: Format Date to "01 Mar 2026"
    function formatFriendlyDate(dateStr) {
        if(!dateStr) return "";
        const dateObj = new Date(dateStr);
        return dateObj.toLocaleDateString('en-GB', {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        });
    }

    window.setMode = (mode) => {
        currentMode = mode;
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('chartTitle').innerText = mode + ' Analytics';
        updateUI();
    };

    window.clearFilter = () => {
        document.getElementById('filterDate').value = '';
        updateUI();
    };

    document.getElementById('trackerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const data = {
            date: document.getElementById('date').value,
            amount: parseFloat(document.getElementById('amount').value),
            type: document.getElementById('type').value,
            remarks: document.getElementById('remarks').value
        };
        id ? update(ref(db, 'transactions/'+id), data) : push(dbRef, data);
        e.target.reset();
        document.getElementById('editId').value = '';
        bModal.hide();
    });

    onValue(dbRef, (snap) => {
        transactions = [];
        snap.forEach(c => { transactions.push({ id: c.key, ...c.val() }); });
        updateUI();
    });

    window.updateUI = function() {
        const filterD = document.getElementById('filterDate').value;
        const tbody = document.getElementById('dataTable');
        const detailTxt = document.getElementById('detailText');
        const summaryHeader = document.getElementById('summaryTotalHeader');
        tbody.innerHTML = '';
        
        let filtered = transactions.filter(t => {
            let matchesType = (currentMode === 'All' || t.type === currentMode);
            let matchesDate = (!filterD || t.date === filterD);
            return matchesType && matchesDate;
        });

        let summaryStr = "";
        let labels = [], incData = [], expData = [];
        let viewInc = 0, viewExp = 0;
        
        filtered.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(t => {
            let rowColor = t.type === 'Income' ? 'text-success' : 'text-danger';
            if(t.type === 'Income') viewInc += t.amount; else viewExp += t.amount;

            // Using Friendly Date here
            const displayDate = formatFriendlyDate(t.date);

            tbody.innerHTML += `<tr>
                <td>${displayDate}</td>
                <td class="${rowColor}"><strong>${t.type}</strong></td>
                <td>$${t.amount.toFixed(2)}</td>
                <td>${t.remarks}</td>
                <td>
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editEntry('${t.id}','${t.date}',${t.amount},'${t.type}','${t.remarks}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteEntry('${t.id}')"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`;

            if(!labels.includes(displayDate)) labels.push(displayDate);
            let idx = labels.indexOf(displayDate);
            if(!incData[idx]) incData[idx] = 0; if(!expData[idx]) expData[idx] = 0;
            t.type === 'Income' ? incData[idx] += t.amount : expData[idx] += t.amount;
            summaryStr += `• <b>${displayDate}</b>: ${t.type} of $${t.amount.toFixed(2)} (${t.remarks})<br>`;
        });

        summaryHeader.innerHTML = `Summary -> Total Income: $${viewInc.toFixed(2)} | Total Expense: $${viewExp.toFixed(2)}`;
        detailTxt.innerHTML = summaryStr || "Koi records nahi milay.";
        calculateProfits(filterD);
        renderChart(labels, incData, expData);
    }

    function calculateProfits(selectedDate) {
        const todayStr = new Date().toISOString().split('T')[0];
        let dTotal = 0, wTotal = 0, mTotal = 0, yTotal = 0;
        let cardInc = 0, cardExp = 0;

        transactions.forEach(t => {
            const tDate = new Date(t.date);
            const val = t.type === 'Income' ? t.amount : -t.amount;
            
            if (!selectedDate) {
                if(t.type === 'Income') cardInc += t.amount; else cardExp += t.amount;
            } else if (t.date === selectedDate) {
                if(t.type === 'Income') cardInc += t.amount; else cardExp += t.amount;
            }

            const diff = Math.floor((new Date() - tDate) / (86400000));
            if (t.date === (selectedDate || todayStr)) dTotal += val;
            if (diff >= 0 && diff < 7) wTotal += val;
            if (tDate.getMonth() === new Date().getMonth()) mTotal += val;
            if (tDate.getFullYear() === new Date().getFullYear()) yTotal += val;
        });

        document.getElementById('totalIncVal').innerText = cardInc.toFixed(2);
        document.getElementById('totalExpVal').innerText = cardExp.toFixed(2);
        document.getElementById('dailyVal').innerText = dTotal.toFixed(2);
        document.getElementById('weeklyVal').innerText = wTotal.toFixed(2);
        document.getElementById('monthlyVal').innerText = mTotal.toFixed(2);
        document.getElementById('yearlyVal').innerText = yTotal.toFixed(2);
    }

    function renderChart(labels, inc, exp) {
        const ctx = document.getElementById('myChart');
        if(myChart) myChart.destroy();
        
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels, 
                datasets: [
                    { label: 'Income', data: inc, backgroundColor: '#28a745', borderRadius: 5 },
                    { label: 'Expense', data: exp, backgroundColor: '#dc3545', borderRadius: 5 }
                ] 
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'top' } }
            }
        });
    }

    window.editEntry = (id, date, amt, type, rem) => {
        document.getElementById('editId').value = id;
        document.getElementById('date').value = date;
        document.getElementById('amount').value = amt;
        document.getElementById('type').value = type;
        document.getElementById('remarks').value = rem;
        document.getElementById('modalTitle').innerText = "Edit Entry";
        bModal.show();
    };

    window.deleteEntry = (id) => { if(confirm("Kya aap delete karna chahte hain?")) remove(ref(db, 'transactions/'+id)); };
    window.downloadPDF = () => { html2pdf().from(document.getElementById('pdfArea')).save(); };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
