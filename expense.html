<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no"> 
    <title>Smart Financial Tracker 3D Pro - Fixed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root {
            --bg-body: #e0e5ec;
            --container-bg: #f2f5f9;
            --text-color: #2c3e50;
            --shadow-3d: 9px 9px 16px rgba(163,177,198,0.5), -9px -9px 16px rgba(255,255,255, 0.8);
            --border-color: rgba(255, 255, 255, 0.5);
        }

        html[data-theme="dark"] {
            --bg-body: #121212;
            --container-bg: #1e1e24;
            --text-color: #f5f6fa;
            --shadow-3d: 8px 8px 15px #0a0a0c, -8px -8px 15px #2a2a32;
            --border-color: #2b2b36;
        }

        body { background: var(--bg-body); color: var(--text-color); padding: 20px; font-family: 'Poppins', sans-serif; min-width: 1200px; transition: 0.5s; }
        .main-wrapper { width: 1150px; margin: 0 auto; }
        
        .summary-card { 
            border-radius: 20px; color: white; padding: 20px 10px; margin-bottom: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: 0.3s; cursor: pointer;
        }
        .summary-card:hover { transform: translateY(-5px); }
        .bg-income { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-expense { background: linear-gradient(135deg, #cb2d3e, #ef473a); }
        .bg-profit { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .bg-today { background: linear-gradient(135deg, #4b6cb7, #182848); }

        .chart-container { background: var(--container-bg); padding: 30px; border-radius: 25px; box-shadow: var(--shadow-3d); border: 1px solid var(--border-color); }
        
        .table-custom { border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-3d); background: var(--container-bg); }
        .table-custom thead th { background: #2c3e50; color: white; padding: 12px; font-size: 0.85rem; }
        .table-custom tbody td { padding: 10px; border-bottom: 1px solid var(--border-color); vertical-align: middle; font-size: 0.85rem; }
        
        .remarks-cell { font-size: 0.75rem; color: #666; max-width: 250px; word-break: break-word; line-height: 1.2; }
        html[data-theme="dark"] .remarks-cell { color: #bbb; }

        .fab-add {
            position: fixed; right: 40px; bottom: 40px; width: 70px; height: 70px;
            border-radius: 50%; background: #0d6efd; color: white; font-size: 30px;
            border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000;
        }
        
        .form-locked { background: #eee !important; cursor: not-allowed; }
        html[data-theme="dark"] .form-locked { background: #2b2b36 !important; }
    </style>
</head>
<body>

<button class="fab-add" onclick="openModal()"><i class="bi bi-plus-lg"></i></button>

<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0"><i class="bi bi-wallet2 me-2"></i>Accounts Summary</h3>
        <select id="appTheme" class="form-select w-auto shadow-sm" onchange="saveTheme()">
            <option value="light">☀️ Light</option>
            <option value="dark">🌙 Dark</option>
        </select>
    </div>

    <div class="row text-center mb-4">
        <div class="col"><div class="summary-card bg-income"><h6>Total Income</h6><h3 id="totalIncVal">0</h3></div></div>
        <div class="col"><div class="summary-card bg-expense"><h6>Total Expense</h6><h3 id="totalExpVal">0</h3></div></div>
        <div class="col"><div class="summary-card bg-profit"><h6>Total Balance</h6><h3 id="dailyVal">0</h3></div></div>
        <div class="col"><div class="summary-card bg-today"><h6>Today (Net)</h6><h3 id="todayNetVal">0</h3></div></div>
    </div>

    <div class="chart-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0 text-primary">Transaction History</h5>
            <div class="d-flex gap-2">
                <input type="date" id="fromDate" class="form-control form-control-sm">
                <input type="date" id="toDate" class="form-control form-control-sm">
                <button class="btn btn-dark btn-sm" onclick="applyFilter()">Filter</button>
                <button class="btn btn-secondary btn-sm" onclick="resetFilter()">Reset</button>
            </div>
        </div>

        <div style="height: 300px;"><canvas id="mainChart"></canvas></div>

        <div class="table-responsive mt-4">
            <table class="table table-custom w-100" id="summaryTable">
                <thead>
                    <tr>
                        <th class="text-center" style="width: 100px;">Date</th>
                        <th class="text-center">Opening Bal</th>
                        <th class="text-center">Income (+)</th>
                        <th class="text-center">Mid Balance</th>
                        <th class="text-center">Expense (-)</th>
                        <th class="text-center">Final Balance</th>
                        <th class="text-start">Remarks</th>
                        <th class="text-center" style="width: 120px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Add Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="entryForm">
                    <input type="hidden" id="editKey">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="small fw-bold">Date</label>
                            <input type="date" id="entryDate" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold">Current Opening Balance</label>
                            <input type="number" id="openBal" class="form-control form-locked" readonly step="0.01">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold text-success">Income</label>
                            <input type="number" id="incomeInput" class="form-control border-success" step="0.01" value="0" oninput="calculateLiveBalance()">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold text-danger">Expense</label>
                            <input type="number" id="expenseInput" class="form-control border-danger" step="0.01" value="0" oninput="calculateLiveBalance()">
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold">Remarks / Detail</label>
                            <textarea id="entryRemarks" class="form-control" rows="2" placeholder="Detail likhein..."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold text-primary">Final Balance (Preview)</label>
                            <input type="number" id="finalBalance" class="form-control form-locked fw-bold" readonly step="0.01">
                        </div>
                        <div class="col-12 mt-3">
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Save Data</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'transactions');
    const themeRef = ref(db, 'settings/theme');

    let allData = [];
    let filterStart = null;
    let filterEnd = null;
    let myChart = null;
    const modalObj = new bootstrap.Modal(document.getElementById('entryModal'));
    const today = new Date().toISOString().split('T')[0];

    // Theme Logic
    onValue(themeRef, (snap) => {
        const theme = snap.val() || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('appTheme').value = theme;
    });
    window.saveTheme = () => set(themeRef, document.getElementById('appTheme').value);

    // Initial Filter
    document.getElementById('fromDate').value = today;
    document.getElementById('toDate').value = today;

    // Fetch Data
    onValue(dbRef, (snap) => {
        allData = [];
        snap.forEach(c => { allData.push({ id: c.key, ...c.val() }); });
        refreshUI();
    });

    window.refreshUI = function() {
        const summaryBody = document.getElementById('summaryTableBody');
        summaryBody.innerHTML = '';
        
        // Grouping Data by Date
        const grouped = {};
        allData.forEach(t => {
            if (!grouped[t.date]) { grouped[t.date] = { income: 0, expense: 0, items: [] }; }
            if (t.type === 'Income') grouped[t.date].income += t.amount;
            else grouped[t.date].expense += t.amount;
            grouped[t.date].items.push(t);
        });

        const sortedDates = Object.keys(grouped).sort((a,b) => new Date(a) - new Date(b));
        let runningBalance = 0;

        sortedDates.forEach((date) => {
            const dayData = grouped[date];
            const opening = runningBalance;
            const mid = opening + dayData.income;
            const closing = mid - dayData.expense;

            const isVisible = (!filterStart || date >= filterStart) && (!filterEnd || date <= filterEnd);

            if (isVisible) {
                // Combine Remarks
                const remarksHtml = dayData.items
                    .filter(i => i.remarks && i.remarks !== "N/A")
                    .map(i => `• ${i.remarks}`).join('<br>');

                // Action Buttons for each transaction of the day
                const actionHtml = dayData.items.map(i => `
                    <div class="d-flex justify-content-center gap-1 mb-1">
                        <span class="badge ${i.type==='Income'?'bg-success':'bg-danger'}" style="width:40px;">${i.amount}</span>
                        <i class="bi bi-pencil-square text-primary cursor-pointer" onclick="editEntry('${i.id}')"></i>
                        <i class="bi bi-trash text-danger cursor-pointer" onclick="deleteEntry('${i.id}')"></i>
                    </div>
                `).join('');

                summaryBody.innerHTML += `
                    <tr>
                        <td class="text-center fw-bold">${date.split('-').reverse().slice(0,2).join('/')}</td>
                        <td class="text-center">${opening.toFixed(2)}</td>
                        <td class="text-center text-success fw-bold">${dayData.income > 0 ? '+'+dayData.income.toFixed(2) : '0'}</td>
                        <td class="text-center text-secondary">${mid.toFixed(2)}</td>
                        <td class="text-center text-danger fw-bold">${dayData.expense > 0 ? '-'+dayData.expense.toFixed(2) : '0'}</td>
                        <td class="text-center fw-bold text-primary">${closing.toFixed(2)}</td>
                        <td class="remarks-cell">${remarksHtml || '-'}</td>
                        <td>${actionHtml}</td>
                    </tr>`;
            }
            runningBalance = closing;
        });

        updateCards(runningBalance);
        initChart();
    };

    function updateCards(finalBal) {
        let totalInc = 0, totalExp = 0, todayNet = 0;
        allData.forEach(t => {
            if(t.type === 'Income') totalInc += t.amount; else totalExp += t.amount;
            if(t.date === today) todayNet += (t.type === 'Income' ? t.amount : -t.amount);
        });
        document.getElementById('totalIncVal').innerText = totalInc.toFixed(0);
        document.getElementById('totalExpVal').innerText = totalExp.toFixed(0);
        document.getElementById('dailyVal').innerText = (totalInc - totalExp).toFixed(0);
        document.getElementById('todayNetVal').innerText = todayNet.toFixed(0);
        // Modal balance update
        document.getElementById('openBal').value = (totalInc - totalExp).toFixed(2);
    }

    window.applyFilter = () => { filterStart = document.getElementById('fromDate').value; filterEnd = document.getElementById('toDate').value; refreshUI(); };
    window.resetFilter = () => { filterStart = null; filterEnd = null; refreshUI(); };

    window.calculateLiveBalance = () => {
        const opening = parseFloat(document.getElementById('openBal').value) || 0;
        const inc = parseFloat(document.getElementById('incomeInput').value) || 0;
        const exp = parseFloat(document.getElementById('expenseInput').value) || 0;
        document.getElementById('finalBalance').value = (opening + inc - exp).toFixed(2);
    };

    window.openModal = () => {
        document.getElementById('entryForm').reset();
        document.getElementById('editKey').value = "";
        document.getElementById('entryDate').value = today;
        calculateLiveBalance();
        modalObj.show();
    };

    window.editEntry = (id) => {
        const item = allData.find(i => i.id === id);
        if(!item) return;
        document.getElementById('editKey').value = item.id;
        document.getElementById('entryDate').value = item.date;
        document.getElementById('entryRemarks').value = item.remarks === "N/A" ? "" : item.remarks;
        if(item.type === 'Income') { document.getElementById('incomeInput').value = item.amount; document.getElementById('expenseInput').value = 0; }
        else { document.getElementById('incomeInput').value = 0; document.getElementById('expenseInput').value = item.amount; }
        calculateLiveBalance();
        modalObj.show();
    };

    window.deleteEntry = (id) => { if(confirm("Kya aap waqai delete karna chahte hain?")) remove(ref(db, 'transactions/'+id)); };

    document.getElementById('entryForm').onsubmit = async (e) => {
        e.preventDefault();
        const key = document.getElementById('editKey').value;
        const date = document.getElementById('entryDate').value;
        const inc = parseFloat(document.getElementById('incomeInput').value) || 0;
        const exp = parseFloat(document.getElementById('expenseInput').value) || 0;
        const rem = document.getElementById('entryRemarks').value || "N/A";

        if(key) {
            const type = inc > 0 ? 'Income' : 'Expense';
            const amount = inc > 0 ? inc : exp;
            await set(ref(db, 'transactions/'+key), { type, date, amount, remarks: rem });
        } else {
            if(inc > 0) await push(dbRef, { type: 'Income', date, amount: inc, remarks: rem });
            if(exp > 0) await push(dbRef, { type: 'Expense', date, amount: exp, remarks: rem });
        }
        modalObj.hide();
    };

    function initChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        
        const dates = [...new Set(allData.map(d => d.date))].sort().slice(-7);
        const incData = dates.map(d => allData.filter(x => x.date === d && x.type === 'Income').reduce((a,b)=>a+b.amount,0));
        const expData = dates.map(d => allData.filter(x => x.date === d && x.type === 'Expense').reduce((a,b)=>a+b.amount,0));

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates.map(d => d.split('-').slice(1).reverse().join('/')),
                datasets: [
                    { label: 'Income', data: incData, borderColor: '#2ecc71', tension: 0.3, fill: true, backgroundColor: 'rgba(46, 204, 113, 0.1)' },
                    { label: 'Expense', data: expData, borderColor: '#e74c3c', tension: 0.3, fill: true, backgroundColor: 'rgba(231, 76, 60, 0.1)' }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: { display: false } } }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
