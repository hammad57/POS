<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Financial Tracker 3D Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark theme styling matching your screenshot */
        body { background-color: #1a1e29; color: #ffffff; font-family: sans-serif; }
        .card-bg { background-color: #2a2f3f; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <h2 class="text-xl font-bold">Financial Summary Report</h2>
    </div>

    <div class="overflow-x-auto card-bg rounded-lg shadow-lg border border-gray-700">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-blue-900 text-white">
                <tr>
                    <th class="p-3 border-b border-gray-700">Date</th>
                    <th class="p-3 border-b border-gray-700">Opening Balance</th>
                    <th class="p-3 border-b border-gray-700">Income</th>
                    <th class="p-3 border-b border-gray-700">Balance</th>
                    <th class="p-3 border-b border-gray-700">Expense</th>
                    <th class="p-3 border-b border-gray-700">Remaining Amount</th>
                </tr>
            </thead>
            <tbody id="summaryTableBody">
                <tr class="border-b border-gray-700 hover:bg-gray-700 transition">
                    <td class="p-3">15 Mar 2026</td>
                    <td class="p-3">1640.00</td>
                    <td class="p-3">660.00</td>
                    <td class="p-3 text-blue-400 font-semibold">2300.00</td> <td class="p-3 text-red-400">180.00</td>
                    <td class="p-3 text-green-400 font-bold remaining-amount">2120.00</td> </tr>
            </tbody>
        </table>
    </div>

    <button id="openModalBtn" class="fixed bottom-8 right-8 bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full text-3xl shadow-lg flex items-center justify-center transition">+</button>

    <div id="entryModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50 px-4">
        <div class="card-bg p-6 rounded-lg shadow-2xl w-full max-w-md border border-gray-600">
            <h3 class="text-xl font-bold mb-4 border-b border-gray-600 pb-2">Add New Entry</h3>
            
            <form id="newEntryForm" class="flex flex-col gap-4">
                
                <div class="flex flex-col">
                    <label class="text-gray-300 text-sm mb-1">Date</label>
                    <input type="date" id="entryDate" required class="p-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-gray-300 text-sm mb-1">Opening Balance</label>
                    <input type="number" id="openingBalance" readonly class="p-2 bg-gray-700 border border-gray-600 rounded text-gray-400 cursor-not-allowed" placeholder="0.00">
                </div>

                <div class="flex flex-col">
                    <label class="text-gray-300 text-sm mb-1">Income</label>
                    <input type="number" id="incomeAmount" class="p-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500" placeholder="Enter income amount" min="0">
                </div>

                <div class="flex flex-col">
                    <label class="text-gray-300 text-sm mb-1">Expense</label>
                    <input type="number" id="expenseAmount" class="p-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500" placeholder="Enter expense amount" min="0">
                </div>

                <div class="flex flex-col">
                    <label class="text-gray-300 text-sm mb-1">Balance (Opening + Income - Expense)</label>
                    <input type="number" id="finalBalance" readonly class="p-2 bg-gray-700 border border-gray-600 rounded text-green-400 font-bold cursor-not-allowed" placeholder="0.00">
                </div>

                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-500 text-white transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 text-white font-bold transition">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Modal & Elements Setup
        const modal = document.getElementById('entryModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const form = document.getElementById('newEntryForm');
        
        const entryDate = document.getElementById('entryDate');
        const openingBalanceInput = document.getElementById('openingBalance');
        const incomeInput = document.getElementById('incomeAmount');
        const expenseInput = document.getElementById('expenseAmount');
        const finalBalanceInput = document.getElementById('finalBalance');

        // '+' Button par click karne se popup open hoga
        openBtn.addEventListener('click', () => {
            modal.classList.remove('hidden'); // Modal show karein
            
            // 1. Current Date auto-set karein
            entryDate.valueAsDate = new Date();
            
            // 2. Pichli date ka "Remaining Amount" utha kar Opening Balance mein daalein
            // Note: Main table se utha raha hoon, aap chahain to ise Firebase se link kar saktay hain.
            const remainingElements = document.querySelectorAll('.remaining-amount');
            let lastRemainingAmount = 0;
            if(remainingElements.length > 0) {
                // Table ki aakhri row ka amount uthaye ga
                lastRemainingAmount = parseFloat(remainingElements[remainingElements.length - 1].innerText);
            }
            
            // Opening balance ko lock field mein set karein
            openingBalanceInput.value = lastRemainingAmount.toFixed(2);
            
            // Purani values clear kar dein
            incomeInput.value = '';
            expenseInput.value = '';
            
            // Auto calculate balance
            calculateFinalBalance();
        });

        // Cancel Button se popup band karein
        closeBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // Auto Calculation Logic
        function calculateFinalBalance() {
            let opening = parseFloat(openingBalanceInput.value) || 0;
            let income = parseFloat(incomeInput.value) || 0;
            let expense = parseFloat(expenseInput.value) || 0;

            // Balance = Opening + Income - Expense
            let calculatedBalance = (opening + income) - expense;
            
            // Final result locked field mein dikhayein
            finalBalanceInput.value = calculatedBalance.toFixed(2);
        }

        // Jab user Income ya Expense type kare to calculation fauran update ho jaye
        incomeInput.addEventListener('input', calculateFinalBalance);
        expenseInput.addEventListener('input', calculateFinalBalance);

        // Save Button (Yahan aap ki save logic aayegi)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // TODO: Yahan aap Firebase mein data push karne wali JS code likhain ge.
            console.log("Saving Date:", entryDate.value);
            console.log("Saving Opening:", openingBalanceInput.value);
            console.log("Saving Income:", incomeInput.value);
            console.log("Saving Expense:", expenseInput.value);
            console.log("Saving Final Remaining:", finalBalanceInput.value);
            
            alert("Entry Ready for Save! (Apni Firebase logic attach karein)");
            modal.classList.add('hidden'); // Save hone ke baad popup band ho jaye
        });
    </script>
</body>
</html>
