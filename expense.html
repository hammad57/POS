<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no"> 
    <title>Smart Financial Tracker 3D Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ================= THEME VARIABLES ================= */
        :root {
            --bg-body: #e0e5ec;
            --container-bg: #f2f5f9;
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: rgba(255, 255, 255, 0.5);
            --shadow-3d: 9px 9px 16px rgba(163,177,198,0.5), -9px -9px 16px rgba(255,255,255, 0.8);
            --shadow-inner: inset 4px 4px 8px rgba(163,177,198,0.3), inset -4px -4px 8px rgba(255,255,255, 0.8);
            --table-header-bg: #2c3e50;
            --table-header-text: #ffffff;
            --input-bg: #ffffff;
            --input-text: #333333;
            --glass-blur: none;
        }

        html[data-theme="dark"] {
            --bg-body: #121212;
            --container-bg: #1e1e24;
            --text-color: #f5f6fa;
            --text-muted: #a4b0be;
            --border-color: #2b2b36;
            --shadow-3d: 8px 8px 15px #0a0a0c, -8px -8px 15px #2a2a32;
            --shadow-inner: inset 4px 4px 8px #0a0a0c, inset -4px -4px 8px #2a2a32;
            --table-header-bg: #0f3460;
            --table-header-text: #e9ecef;
            --input-bg: #2b2b36;
            --input-text: #ffffff;
            --glass-blur: none;
        }

        html[data-theme="glass"] {
            --bg-body: linear-gradient(135deg, #12c2e9, #c471ed, #f64f59);
            --container-bg: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --text-muted: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.25);
            --shadow-3d: 0 15px 35px rgba(0, 0, 0, 0.25);
            --shadow-inner: none;
            --table-header-bg: rgba(0, 0, 0, 0.4);
            --table-header-text: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.2);
            --input-text: #ffffff;
            --glass-blur: blur(12px);
        }

        /* ================= BASE STYLES ================= */
        body { 
            background: var(--bg-body); 
            background-attachment: fixed;
            color: var(--text-color); 
            padding: 20px; 
            font-family: 'Poppins', sans-serif; 
            min-width: 1200px; 
            transition: all 0.5s ease;
        }
        .main-wrapper { width: 1150px; margin: 0 auto; }
        
        /* ================= 3D CARDS ================= */
        .summary-card { 
            border-radius: 20px; 
            color: white; 
            padding: 25px 15px; 
            margin-bottom: 20px; 
            box-shadow: 0 15px 25px rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4); 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1;
        }
        .summary-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%);
            z-index: -1; pointer-events: none;
        }
        .summary-card:hover { transform: translateY(-8px) scale(1.03); }
        
        .bg-income { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-expense { background: linear-gradient(135deg, #cb2d3e, #ef473a); }
        .bg-profit { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .bg-today-inc { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .bg-today-exp { background: linear-gradient(135deg, #f12711, #f5af19); }
        
        /* ================= CONTAINERS & ELEMENTS ================= */
        .chart-container { 
            background: var(--container-bg); 
            padding: 35px; 
            border-radius: 25px; 
            box-shadow: var(--shadow-3d); 
            border: 1px solid var(--border-color);
            transition: all 0.5s ease;
        }
        
        .fab-add {
            position: fixed; right: 50px; bottom: 50px; width: 90px; height: 90px;
            border-radius: 50%; background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 45px; box-shadow: 0 10px 25px rgba(13, 110, 253, 0.4);
            cursor: pointer; z-index: 1000; border: none; transition: 0.3s;
        }

        .table-custom { border-collapse: separate; border-spacing: 0; overflow: hidden; border-radius: 15px; box-shadow: var(--shadow-3d); }
        .table-custom thead th { background-color: var(--table-header-bg) !important; color: var(--table-header-text) !important; padding: 15px; }
        .table-custom tbody td { background-color: var(--input-bg) !important; border-color: var(--border-color); vertical-align: middle; }
        
        .form-locked { background: rgba(0,0,0,0.05) !important; opacity: 0.7; cursor: not-allowed; }

        .modal-content {
            background: var(--container-bg);
            border-radius: 20px;
            color: var(--text-color);
        }
    </style>
</head>
<body>

<button class="fab-add" onclick="openModal()"><i class="bi bi-plus-lg"></i></button>

<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0"><i class="bi bi-bank me-2 text-primary"></i>Smart Financial Tracker 3D</h2>
        <select id="appTheme" class="form-select border-0 shadow-sm fw-bold" style="width: 200px;" onchange="saveTheme()">
            <option value="light">☀️ Light Theme</option>
            <option value="dark">🌙 Dark Theme</option>
            <option value="glass">🧊 Glassmorphism</option>
        </select>
    </div>

    <div class="row text-center mb-4">
        <div class="col" onclick="updateView('Income')"><div class="summary-card bg-income"><h6>Total Income</h6><h2 id="totalIncVal">0</h2></div></div>
        <div class="col" onclick="updateView('Expense')"><div class="summary-card bg-expense"><h6>Total Expense</h6><h2 id="totalExpVal">0</h2></div></div>
        <div class="col" onclick="updateView('All')"><div class="summary-card bg-profit"><h6>Daily Profit</h6><h2 id="dailyVal">0</h2></div></div>
        <div class="col" onclick="updateView('Income')"><div class="summary-card bg-today-inc"><h6>Today Income</h6><h2 id="todayIncVal">0</h2></div></div>
        <div class="col" onclick="updateView('Expense')"><div class="summary-card bg-today-exp"><h6>Today Expense</h6><h2 id="todayExpVal">0</h2></div></div>
    </div>
    
    <span id="balanceVal" style="display: none;">0</span>

    <div class="chart-container">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div class="btn-group shadow-sm">
                <button class="btn btn-primary active fw-bold" id="btnAll" onclick="updateView('All')">All Tracking</button>
                <button class="btn btn-outline-primary fw-bold" id="btnInc" onclick="updateView('Income')">Income</button>
                <button class="btn btn-outline-primary fw-bold" id="btnExp" onclick="updateView('Expense')">Expense</button>
            </div>
            <div class="d-flex align-items-center gap-2">
                <input type="date" id="fromDate" class="form-control form-control-sm">
                <input type="date" id="toDate" class="form-control form-control-sm">
                <button class="btn btn-dark btn-sm" onclick="applyFilter()">Filter</button>
                <button class="btn btn-secondary btn-sm" onclick="resetFilter()">Reset</button>
            </div>
        </div>

        <div id="chartBox" style="height: 380px; width: 100%;">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="table-responsive mt-5">
            <table class="table table-custom align-middle" id="summaryTable">
                <thead>
                    <tr>
                        <th class="text-center">Date</th>
                        <th class="text-center">Opening Balance</th>
                        <th class="text-center">Income</th>
                        <th class="text-center">Balance</th>
                        <th class="text-center">Expense</th>
                        <th class="text-center">Remaining Amount</th>
                        <th class="text-center">Remarks</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>Nayi Entry Karein</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="entryForm">
                    <input type="hidden" id="editKey">
                    <div class="mb-3">
                        <label class="fw-bold mb-1">Date</label>
                        <input type="date" id="entryDate" class="form-control shadow-sm" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold mb-1 opacity-75">Opening Balance (Current)</label>
                        <input type="number" id="openBal" class="form-control form-locked" readonly step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold mb-1 text-success">Income Amount</label>
                        <input type="number" id="incomeInput" class="form-control border-success" step="0.01" value="0" oninput="calculateLiveBalance()">
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold mb-1 text-danger">Expense Amount</label>
                        <input type="number" id="expenseInput" class="form-control border-danger" step="0.01" value="0" oninput="calculateLiveBalance()">
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold mb-1 text-primary">Expected Final Balance</label>
                        <input type="number" id="finalBalance" class="form-control form-locked fw-bold text-primary" readonly step="0.01">
                    </div>
                    <div class="mb-4">
                        <label class="fw-bold mb-1">Remarks (Detail)</label>
                        <textarea id="entryRemarks" class="form-control shadow-sm" rows="3" placeholder="Yahan detail likhein..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-3">Save Record Data</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    Chart.register(ChartDataLabels);

    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'transactions');
    const themeRef = ref(db, 'settings/theme'); 

    let allData = [];
    let currentTab = 'All';
    let filterStart = null;
    let filterEnd = null;
    let myChart = null;
    const modalObj = new bootstrap.Modal(document.getElementById('entryModal'));

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('fromDate').value = today;
    document.getElementById('toDate').value = today;

    onValue(themeRef, (snap) => {
        const savedTheme = snap.val() || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('appTheme').value = savedTheme;
        if(allData.length > 0) refreshUI(); 
    });

    window.saveTheme = () => set(themeRef, document.getElementById('appTheme').value);

    const formatDateDisplay = (dateStr) => new Date(dateStr).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

    onValue(dbRef, (snap) => {
        allData = [];
        snap.forEach(c => { allData.push({ id: c.key, ...c.val() }); });
        refreshUI();
    });

    window.refreshUI = function() {
        const summaryBody = document.getElementById('summaryTableBody');
        summaryBody.innerHTML = '';
        
        const grouped = {};
        allData.forEach(t => {
            if (!grouped[t.date]) { grouped[t.date] = { income: 0, expense: 0, items: [] }; }
            if (t.type === 'Income') grouped[t.date].income += t.amount;
            else grouped[t.date].expense += t.amount;
            grouped[t.date].items.push(t);
        });

        const sortedDates = Object.keys(grouped).sort((a,b) => new Date(a) - new Date(b));
        let runningBalance = 0;

        sortedDates.forEach((date) => {
            const data = grouped[date];
            const openingBalForDay = runningBalance;
            const balanceAfterIncome = openingBalForDay + data.income; // Agar negative hai to income se kam hoga
            const currentDayClosing = balanceAfterIncome - data.expense; // Expense se mazeed negative hoga
            
            const isWithinRange = (!filterStart || date >= filterStart) && (!filterEnd || date <= filterEnd);

            if (isWithinRange) {
                let dayRemarks = data.items.map(i => i.remarks).filter(r => r && r !== "N/A").join(" | ");
                
                let actionButtons = data.items.map(item => `
                    <div class="d-flex align-items-center justify-content-center gap-1 mb-1">
                        <span class="badge ${item.type==='Income'?'bg-success':'bg-danger'}" style="min-width:50px;">${item.amount}</span>
                        <button class="btn btn-sm btn-primary py-0 px-2" onclick="editEntry('${item.id}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger py-0 px-2" onclick="deleteEntry('${item.id}')"><i class="bi bi-trash"></i></button>
                    </div>
                `).join('');

                summaryBody.innerHTML += `
                    <tr>
                        <td class="text-center fw-bold small">${formatDateDisplay(date)}</td>
                        <td class="text-center fw-bold">${openingBalForDay.toFixed(2)}</td>
                        <td class="text-center text-success fw-bold">${data.income.toFixed(2)}</td>
                        <td class="text-center text-info fw-bold">${balanceAfterIncome.toFixed(2)}</td>
                        <td class="text-center text-danger fw-bold">${data.expense.toFixed(2)}</td>
                        <td class="text-center text-primary fw-bold fs-6">${currentDayClosing.toFixed(2)}</td>
                        <td class="small" style="max-width:200px; word-wrap:break-word;">${dayRemarks}</td>
                        <td class="text-center">${actionButtons}</td>
                    </tr>`;
            }
            runningBalance = currentDayClosing;
        });

        updateCalculations();
        initChart(allData.filter(t => (!filterStart || t.date >= filterStart) && (!filterEnd || t.date <= filterEnd)));
    }

    function updateCalculations() {
        let dInc = 0, dExp = 0, tBal = 0;
        let todayInc = 0, todayExp = 0;
        const lastDate = allData.length > 0 ? [...new Set(allData.map(t => t.date))].sort().pop() : "";
        allData.forEach(t => { 
            tBal += (t.type === 'Income' ? t.amount : -t.amount); 
            if(t.date === lastDate) { if(t.type === 'Income') todayInc += t.amount; else todayExp += t.amount; }
            if(t.type === 'Income') dInc += t.amount; else dExp += t.amount;
        });
        document.getElementById('totalIncVal').innerText = dInc.toFixed(2);
        document.getElementById('totalExpVal').innerText = dExp.toFixed(2);
        document.getElementById('dailyVal').innerText = (dInc - dExp).toFixed(2);
        document.getElementById('balanceVal').innerText = tBal.toFixed(2); 
        document.getElementById('todayIncVal').innerText = todayInc.toFixed(2);
        document.getElementById('todayExpVal').innerText = todayExp.toFixed(2);
    }

    window.applyFilter = () => { filterStart = document.getElementById('fromDate').value; filterEnd = document.getElementById('toDate').value; refreshUI(); };
    window.resetFilter = () => { filterStart = null; filterEnd = null; document.getElementById('fromDate').value = today; document.getElementById('toDate').value = today; refreshUI(); };

    window.editEntry = (id) => {
        const entry = allData.find(i => i.id === id);
        if (entry) {
            document.getElementById('editKey').value = entry.id;
            document.getElementById('entryDate').value = entry.date;
            document.getElementById('entryRemarks').value = (entry.remarks === "N/A") ? "" : entry.remarks;
            if(entry.type === 'Income') { document.getElementById('incomeInput').value = entry.amount; document.getElementById('expenseInput').value = 0; }
            else { document.getElementById('incomeInput').value = 0; document.getElementById('expenseInput').value = entry.amount; }
            document.getElementById('openBal').value = (parseFloat(document.getElementById('balanceVal').innerText) || 0).toFixed(2);
            calculateLiveBalance();
            modalObj.show();
        }
    };

    window.deleteEntry = (id) => { if(confirm("Kya aap delete karna chahte hain?")) remove(ref(db, 'transactions/'+id)); };

    window.calculateLiveBalance = () => {
        const opening = parseFloat(document.getElementById('openBal').value) || 0;
        const income = parseFloat(document.getElementById('incomeInput').value) || 0;
        const expense = parseFloat(document.getElementById('expenseInput').value) || 0;
        document.getElementById('finalBalance').value = ((opening + income) - expense).toFixed(2);
    };

    window.openModal = () => {
        document.getElementById('entryForm').reset();
        document.getElementById('editKey').value = "";
        document.getElementById('entryDate').value = today;
        document.getElementById('openBal').value = (parseFloat(document.getElementById('balanceVal').innerText) || 0).toFixed(2);
        calculateLiveBalance();
        modalObj.show();
    };

    document.getElementById('entryForm').onsubmit = async (e) => {
        e.preventDefault();
        const key = document.getElementById('editKey').value;
        const date = document.getElementById('entryDate').value;
        const income = parseFloat(document.getElementById('incomeInput').value) || 0;
        const expense = parseFloat(document.getElementById('expenseInput').value) || 0;
        const remarks = document.getElementById('entryRemarks').value || "N/A";

        if(key) {
            const type = income > 0 ? 'Income' : 'Expense';
            const amount = income > 0 ? income : expense;
            set(ref(db, 'transactions/'+key), { type, date, amount, remarks });
        } else {
            if(income > 0) await push(dbRef, { type: 'Income', date, amount: income, remarks });
            if(expense > 0) await push(dbRef, { type: 'Expense', date, amount: expense, remarks });
        }
        modalObj.hide();
    };

    window.initChart = (data) => {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        const sorted = [...data].sort((a,b) => new Date(a.date) - new Date(b.date));
        const labels = [...new Set(sorted.map(d => formatDateDisplay(d.date)))];
        const incs = labels.map(l => sorted.filter(d => formatDateDisplay(d.date) === l && d.type === 'Income').reduce((s,c) => s+c.amount,0));
        const exps = labels.map(l => sorted.filter(d => formatDateDisplay(d.date) === l && d.type === 'Expense').reduce((s,c) => s+c.amount,0));
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: labels, 
                datasets: [
                    { label: 'Income', data: incs, backgroundColor: '#2ecc71' },
                    { label: 'Expense', data: exps, backgroundColor: '#e74c3c' }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    window.updateView = (tab) => { currentTab = tab; refreshUI(); };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
