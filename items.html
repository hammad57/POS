<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #22c55e; --light: #f1f5f9; --white: #ffffff; --red: #ef4444; --blue: #3b82f6; --dark-blue: #1e40af; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 80px; }
        
        /* Sync UI */
        .sync-box { text-align: right; line-height: 1.2; }
        #sync-btn { background: var(--accent); color: white; border: none; padding: 6px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 10px; }
        #sync-time { font-size: 9px; opacity: 0.7; display: block; margin-top: 2px; }

        /* Loader */
        #loading { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 24px; border-radius: 12px; display: none; align-items: center; gap: 12px; z-index: 9999; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-left: 5px solid var(--accent); }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--accent); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .nav-bar { background: var(--primary); padding: 15px; color: white; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-size: 18px; font-weight: bold; }
        
        .tabs { display: flex; background: var(--primary); }
        .tab { flex: 1; padding: 15px; text-align: center; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; font-weight: bold; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }

        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #64748b; font-size: 13px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 10px; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-blue { background: var(--blue); color: white; width: 100%; margin-top: 10px; }

        /* Calculator Specific */
        .calc-btn { background: #e2e8f0; color: #1e293b; font-size: 18px; border-radius: 8px; padding: 15px; border: none; cursor: pointer; }
        .calc-btn:active { background: #cbd5e1; }
        .calc-screen { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: right; font-size: 24px; font-weight: bold; border: 1px solid #e2e8f0; min-height: 40px; overflow: hidden; }

        /* Queue Styling */
        .queue-container { margin-top: 20px; border-top: 2px dashed #cbd5e1; padding-top: 15px; }
        .queue-item { display: flex; align-items: center; background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--blue); }
        .queue-info { flex: 1; font-size: 13px; }

        /* Product List */
        .product-item { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #f1f5f9; gap: 12px; }
        .product-img { width: 50px; height: 50px; object-fit: contain; background: #f8fafc; border-radius: 8px; }
        .product-info { flex: 1; }
        .product-info h4 { margin: 0; color: #1e293b; font-size: 15px; }
        .price-tag { color: var(--accent); font-weight: 800; font-size: 14px; }
        
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #3b82f6; color: white; padding: 8px; border-radius: 6px; border:none; cursor: pointer; }
        .del-btn { background: var(--red); color: white; padding: 8px; border-radius: 6px; border:none; cursor: pointer; }

        .search-box { position: sticky; top: 115px; z-index: 90; background: var(--light); padding: 10px 0; display: flex; gap: 10px; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        
        .download-option { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; text-align: left; font-weight: bold; position: relative; }
        .download-option:hover { background: #f1f5f9; }
        .download-option input { width: auto; position: absolute; right: 15px; top: 15px; }

        /* Hidden Export Table */
        #export-table-container { position: absolute; left: -9999px; top: -9999px; background: white; padding: 20px; }
        .export-table { border-collapse: collapse; width: 100%; }
        .export-table th, .export-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .export-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div id="loading"><div class="spinner"></div><span id="loading-text">Processing...</span></div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal">
            <h3>Confirm Deletion</h3>
            <p>Delete <span id="delete-item-name" style="font-weight:bold; color:var(--red);"></span>?</p>
            <div class="btn-grid">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn" style="background: var(--red); color: white;" onclick="confirmDeleteAction()">Delete</button>
            </div>
        </div>
    </div>

    <div id="calculator-modal" class="modal-overlay">
        <div class="modal">
            <h3 style="margin-top:0;">Calculator</h3>
            <div class="calc-screen" id="calc-display">0</div>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
                <button class="calc-btn" onclick="calcAction('C')" style="background:var(--red); color:white;">C</button>
                <button class="calc-btn" onclick="calcAction('DEL')">⌫</button>
                <button class="calc-btn" onclick="calcAction('/')">÷</button>
                <button class="calc-btn" onclick="calcAction('*')">×</button>
                <button class="calc-btn" onclick="calcNum('7')">7</button>
                <button class="calc-btn" onclick="calcNum('8')">8</button>
                <button class="calc-btn" onclick="calcNum('9')">9</button>
                <button class="calc-btn" onclick="calcAction('-')">-</button>
                <button class="calc-btn" onclick="calcNum('4')">4</button>
                <button class="calc-btn" onclick="calcNum('5')">5</button>
                <button class="calc-btn" onclick="calcNum('6')">6</button>
                <button class="calc-btn" onclick="calcAction('+')">+</button>
                <button class="calc-btn" onclick="calcNum('1')">1</button>
                <button class="calc-btn" onclick="calcNum('2')">2</button>
                <button class="calc-btn" onclick="calcNum('3')">3</button>
                <button class="calc-btn" onclick="calcAction('=')" style="grid-row: span 2; background:var(--accent); color:white;">=</button>
                <button class="calc-btn" onclick="calcNum('0')" style="grid-column: span 2;">0</button>
                <button class="calc-btn" onclick="calcNum('.')">.</button>
            </div>
            <button class="btn btn-secondary" onclick="toggleCalculator()" style="width:100%; margin-top:15px;">Close</button>
        </div>
    </div>

    <div id="download-modal" class="modal-overlay">
        <div class="modal" style="text-align: left;">
            <h3 style="text-align: center; margin-top: 0;">Download Stock</h3>
            
            <p style="font-size: 13px; font-weight: bold; color: #64748b;">Choose Format:</p>
            <div class="download-option" onclick="processDownload('PDF')">📄 Download as PDF File</div>
            <div class="download-option" onclick="processDownload('Excel')">📊 Download as Excel Sheet</div>
            <div class="download-option" onclick="processDownload('Image')">🖼️ Download as Image</div>
            
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
            
            <label style="display: flex; align-items: center; cursor: pointer; background: #f1f5f9; padding: 10px; border-radius: 8px;">
                <input type="checkbox" id="include-images" style="width: auto; margin-right: 10px;">
                <span>Include Product Pictures</span>
            </label>

            <button class="btn btn-secondary" onclick="closeDownloadModal()" style="width:100%; margin-top:15px;">Cancel</button>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Hammad Mart</a>
        <div class="sync-box">
            <span id="sync-status" style="font-size:11px; font-weight:bold;">Offline Mode</span>
            <button id="sync-btn" onclick="syncData()">🔄 Sync</button>
            <span id="sync-time">Last Sync: Never</span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('add', this)">Add / Edit</div>
        <div class="tab" onclick="switchTab('list', this)">All Products</div>
    </div>

    <div id="add-view" class="container">
        <div class="card">
            <h3 id="form-header" style="margin:0 0 15px 0; color: var(--primary);">Add New Product</h3>
            
            <button class="btn btn-secondary" style="width:100%; margin-bottom:15px;" onclick="toggleScanner()">📷 Scan Barcode</button>
            <div id="reader"></div>

            <div class="form-group"><label>Product ID (Barcode)</label><input type="text" id="pID" oninput="checkExistingProduct(this.value)"></div>
            <div class="form-group"><label>English Name</label><input type="text" id="enName"></div>
            <div class="form-group"><label>Urdu Name</label><input type="text" id="urName" dir="rtl"></div>
            
            <div class="btn-grid">
                <div class="form-group"><label>Purchase Price</label><input type="number" id="purchasePrice"></div>
                <div class="form-group"><label>Sale Price</label><input type="number" id="price"></div>
            </div>

            <div class="form-group">
                <label>Unit</label>
                <select id="unit"><option value="kg">KG</option><option value="piece">Piece</option><option value="pack">Pack</option><option value="ltr">Litre</option></select>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="img" placeholder="URL or Capture Data">
                    <button class="btn btn-secondary" onclick="startCamera()" style="white-space:nowrap; padding: 10px;">📷 Take Photo</button>
                </div>
                
                <video id="camera-preview" autoplay playsinline></video>
                <button id="capture-btn" class="btn" onclick="capturePhoto()">CAPTURE NOW 📸</button>
                <canvas id="photo-canvas" style="display:none;"></canvas>
                
                <div id="img-preview-container">
                    <p style="font-size:11px; margin:5px 0;">Preview:</p>
                    <img id="img-preview" src="">
                </div>
            </div>

            <div class="btn-grid">
                <button class="btn btn-blue" onclick="addToQueue()">+ ADD TO QUEUE</button>
                <button class="btn btn-primary" id="saveBtn" onclick="saveProduct()">SAVE NOW ✓</button>
            </div>
            
            <div class="btn-grid" style="margin-top:10px;">
                <button class="btn btn-secondary" onclick="resetForm()">CLEAR FORM</button>
                <button class="btn" style="background:var(--primary); color:white;" onclick="toggleCalculator()">🖩 CALCULATOR</button>
            </div>

            <div id="bulk-section" class="queue-container" style="display:none;">
                <h4 style="margin:0 0 10px 0; color:var(--blue);">Pending Items (<span id="queue-count">0</span>)</h4>
                <div id="queue-list"></div>
                <button class="btn btn-primary" style="background:var(--blue); margin-top:15px;" onclick="uploadBulk()">🚀 UPLOAD ALL TO SHEET</button>
            </div>
        </div>
    </div>

    <div id="list-view" class="container" style="display:none;">
        <button class="btn btn-blue" style="margin-bottom: 10px; background: var(--dark-blue);" onclick="openDownloadModal()">📥 Download Stock Report</button>
        <div class="search-box">
            <input type="text" id="listSearch" placeholder="Search products..." oninput="filterList()">
        </div>
        <div class="card" style="padding:0; overflow:hidden;" id="product-list"></div>
    </div>

    <div id="export-table-container"></div>

    <script>
        const SHEET_API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        let allProducts = [];
        let bulkQueue = [];
        let selectedID = null;
        let scanner = null;
        let stream = null;
        let productToDelete = null;

        // --- Calculator Logic ---
        let calcVal = "0";
        function toggleCalculator() {
            const modal = document.getElementById('calculator-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }
        function calcNum(num) {
            if(calcVal === "0") calcVal = num; else calcVal += num;
            document.getElementById('calc-display').innerText = calcVal;
        }
        function calcAction(action) {
            if(action === 'C') calcVal = "0";
            else if(action === 'DEL') calcVal = calcVal.length > 1 ? calcVal.slice(0, -1) : "0";
            else if(action === '=') { try { calcVal = eval(calcVal).toString(); } catch { calcVal = "Error"; } }
            else calcVal += action;
            document.getElementById('calc-display').innerText = calcVal;
        }

        // --- Download & Export Logic ---
        function openDownloadModal() { document.getElementById('download-modal').style.display = 'flex'; }
        function closeDownloadModal() { document.getElementById('download-modal').style.display = 'none'; }

        async function processDownload(type) {
            const includeImg = document.getElementById('include-images').checked;
            closeDownloadModal();
            showLoader(`Preparing ${type}...`);

            // Prepare Data with Profit Calculation
            const reportData = allProducts.map(p => {
                const purchase = parseFloat(p.pp) || 0;
                const sale = parseFloat(p.price) || 0;
                return {
                    id: p.id,
                    name: `${p.en}${p.ur ? ' / ' + p.ur : ''}`,
                    purchase: purchase,
                    sale: sale,
                    profit: (sale - purchase),
                    img: p.img || ""
                };
            });

            if (type === 'Excel') {
                const worksheet = XLSX.utils.json_to_sheet(reportData.map(i => ({
                    "Product Code": i.id,
                    "Product Name": i.name,
                    "Purchase Price": i.purchase,
                    "Sale Price": i.sale,
                    "Profit per Item": i.profit
                })));
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Stock");
                XLSX.writeFile(workbook, `Hammad_Mart_Stock_${new Date().toLocaleDateString()}.xlsx`);
            } 
            else if (type === 'PDF') {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text("Hammad Mart - Stock Report", 14, 15);
                
                const tableBody = reportData.map(i => [i.id, i.name, i.purchase, i.sale, i.profit]);
                
                doc.autoTable({
                    head: [['Code', 'Product Name', 'Purchase', 'Sale', 'Profit']],
                    body: tableBody,
                    startY: 20,
                    theme: 'grid'
                });
                doc.save(`Stock_Report_${new Date().toLocaleDateString()}.pdf`);
            }
            else if (type === 'Image') {
                const container = document.getElementById('export-table-container');
                let html = `
                    <div style="padding:20px; background:white; width:800px;">
                        <h2 style="text-align:center;">Hammad Mart - Stock Report</h2>
                        <table class="export-table">
                            <thead>
                                <tr>
                                    ${includeImg ? '<th>Image</th>' : ''}
                                    <th>Code</th>
                                    <th>Name</th>
                                    <th>Purchase</th>
                                    <th>Sale</th>
                                    <th>Profit</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${reportData.map(i => `
                                    <tr>
                                        ${includeImg ? `<td><img src="${i.img}" width="40" height="40" style="object-fit:contain;"></td>` : ''}
                                        <td>${i.id}</td>
                                        <td>${i.name}</td>
                                        <td>Rs. ${i.purchase}</td>
                                        <td>Rs. ${i.sale}</td>
                                        <td style="color:green; font-weight:bold;">Rs. ${i.profit}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                container.innerHTML = html;
                
                // Wait for images to load if needed
                setTimeout(async () => {
                    const canvas = await html2canvas(container, { useCORS: true, scale: 2 });
                    const link = document.createElement('a');
                    link.download = `Stock_Report_${new Date().toLocaleDateString()}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    container.innerHTML = "";
                }, 1000);
            }
            hideLoader();
        }

        // --- Camera Management ---
        async function startCamera() {
            const video = document.getElementById('camera-preview');
            const btn = document.getElementById('capture-btn');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
                video.style.display = 'block';
                btn.style.display = 'block';
            } catch (err) { alert("Camera Error: " + err); }
        }

        function capturePhoto() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('photo-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
            document.getElementById('img').value = dataUrl;
            document.getElementById('img-preview').src = dataUrl;
            document.getElementById('img-preview-container').style.display = 'block';
            stopCamera();
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('camera-preview').style.display = 'none';
            document.getElementById('capture-btn').style.display = 'none';
        }

        // --- Bulk Queue Logic ---
        function addToQueue() {
            const id = document.getElementById('pID').value;
            const en = document.getElementById('enName').value;
            const price = document.getElementById('price').value;
            if(!id || !en || !price) { alert("ID, Name, and Price are required!"); return; }

            const item = {
                action: selectedID ? "update" : "add",
                id: id,
                en: en,
                ur: document.getElementById('urName').value,
                pp: document.getElementById('purchasePrice').value,
                price: price,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };

            bulkQueue.push(item);
            updateQueueUI();
            resetForm();
        }

        function updateQueueUI() {
            const section = document.getElementById('bulk-section');
            const list = document.getElementById('queue-list');
            const count = document.getElementById('queue-count');

            if(bulkQueue.length > 0) {
                section.style.display = 'block';
                count.innerText = bulkQueue.length;
                list.innerHTML = bulkQueue.map((item, index) => `
                    <div class="queue-item">
                        <div class="queue-info">
                            <b>${item.en}</b> (ID: ${item.id})<br>
                            Rs. ${item.price} | ${item.unit}
                        </div>
                        <button class="del-btn" onclick="removeFromQueue(${index})" style="padding:5px 10px;">✕</button>
                    </div>
                `).join('');
            } else { section.style.display = 'none'; }
        }

        function removeFromQueue(index) { bulkQueue.splice(index, 1); updateQueueUI(); }

        async function uploadBulk() {
            if(bulkQueue.length === 0) return;
            showLoader(`Uploading 1 of ${bulkQueue.length}...`);
            try {
                for(let i = 0; i < bulkQueue.length; i++) {
                    showLoader(`Uploading ${i+1} of ${bulkQueue.length}...`);
                    await fetch(SHEET_API, { method: "POST", mode: "no-cors", body: JSON.stringify(bulkQueue[i]) });
                }
                bulkQueue = [];
                updateQueueUI();
                await syncData();
                alert("All items uploaded successfully!");
            } catch(e) { alert("Some items failed to upload. Check internet."); }
            finally { hideLoader(); }
        }

        // --- Core Sync Logic ---
        function initializePage() {
            const localData = localStorage.getItem('mart_data');
            const lastSync = localStorage.getItem('mart_last_sync');
            if (localData) {
                allProducts = JSON.parse(localData);
                renderList(allProducts);
                if (lastSync) document.getElementById('sync-time').innerText = "Last Sync: " + lastSync;
                document.getElementById('sync-status').innerText = "Storage Mode";
            }
        }

        async function syncData() {
            showLoader("Syncing with Google Sheets...");
            const btn = document.getElementById('sync-btn');
            btn.disabled = true;
            try {
                const res = await fetch(SHEET_API + "?action=read");
                const data = await res.json();
                allProducts = data;
                const now = new Date().toLocaleString();
                localStorage.setItem('mart_data', JSON.stringify(data));
                localStorage.setItem('mart_last_sync', now);
                renderList(allProducts);
                document.getElementById('sync-time').innerText = "Last Sync: " + now;
                document.getElementById('sync-status').innerText = "Sync Success";
            } catch(e) { alert("Internet Error!"); }
            finally { hideLoader(); btn.disabled = false; }
        }

        // --- UI & Actions ---
        function renderList(data) {
            const listDiv = document.getElementById('product-list');
            listDiv.innerHTML = data.map(p => `
                <div class="product-item">
                    <img class="product-img" src="${p.img || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'">
                    <div class="product-info">
                        <h4>${p.en} ${p.ur ? '<span dir="rtl">(' + p.ur + ')</span>' : ''}</h4>
                        <span class="price-tag">Rs. ${p.price}</span>
                        <p style="font-size:10px; margin:0; opacity:0.6;">ID: ${p.id} | Unit: ${p.unit}</p>
                    </div>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editProduct('${p.id}')">✏️</button>
                        <button class="del-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('add-view').style.display = (tab === 'add') ? 'block' : 'none';
            document.getElementById('list-view').style.display = (tab === 'list') ? 'block' : 'none';
        }

        function checkExistingProduct(id) {
            const p = allProducts.find(item => String(item.id) === String(id));
            if (p) {
                selectedID = p.id;
                document.getElementById('enName').value = p.en;
                document.getElementById('urName').value = p.ur || "";
                document.getElementById('purchasePrice').value = p.pp || "";
                document.getElementById('price').value = p.price;
                document.getElementById('unit').value = p.unit || "kg";
                document.getElementById('img').value = p.img || "";
                if(p.img) {
                    document.getElementById('img-preview').src = p.img;
                    document.getElementById('img-preview-container').style.display = 'block';
                }
                document.getElementById('form-header').innerText = "Update Product";
                document.getElementById('saveBtn').innerText = "UPDATE NOW ✓";
            } else {
                selectedID = null;
                document.getElementById('form-header').innerText = "Add New Product";
                document.getElementById('saveBtn').innerText = "SAVE NOW ✓";
            }
        }

        async function saveProduct() {
            const data = {
                action: selectedID ? "update" : "add",
                id: document.getElementById('pID').value,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                pp: document.getElementById('purchasePrice').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            if(!data.id || !data.en || !data.price) { alert("ID, Name, and Price are required!"); return; }
            showLoader("Saving...");
            try {
                await fetch(SHEET_API, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
                resetForm();
                await syncData();
            } catch(e) { alert("Save failed!"); }
            finally { hideLoader(); }
        }

        function editProduct(id) {
            checkExistingProduct(id);
            document.getElementById('pID').value = id;
            switchTab('add', document.querySelectorAll('.tab')[0]);
        }

        function deleteProduct(id) {
            productToDelete = id;
            const p = allProducts.find(x => x.id == id);
            document.getElementById('delete-item-name').innerText = p ? p.en : id;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() { document.getElementById('delete-modal').style.display = 'none'; }

        async function confirmDeleteAction() {
            closeDeleteModal();
            showLoader("Deleting...");
            try {
                await fetch(SHEET_API, { method: "POST", mode: "no-cors", body: JSON.stringify({action:"delete", id: productToDelete}) });
                await syncData();
            } catch(e) { alert("Delete failed!"); }
            finally { hideLoader(); }
        }

        function filterList() {
            const q = document.getElementById('listSearch').value.toLowerCase();
            const filtered = allProducts.filter(p => p.en.toLowerCase().includes(q) || String(p.id).includes(q));
            renderList(filtered);
        }

        function toggleScanner() {
            const div = document.getElementById('reader');
            if(div.style.display === 'block') { if(scanner) scanner.clear(); div.style.display = 'none'; }
            else {
                div.style.display = 'block';
                scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                scanner.render((id) => { document.getElementById('pID').value = id; checkExistingProduct(id); toggleScanner(); });
            }
        }

        function showLoader(t) { document.getElementById('loading-text').innerText = t; document.getElementById('loading').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loading').style.display = 'none'; }
        
        function resetForm() { 
            selectedID = null; 
            ['pID', 'enName', 'urName', 'purchasePrice', 'price', 'img'].forEach(i => document.getElementById(i).value=""); 
            document.getElementById('img-preview-container').style.display = 'none';
            document.getElementById('form-header').innerText = "Add New Product";
            document.getElementById('saveBtn').innerText = "SAVE NOW ✓";
            stopCamera();
        }

        window.onload = initializePage;
    </script>
</body>
</html>
