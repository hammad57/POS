<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager (Barcode System)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #22c55e; --light: #f1f5f9; --white: #ffffff; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 80px; }
        
        /* Loading Overlay */
        #loading { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 24px; border-radius: 12px; display: none; align-items: center; gap: 12px; z-index: 9999; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-left: 5px solid var(--accent); }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--accent); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Sync UI Styles */
        .sync-box { text-align: right; line-height: 1.2; }
        #sync-btn { background: var(--accent); color: white; border: none; padding: 6px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 10px; transition: 0.3s; }
        #sync-btn:disabled { background: #94a3b8; }
        #sync-time { font-size: 9px; opacity: 0.7; display: block; margin-top: 2px; }

        .nav-bar { background: var(--primary); padding: 15px; color: white; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-size: 18px; font-weight: bold; }
        
        .tabs { display: flex; background: var(--primary); }
        .tab { flex: 1; padding: 15px; text-align: center; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; font-weight: bold; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }

        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #64748b; font-size: 13px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 10px; }
        .btn-secondary { background: #64748b; color: white; }

        /* Camera Preview */
        #camera-preview { width: 100%; border-radius: 10px; display: none; margin-top: 10px; background: #000; }
        #capture-btn { display: none; background: var(--red); color: white; margin-top: 10px; width: 100%; }
        #img-preview-container { margin-top: 10px; display: none; text-align: center; }
        #img-preview-container img { max-width: 120px; border-radius: 8px; border: 2px solid var(--accent); }

        .product-item { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #f1f5f9; gap: 12px; }
        .product-img { width: 50px; height: 50px; object-fit: contain; background: #f8fafc; border-radius: 8px; }
        .product-info { flex: 1; }
        .product-info h4 { margin: 0; color: #1e293b; font-size: 15px; }
        .price-tag { color: var(--accent); font-weight: 800; font-size: 14px; }
        
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #3b82f6; color: white; padding: 8px; border-radius: 6px; border:none; cursor: pointer; }
        .del-btn { background: var(--red); color: white; padding: 8px; border-radius: 6px; border:none; cursor: pointer; }

        .search-box { position: sticky; top: 115px; z-index: 90; background: var(--light); padding: 10px 0; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; }

        /* Delete Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
        .modal { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; }
    </style>
</head>
<body>

    <div id="loading"><div class="spinner"></div><span id="loading-text">Processing...</span></div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete <br><span id="delete-item-name" style="font-weight:bold; color:var(--red);"></span>?</p>
            <div class="btn-grid" style="margin-top:20px;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn" style="background: var(--red); color: white;" onclick="confirmDeleteAction()">Delete Now</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Hammad Mart</a>
        <div class="sync-box">
            <span id="sync-status" style="font-size:11px; font-weight:bold;">Local Mode</span>
            <button id="sync-btn" onclick="syncData()">🔄 Sync</button>
            <span id="sync-time">Last Sync: Never</span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('add', this)">Add / Edit</div>
        <div class="tab" onclick="switchTab('list', this)">Product List</div>
    </div>

    <div id="add-view" class="container">
        <div class="card">
            <h3 id="form-header" style="margin:0 0 15px 0; color: var(--primary);">Product Details</h3>
            
            <button class="btn btn-secondary" style="width:100%; margin-bottom:15px;" onclick="toggleScanner()">📷 Scan Barcode</button>
            <div id="reader"></div>

            <div class="form-group">
                <label>Product ID (Barcode)</label>
                <input type="text" id="pID" oninput="checkExistingProduct(this.value)">
            </div>
            
            <div class="form-group"><label>English Name</label><input type="text" id="enName"></div>
            <div class="form-group"><label>Urdu Name</label><input type="text" id="urName" dir="rtl"></div>
            
            <div class="btn-grid">
                <div class="form-group"><label>Purchase Price</label><input type="number" id="purchasePrice"></div>
                <div class="form-group"><label>Sale Price</label><input type="number" id="price"></div>
            </div>

            <div class="form-group">
                <label>Unit</label>
                <select id="unit">
                    <option value="kg">Kilogram (KG)</option>
                    <option value="piece">Piece / Item</option>
                    <option value="pack">Pack / Box</option>
                    <option value="ltr">Litre</option>
                </select>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="img" placeholder="URL or Capture Data">
                    <button class="btn btn-secondary" onclick="startCamera()" style="white-space:nowrap; padding: 10px;">📷 Camera</button>
                </div>
                
                <video id="camera-preview" autoplay playsinline></video>
                <button id="capture-btn" class="btn" onclick="capturePhoto()">CAPTURE PHOTO 📸</button>
                <canvas id="photo-canvas" style="display:none;"></canvas>
                
                <div id="img-preview-container">
                    <p style="font-size:11px; margin:5px 0;">Image Preview:</p>
                    <img id="img-preview" src="">
                </div>
            </div>

            <button class="btn btn-primary" id="saveBtn" onclick="saveProduct()">SAVE PRODUCT ✓</button>
            <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="resetForm()">CLEAR FORM</button>
        </div>
    </div>

    <div id="list-view" class="container" style="display:none;">
        <button class="btn btn-primary" style="margin-bottom:15px;" onclick="generatePDF()">📥 Download Barcode PDF</button>
        <div class="search-box"><input type="text" id="listSearch" placeholder="Search by name or ID..." oninput="filterList()"></div>
        <div class="card" style="padding:0; overflow:hidden;" id="product-list"></div>
    </div>

    <canvas id="barcode-canvas" style="display:none;"></canvas>

    <script>
        const SHEET_API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        let allProducts = [];
        let selectedID = null;
        let scanner = null;
        let stream = null;
        let productToDelete = null;

        // --- 1. Offline & Sync Logic ---
        function initializePage() {
            const localData = localStorage.getItem('mart_data');
            const lastSync = localStorage.getItem('mart_last_sync');
            if (localData) {
                allProducts = JSON.parse(localData);
                renderList(allProducts);
                if (lastSync) document.getElementById('sync-time').innerText = "Last Sync: " + lastSync;
            } else {
                syncData(); // Pehli baar load ho raha ho
            }
        }

        async function syncData() {
            showLoader("Syncing with Google Sheets...");
            const btn = document.getElementById('sync-btn');
            btn.disabled = true;
            try {
                const res = await fetch(SHEET_API + "?action=read");
                const data = await res.json();
                allProducts = data;
                const now = new Date().toLocaleString();
                localStorage.setItem('mart_data', JSON.stringify(data));
                localStorage.setItem('mart_last_sync', now);
                renderList(allProducts);
                document.getElementById('sync-time').innerText = "Last Sync: " + now;
                document.getElementById('sync-status').innerText = "Cloud Synced";
            } catch(e) { alert("Network Error. Check internet."); }
            finally { hideLoader(); btn.disabled = false; }
        }

        // --- 2. Camera Functions ---
        async function startCamera() {
            const video = document.getElementById('camera-preview');
            const btn = document.getElementById('capture-btn');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.style.display = 'block';
                btn.style.display = 'block';
            } catch (err) { alert("Camera Permission Denied!"); }
        }

        function capturePhoto() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('photo-canvas');
            canvas.width = 300; // Compressed size
            canvas.height = (video.videoHeight / video.videoWidth) * 300;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            document.getElementById('img').value = dataUrl;
            document.getElementById('img-preview').src = dataUrl;
            document.getElementById('img-preview-container').style.display = 'block';
            stopCamera();
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('camera-preview').style.display = 'none';
            document.getElementById('capture-btn').style.display = 'none';
        }

        // --- 3. Core Actions ---
        function renderList(data) {
            const listDiv = document.getElementById('product-list');
            listDiv.innerHTML = data.map(p => `
                <div class="product-item">
                    <img class="product-img" src="${p.img || 'https://via.placeholder.com/50'}">
                    <div class="product-info">
                        <h4>${p.en}</h4>
                        <span class="price-tag">Rs. ${p.price}</span>
                        <p style="font-size:10px; margin:0; opacity:0.6;">Barcode: ${p.id}</p>
                    </div>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editProduct('${p.id}')">✏️</button>
                        <button class="del-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function saveProduct() {
            const data = {
                action: selectedID ? "update" : "add",
                id: document.getElementById('pID').value,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                pp: document.getElementById('purchasePrice').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            if(!data.id || !data.en) return alert("Fill required fields!");
            showLoader("Saving...");
            try {
                await fetch(SHEET_API, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
                resetForm();
                await syncData();
            } catch(e) { alert("Save failed!"); }
            finally { hideLoader(); }
        }

        // --- 4. PDF Generation (Your Original Feature) ---
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const canvas = document.getElementById('barcode-canvas');
            let x = 10, y = 10;
            const cardWidth = 60, cardHeight = 70, margin = 5;

            showLoader("Generating PDF...");
            allProducts.forEach((p, i) => {
                doc.rect(x, y, cardWidth, cardHeight);
                if (p.img) {
                    try { doc.addImage(p.img, 'JPEG', x + 5, y + 5, 50, 30); } catch(e) {}
                }
                doc.setFontSize(10);
                doc.text(p.en.substring(0, 20), x + 5, y + 42);
                doc.text("Rs. " + p.price, x + 5, y + 47);
                
                try {
                    JsBarcode(canvas, p.id, { format: "CODE128", height: 30, displayValue: true });
                    const bImg = canvas.toDataURL("image/png");
                    doc.addImage(bImg, 'PNG', x + 5, y + 50, 50, 15);
                } catch(e) {}

                x += cardWidth + margin;
                if (x > 180) { x = 10; y += cardHeight + margin; }
                if (y > 240 && i < allProducts.length - 1) { doc.addPage(); x = 10; y = 10; }
            });
            doc.save("Mart_Barcodes.pdf");
            hideLoader();
        }

        // --- 5. Helper Functions ---
        function checkExistingProduct(id) {
            const p = allProducts.find(x => String(x.id) === String(id));
            if (p) {
                selectedID = p.id;
                document.getElementById('enName').value = p.en;
                document.getElementById('urName').value = p.ur || "";
                document.getElementById('purchasePrice').value = p.pp || "";
                document.getElementById('price').value = p.price;
                document.getElementById('img').value = p.img || "";
                document.getElementById('unit').value = p.unit || "kg";
                if(p.img) { document.getElementById('img-preview').src = p.img; document.getElementById('img-preview-container').style.display='block'; }
                document.getElementById('form-header').innerText = "Update Item";
            } else {
                selectedID = null;
                document.getElementById('form-header').innerText = "New Item";
            }
        }

        function editProduct(id) { checkExistingProduct(id); document.getElementById('pID').value = id; switchTab('add', document.querySelectorAll('.tab')[0]); }
        
        function deleteProduct(id) { productToDelete = id; document.getElementById('delete-item-name').innerText = id; document.getElementById('delete-modal').style.display = 'flex'; }
        function closeDeleteModal() { document.getElementById('delete-modal').style.display = 'none'; }
        async function confirmDeleteAction() {
            closeDeleteModal(); showLoader("Deleting...");
            try { await fetch(SHEET_API, { method: "POST", mode: "no-cors", body: JSON.stringify({action:"delete", id: productToDelete}) }); await syncData(); } catch(e) {}
            finally { hideLoader(); }
        }

        function toggleScanner() {
            const div = document.getElementById('reader');
            if(div.style.display === 'block') { scanner.clear(); div.style.display = 'none'; }
            else {
                div.style.display = 'block';
                scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                scanner.render((id) => { document.getElementById('pID').value = id; checkExistingProduct(id); toggleScanner(); });
            }
        }

        function filterList() {
            const q = document.getElementById('listSearch').value.toLowerCase();
            renderList(allProducts.filter(p => p.en.toLowerCase().includes(q) || String(p.id).includes(q)));
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('add-view').style.display = (tab === 'add') ? 'block' : 'none';
            document.getElementById('list-view').style.display = (tab === 'list') ? 'block' : 'none';
        }

        function showLoader(t) { document.getElementById('loading-text').innerText = t; document.getElementById('loading').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loading').style.display = 'none'; }
        function resetForm() { selectedID = null; ['pID', 'enName', 'urName', 'purchasePrice', 'price', 'img'].forEach(i => document.getElementById(i).value=""); document.getElementById('img-preview-container').style.display='none'; stopCamera(); }

        window.onload = initializePage;
    </script>
</body>
</html>
