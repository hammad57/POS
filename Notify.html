<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">📢 Notification Manager</h1>
        
        <div class="bg-slate-800 p-6 rounded-xl mb-8 border border-slate-700">
            <input type="text" id="msg" placeholder="Write notification message..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg mb-4">
            <button onclick="addNotify()" class="w-full bg-blue-600 p-3 rounded-lg font-bold hover:bg-blue-700">Send Notification</button>
        </div>

        <div id="notifList" class="space-y-3">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.addNotify = () => {
            const text = document.getElementById('msg').value;
            if(text) {
                push(ref(db, 'notifications'), { text, date: new Date().toLocaleString() });
                document.getElementById('msg').value = '';
            }
        };

        onValue(ref(db, 'notifications'), (snap) => {
            const list = document.getElementById('notifList');
            list.innerHTML = '';
            if(snap.exists()){
                Object.entries(snap.val()).forEach(([key, val]) => {
                    list.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-lg flex justify-between items-center border-l-4 border-blue-500">
                            <div>
                                <p class="text-sm">${val.text}</p>
                                <small class="text-slate-500">${val.date}</small>
                            </div>
                            <button onclick="deleteNotif('${key}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            }
        });

        window.deleteNotif = (key) => remove(ref(db, `notifications/${key}`));
    </script>
</body>
</html>
