<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 50px; }
        .lock-container { max-width: 400px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video { width: 100%; height: auto; border-radius: 10px; background: black; transform: scaleX(-1); }
        .input-field { width: 80%; padding: 10px; margin: 15px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 16px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #2563eb; }
        .hidden { display: none; }
        .or-text { margin: 20px 0; color: #94a3b8; font-weight: bold; }
        #main-content { padding: 50px; background: #10b981; border-radius: 10px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="lock-screen" class="lock-container">
        <h2>🔒 Security Verification</h2>
        <p>Apna Face Scan karein ya Neeche Code lagayein</p>

        <video id="webcam" autoplay playsinline></video>
        <p id="status" style="color: #22c55e;">Camera Loading...</p>

        <div class="or-text">— YA —</div>

        <div>
            <input type="password" id="backupCode" class="input-field" placeholder="Enter Backup Code Here">
            <br>
            <button class="btn" onclick="verifyCode()">Code Se Open Karein</button>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <h1>🎉 Access Granted!</h1>
        <p>Khushamdeed! Aap ki file kamyabi se unlock ho chuki hai.</p>
        <p>Yahan aap apna baki ka saara main code ya data rakh sakte hain.</p>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const statusText = document.getElementById('status');
        const secretCode = "12345"; // Aap apna backup code yahan set kar sakte hain

        // 1. Camera Open Karne Ka Logic
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                statusText.innerText = "Scanning Face... (Looking for match)";
                
                // MOCK FACE MATCH: 3 seconds baad automatic face match simulation (Sirf Demo ke liye)
                setTimeout(() => {
                    // Haqeeqat mein yahan face-api.js ka code lagta hai jo aapke pehle se save face se match karta hai
                    let faceMatched = true; // Agar face match ho jaye
                    if(faceMatched) {
                        unlockFile();
                    }
                }, 4000);

            } catch (err) {
                console.error("Camera access denied", err);
                statusText.innerText = "Camera nahi chal raha! Neeche diye gaye code ka istemal karein.";
                statusText.style.color = "#ef4444";
            }
        }

        // 2. Code/Password Verify Karne Ka Logic
        function verifyCode() {
            const userCode = document.getElementById('backupCode').value;
            if(userCode === secretCode) {
                unlockFile();
            } else {
                alert("Ghalat Code! Dobara koshish karein.");
            }
        }

        // 3. File Unlock Karne Ka Function
        function unlockFile() {
            // Camera band karna ta ke battery bache
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            
            // Lock screen chupana aur Main content dikhana
            document.getElementById('lock-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }

        // File open hote he camera start ho jaye
        window.onload = startCamera;
    </script>
</body>
</html>
