<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center text-white relative">

    <div class="w-full max-w-md md:max-w-2xl mb-4 flex justify-start fade-in">
        <a href="https://hammad57.github.io/POS/" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-6 rounded-full shadow-lg border border-white/20 transition duration-300 flex items-center gap-2">
            🏠 Home
        </a>
    </div>

    <div class="glass p-6 w-full max-w-md md:max-w-2xl fade-in mb-10">
        <h1 class="text-3xl font-bold text-center mb-6">📦 New Order</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-2">Item Name (چیز کا نام)</label>
                <input type="text" id="itemName" placeholder="Ex: Sugar, Atta..." class="w-full p-3 rounded-lg text-black focus:outline-none focus:ring-2 focus:ring-purple-500 shadow-md transition-all">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Quantity (تعداد)</label>
                <input type="number" id="itemQty" placeholder="Ex: 2, 5..." class="w-full p-3 rounded-lg text-black focus:outline-none focus:ring-2 focus:ring-purple-500 shadow-md transition-all">
            </div>
            
            <button <button onclick="saveOrder()" 
class="w-full flex items-center justify-center gap-2 
bg-gradient-to-r from-green-500 to-emerald-600 
hover:from-emerald-600 hover:to-green-700 
text-white font-semibold py-3 px-4 rounded-xl 
shadow-lg hover:shadow-2xl 
transform hover:scale-105 transition duration-300">

  <i class="fa-solid fa-bag-shopping text-lg"></i>
 🛒 Place Order

</button>

    </div>

    <div class="glass p-6 w-full max-w-4xl fade-in" id="orderSection">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
            <h2 class="text-2xl font-bold">📋 Order List</h2>
            <div class="space-x-2">
                <button onclick="downloadImage()" class="bg-blue-500 hover:bg-blue-600 text-sm px-4 py-2 rounded shadow transition">📸 Save Pic</button>
                <button onclick="downloadPDF()" class="bg-red-500 hover:bg-red-600 text-sm px-4 py-2 rounded shadow transition">📄 PDF</button>
            </div>
        </div>

        <div id="printArea" class="overflow-x-auto bg-white rounded-lg text-black p-2">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 uppercase text-sm leading-normal">
                        <th class="py-3 px-6">Item Name</th>
                        <th class="py-3 px-6 text-center">Quantity</th>
                        <th class="py-3 px-6 text-center action-col">Action</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody" class="text-gray-600 text-sm font-light">
                    </tbody>
            </table>
            <div id="loading" class="text-center p-4 font-bold text-gray-500">Loading orders...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ----------------------------------------------------
        // TODO: REPLACE THIS WITH YOUR FIREBASE CONFIG
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", 
            projectId: "own-live-steam-web",
            storageBucket: "own-live-steam-web.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const orderListRef = ref(db, 'orders');

        // Function: Save Order
        window.saveOrder = function() {
            const name = document.getElementById('itemName').value;
            const qty = document.getElementById('itemQty').value;

            if(name === "" || qty === "") {
                alert("Please fill all fields!");
                return;
            }

            push(orderListRef, {
                itemName: name,
                quantity: qty
            }).then(() => {
                alert("Order Placed Successfully! ✅");
                document.getElementById('itemName').value = '';
                document.getElementById('itemQty').value = '';
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }

        // Function: Load Orders (Realtime)
        onValue(orderListRef, (snapshot) => {
            const tableBody = document.getElementById('orderTableBody');
            const loading = document.getElementById('loading');
            tableBody.innerHTML = "";
            loading.style.display = "none";

            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((key) => {
                    const order = data[key];
                    const row = `
                        <tr class="border-b border-gray-200 hover:bg-gray-100 transition duration-150">
                            <td class="py-3 px-6 font-medium">${order.itemName}</td>
                            <td class="py-3 px-6 text-center"><span class="bg-purple-200 text-purple-600 py-1 px-3 rounded-full text-xs">${order.quantity}</span></td>
                            <td class="py-3 px-6 text-center action-col">
                                <button onclick="deleteOrder('${key}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-700 transition">Delete 🗑️</button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="3" class="text-center p-4">No orders found.</td></tr>`;
            }
        });

        // Function: Delete Order
        window.deleteOrder = function(key) {
            if(confirm("Are you sure you want to delete this order?")) {
                const itemRef = ref(db, `orders/${key}`);
                remove(itemRef);
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // PDF Download Function
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById("printArea");
            
            // Hide delete buttons for PDF
            document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');

            const canvas = await html2canvas(element);
            const imgData = canvas.toDataURL('image/png');
            
            const pdf = new jsPDF();
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save("Order-List.pdf");

            // Show delete buttons again
            document.querySelectorAll('.action-col').forEach(el => el.style.display = '');
        }

        // Image Download Function
        function downloadImage() {
            const element = document.getElementById("printArea");
            
            // Hide delete buttons for Image
            document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');

            html2canvas(element).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Order-List.png';
                link.href = canvas.toDataURL();
                link.click();
                
                // Show delete buttons again
                document.querySelectorAll('.action-col').forEach(el => el.style.display = '');
            });
        }
    </script>
</body>
</html>
