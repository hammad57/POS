<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar for a clean look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-indigo-200 shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-800">Order System</h1>
        </div>
        <a href="https://hammad57.github.io/POS/" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Home
        </a>
    </nav>

    <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4">
            <div class="sticky top-24 relative bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 overflow-hidden group transition-all hover:shadow-2xl">
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-[0.08] group-hover:opacity-15 transition-opacity"></div>
                
                <h2 class="text-2xl font-bold text-slate-800 mb-8 flex items-center gap-3 relative z-10">
                    <span class="bg-indigo-600 w-1.5 h-8 rounded-full"></span>
                    New Order
                </h2>
                
                <div class="space-y-6 relative z-10">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Item Name <span class="text-slate-400 font-normal ml-1">(چیز کا نام)</span></label>
                        <div class="relative group/input">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-slate-400 group-focus-within/input:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                            </div>
                            <input type="text" id="itemName" placeholder="e.g. Sugar, Flour" class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 text-sm focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50/50 focus:bg-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Quantity <span class="text-slate-400 font-normal ml-1">(تعداد)</span></label>
                        <div class="relative group/input">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-slate-400 group-focus-within/input:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg>
                            </div>
                            <input type="number" id="itemQty" placeholder="e.g. 10" class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 text-sm focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50/50 focus:bg-white">
                        </div>
                    </div>
                    
                    <button id="saveBtn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transform active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Place Order
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8" id="orderSection">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Order List</h2>
                        <p class="text-slate-400 text-sm mt-1">Manage and export your orders</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                        <button id="deleteSelectedBtn" class="hidden bg-rose-50 text-rose-600 hover:bg-rose-100 px-4 py-2.5 rounded-xl border border-rose-100 transition-all font-semibold text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Delete (<span id="selectedCount">0</span>)
                        </button>
                        <button onclick="downloadImage()" class="bg-slate-50 hover:bg-slate-100 text-slate-700 px-4 py-2.5 rounded-xl border border-slate-200 transition-all font-semibold text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Save Pic
                        </button>
                        <button onclick="downloadPDF()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2.5 rounded-xl border border-indigo-100 transition-all font-semibold text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            PDF
                        </button>
                    </div>
                </div>

                <div id="printArea" class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-xs font-bold tracking-widest">
                                    <th class="py-5 px-6 w-12 text-center action-col">
                                        <input type="checkbox" id="selectAll" class="w-5 h-5 text-indigo-600 rounded-lg border-slate-300 focus:ring-indigo-500 cursor-pointer">
                                    </th>
                                    <th class="py-5 px-6">Item Description</th>
                                    <th class="py-5 px-6 text-center">Qty</th>
                                    <th class="py-5 px-6 text-center action-col">Operations</th>
                                </tr>
                            </thead>
                            <tbody id="orderTableBody" class="text-sm divide-y divide-slate-100">
                                </tbody>
                        </table>
                    </div>
                    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
                        <svg class="animate-spin h-8 w-8 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <p class="font-medium">Syncing with database...</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", 
            projectId: "own-live-steam-web",
            storageBucket: "own-live-steam-web.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const orderListRef = ref(db, 'orders');

        // Professional Toast Config
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2500,
            timerProgressBar: true,
        });

        // Add Order Functionality
        document.getElementById('saveBtn').addEventListener('click', () => {
            const nameInput = document.getElementById('itemName');
            const qtyInput = document.getElementById('itemQty');
            
            if(nameInput.value.trim() === "" || qtyInput.value.trim() === "") { 
                Swal.fire({ 
                    icon: 'warning', 
                    title: 'Missing Info', 
                    text: 'Please enter both item name and quantity.',
                    confirmButtonColor: '#4f46e5',
                    customClass: { popup: 'rounded-3xl' }
                });
                return; 
            }

            push(orderListRef, { itemName: nameInput.value.trim(), quantity: qtyInput.value.trim() })
            .then(() => {
                nameInput.value = '';
                qtyInput.value = '';
                Toast.fire({ icon: 'success', title: 'Order added to list' });
            });
        });

        // Realtime Data Sync
        onValue(orderListRef, (snapshot) => {
            const tableBody = document.getElementById('orderTableBody');
            const loading = document.getElementById('loading');
            tableBody.innerHTML = "";
            loading.style.display = "none";

            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((key) => {
                    const order = data[key];
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50/80 transition-all duration-150 group";
                    row.innerHTML = `
                        <td class="py-4 px-6 text-center action-col">
                            <input type="checkbox" class="order-checkbox w-5 h-5 text-indigo-600 rounded-lg border-slate-300 focus:ring-indigo-500 cursor-pointer" data-id="${key}">
                        </td>
                        <td class="py-4 px-6 font-semibold text-slate-700">${order.itemName}</td>
                        <td class="py-4 px-6 text-center">
                            <span class="bg-indigo-100 text-indigo-700 py-1.5 px-4 rounded-full text-xs font-bold border border-indigo-200">${order.quantity}</span>
                        </td>
                        <td class="py-4 px-6 text-center action-col">
                            <button class="delete-btn text-rose-400 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 p-2 rounded-xl transition-all" data-id="${key}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-20 text-slate-400 text-sm italic">No active orders in the database.</td></tr>`;
            }
            updateDeleteButtonVisibility();
        });

        // Handle Table Actions
        document.getElementById('orderTableBody').addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                const key = deleteBtn.getAttribute('data-id');
                Swal.fire({
                    title: 'Delete Order?',
                    text: "This action cannot be undone.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Delete',
                    customClass: { popup: 'rounded-3xl' }
                }).then((result) => {
                    if (result.isConfirmed) {
                        remove(ref(db, `orders/${key}`));
                        Toast.fire({ icon: 'success', title: 'Removed' });
                    }
                });
            }

            if (e.target.classList.contains('order-checkbox')) {
                updateDeleteButtonVisibility();
                const total = document.querySelectorAll('.order-checkbox').length;
                const checked = document.querySelectorAll('.order-checkbox:checked').length;
                document.getElementById('selectAll').checked = (total === checked && total > 0);
            }
        });

        // Bulk Selection Logic
        document.getElementById('selectAll').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.order-checkbox');
            checkboxes.forEach(cb => cb.checked = e.target.checked);
            updateDeleteButtonVisibility();
        });

        function updateDeleteButtonVisibility() {
            const selectedCount = document.querySelectorAll('.order-checkbox:checked').length;
            const btn = document.getElementById('deleteSelectedBtn');
            const countSpan = document.getElementById('selectedCount');
            if (selectedCount > 0) {
                btn.classList.remove('hidden');
                countSpan.innerText = selectedCount;
            } else {
                btn.classList.add('hidden');
            }
        }

        // Bulk Delete Logic
        document.getElementById('deleteSelectedBtn').addEventListener('click', async () => {
            const selected = document.querySelectorAll('.order-checkbox:checked');
            Swal.fire({
                title: `Delete ${selected.length} orders?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Yes, delete all',
                customClass: { popup: 'rounded-3xl' }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    for (let cb of selected) {
                        await remove(ref(db, `orders/${cb.getAttribute('data-id')}`));
                    }
                    document.getElementById('selectAll').checked = false;
                    Toast.fire({ icon: 'success', title: 'Batch delete complete' });
                }
            });
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById("printArea");
            document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');
            
            const canvas = await html2canvas(element, { scale: 2, backgroundColor: "#ffffff" });
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const imgProps = pdf.getImageProperties(imgData);
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
            pdf.save("Order-List.pdf");
            document.querySelectorAll('.action-col').forEach(el => el.style.display = '');
        }

        function downloadImage() {
            const element = document.getElementById("printArea");
            document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');
            
            html2canvas(element, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Orders-Export.png';
                link.href = canvas.toDataURL();
                link.click();
                document.querySelectorAll('.action-col').forEach(el => el.style.display = '');
            });
        }
    </script>
</body>
</html>
