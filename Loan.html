<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no"> 
    <title>Loan & Debt Manager 3D Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-body: #e0e5ec;
            --container-bg: #f2f5f9;
            --text-color: #2c3e50;
            --shadow-3d: 9px 9px 16px rgba(163,177,198,0.5), -9px -9px 16px rgba(255,255,255, 0.8);
            --border-color: rgba(255, 255, 255, 0.5);
        }

        body { 
            background: var(--bg-body); 
            color: var(--text-color); 
            padding: 20px; 
            font-family: 'Poppins', sans-serif; 
            min-width: 1200px; 
        }
        .main-wrapper { width: 1150px; margin: 0 auto; }
        
        .summary-card { 
            border-radius: 20px; color: white; padding: 25px 15px; margin-bottom: 20px; 
            box-shadow: 0 15px 25px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; height: 140px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .summary-card:hover { transform: translateY(-5px); }
        
        .bg-vault { background: linear-gradient(135deg, #0984e3, #0056b3); }
        .bg-given { background: linear-gradient(135deg, #6a11cb, #2575fc); }
        .bg-taken { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .bg-balance { background: linear-gradient(135deg, #00b09b, #96c93d); }

        .glass-panel { 
            background: var(--container-bg); padding: 30px; border-radius: 25px; 
            box-shadow: var(--shadow-3d); border: 1px solid var(--border-color); 
        }

        .table-custom { border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-3d); margin-top: 20px;}
        .table-custom thead { background: #2c3e50; color: white; }
        .table-custom tbody tr:hover { background: rgba(0,0,0,0.02); }

        .fab-add {
            position: fixed; right: 50px; bottom: 50px; width: 80px; height: 80px;
            border-radius: 50%; background: #0d6efd; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: none; z-index: 1000;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-person-video2 me-2 text-primary"></i>Loan & User Manager</h2>
        <div class="d-flex gap-2">
            <button class="btn btn-dark fw-bold px-4 shadow-sm" onclick="openUserModal()">
                <i class="bi bi-person-plus-fill me-2"></i>Add New User
            </button>
        </div>
    </div>

    <div class="row text-center mb-4">
        <div class="col">
            <div class="summary-card bg-vault">
                <h6>Live Vault Balance</h6>
                <h2 id="bankBalanceDisplay">Rs. 0</h2>
            </div>
        </div>
        <div class="col">
            <div class="summary-card bg-given">
                <h6>Total Given (Lena Hai)</h6>
                <h2 id="totalGiven">0</h2>
            </div>
        </div>
        <div class="col">
            <div class="summary-card bg-taken">
                <h6>Total Taken (Dena Hai)</h6>
                <h2 id="totalTaken">0</h2>
            </div>
        </div>
        <div class="col">
            <div class="summary-card bg-balance">
                <h6>Net Loan Balance</h6>
                <h2 id="netPosition">0</h2>
            </div>
        </div>
    </div>

    <div class="glass-panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="fw-bold m-0"><i class="bi bi-clock-history me-2"></i>Recent Loan Transactions</h4>
            <div class="d-flex gap-2">
                <input type="date" id="filterDate" class="form-control shadow-sm" style="width: 180px;">
                <button class="btn btn-primary shadow-sm" onclick="applyFilter()">Filter</button>
                <button class="btn btn-secondary shadow-sm" onclick="resetFilter()">View All</button>
            </div>
        </div>

        <table class="table table-custom align-middle">
            <thead class="text-center">
                <tr>
                    <th>Date</th>
                    <th>User / Person</th>
                    <th>Entry Type</th>
                    <th>Remarks</th>
                    <th class="text-end">Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="loanTableBody">
                </tbody>
        </table>
    </div>
</div>

<button class="fab-add" onclick="openLoanModal()"><i class="bi bi-plus-lg"></i></button>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header bg-dark text-white" style="border-radius: 20px 20px 0 0;">
                <h5 class="modal-title">Create New Loan User</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <label class="fw-bold mb-1">Person Name</label>
                <input type="text" id="userName" class="form-control mb-3" placeholder="Enter Full Name">
                <button class="btn btn-primary w-100 fw-bold py-2" onclick="saveUser()">Save Person</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="loanModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header bg-primary text-white" style="border-radius: 20px 20px 0 0;">
                <h5 class="modal-title">New Loan/Debt Transaction</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="loanForm">
                    <div class="mb-3">
                        <label class="fw-bold">Select Person</label>
                        <select id="userSelect" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">Transaction Type</label>
                        <select id="loanType" class="form-select" required>
                            <option value="Opening Balance">Opening Balance</option>
                            <option value="Loan Given">Loan Given (Udhaar Diya)</option>
                            <option value="Loan Taken">Loan Taken (Udhaar Liya)</option>
                            <option value="Repayment Received">Repayment Received (Wapsi Mili)</option>
                            <option value="Repayment Paid">Repayment Paid (Wapsi Ki)</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="fw-bold">Date</label><input type="date" id="loanDate" class="form-control" required></div>
                    <div class="mb-3"><label class="fw-bold">Amount</label><input type="number" id="loanAmount" class="form-control" step="0.01" required></div>
                    <div class="mb-4"><label class="fw-bold">Remarks / Details</label><textarea id="loanRemarks" class="form-control" rows="2"></textarea></div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-3">Save Loan Record</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { 
        databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", 
        projectId: "own-live-steam-web" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const uModal = new bootstrap.Modal(document.getElementById('userModal'));
    const lModal = new bootstrap.Modal(document.getElementById('loanModal'));
    let selectedFilterDate = null;

    // --- LIVE SYNC: BANK BALANCE FROM MONEY.HTML ---
    // Money.html bank_transactions node se data fetch karke total balance calculate karna
    onValue(ref(db, 'bank_transactions'), (snapshot) => {
        let total = 0;
        snapshot.forEach((bankNode) => {
            bankNode.forEach((transNode) => {
                const t = transNode.val();
                const amt = parseFloat(t.amount) || 0;
                if (t.type === 'Income' || t.type === 'Adjustment In') total += amt;
                else if (t.type === 'Expense' || t.type === 'Adjustment Out') total -= amt;
            });
        });
        document.getElementById('bankBalanceDisplay').innerText = "Rs. " + total.toLocaleString();
    });

    // --- LOAD USERS ---
    onValue(ref(db, 'loan_users'), (snapshot) => {
        const select = document.getElementById('userSelect');
        select.innerHTML = '<option value="">-- Choose User --</option>';
        snapshot.forEach(child => {
            const user = child.val();
            select.innerHTML += `<option value="${user.name}">${user.name}</option>`;
        });
    });

    // --- LOAD TRANSACTIONS ---
    onValue(ref(db, 'loan_transactions'), (snapshot) => {
        renderTable(snapshot);
    });

    function renderTable(snapshot) {
        const body = document.getElementById('loanTableBody');
        body.innerHTML = '';
        let totalG = 0; // Assets / Lena Hai
        let totalT = 0; // Liabilities / Dena Hai

        const entries = [];
        snapshot.forEach(child => { entries.push({ id: child.key, ...child.val() }); });
        
        // Sorting by Date (Newest first)
        entries.sort((a,b) => new Date(b.date) - new Date(a.date));

        entries.forEach(t => {
            if (selectedFilterDate && t.date !== selectedFilterDate) return;

            // Logic: Given, Repayment Paid (Outflow) are "Lena Hai" / Taken, Received (Inflow) are "Dena Hai"
            const isAsset = (t.type === 'Loan Given' || t.type === 'Repayment Paid' || (t.type === 'Opening Balance' && t.amount > 0));
            const amt = parseFloat(t.amount) || 0;
            
            if (isAsset) totalG += Math.abs(amt);
            else totalT += Math.abs(amt);

            body.innerHTML += `
                <tr>
                    <td class="text-center">${t.date}</td>
                    <td class="fw-bold">${t.user}</td>
                    <td class="text-center"><span class="badge ${isAsset ? 'bg-primary' : 'bg-danger'} shadow-sm">${t.type}</span></td>
                    <td class="small">${t.remarks || '-'}</td>
                    <td class="text-end fw-bold text-${isAsset ? 'primary' : 'danger'}">${amt.toFixed(2)}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteEntry('${t.id}')">
                            <i class="bi bi-trash3-fill"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

        document.getElementById('totalGiven').innerText = totalG.toFixed(2);
        document.getElementById('totalTaken').innerText = totalT.toFixed(2);
        document.getElementById('netPosition').innerText = (totalG - totalT).toFixed(2);
    }

    // --- ACTIONS ---
    window.saveUser = () => {
        const name = document.getElementById('userName').value.trim();
        if (name) {
            push(ref(db, 'loan_users'), { name: name });
            document.getElementById('userName').value = '';
            uModal.hide();
        }
    };

    window.openUserModal = () => uModal.show();
    window.openLoanModal = () => {
        document.getElementById('loanForm').reset();
        document.getElementById('loanDate').value = new Date().toISOString().split('T')[0];
        lModal.show();
    };

    document.getElementById('loanForm').onsubmit = (e) => {
        e.preventDefault();
        const data = {
            user: document.getElementById('userSelect').value,
            type: document.getElementById('loanType').value,
            date: document.getElementById('loanDate').value,
            amount: parseFloat(document.getElementById('loanAmount').value),
            remarks: document.getElementById('loanRemarks').value
        };
        push(ref(db, 'loan_transactions'), data);
        lModal.hide();
    };

    window.deleteEntry = (id) => {
        if (confirm("Kya aap waqai is entry ko delete karna chahte hain?")) {
            remove(ref(db, 'loan_transactions/' + id));
        }
    };

    window.applyFilter = () => {
        selectedFilterDate = document.getElementById('filterDate').value;
        onValue(ref(db, 'loan_transactions'), renderTable, { onlyOnce: true });
    };

    window.resetFilter = () => {
        selectedFilterDate = null;
        document.getElementById('filterDate').value = '';
        onValue(ref(db, 'loan_transactions'), renderTable, { onlyOnce: true });
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
