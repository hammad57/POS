<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no"> 
    <title>Loan & Debt Manager 3D Pro | Sync Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-body: #e0e5ec;
            --container-bg: #f2f5f9;
            --text-color: #2c3e50;
            --shadow-3d: 9px 9px 16px rgba(163,177,198,0.5), -9px -9px 16px rgba(255,255,255, 0.8);
            --border-color: rgba(255, 255, 255, 0.5);
        }

        body { background: var(--bg-body); color: var(--text-color); padding: 20px; font-family: 'Poppins', sans-serif; min-width: 1200px; }
        .main-wrapper { width: 1150px; margin: 0 auto; }
        
        .summary-card { 
            border-radius: 20px; color: white; padding: 25px 15px; margin-bottom: 20px; 
            box-shadow: 0 15px 25px rgba(0,0,0,0.2); transition: 0.3s; height: 140px;
            display: flex; flex-direction: column; justify-content: center;
        }
        
        .bg-vault { background: linear-gradient(135deg, #0984e3, #0056b3); }
        .bg-given { background: linear-gradient(135deg, #6a11cb, #2575fc); }
        .bg-taken { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .bg-balance { background: linear-gradient(135deg, #00b09b, #96c93d); }

        .glass-panel { background: var(--container-bg); padding: 30px; border-radius: 25px; box-shadow: var(--shadow-3d); border: 1px solid var(--border-color); }
        .table-custom { border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-3d); margin-top: 20px; background: white; }
        .table-custom thead { background: #2c3e50; color: white; }

        .fab-add {
            position: fixed; right: 50px; bottom: 50px; width: 80px; height: 80px;
            border-radius: 50%; background: #0d6efd; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: none; z-index: 1000;
        }
        .balance-pill { font-size: 0.85rem; padding: 5px 12px; border-radius: 50px; font-weight: 700; display: inline-block; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-wallet2 me-2 text-primary"></i>Loan Tracking & Ledger</h2>
        <button class="btn btn-dark fw-bold px-4 shadow-sm" onclick="openUserModal()">+ Add New Person</button>
    </div>

    <div class="row text-center mb-4">
        <div class="col"><div class="summary-card bg-vault"><h6>Live Vault Balance</h6><h2 id="bankBalanceDisplay">Rs. 0</h2></div></div>
        <div class="col"><div class="summary-card bg-given"><h6>Total Recoverable (Lena Hai)</h6><h2 id="totalGiven">0</h2></div></div>
        <div class="col"><div class="summary-card bg-taken"><h6>Total Payable (Dena Hai)</h6><h2 id="totalTaken">0</h2></div></div>
        <div class="col"><div class="summary-card bg-balance"><h6>Net Loan Position</h6><h2 id="netPosition">0</h2></div></div>
    </div>

    <div class="glass-panel">
        <h4 class="fw-bold mb-4"><i class="bi bi-journal-text me-2"></i>Detailed Transaction Ledger</h4>
        <table class="table table-custom align-middle">
            <thead class="text-center">
                <tr>
                    <th>Date</th>
                    <th>Person Name</th>
                    <th>Type</th>
                    <th>Remarks</th>
                    <th class="text-end">Amount</th>
                    <th class="text-end">Remaining Balance</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="loanTableBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-add" onclick="openLoanModal()"><i class="bi bi-plus-lg"></i></button>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header"><h5>Create New User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-4">
                <input type="text" id="userName" class="form-control mb-3" placeholder="Enter Full Name">
                <button class="btn btn-primary w-100" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="loanModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header bg-primary text-white"><h5>New Entry & Auto Sync</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-4">
                <form id="loanForm">
                    <div class="mb-3"><label class="fw-bold">Select Person</label><select id="userSelect" class="form-select" required></select></div>
                    <div class="mb-3">
                        <label class="fw-bold">Type</label>
                        <select id="loanType" class="form-select" required onchange="toggleBankSelect()">
                            <option value="Opening Balance">Opening Balance</option>
                            <option value="Loan Given">Loan Given (Lena Hai)</option>
                            <option value="Loan Taken">Loan Taken (Dena Hai)</option>
                            <option value="Repayment Received">Repayment Received (Mili)</option>
                            <option value="Repayment Paid">Repayment Paid (Wapis Ki)</option>
                        </select>
                    </div>
                    <div class="mb-3" id="bankSelectDiv"><label class="fw-bold text-primary">Sync with Bank/Wallet</label><select id="syncBank" class="form-select border-primary"></select></div>
                    <div class="row">
                        <div class="col-6 mb-3"><label class="fw-bold">Date</label><input type="date" id="loanDate" class="form-control" required></div>
                        <div class="col-6 mb-3"><label class="fw-bold">Amount</label><input type="number" id="loanAmount" class="form-control" required></div>
                    </div>
                    <div class="mb-3"><label class="fw-bold">Remarks</label><textarea id="loanRemarks" class="form-control" rows="2"></textarea></div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">Save & Sync</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const uModal = new bootstrap.Modal(document.getElementById('userModal'));
    const lModal = new bootstrap.Modal(document.getElementById('loanModal'));

    // --- LIVE SYNC: BANK BALANCE ---
    onValue(ref(db, 'bank_transactions'), (snap) => {
        let total = 0;
        snap.forEach(b => b.forEach(tNode => {
            const t = tNode.val();
            const amt = parseFloat(t.amount) || 0;
            if (t.type === 'Income' || t.type === 'Adjustment In') total += amt;
            else if (t.type === 'Expense' || t.type === 'Adjustment Out') total -= amt;
        }));
        document.getElementById('bankBalanceDisplay').innerText = "Rs. " + total.toLocaleString();
    });

    onValue(ref(db, 'bank_accounts'), (snap) => {
        const syncBank = document.getElementById('syncBank');
        syncBank.innerHTML = '';
        snap.forEach(child => { syncBank.innerHTML += `<option value="${child.key}">${child.val().name}</option>`; });
    });

    // --- LOAN USERS & LEDGER LOGIC ---
    onValue(ref(db, 'loan_users'), (snap) => {
        const select = document.getElementById('userSelect');
        select.innerHTML = '<option value="">-- Select Person --</option>';
        snap.forEach(c => { select.innerHTML += `<option value="${c.val().name}">${c.val().name}</option>`; });
    });

    onValue(ref(db, 'loan_transactions'), (snapshot) => {
        const body = document.getElementById('loanTableBody');
        body.innerHTML = '';
        let tg = 0, tt = 0;
        const entries = [];
        snapshot.forEach(c => { entries.push({id: c.key, ...c.val()}); });
        
        // Logical Order: Oldest first for calculation
        entries.sort((a,b) => new Date(a.date) - new Date(b.date));

        const userBalances = {};
        const calculatedData = entries.map(t => {
            const amt = parseFloat(t.amount) || 0;
            if (!userBalances[t.user]) userBalances[t.user] = 0;

            if (t.type === 'Loan Given' || t.type === 'Repayment Paid' || (t.type === 'Opening Balance' && amt > 0)) {
                userBalances[t.user] += amt;
            } else {
                userBalances[t.user] -= Math.abs(amt);
            }
            return { ...t, currentRunningBal: userBalances[t.user] };
        });

        // Dashboard Summary
        Object.values(userBalances).forEach(b => { if(b > 0) tg += b; else tt += Math.abs(b); });

        // Table View: Newest First
        calculatedData.reverse().forEach(t => {
            const isLena = t.currentRunningBal >= 0;
            const typeClass = (t.type.includes('Given') || t.type.includes('Paid')) ? 'bg-primary' : 'bg-danger';
            
            body.innerHTML += `
                <tr class="text-center">
                    <td>${t.date}</td>
                    <td class="fw-bold text-start">${t.user}</td>
                    <td><span class="badge ${typeClass}">${t.type}</span></td>
                    <td class="text-muted small">${t.remarks || '-'}</td>
                    <td class="text-end fw-bold">${parseFloat(t.amount).toLocaleString()}</td>
                    <td class="text-end">
                        <span class="balance-pill ${isLena ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                            ${isLena ? 'Lena: ' : 'Dena: '} ${Math.abs(t.currentRunningBal).toLocaleString()}
                        </span>
                    </td>
                    <td><button class="btn btn-sm text-danger border-0" onclick="deleteEntry('${t.id}')"><i class="bi bi-trash3"></i></button></td>
                </tr>`;
        });

        document.getElementById('totalGiven').innerText = tg.toLocaleString();
        document.getElementById('totalTaken').innerText = tt.toLocaleString();
        document.getElementById('netPosition').innerText = (tg - tt).toLocaleString();
    });

    // --- FORM ACTIONS ---
    document.getElementById('loanForm').onsubmit = (e) => {
        e.preventDefault();
        const type = document.getElementById('loanType').value;
        const amt = parseFloat(document.getElementById('loanAmount').value);
        const person = document.getElementById('userSelect').value;
        const date = document.getElementById('loanDate').value;
        const bankId = document.getElementById('syncBank').value;
        const remarks = document.getElementById('loanRemarks').value;

        push(ref(db, 'loan_transactions'), { user: person, type, date, amount: amt, remarks });

        // Sync with Money.html
        let syncAction = "";
        if (type === 'Loan Given' || type === 'Repayment Paid') syncAction = "Adjustment Out";
        else if (type === 'Loan Taken' || type === 'Repayment Received') syncAction = "Adjustment In";

        if (syncAction !== "") {
            push(ref(db, `bank_transactions/${bankId}`), {
                type: syncAction, amount: amt, date, remarks: `Loan Sync: ${type} (${person})`
            });
        }
        lModal.hide();
    };

    window.toggleBankSelect = () => {
        const type = document.getElementById('loanType').value;
        document.getElementById('bankSelectDiv').style.display = (type === 'Opening Balance') ? 'none' : 'block';
    };
    window.saveUser = () => {
        const name = document.getElementById('userName').value;
        if(name) { push(ref(db, 'loan_users'), { name }); uModal.hide(); }
    };
    window.openUserModal = () => uModal.show();
    window.openLoanModal = () => { document.getElementById('loanDate').value = new Date().toISOString().split('T')[0]; lModal.show(); };
    window.deleteEntry = (id) => { if(confirm("Delete this?")) remove(ref(db, 'loan_transactions/'+id)); };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
