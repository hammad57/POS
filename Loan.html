<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no"> 
    <title>Loan & Debt Manager 3D Pro | Sync Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-body: #e0e5ec;
            --container-bg: #f2f5f9;
            --text-color: #2c3e50;
            --shadow-3d: 9px 9px 16px rgba(163,177,198,0.5), -9px -9px 16px rgba(255,255,255, 0.8);
            --border-color: rgba(255, 255, 255, 0.5);
        }

        body { background: var(--bg-body); color: var(--text-color); padding: 20px; font-family: 'Poppins', sans-serif; min-width: 1200px; }
        .main-wrapper { width: 1150px; margin: 0 auto; }
        
        .summary-card { 
            border-radius: 20px; color: white; padding: 25px 15px; margin-bottom: 20px; 
            box-shadow: 0 15px 25px rgba(0,0,0,0.2); transition: 0.3s; height: 140px;
            display: flex; flex-direction: column; justify-content: center;
        }
        
        .bg-vault { background: linear-gradient(135deg, #0984e3, #0056b3); }
        .bg-given { background: linear-gradient(135deg, #6a11cb, #2575fc); }
        .bg-taken { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .bg-balance { background: linear-gradient(135deg, #00b09b, #96c93d); }

        .glass-panel { background: var(--container-bg); padding: 30px; border-radius: 25px; box-shadow: var(--shadow-3d); border: 1px solid var(--border-color); }
        .table-custom { border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-3d); margin-top: 20px; background: white; width: 100%; }
        .table-custom thead { background: #2c3e50; color: white; }

        .history-row { background: #f8f9fa; display: none; }
        .history-table { background: #fff; margin: 10px 0; border: 1px solid #dee2e6; border-radius: 10px; }
        
        .btn-expand { cursor: pointer; transition: 0.3s; color: #0d6efd; font-size: 1.2rem; }
        .btn-expand.active { transform: rotate(45deg); color: #dc3545; }

        .balance-pill { font-size: 0.85rem; padding: 5px 12px; border-radius: 50px; font-weight: 700; display: inline-block; }

        .fab-add {
            position: fixed; right: 50px; bottom: 50px; width: 80px; height: 80px;
            border-radius: 50%; background: #0d6efd; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: none; z-index: 1000;
        }
    </style>
</head>
<body>
<a href="https://hammad57.github.io/POS/index.html" class="top-home-btn" title="Go to Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    Home
</a>

<style>
    .top-home-btn {
        position: fixed;
        top: 20px;
        Right: 20px;
        background: linear-gradient(135deg, #4f46e5, #3b82f6);
        color: #ffffff !important;
        text-decoration: none !important;
        padding: 10px 20px;
        border-radius: 50px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        z-index: 9999;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .top-home-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        background: linear-gradient(135deg, #4338ca, #2563eb);
        color: #ffffff !important;
    }

    .top-home-btn svg {
        width: 18px;
        height: 18px;
    }

    /* Mobile screens ke liye thoda adjust karne ke liye */
    @media (max-width: 768px) {
        .top-home-btn {
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            font-size: 14px;
        }
    }
</style>
<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-person-lines-fill me-2 text-primary"></i>User Loan Ledger</h2>
        <button class="btn btn-dark fw-bold px-4 shadow-sm" onclick="openUserModal()">+ Add New Person</button>
    </div>

    <div class="row text-center mb-4">
        <div class="col"><div class="summary-card bg-vault"><h6>Live Vault Balance</h6><h2 id="bankBalanceDisplay">Rs. 0</h2></div></div>
        <div class="col"><div class="summary-card bg-given"><h6>Lena Hai (Total)</h6><h2 id="totalGiven">0</h2></div></div>
        <div class="col"><div class="summary-card bg-taken"><h6>Dena Hai (Total)</h6><h2 id="totalTaken">0</h2></div></div>
        <div class="col"><div class="summary-card bg-balance"><h6>Net Position</h6><h2 id="netPosition">0</h2></div></div>
    </div>

    <div class="glass-panel">
        <h4 class="fw-bold mb-4"><i class="bi bi-people-fill me-2"></i>Active User Balances</h4>
        <table class="table table-custom align-middle">
            <thead class="text-center">
                <tr>
                    <th style="width: 50px;">View</th>
                    <th class="text-start">Person Name</th>
                    <th>Current Status</th>
                    <th class="text-end">Balance Amount</th>
                </tr>
            </thead>
            <tbody id="userSummaryBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-add" onclick="openLoanModal()"><i class="bi bi-plus-lg"></i></button>

<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius: 20px;"><div class="modal-header"><h5>Add New Person</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="text" id="userName" class="form-control mb-3" placeholder="Full Name"><button class="btn btn-primary w-100" onclick="saveUser()">Save User</button></div></div></div></div>

<div class="modal fade" id="loanModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header bg-primary text-white"><h5>New Entry & Sync</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-4">
                <form id="loanForm">
                    <div class="mb-3"><label class="fw-bold">Select Person</label><select id="userSelect" class="form-select" required></select></div>
                    <div class="mb-3"><label class="fw-bold">Type</label>
                        <select id="loanType" class="form-select" required onchange="toggleBankSelect()">
                            <option value="Opening Balance">Opening Balance</option>
                            <option value="Loan Given">Loan Given (Lena Hai)</option>
                            <option value="Loan Taken">Loan Taken (Dena Hai)</option>
                            <option value="Repayment Received">Repayment Received (Mili)</option>
                            <option value="Repayment Paid">Repayment Paid (Wapis Ki)</option>
                        </select>
                    </div>
                    <div class="mb-3" id="bankSelectDiv"><label class="fw-bold text-primary">Sync with Bank/Wallet</label><select id="syncBank" class="form-select border-primary"></select></div>
                    <div class="row">
                        <div class="col-6 mb-3"><label class="fw-bold">Date</label><input type="date" id="loanDate" class="form-control" required></div>
                        <div class="col-6 mb-3"><label class="fw-bold">Amount</label><input type="number" id="loanAmount" class="form-control" required></div>
                    </div>
                    <div class="mb-3"><label class="fw-bold">Remarks</label><textarea id="loanRemarks" class="form-control" rows="2"></textarea></div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">Save Record</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/", projectId: "own-live-steam-web" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const uModal = new bootstrap.Modal(document.getElementById('userModal'));
    const lModal = new bootstrap.Modal(document.getElementById('loanModal'));

    // --- LIVE BANK SYNC ---
    onValue(ref(db, 'bank_transactions'), (snap) => {
        let total = 0;
        snap.forEach(b => b.forEach(tNode => {
            const t = tNode.val();
            const amt = parseFloat(t.amount) || 0;
            if (t.type === 'Income' || t.type === 'Adjustment In') total += amt;
            else if (t.type === 'Expense' || t.type === 'Adjustment Out') total -= amt;
        }));
        document.getElementById('bankBalanceDisplay').innerText = "Rs. " + total.toLocaleString();
    });

    onValue(ref(db, 'bank_accounts'), (snap) => {
        const syncBank = document.getElementById('syncBank');
        syncBank.innerHTML = '';
        snap.forEach(child => { syncBank.innerHTML += `<option value="${child.key}">${child.val().name}</option>`; });
    });

    // --- MAIN LOGIC ---
    onValue(ref(db, 'loan_users'), (snap) => {
        const select = document.getElementById('userSelect');
        select.innerHTML = '<option value="">-- Select Person --</option>';
        snap.forEach(c => { select.innerHTML += `<option value="${c.val().name}">${c.val().name}</option>`; });
    });

    onValue(ref(db, 'loan_transactions'), (snapshot) => {
        const body = document.getElementById('userSummaryBody');
        body.innerHTML = '';
        let totalG = 0, totalT = 0;
        
        const allTransactions = [];
        snapshot.forEach(c => { allTransactions.push({id: c.key, ...c.val()}); });
        
        // Grouping by User
        const groups = {};
        allTransactions.forEach(t => {
            if (!groups[t.user]) groups[t.user] = [];
            groups[t.user].push(t);
        });

        Object.keys(groups).forEach((userName, index) => {
            const userHistory = groups[userName].sort((a,b) => new Date(b.date) - new Date(a.date));
            let balance = 0;
            
            userHistory.forEach(t => {
                const amt = parseFloat(t.amount) || 0;
                if (t.type === 'Loan Given' || t.type === 'Repayment Paid' || (t.type === 'Opening Balance' && amt > 0)) balance += amt;
                else balance -= Math.abs(amt);
            });

            if(balance > 0) totalG += balance; else totalT += Math.abs(balance);
            const isLena = balance >= 0;

            // Row Generation
            body.innerHTML += `
                <tr class="text-center">
                    <td><i class="bi bi-plus-circle-fill btn-expand" onclick="toggleHistory('row-${index}', this)"></i></td>
                    <td class="text-start fw-bold">${userName}</td>
                    <td><span class="badge ${isLena ? 'bg-primary' : 'bg-danger'}">${isLena ? 'Lena Hai' : 'Dena Hai'}</span></td>
                    <td class="text-end fw-bold">Rs. ${Math.abs(balance).toLocaleString()}</td>
                </tr>
                <tr id="row-${index}" class="history-row">
                    <td colspan="4" class="p-3">
                        <div class="table-responsive">
                            <table class="table table-sm history-table align-middle">
                                <thead class="table-light">
                                    <tr class="text-center"><th>Date</th><th>Type</th><th>Remarks</th><th class="text-end">Amount</th><th>Action</th></tr>
                                </thead>
                                <tbody>
                                    ${userHistory.map(h => `
                                        <tr class="text-center">
                                            <td>${h.date}</td>
                                            <td><small class="badge bg-secondary">${h.type}</small></td>
                                            <td class="small">${h.remarks || '-'}</td>
                                            <td class="text-end fw-bold">${parseFloat(h.amount).toLocaleString()}</td>
                                            <td><button class="btn btn-sm text-danger" onclick="deleteEntry('${h.id}')"><i class="bi bi-trash"></i></button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </td>
                </tr>
            `;
        });

        document.getElementById('totalGiven').innerText = totalG.toLocaleString();
        document.getElementById('totalTaken').innerText = totalT.toLocaleString();
        document.getElementById('netPosition').innerText = (totalG - totalT).toLocaleString();
    });

    window.toggleHistory = (rowId, btn) => {
        const row = document.getElementById(rowId);
        const isHidden = row.style.display === 'none' || row.style.display === '';
        row.style.display = isHidden ? 'table-row' : 'none';
        btn.classList.toggle('active', isHidden);
        btn.classList.toggle('bi-plus-circle-fill', !isHidden);
        btn.classList.toggle('bi-dash-circle-fill', isHidden);
    };

    document.getElementById('loanForm').onsubmit = (e) => {
        e.preventDefault();
        const type = document.getElementById('loanType').value;
        const amt = parseFloat(document.getElementById('loanAmount').value);
        const person = document.getElementById('userSelect').value;
        const date = document.getElementById('loanDate').value;
        const bankId = document.getElementById('syncBank').value;
        const remarks = document.getElementById('loanRemarks').value;

        push(ref(db, 'loan_transactions'), { user: person, type, date, amount: amt, remarks });

        let syncAction = (type === 'Loan Given' || type === 'Repayment Paid') ? "Adjustment Out" : 
                         (type === 'Loan Taken' || type === 'Repayment Received') ? "Adjustment In" : "";

        if (syncAction !== "") {
            push(ref(db, `bank_transactions/${bankId}`), { type: syncAction, amount: amt, date, remarks: `Loan Sync: ${type} (${person})` });
        }
        lModal.hide();
    };

    window.toggleBankSelect = () => { document.getElementById('bankSelectDiv').style.display = (document.getElementById('loanType').value === 'Opening Balance') ? 'none' : 'block'; };
    window.saveUser = () => { if(document.getElementById('userName').value) { push(ref(db, 'loan_users'), { name: document.getElementById('userName').value }); uModal.hide(); } };
    window.openUserModal = () => uModal.show();
    window.openLoanModal = () => { document.getElementById('loanDate').value = new Date().toISOString().split('T')[0]; toggleBankSelect(); lModal.show(); };
    window.deleteEntry = (id) => { if(confirm("Delete this?")) remove(ref(db, 'loan_transactions/'+id)); };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
