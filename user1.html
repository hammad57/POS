<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Tour Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #map { position:absolute; top:0; left:0; right:0; bottom:0; z-index:1; }
  #topbar {
    position:absolute; top:0; left:0; right:0; z-index:10;
    background:rgba(20,30,48,.92); color:#fff; padding:10px 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  #topbar h1 { font-size:17px; font-weight:700; }
  #topbar h1 span { color:#4fc3f7; }
  #stats { font-size:12px; opacity:.9; text-align:right; line-height:1.5; }
  #controls {
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:8px;
    background:linear-gradient(transparent, rgba(0,0,0,.55));
  }
  .btn {
    flex:1; border:none; border-radius:14px; padding:14px 4px;
    font-size:15px; font-weight:700; color:#fff; cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
  }
  .btn:active { transform:scale(.96); }
  .btn:disabled { opacity:.45; }
  #btnStart { background:#2e7d32; }
  #btnStart.stop { background:#c62828; }
  #btnMark { background:#ef6c00; }
  #btnHistory { background:#1565c0; flex:0.7; }
  #status {
    position:absolute; top:58px; left:50%; transform:translateX(-50%); z-index:10;
    background:rgba(0,0,0,.75); color:#fff; font-size:13px;
    padding:7px 14px; border-radius:20px; display:none; max-width:92%;
    text-align:center;
  }
  #historyPanel {
    position:absolute; top:0; right:-85%; width:85%; max-width:340px; height:100%;
    background:#fff; z-index:20; transition:right .25s ease;
    display:flex; flex-direction:column; box-shadow:-3px 0 12px rgba(0,0,0,.3);
  }
  #historyPanel.open { right:0; }
  #historyPanel header {
    background:#1565c0; color:#fff; padding:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #historyPanel header h2 { font-size:16px; }
  #closeHist { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
  #histList { flex:1; overflow-y:auto; }
  .tour-item { padding:13px 14px; border-bottom:1px solid #eee; cursor:pointer; }
  .tour-item:active { background:#f0f7ff; }
  .tour-item .t-name { font-weight:700; font-size:14px; }
  .tour-item .t-meta { font-size:12px; color:#666; margin-top:3px; }
  .tour-item .t-del { float:right; color:#c62828; font-size:13px; padding:4px 8px; }
  .empty { padding:30px 20px; text-align:center; color:#888; font-size:14px; }
  #overlay {
    position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:15; display:none;
  }
  #overlay.show { display:block; }
  .mark-label {
    background:#fff; border:2px solid #ef6c00; border-radius:8px;
    padding:2px 7px; font-size:12px; font-weight:700; color:#333;
    white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  .leaflet-container { font-family:inherit; }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>🗺️ Tour <span>Tracker</span></h1>
  <div id="stats">📍 --<br>⏱️ --</div>
</div>
<div id="status"></div>

<div id="controls">
  <button class="btn" id="btnStart">▶ Start</button>
  <button class="btn" id="btnMark" disabled>⭐ Add Mark</button>
  <button class="btn" id="btnHistory">🕘 History</button>
</div>

<div id="overlay"></div>
<aside id="historyPanel">
  <header>
    <h2>🕘 Saved Tours</h2>
    <button id="closeHist">✕</button>
  </header>
  <div id="histList"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  // ---------- State ----------
  var tracking = false;
  var watchId = null;
  var routePts = [];        // [lat,lng]
  var marks = [];           // {lat,lng,name}
  var startTime = null;
  var timerInt = null;
  var wakeLock = null;
  var lastPt = null;
  var totalDist = 0;

  // ---------- Map ----------
  var map = L.map('map', { zoomControl:false }).setView([31.5204, 74.3587], 13);
  L.control.zoom({ position:'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution:'© OpenStreetMap'
  }).addTo(map);

  var routeLine = L.polyline([], { color:'#1976d2', weight:6, opacity:.9 }).addTo(map);
  var markLayer = L.layerGroup().addTo(map);
  var meMarker = null;

  var starIcon = L.divIcon({
    className:'', html:'<div style="font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))">⭐</div>',
    iconSize:[30,30], iconAnchor:[15,28]
  });

  // ---------- Helpers ----------
  function $(id){ return document.getElementById(id); }
  function toast(msg, ms){
    var s = $('status'); s.textContent = msg; s.style.display='block';
    clearTimeout(s._t); s._t = setTimeout(function(){ s.style.display='none'; }, ms||2500);
  }
  function fmtTime(sec){
    var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function fmtDist(m){
    return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km';
  }
  function distM(a,b){
    var R=6371000, dLa=(b[0]-a[0])*Math.PI/180, dLo=(b[1]-a[1])*Math.PI/180;
    var la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
    var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }

  // ---------- Wake lock (screen on rahe) ----------
  function lockScreen(){
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(l){
        wakeLock=l; toast('🔒 Screen on rahegi jab tak tour chale');
      }).catch(function(){});
    }
  }
  function unlockScreen(){
    if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock=null; }
  }

  // ---------- GPS ----------
  function onPos(p){
    var pt=[p.coords.latitude, p.coords.longitude];
    if(meMarker){ meMarker.setLatLng(pt); }
    else { meMarker=L.marker(pt).addTo(map); map.setView(pt,16); }
    if(!tracking) return;
    if(lastPt && distM(lastPt,pt) < 5) return; // 5m se kam movement ignore
    if(lastPt) totalDist += distM(lastPt,pt);
    lastPt=pt;
    routePts.push(pt);
    routeLine.setLatLngs(routePts);
    map.panTo(pt);
    updateStats();
  }
  function onErr(e){
    var m='GPS error';
    if(e.code===1) m='❌ Location permission nahi mili. Browser settings mein allow karein.';
    else if(e.code===2) m='❌ Location nahi mil rahi. GPS on karein.';
    else if(e.code===3) m='⏳ GPS signal ka intezar...';
    toast(m, 3500);
  }
  function updateStats(){
    var sec = startTime ? Math.floor((Date.now()-startTime)/1000) : 0;
    $('stats').innerHTML='📍 '+fmtDist(totalDist)+'<br>⏱️ '+fmtTime(sec);
  }

  // ---------- Buttons ----------
  $('btnStart').onclick=function(){
    if(!tracking){
      if(!('geolocation' in navigator)){ toast('❌ Is browser mein GPS support nahi.'); return; }
      // pehle aik current position lo taake map center ho
      navigator.geolocation.getCurrentPosition(function(p){
        map.setView([p.coords.latitude,p.coords.longitude],16);
      }, onErr, {enableHighAccuracy:true, timeout:15000});
      tracking=true; routePts=[]; marks=[]; totalDist=0; lastPt=null;
      startTime=Date.now();
      routeLine.setLatLngs([]); markLayer.clearLayers();
      watchId=navigator.geolocation.watchPosition(onPos,onErr,
        {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
      timerInt=setInterval(updateStats,1000);
      lockScreen();
      var b=$('btnStart'); b.textContent='⏹ Finish Tour'; b.classList.add('stop');
      $('btnMark').disabled=false;
      toast('🟢 Tracking shuru! Safar ki lakeer banti jayegi.');
    } else {
      finishTour();
    }
  };

  $('btnMark').onclick=function(){
    if(!tracking || !lastPt){ toast('Pehle Start dabayein aur GPS ka intezar karein.'); return; }
    var name=prompt('Is jagah ka naam likhein:', '');
    if(name===null) return;
    name=(name||'').trim()||'Mark '+(marks.length+1);
    var mk={lat:lastPt[0], lng:lastPt[1], name:name};
    marks.push(mk); drawMark(mk);
    toast('⭐ "'+name+'" save ho gaya!');
  };

  function drawMark(mk){
    L.marker([mk.lat,mk.lng],{icon:starIcon}).addTo(markLayer)
      .bindTooltip(mk.name,{permanent:true,direction:'top',offset:[0,-28],className:'mark-label'});
  }

  function finishTour(){
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    clearInterval(timerInt); unlockScreen(); tracking=false;
    var b=$('btnStart'); b.textContent='▶ Start'; b.classList.remove('stop');
    $('btnMark').disabled=true;
    if(routePts.length<2 && marks.length===0){
      toast('Koi safar record nahi hua — save nahi kiya.');
      return;
    }
    var d=new Date();
    var name='Tour '+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    var tour={ id:Date.now(), name:name,
      date:d.toLocaleString(), dist:Math.round(totalDist),
      dur:Math.floor((Date.now()-startTime)/1000),
      pts:routePts, marks:marks };
    var all=getTours(); all.unshift(tour); saveTours(all);
    toast('💾 "'+name+'" save ho gaya!');
  }

  // ---------- History (localStorage) ----------
  function getTours(){
    try{ return JSON.parse(localStorage.getItem('tt_tours')||'[]'); }catch(e){ return []; }
  }
  function saveTours(t){
    try{ localStorage.setItem('tt_tours', JSON.stringify(t)); }catch(e){ toast('❌ Save nahi ho saka (storage full).'); }
  }
  function openHistory(){
    renderHist();
    $('historyPanel').classList.add('open'); $('overlay').classList.add('show');
  }
  function closeHistory(){
    $('historyPanel').classList.remove('open'); $('overlay').classList.remove('show');
  }
  function renderHist(){
    var list=$('histList'), tours=getTours();
    if(!tours.length){ list.innerHTML='<div class="empty">Abhi koi tour save nahi.<br>Start daba kar pehla tour banayein! 🗺️</div>'; return; }
    list.innerHTML='';
    tours.forEach(function(t){
      var div=document.createElement('div'); div.className='tour-item';
      div.innerHTML='<span class="t-del" data-id="'+t.id+'">🗑</span>'+
        '<div class="t-name">'+escapeHtml(t.name)+'</div>'+
        '<div class="t-meta">📍 '+fmtDist(t.dist)+' &nbsp; ⏱️ '+fmtTime(t.dur)+
        ' &nbsp; ⭐ '+(t.marks?t.marks.length:0)+'<br>'+escapeHtml(t.date||'')+'</div>';
      div.onclick=function(e){
        if(e.target.classList.contains('t-del')){
          e.stopPropagation();
          if(confirm('Ye tour delete kar dein?')){
            saveTours(getTours().filter(function(x){return x.id!==t.id;}));
            renderHist();
          }
          return;
        }
        showTour(t); closeHistory();
      };
      list.appendChild(div);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showTour(t){
    routeLine.setLatLngs(t.pts||[]); markLayer.clearLayers();
    (t.marks||[]).forEach(drawMark);
    if(t.pts && t.pts.length){ map.fitBounds(L.latLngBounds(t.pts), {padding:[40,40]}); }
    toast('🗺️ "'+t.name+'" — '+fmtDist(t.dist)+', '+fmtTime(t.dur));
  }

  $('btnHistory').onclick=openHistory;
  $('closeHist').onclick=closeHistory;
  $('overlay').onclick=closeHistory;

  // ---------- Init: GPS permission hint ----------
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(function(p){
      map.setView([p.coords.latitude,p.coords.longitude],15);
      meMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map);
    }, function(){}, {timeout:10000});
  }
})();
</script>
</body>
</html>
