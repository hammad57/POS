<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, push } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // Apki di gayi Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web-default.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/",
            projectId: "own-live-steam-web-default",
            storageBucket: "own-live-steam-web-default.appspot.com",
            messagingSenderId: "xxxxxxxxxxx",
            appId: "xxxxxxxxxxx"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Global Variables
        let currentUser = null;
        let currentCoin = "BNBUSDT"; 

        // --- 1. Auth & Dashboard State ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadUserData(user.uid);
                loadBinanceCoins();
                loadTradingViewGraph(currentCoin);
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        });

        // --- 2. Load Binance Coins ---
        async function loadBinanceCoins() {
            try {
                let res = await fetch("https://api.binance.com/api/v3/ticker/price");
                let data = await res.json();
                let select = document.getElementById('coin-select');
                
                // Sirf USDT pairs show krny k leye (ta k samajhna asan ho)
                let usdtPairs = data.filter(coin => coin.symbol.endsWith('USDT'));
                
                usdtPairs.forEach(coin => {
                    let option = document.createElement('option');
                    option.value = coin.symbol;
                    option.text = `${coin.symbol} - $${parseFloat(coin.price).toFixed(4)}`;
                    select.appendChild(option);
                });

                select.addEventListener('change', (e) => {
                    currentCoin = e.target.value;
                    loadTradingViewGraph(currentCoin);
                });
            } catch (error) {
                console.error("Binance API Error", error);
            }
        }

        // --- 3. TradingView Graph (Professional Realtime Graph) ---
        window.loadTradingViewGraph = function(symbol) {
            document.getElementById('tv_chart_container').innerHTML = ""; // Clear old graph
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:" + symbol,
                "interval": "15",
                "timezone": "Asia/Karachi",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "container_id": "tv_chart_container"
            });
        }

        // --- 4. Buy / Convert Package Logic ---
        window.buyCoin = async function() {
            if(!currentUser) return;
            const coinPriceRes = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${currentCoin}`);
            const coinData = await coinPriceRes.json();
            const currentPrice = parseFloat(coinData.price);

            const userRef = ref(db, 'users/' + currentUser.uid);
            const snapshot = await get(userRef);
            let userData = snapshot.val();

            let fee = 0;
            // Agar first time nhi hy, to thori fee charge kro (e.g., $1 ya % k hisaab sy)
            if(userData.hasPurchasedBefore) {
                fee = 1.0; // $1 fee deduction
            }

            if (userData.balance >= (currentPrice + fee)) {
                // Update Balance aur Portfolio Firebase main
                await update(userRef, {
                    balance: userData.balance - (currentPrice + fee),
                    hasPurchasedBefore: true
                });
                alert(`${currentCoin} Bought! Fee applied: $${fee}`);
                loadUserData(currentUser.uid); // Refresh UI
            } else {
                alert("Insufficient Balance!");
            }
        }

        // --- 5. Withdrawal Request ---
        window.requestWithdrawal = async function() {
            let amount = prompt("Withdrawal Amount Enter Krain:");
            if(amount && !isNaN(amount)) {
                let withdrawRef = push(ref(db, 'withdrawals'));
                await set(withdrawRef, {
                    uid: currentUser.uid,
                    amount: parseFloat(amount),
                    status: "pending",
                    timestamp: Date.now()
                });

                // Deduct from user balance temporarily
                const userRef = ref(db, 'users/' + currentUser.uid);
                const snapshot = await get(userRef);
                await update(userRef, { balance: snapshot.val().balance - parseFloat(amount) });

                // WhatsApp Redirect
                let message = `Hello Admin, meri withdrawal request approve kr dain.\nUser ID: ${currentUser.uid}\nAmount: $${amount}`;
                let whatsappUrl = `https://wa.me/923423944508?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
            }
        }

        // Dummy Data Loader for UI
        function loadUserData(uid) {
            get(ref(db, 'users/' + uid)).then((snapshot) => {
                if(snapshot.exists()) {
                    document.getElementById('user-balance').innerText = "$" + parseFloat(snapshot.val().balance).toFixed(2);
                }
            });
        }
    </script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Authentication Section -->
    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-4">
        <h1 class="text-3xl font-bold mb-6 text-blue-400">CryptoTrade</h1>
        <!-- Add your HTML Login/Register Inputs here -->
        <button class="bg-blue-600 px-6 py-2 rounded mt-4">Login (Implement UI)</button>
    </div>

    <!-- Main Dashboard Section -->
    <div id="dashboard-section" class="hidden flex flex-col h-screen">
        <!-- Header -->
        <div class="flex justify-between items-center p-4 bg-gray-800 shadow">
            <h2 class="font-bold text-xl">Balance: <span id="user-balance" class="text-green-400">$0.00</span></h2>
            <a href="https://wa.me/923423944508" target="_blank" class="text-green-500 underline text-sm">Help (WhatsApp)</a>
        </div>

        <!-- Coin Selector -->
        <div class="p-4">
            <label class="block text-sm mb-2">Select Coin (Live Binance Data):</label>
            <select id="coin-select" class="w-full bg-gray-800 text-white p-2 rounded border border-gray-700"></select>
        </div>

        <!-- TradingView Graph Container -->
        <div id="tv_chart_container" class="flex-grow w-full"></div>

        <!-- Action Buttons -->
        <div class="p-4 grid grid-cols-2 gap-4 bg-gray-800">
            <button onclick="buyCoin()" class="bg-green-600 hover:bg-green-500 p-3 rounded font-bold">Buy / Convert</button>
            <button onclick="requestWithdrawal()" class="bg-red-600 hover:bg-red-500 p-3 rounded font-bold">Withdraw</button>
        </div>
    </div>

</body>
</html>
