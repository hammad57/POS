<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Admin - Crypto Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pulse-soft {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <!-- MAIN CONTENT -->
    <main class="max-w-md mx-auto">
        
        <!-- REALTIME CRYPTO BALANCING CARD -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-slate-800">Crypto Portfolio Tracker</h3>
                <span class="text-[10px] text-emerald-600 font-bold bg-emerald-100 px-2 py-0.5 rounded-full pulse-soft flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> Live
                </span>
            </div>

            <!-- Dropdown Selector -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">Coin Select Karein:</label>
                <select id="cryptoCoinSelect" onchange="updateCryptoPortfolioUI()" class="w-full rounded-xl px-3 py-2.5 text-sm font-bold text-slate-700 bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all">
                    <option value="BTCUSDT">Bitcoin (BTC)</option>
                    <option value="ETHUSDT">Ethereum (ETH)</option>
                    <option value="BNBUSDT">BNB Chain (BNB)</option>
                    <option value="SOLUSDT">Solana (SOL)</option>
                </select>
            </div>

            <!-- Dynamic Metrics -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-[10px] text-slate-400 font-semibold uppercase block mb-1">Current Rate</span>
                    <span id="lblCryptoCurrentRate" class="text-base font-extrabold text-slate-800 font-mono">Loading...</span>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-[10px] text-slate-400 font-semibold uppercase block mb-1">Current Value</span>
                    <span id="lblCryptoTotalValue" class="text-base font-extrabold text-slate-800 font-mono">Loading...</span>
                </div>
            </div>

            <!-- Profit / Loss Box -->
            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500">Daily P&L:</span>
                <span id="lblCryptoPNL" class="text-xs font-black text-slate-400">Wait...</span>
            </div>
        </div>

    </main>

    <!-- REALTIME JAVASCRIPT ENGINE -->
    <script>
        // Dummy data: Firebase Database se connect karne se pehle ye test values use hongi
        const userCryptoHoldings = {
            'BTCUSDT': { quantity: 0.005, buyPrice: 62000 },
            'ETHUSDT': { quantity: 0.15, buyPrice: 2600 },
            'BNBUSDT': { quantity: 1.2, buyPrice: 540 },
            'SOLUSDT': { quantity: 2.5, buyPrice: 135 }
        };

        let binanceLivePrices = {};
        let binanceWS = null;

        function connectBinanceWebSocket() {
            // Un coins ka stream URL banayein jo track karne hain
            const streams = ['btcusdt@ticker', 'ethusdt@ticker', 'bnbusdt@ticker', 'solusdt@ticker'].join('/');
            const socketUrl = `wss://stream.binance.com:9443/ws/${streams}`;

            binanceWS = new WebSocket(socketUrl);

            binanceWS.onopen = () => {
                console.log("Binance Live Stream Connected");
            };

            binanceWS.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data && data.s && data.c) {
                    const pairSymbol = data.s;           // Example: BTCUSDT
                    const currentPrice = parseFloat(data.c); // Example: 64500.50
                    
                    // Naya rate save karein
                    binanceLivePrices[pairSymbol] = currentPrice;
                    
                    // Agar yehi coin select hua hai, toh screen update karein
                    const currentSelected = document.getElementById('cryptoCoinSelect').value;
                    if (currentSelected === pairSymbol) {
                        updateCryptoPortfolioUI();
                    }
                }
            };

            binanceWS.onerror = (err) => {
                console.error("Binance WebSocket Error:", err);
            };

            binanceWS.onclose = () => {
                console.log("Disconnected. Reconnecting in 3 seconds...");
                setTimeout(connectBinanceWebSocket, 3000); // Auto-reconnect on disconnect
            };
        }

        function updateCryptoPortfolioUI() {
            const selectEl = document.getElementById('cryptoCoinSelect');
            if (!selectEl) return;

            const selectedSymbol = selectEl.value;
            const livePrice = binanceLivePrices[selectedSymbol] || 0;
            const holding = userCryptoHoldings[selectedSymbol] || { quantity: 0, buyPrice: 0 };

            // Agar data abhi nahi aaya toh exit karein
            if (livePrice === 0) return;

            // 1. Update Current Rate
            document.getElementById('lblCryptoCurrentRate').innerText = `$${livePrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            // 2. Calculate Values
            const currentValue = holding.quantity * livePrice;
            const initialInvestment = holding.quantity * holding.buyPrice;
            const profitLoss = currentValue - initialInvestment;
            const pnlPercentage = initialInvestment > 0 ? (profitLoss / initialInvestment) * 100 : 0;

            // 3. Update Total Value
            document.getElementById('lblCryptoTotalValue').innerText = `$${currentValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            // 4. Update Profit/Loss styling
            const pnlEl = document.getElementById('lblCryptoPNL');
            const formatPnl = Math.abs(profitLoss).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            if (profitLoss >= 0) {
                pnlEl.innerText = `+$${formatPnl} (+${pnlPercentage.toFixed(2)}%)`;
                pnlEl.className = 'text-xs font-black text-emerald-700 bg-emerald-100 px-3 py-1.5 rounded-lg';
            } else {
                pnlEl.innerText = `-$${formatPnl} (${pnlPercentage.toFixed(2)}%)`;
                pnlEl.className = 'text-xs font-black text-red-600 bg-red-100 px-3 py-1.5 rounded-lg';
            }
        }

        // Script start hone par WebSocket ko chalu karein
        document.addEventListener('DOMContentLoaded', () => {
            connectBinanceWebSocket();
        });
    </script>
</body>
</html>
