<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no"> 
    <title>Muluk Hussain - Professional Financial Tracker 3D</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-body: #e0e5ec;
            --container-bg: #f2f5f9;
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: rgba(255, 255, 255, 0.5);
            --shadow-3d: 9px 9px 16px rgba(163,177,198,0.5), -9px -9px 16px rgba(255,255,255, 0.8);
            --table-header-bg: #2c3e50;
            --table-header-text: #ffffff;
            --input-bg: #ffffff;
            --input-text: #333333;
        }

        html[data-theme="dark"] {
            --bg-body: #121212;
            --container-bg: #1e1e24;
            --text-color: #f5f6fa;
            --text-muted: #a4b0be;
            --border-color: #2b2b36;
            --shadow-3d: 8px 8px 15px #0a0a0c, -8px -8px 15px #2a2a32;
            --table-header-bg: #0f3460;
            --table-header-text: #e9ecef;
            --input-bg: #2b2b36;
            --input-text: #ffffff;
        }

        html[data-theme="glass"] {
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.2);
            --table-header-bg: rgba(0, 0, 0, 0.3);
            --input-bg: rgba(255, 255, 255, 0.2);
        }

        body { background: var(--bg-body); color: var(--text-color); padding: 20px; font-family: 'Poppins', sans-serif; min-width: 1200px; transition: all 0.4s ease; }
        .main-wrapper { width: 1150px; margin: 0 auto; }
        
        .summary-card { border-radius: 20px; color: white; padding: 25px 15px; margin-bottom: 20px; box-shadow: 0 15px 25px rgba(0,0,0,0.2); transition: 0.3s; }
        .bg-income { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-expense { background: linear-gradient(135deg, #cb2d3e, #ef473a); }
        .bg-profit { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .bg-today { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        
        .chart-container { background: var(--container-bg); padding: 35px; border-radius: 25px; box-shadow: var(--shadow-3d); border: 1px solid var(--border-color); margin-top: 20px; }

        .table-custom { border-collapse: separate; border-radius: 15px; box-shadow: var(--shadow-3d); width: 100%; overflow: hidden; }
        .table-custom thead th { background-color: var(--table-header-bg) !important; color: var(--table-header-text) !important; padding: 15px; }
        .table-custom tbody td { background-color: var(--input-bg) !important; border-color: var(--border-color); color: var(--text-color); padding: 12px; }

        .fab-add { position: fixed; right: 50px; bottom: 50px; width: 80px; height: 80px; border-radius: 50%; background: #0d6efd; color: white; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4); border: none; z-index: 1000; }
        
        .form-control { background: var(--input-bg); color: var(--input-text); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
        .form-locked { background: rgba(128, 128, 128, 0.1) !important; cursor: not-allowed; font-weight: bold; }

        .modal-content { background: var(--container-bg); border-radius: 25px; border: 1px solid var(--border-color); color: var(--text-color); }

        /* Calculator Styles */
        .calc-btn-trigger { cursor: pointer; color: #0d6efd; font-size: 1.3rem; transition: 0.3s; margin-left: 10px; }
        .calc-btn-trigger:hover { transform: scale(1.2); color: #0056b3; }
        .sys-calc-btn { color: #6c757d; }
        .sys-calc-btn:hover { color: #343a40; }
        
        #calculatorModal .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 320px;
            margin: auto;
        }
        .calc-display {
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-family: monospace;
            min-height: 60px;
            word-wrap: break-word;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn-calc {
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transition: 0.2s;
        }
        .btn-calc:hover { background: rgba(255, 255, 255, 0.25); }
        .btn-op { background: rgba(255, 159, 67, 0.3); }
        .btn-eq { background: #0d6efd; grid-column: span 2; }

        .top-home-btn {
            position: fixed; top: 20px; left: 20px; background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #ffffff !important; text-decoration: none !important; padding: 10px 20px; border-radius: 50px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 600; font-size: 15px;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); z-index: 9999;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .top-home-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6); }
    </style>
</head>
<body>

<a href="https://hammad57.github.io/POS/index.html" class="top-home-btn" title="Go to Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    Home
</a>

<button class="fab-add" onclick="openModal()"><i class="bi bi-plus-lg"></i></button>

<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0"><i class="bi bi-cpu me-2 text-primary"></i>Muluk Hussain Analytics</h2>
            <p class="text-muted small m-0">Smart Financial Management System v4.0</p>
        </div>
        <div class="d-flex gap-3">
            <select id="appTheme" class="form-select border-0 shadow-sm fw-bold" style="width: 180px;" onchange="saveTheme()">
                <option value="light">☀️ Light Theme</option>
                <option value="dark">🌙 Dark Theme</option>
                <option value="glass">🧊 Glassmorphism</option>
            </select>
        </div>
    </div>

    <div class="row text-center mb-2">
        <div class="col"><div class="summary-card bg-income"><h6>Total Income</h6><h2 id="totalIncVal">0</h2></div></div>
        <div class="col"><div class="summary-card bg-expense"><h6>Total Expense</h6><h2 id="totalExpVal">0</h2></div></div>
        <div class="col"><div class="summary-card bg-profit"><h6>Current Balance</h6><h2 id="balanceVal">0</h2></div></div>
        <div class="col"><div class="summary-card bg-today"><h6>Today Profit</h6><h2 id="todayProfitVal">0</h2></div></div>
    </div>

    <div class="chart-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="btn-group shadow-sm">
                <button class="btn btn-primary" onclick="toggleChartType('bar')">Bar Chart</button>
                <button class="btn btn-outline-primary" onclick="toggleChartType('line')">Flow Chart</button>
                <button class="btn btn-outline-dark ms-2" onclick="exportPDF()">Export PDF</button>
            </div>
            <div class="d-flex align-items-center gap-2">
                <input type="date" id="fromDate" class="form-control form-control-sm">
                <input type="date" id="toDate" class="form-control form-control-sm">
                <button class="btn btn-dark btn-sm px-3" onclick="applyFilter()">Filter</button>
                <button class="btn btn-secondary btn-sm" onclick="resetFilter()">Reset</button>
            </div>
        </div>

        <div id="chartBox" style="height: 350px; width: 100%;">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="table-responsive mt-5">
            <table class="table table-custom align-middle" id="summaryTable">
                <thead>
                    <tr>
                        <th class="text-center">Date</th>
                        <th class="text-center">Opening Bal</th>
                        <th class="text-center">Income (+)</th>
                        <th class="text-center">Mid Balance</th>
                        <th class="text-center">Expense (-)</th>
                        <th class="text-center">Final Balance</th>
                        <th class="text-start">Remarks / Details</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <div class="d-flex justify-content-between w-100 align-items-center">
                    <h5 class="modal-title fw-bold m-0"><i class="bi bi-plus-circle-fill me-2"></i>Add New Record</h5>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-laptop calc-btn-trigger sys-calc-btn" onclick="openSystemCalculator()" title="Open Device Calculator"></i>
                        <i class="bi bi-calculator calc-btn-trigger" onclick="openCalculator()" title="Open Built-in Calculator"></i>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="entryForm">
                    <input type="hidden" id="editKey">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="small fw-bold">Date</label>
                            <input type="text" id="displayDate" class="form-control form-locked" readonly>
                            <input type="hidden" id="entryDate">
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold">Previous day Balance (Closing)</label>
                            <input type="number" id="prevDayBal" class="form-control form-locked" readonly step="0.01">
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold text-primary">Current day Balance</label>
                            <input type="number" id="currDayBal" class="form-control border-primary" step="0.01" value="0" oninput="calculateUserLogic()">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold text-success">Today Income (+)</label>
                            <input type="number" id="todayInc" class="form-control form-locked text-success" readonly step="0.01">
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold text-danger">Today Expense (-)</label>
                            <input type="number" id="todayExp" class="form-control border-danger" step="0.01" value="0" oninput="calculateUserLogic()">
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold text-primary">Closing Balance</label>
                            <input type="number" id="finalClosing" class="form-control form-locked text-primary" readonly step="0.01">
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold">Remarks / Purpose</label>
                            <textarea id="entryRemarks" class="form-control" rows="2" placeholder="Enter details..."></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-3 shadow">SAVE TRANSACTION</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="calculatorModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h6 class="text-white small fw-bold opacity-75">SMART CALCULATOR</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="calc-display" id="calcDisplay">0</div>
                <div class="calc-grid">
                    <button class="btn-calc btn-op" onclick="clearCalc()">C</button>
                    <button class="btn-calc btn-op" onclick="backspaceCalc()">⌫</button>
                    <button class="btn-calc btn-op" onclick="pressCalc('/')">÷</button>
                    <button class="btn-calc btn-op" onclick="pressCalc('*')">×</button>
                    <button class="btn-calc" onclick="pressCalc('7')">7</button>
                    <button class="btn-calc" onclick="pressCalc('8')">8</button>
                    <button class="btn-calc" onclick="pressCalc('9')">9</button>
                    <button class="btn-calc btn-op" onclick="pressCalc('-')">-</button>
                    <button class="btn-calc" onclick="pressCalc('4')">4</button>
                    <button class="btn-calc" onclick="pressCalc('5')">5</button>
                    <button class="btn-calc" onclick="pressCalc('6')">6</button>
                    <button class="btn-calc btn-op" onclick="pressCalc('+')">+</button>
                    <button class="btn-calc" onclick="pressCalc('1')">1</button>
                    <button class="btn-calc" onclick="pressCalc('2')">2</button>
                    <button class="btn-calc" onclick="pressCalc('3')">3</button>
                    <button class="btn-calc btn-eq" onclick="solveCalc()">=</button>
                    <button class="btn-calc" style="grid-column: span 2;" onclick="pressCalc('0')">0</button>
                    <button class="btn-calc" onclick="pressCalc('.')">.</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'transactions');
    const themeRef = ref(db, 'settings/theme');

    let allData = [];
    let filterStart = null;
    let filterEnd = null;
    let myChart = null;
    let chartType = 'bar'; 
    let globalLastBalance = 0;

    const modalObj = new bootstrap.Modal(document.getElementById('entryModal'));
    const calcModalObj = new bootstrap.Modal(document.getElementById('calculatorModal'));
    const today = new Date().toISOString().split('T')[0];

    // Calculator Logic (Preserved)
    window.openSystemCalculator = () => { window.location.href = "calc:"; };
    let calcExpression = "";
    window.openCalculator = () => calcModalObj.show();
    window.pressCalc = (val) => { calcExpression += val; document.getElementById('calcDisplay').innerText = calcExpression; };
    window.clearCalc = () => { calcExpression = ""; document.getElementById('calcDisplay').innerText = "0"; };
    window.backspaceCalc = () => { calcExpression = calcExpression.slice(0, -1); document.getElementById('calcDisplay').innerText = calcExpression || "0"; };
    window.solveCalc = () => { try { calcExpression = eval(calcExpression).toString(); document.getElementById('calcDisplay').innerText = calcExpression; } catch { document.getElementById('calcDisplay').innerText = "Error"; calcExpression = ""; } };

    // Theme Logic (Preserved)
    onValue(themeRef, (snap) => {
        const t = snap.val() || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('appTheme').value = t;
    });
    window.saveTheme = () => set(themeRef, document.getElementById('appTheme').value);

    // Firebase Data Logic (Preserved)
    onValue(dbRef, (snap) => {
        allData = [];
        snap.forEach(c => { allData.push({ id: c.key, ...c.val() }); });
        refreshUI();
    });

    window.refreshUI = function() {
        const body = document.getElementById('summaryTableBody');
        body.innerHTML = '';
        const grouped = {};
        allData.forEach(t => {
            if (!grouped[t.date]) { grouped[t.date] = { inc: 0, exp: 0, items: [] }; }
            if (t.type === 'Income') grouped[t.date].inc += t.amount;
            else grouped[t.date].exp += t.amount;
            grouped[t.date].items.push(t);
        });

        const sortedDates = Object.keys(grouped).sort((a,b) => new Date(a) - new Date(b));
        let runningBalance = 0;

        sortedDates.forEach((date) => {
            const day = grouped[date];
            const opening = runningBalance;
            const mid = opening + day.inc;
            const closing = mid - day.exp;

            if ((!filterStart || date >= filterStart) && (!filterEnd || date <= filterEnd)) {
                const remarksList = day.items.filter(i => i.remarks && i.remarks !== "N/A").map(i => `• ${i.remarks}`).join('<br>');
                const actions = day.items.map(i => `
                    <div class="d-flex justify-content-center gap-2 mb-1">
                        <button class="btn btn-sm btn-light py-0 border" onclick="deleteEntry('${i.id}')"><i class="bi bi-trash text-danger"></i></button>
                    </div>
                `).join('');

                body.innerHTML += `
                    <tr>
                        <td class="text-center fw-bold small">${date.split('-').reverse().join('/')}</td>
                        <td class="text-center">${opening.toFixed(2)}</td>
                        <td class="text-center text-success fw-bold">+${day.inc.toFixed(2)}</td>
                        <td class="text-center text-secondary">${mid.toFixed(2)}</td>
                        <td class="text-center text-danger fw-bold">-${day.exp.toFixed(2)}</td>
                        <td class="text-center fw-bold text-primary">${closing.toFixed(2)}</td>
                        <td><span style="font-size:0.75rem;">${remarksList || '-'}</span></td>
                        <td>${actions}</td>
                    </tr>`;
            }
            runningBalance = closing;
        });
        globalLastBalance = runningBalance;
        updateDashboard(runningBalance);
        initChart();
    };

    function updateDashboard(finalBal) {
        let tInc = 0, tExp = 0, tDay = 0;
        allData.forEach(t => {
            if(t.type === 'Income') tInc += t.amount; else tExp += t.amount;
            if(t.date === today) tDay += (t.type === 'Income' ? t.amount : -t.amount);
        });
        document.getElementById('totalIncVal').innerText = tInc.toFixed(0);
        document.getElementById('totalExpVal').innerText = tExp.toFixed(0);
        document.getElementById('balanceVal').innerText = finalBal.toFixed(0);
        document.getElementById('todayProfitVal').innerText = tDay.toFixed(0);
    }

    // --- NEW CALCULATION LOGIC AS PER YOUR REQUIREMENT ---
    window.calculateUserLogic = () => {
        const prev = parseFloat(document.getElementById('prevDayBal').value) || 0;
        const curr = parseFloat(document.getElementById('currDayBal').value) || 0;
        const exp = parseFloat(document.getElementById('todayExp').value) || 0;
        
        // Today Income (Positive difference)
        let inc = curr - prev;
        if (inc < 0) inc = 0; // Negative income ko 0 show karega
        
        document.getElementById('todayInc').value = inc.toFixed(2);
        
        // Closing Balance = Current Balance + Today Income - Today Expense
        const closing = curr + inc - exp;
        document.getElementById('finalClosing').value = closing.toFixed(2);
    };

    window.openModal = () => {
        const now = new Date();
        const options = { day: '2-digit', month: 'short', year: 'numeric' };
        
        document.getElementById('entryForm').reset();
        document.getElementById('editKey').value = "";
        
        // Auto Date
        document.getElementById('displayDate').value = now.toLocaleDateString('en-GB', options);
        document.getElementById('entryDate').value = today;
        
        // Auto Previous Balance
        document.getElementById('prevDayBal').value = globalLastBalance.toFixed(2);
        
        calculateUserLogic();
        modalObj.show();
    };

    window.deleteEntry = (id) => { if(confirm("Confirm Delete?")) remove(ref(db, 'transactions/'+id)); };

    document.getElementById('entryForm').onsubmit = async (e) => {
        e.preventDefault();
        const date = document.getElementById('entryDate').value;
        const inc = parseFloat(document.getElementById('todayInc').value) || 0;
        const exp = parseFloat(document.getElementById('todayExp').value) || 0;
        const rem = document.getElementById('entryRemarks').value || "N/A";
        
        // Firebase me save karega (Income aur Expense agar 0 se zyada hain)
        if(inc > 0) await push(dbRef, { type: 'Income', date, amount: inc, remarks: rem });
        if(exp > 0) await push(dbRef, { type: 'Expense', date, amount: exp, remarks: rem });
        
        modalObj.hide();
    };

    // Filter & Chart Logic (Preserved)
    window.applyFilter = () => { filterStart = document.getElementById('fromDate').value; filterEnd = document.getElementById('toDate').value; refreshUI(); };
    window.resetFilter = () => { filterStart = null; filterEnd = null; refreshUI(); };
    window.toggleChartType = (type) => { chartType = type; initChart(); };

    function initChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        const dates = [...new Set(allData.map(d => d.date))].sort().slice(-10);
        const incs = dates.map(d => allData.filter(x => x.date === d && x.type === 'Income').reduce((a,b)=>a+b.amount,0));
        const exps = dates.map(d => allData.filter(x => x.date === d && x.type === 'Expense').reduce((a,b)=>a+b.amount,0));
        myChart = new Chart(ctx, {
            type: chartType,
            data: {
                labels: dates.map(d => d.split('-').reverse().slice(0,2).join('/')),
                datasets: [
                    { label: 'Income', data: incs, borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.5)', fill: true, tension: 0.4 },
                    { label: 'Expense', data: exps, borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.5)', fill: true, tension: 0.4 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    window.exportPDF = () => {
        const element = document.getElementById('summaryTable');
        html2pdf().from(element).save(`Report_${today}.pdf`);
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () { window.location.href = "https://hammad57.github.io/POS/index.html"; };
</script>
</body>
</html>
