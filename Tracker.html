<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Journey Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #004a99; color: white; padding: 12px; text-align: center; font-size: 1.1rem; }
        
        #map { flex: 2; width: 100%; border-bottom: 3px solid #004a99; }
        
        .history-panel { flex: 1; background: white; overflow-y: auto; padding: 10px; border-top: 2px solid #ddd; }
        .history-item { display: flex; justify-content: space-between; background: #f1f1f1; padding: 10px; margin-bottom: 5px; border-radius: 5px; align-items: center; }
        
        .controls { padding: 10px; background: #fff; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        #startBtn { background: #28a745; }
        #stopBtn { background: #dc3545; }
        #clearBtn { background: #6c757d; }
        
        .status-bar { background: #222; color: #00ff00; font-size: 12px; padding: 4px; text-align: center; font-family: monospace; }
        .btn-v { background: #007bff; padding: 5px 10px; border-radius: 4px; border: none; color: white; margin-right: 5px; cursor: pointer; }
        .btn-d { background: #ff4444; padding: 5px 10px; border-radius: 4px; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <header>Real-Time Detail Tracker</header>
    <div class="status-bar" id="status">Ready to Track</div>
    
    <div id="map"></div>

    <div class="controls">
        <button id="startBtn" onclick="startTracking()">Start Tracking</button>
        <button id="stopBtn" onclick="stopTracking()">Stop & Save</button>
        <button id="clearBtn" onclick="clearMap()">Clear Screen</button>
    </div>

    <div class="history-panel">
        <h3 style="font-size: 14px; margin-bottom: 8px;">History Log:</h3>
        <div id="history-list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, marker, polyline;
        let routeCoordinates = [];
        let watchID = null;

        // --- Layers ---
        // 1. OSM Standard (Best for Road Names & Shops)
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        // 2. Google Satellite Hybrid (Real view with Labels)
        const satelliteLayer = L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains:['mt0','mt1','mt2','mt3'],
            attribution: '© Google Maps'
        });

        // Map Initialize
        map = L.map('map', {
            center: [30.3753, 69.3451],
            zoom: 13,
            layers: [osmLayer] // Default detail view
        });

        // Layer Switcher
        const baseMaps = {
            "Detail Street View": osmLayer,
            "Satellite (Hybrid)": satelliteLayer
        };
        L.control.layers(baseMaps).addTo(map);

        polyline = L.polyline([], {color: '#ff0000', weight: 6, opacity: 0.9}).addTo(map);

        window.onload = displayHistory;

        function startTracking() {
            if (watchID) return;
            routeCoordinates = [];
            polyline.setLatLngs([]);
            updateStatus("GPS Active... Move now!");

            watchID = navigator.geolocation.watchPosition(
                (pos) => {
                    const latlng = [pos.coords.latitude, pos.coords.longitude];
                    routeCoordinates.push(latlng);
                    
                    if (routeCoordinates.length === 1) map.setView(latlng, 18);
                    
                    if (!marker) {
                        marker = L.circleMarker(latlng, {radius: 9, color: 'white', fillColor: '#007bff', fillOpacity: 1, weight: 3}).addTo(map);
                    } else {
                        marker.setLatLng(latlng);
                    }

                    polyline.setLatLngs(routeCoordinates);
                    map.panTo(latlng);
                    updateStatus(`Tracking: ${latlng[0].toFixed(5)}, ${latlng[1].toFixed(5)}`);
                },
                (err) => updateStatus("GPS Error: " + err.message),
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        function stopTracking() {
            if (watchID) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                updateStatus("Trip Saved!");
                if (routeCoordinates.length > 1) saveTrip(routeCoordinates);
            }
        }

        // --- History Logic ---
        function saveTrip(coords) {
            let trips = JSON.parse(localStorage.getItem('my_trips') || '[]');
            const tripObj = { id: Date.now(), time: new Date().toLocaleString(), data: coords };
            trips.unshift(tripObj);
            localStorage.setItem('my_trips', JSON.stringify(trips));
            displayHistory();
        }

        function displayHistory() {
            const trips = JSON.parse(localStorage.getItem('my_trips') || '[]');
            const list = document.getElementById('history-list');
            list.innerHTML = trips.map(t => `
                <div class="history-item">
                    <span>${t.time}</span>
                    <div>
                        <button class="btn-v" onclick='viewTrip(${JSON.stringify(t.data)})'>View</button>
                        <button class="btn-d" onclick='deleteTrip(${t.id})'>X</button>
                    </div>
                </div>
            `).join('');
        }

        function viewTrip(data) {
            clearMap();
            polyline.setLatLngs(data);
            map.fitBounds(polyline.getBounds());
            updateStatus("Viewing Saved Trip");
        }

        function deleteTrip(id) {
            let trips = JSON.parse(localStorage.getItem('my_trips') || '[]');
            trips = trips.filter(t => t.id !== id);
            localStorage.setItem('my_trips', JSON.stringify(trips));
            displayHistory();
        }

        function clearMap() {
            polyline.setLatLngs([]);
            if (marker) { map.removeLayer(marker); marker = null; }
            updateStatus("Map Cleared");
        }

        function updateStatus(m) { document.getElementById('status').innerText = "Status: " + m; }
    </script>
</body>
</html>
