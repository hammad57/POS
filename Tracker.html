<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast 3s Red Line Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #d32f2f; color: white; padding: 12px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #map { flex-grow: 1; width: 100%; border-bottom: 2px solid #ccc; }
        .controls { padding: 15px; background: white; text-align: center; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; color: white; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #startBtn { background: #2e7d32; }
        #stopBtn { background: #c62828; }
        #clearBtn { background: #546e7a; }
        button:active { transform: scale(0.95); }
        .status-bar { background: #212121; color: #00e676; font-family: 'Courier New', monospace; font-size: 12px; padding: 6px; text-align: center; }
    </style>
</head>
<body>

    <header>Live Movement Tracker</header>
    <div class="status-bar" id="status">Status: GPS Ready</div>
    <div id="map"></div>

    <div class="controls">
        <button id="startBtn" onclick="startTracking()">Start</button>
        <button id="stopBtn" onclick="stopTracking()">Stop</button>
        <button id="clearBtn" onclick="clearData()">Clear</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, marker, polyline;
        let routeCoordinates = [];
        let watchID = null;

        // Map Setup
        map = L.map('map').setView([30.3753, 69.3451], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Red Line Setup
        polyline = L.polyline([], {
            color: '#ff0000', // Red Line
            weight: 6, 
            opacity: 0.9,
            smoothFactor: 1
        }).addTo(map);

        function startTracking() {
            if (watchID) return;

            updateStatus("Searching for precise location...");

            const options = {
                enableHighAccuracy: true, // Sabse behtareen GPS accuracy
                maximumAge: 0,           // Cached data use nahi hoga
                timeout: 5000            // Har 5 sec mein signal lazmi check karega
            };

            watchID = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const currentPos = [lat, lng];

                    updateStatus(`Live Tracking: ${lat.toFixed(6)}, ${lng.toFixed(6)} (Acc: ${accuracy.toFixed(1)}m)`);
                    
                    // Nayi location ko list mein dalna
                    routeCoordinates.push(currentPos);
                    
                    // Live UI Updates
                    if (routeCoordinates.length === 1) {
                        map.setView(currentPos, 19); // Bohat nazdeek zoom
                    }

                    // Marker update (Blue point)
                    if (!marker) {
                        marker = L.circleMarker(currentPos, {
                            radius: 8, 
                            color: '#fff', 
                            fillColor: '#007bff', 
                            fillOpacity: 1,
                            weight: 2
                        }).addTo(map);
                    } else {
                        marker.setLatLng(currentPos);
                    }

                    // Red Line drawing
                    polyline.setLatLngs(routeCoordinates);
                    
                    // Map ko movement ke sath move karna
                    map.panTo(currentPos);
                },
                (err) => {
                    updateStatus("Error: " + err.message);
                },
                options
            );
        }

        function stopTracking() {
            if (watchID) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                updateStatus("Tracking Stopped.");
                if (routeCoordinates.length > 0) map.fitBounds(polyline.getBounds());
            }
        }

        function clearData() {
            stopTracking();
            routeCoordinates = [];
            polyline.setLatLngs([]);
            if (marker) {
                map.removeLayer(marker);
                marker = null;
            }
            updateStatus("Data Cleared.");
        }

        function updateStatus(msg) {
            document.getElementById('status').innerText = "Status: " + msg;
        }
    </script>
</body>
</html>
