<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced GPS Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-weight: bold; }
        
        #map { flex: 2; width: 100%; border-bottom: 2px solid #ccc; }
        
        .history-section { flex: 1; background: white; overflow-y: auto; padding: 15px; border-top: 5px solid #1a73e8; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .delete-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .view-btn { background: #1a73e8; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-right: 5px; }

        .controls { padding: 15px; background: #fff; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        button { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; }
        #startBtn { background: #28a745; }
        #stopBtn { background: #dc3545; }
        #clearBtn { background: #6c757d; }
        
        .status-bar { background: #212121; color: #00e676; font-family: monospace; font-size: 11px; padding: 5px; text-align: center; }
    </style>
</head>
<body>

    <header>Live Tracker & History</header>
    <div class="status-bar" id="status">Status: Ready</div>
    
    <div id="map"></div>

    <div class="controls">
        <button id="startBtn" onclick="startTracking()">Start</button>
        <button id="stopBtn" onclick="stopTracking()">Stop & Save</button>
        <button id="clearBtn" onclick="clearCurrent()">Clear Map</button>
    </div>

    <div class="history-section">
        <h4 style="margin-bottom: 10px;">Saved Journeys</h4>
        <div id="history-list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, marker, polyline;
        let routeCoordinates = [];
        let watchID = null;

        // 1. Map Layers (Normal and Satellite)
        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri, DigitalGlobe, GeoEye, Earthstar Geographics, CNES/Airbus DS, USDA, USGS, AeroGRID, IGN, and the GIS User Community'
        });

        map = L.map('map', {
            center: [30.3753, 69.3451],
            zoom: 5,
            layers: [streetLayer] // Default layer
        });

        // Layer Switcher (Satellite View Option)
        const baseMaps = {
            "Normal View": streetLayer,
            "Satellite View": satelliteLayer
        };
        L.control.layers(baseMaps).addTo(map);

        polyline = L.polyline([], {color: '#ff0000', weight: 6}).addTo(map);

        // Load history on startup
        window.onload = loadHistory;

        function startTracking() {
            if (watchID) return;
            routeCoordinates = [];
            polyline.setLatLngs([]);
            updateStatus("Tracking started... Move around!");

            watchID = navigator.geolocation.watchPosition(
                (position) => {
                    const pos = [position.coords.latitude, position.coords.longitude];
                    routeCoordinates.push(pos);
                    
                    if (routeCoordinates.length === 1) map.setView(pos, 18);
                    
                    if (!marker) {
                        marker = L.circleMarker(pos, {radius: 8, color: 'blue', fillColor: 'white', fillOpacity: 1}).addTo(map);
                    } else {
                        marker.setLatLng(pos);
                    }

                    polyline.setLatLngs(routeCoordinates);
                    map.panTo(pos);
                    updateStatus(`Live: ${pos[0].toFixed(5)}, ${pos[1].toFixed(5)}`);
                },
                (err) => updateStatus("Error: " + err.message),
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        function stopTracking() {
            if (watchID) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                updateStatus("Tracking Saved to History.");
                
                if (routeCoordinates.length > 1) {
                    saveToHistory(routeCoordinates);
                }
            }
        }

        // History Management
        function saveToHistory(coords) {
            const history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
            const newTrip = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                data: coords
            };
            history.unshift(newTrip); // Add to start
            localStorage.setItem('tripHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';

            history.forEach(trip => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span>${trip.date}</span>
                    <div>
                        <button class="view-btn" onclick='viewHistory(${JSON.stringify(trip.data)})'>View</button>
                        <button class="delete-btn" onclick='deleteHistory(${trip.id})'>X</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function viewHistory(coords) {
            clearCurrent();
            polyline.setLatLngs(coords);
            map.fitBounds(polyline.getBounds());
            updateStatus("Viewing saved trip.");
        }

        function deleteHistory(id) {
            let history = JSON.parse(localStorage.getItem('tripHistory') || '[]');
            history = history.filter(trip => trip.id !== id);
            localStorage.setItem('tripHistory', JSON.stringify(history));
            loadHistory();
        }

        function clearCurrent() {
            polyline.setLatLngs([]);
            if (marker) { map.removeLayer(marker); marker = null; }
            updateStatus("Map Cleared.");
        }

        function updateStatus(msg) {
            document.getElementById('status').innerText = "Status: " + msg;
        }
    </script>
</body>
</html>
