<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Second Route Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a73e8; color: white; padding: 10px; text-align: center; }
        #map { flex-grow: 1; width: 100%; }
        .controls { padding: 15px; background: white; text-align: center; display: flex; justify-content: center; gap: 10px; border-top: 1px solid #ccc; }
        button { padding: 12px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; }
        #startBtn { background: #28a745; }
        #stopBtn { background: #dc3545; }
        #clearBtn { background: #6c757d; }
        .status-bar { background: #333; color: #00ff00; font-family: monospace; font-size: 11px; padding: 5px; text-align: center; }
    </style>
</head>
<body>

    <header><h3>📍 Fast Live Tracker</h3></header>
    <div class="status-bar" id="status">Status: Ready</div>
    <div id="map"></div>

    <div class="controls">
        <button id="startBtn" onclick="startTracking()">Start</button>
        <button id="stopBtn" onclick="stopTracking()">Stop</button>
        <button id="clearBtn" onclick="clearData()">Clear</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, marker, polyline;
        let routeCoordinates = [];
        let watchID = null;

        // Map setup
        map = L.map('map').setView([30.3753, 69.3451], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        polyline = L.polyline([], {color: '#ff4444', weight: 5}).addTo(map);

        function startTracking() {
            if (watchID) return; // Pehle se chal raha ho to dubara start na ho

            document.getElementById('status').innerText = "Status: Locating...";
            
            // Geolocation options for 3-second responsiveness
            const options = {
                enableHighAccuracy: true,
                maximumAge: 0,        // Purani location use na kare
                timeout: 3000         // Har 3 second mein update ki koshish kare
            };

            watchID = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const currentPos = [lat, lng];

                    document.getElementById('status').innerText = `Live: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                    
                    routeCoordinates.push(currentPos);
                    
                    // Live UI Updates
                    if (routeCoordinates.length === 1) map.setView(currentPos, 18);
                    
                    if (!marker) {
                        marker = L.circleMarker(currentPos, {radius: 8, color: 'blue', fillColor: 'white', fillOpacity: 1}).addTo(map);
                    } else {
                        marker.setLatLng(currentPos);
                    }

                    polyline.setLatLngs(routeCoordinates);
                    map.panTo(currentPos); // Screen ko sath sath move karega
                },
                (err) => {
                    document.getElementById('status').innerText = "Error: " + err.message;
                },
                options
            );
        }

        function stopTracking() {
            if (watchID) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                document.getElementById('status').innerText = "Status: Stopped.";
                if (routeCoordinates.length > 0) map.fitBounds(polyline.getBounds());
            }
        }

        function clearData() {
            stopTracking();
            routeCoordinates = [];
            polyline.setLatLngs([]);
            if (marker) {
                map.removeLayer(marker);
                marker = null;
            }
            document.getElementById('status').innerText = "Status: Data Cleared.";
        }
    </script>
</body>
</html>
