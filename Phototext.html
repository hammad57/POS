<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Data Extractor</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            padding: 20px; 
            display: flex; justify-content: center; 
        }
        .container { 
            width: 100%; max-width: 600px; 
            background: rgba(30, 41, 59, 0.8); 
            padding: 25px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"]#urlInput { 
            flex: 1; padding: 12px; border-radius: 8px; 
            border: 1px solid #334155; background: #1e293b; color: white;
        }
        button#fetchBtn { 
            padding: 10px 20px; background: #38bdf8; border: none; 
            border-radius: 8px; color: #0f172a; font-weight: bold; cursor: pointer;
        }

        .box { 
            background: #1e293b; padding: 15px; border-radius: 10px; 
            margin-bottom: 15px; position: relative; border: 1px solid #334155; 
        }
        .box label { font-weight: 600; color: #38bdf8; display: block; margin-bottom: 8px; font-size: 13px; }
        
        /* Readonly inputs taake keyboard open na ho */
        .display-input { 
            width: calc(100% - 80px); background: transparent; border: none; 
            color: #f8fafc; font-size: 15px; outline: none; cursor: pointer;
        }
        textarea.display-input { width: 100%; height: 80px; margin-top: 5px; cursor: pointer; }

        .copy-btn { 
            position: absolute; right: 10px; top: 10px; 
            background: #0284c7; border: none; color: white; 
            padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 11px;
        }

        #status { text-align: center; font-size: 14px; margin-bottom: 10px; }
        .loader { 
            display: none; border: 3px solid #334155; border-top: 3px solid #38bdf8; 
            border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Link Data Extractor</h2>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Yahan Product Link paste karein...">
        <button id="fetchBtn" onclick="fetchData()">Extract</button>
    </div>
    
    <div class="loader" id="loader"></div>
    <p id="status"></p>

    <div class="box" onclick="copyText('nameBox')">
        <label>Product Name</label>
        <input type="text" id="nameBox" class="display-input" readonly>
        <button class="copy-btn">Copy</button>
    </div>

    <div class="box" onclick="copyText('priceBox')">
        <label>Price</label>
        <input type="text" id="priceBox" class="display-input" readonly>
        <button class="copy-btn">Copy</button>
    </div>

    <div class="box" onclick="copyText('descBox')">
        <label>Description Detail</label>
        <textarea id="descBox" class="display-input" readonly></textarea>
        <button class="copy-btn">Copy</button>
    </div>

    <div class="box" onclick="copyText('sizeBox')">
        <label>Size / Color</label>
        <input type="text" id="sizeBox" class="display-input" readonly>
        <button class="copy-btn">Copy</button>
    </div>

    <div class="box" onclick="copyText('imgBox')">
        <label>Image Address (Link)</label>
        <input type="text" id="imgBox" class="display-input" readonly>
        <button class="copy-btn">Copy</button>
    </div>
</div>

<script>
async function fetchData() {
    const url = document.getElementById('urlInput').value;
    if (!url) return alert("Pehle link paste karein!");

    const status = document.getElementById('status');
    const loader = document.getElementById('loader');
    
    status.innerText = "Data nikala ja raha hai...";
    status.style.color = "#fde047";
    loader.style.display = "block";

    try {
        // Using a CORS proxy to fetch the HTML
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
        const response = await fetch(proxyUrl);
        const data = await response.json();
        const html = data.contents;

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extraction Logic (Website ke generic tags ke mutabiq)
        document.getElementById('nameBox').value = doc.querySelector('h1')?.innerText || doc.title || "Nahi mila";
        
        // Price dhundne ki koshish
        let price = doc.querySelector('[class*="price"], [id*="price"]')?.innerText || "Nahi mila";
        document.getElementById('priceBox').value = price.trim();

        // Description
        let desc = doc.querySelector('[class*="description"], [id*="description"], #details')?.innerText || "Details link mein check karein";
        document.getElementById('descBox').value = desc.trim().substring(0, 500) + "...";

        // Size / Color
        let size = doc.querySelector('[class*="size"], [class*="variant"]')?.innerText || "Default / Standard";
        document.getElementById('sizeBox').value = size.trim();

        // Image URL
        let img = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('img')?.src || "Nahi mila";
        document.getElementById('imgBox').value = img;

        status.innerText = "Data kamyabi se nikal liya gaya!";
        status.style.color = "#4ade80";
    } catch (error) {
        status.innerText = "Error: Link access nahi ho saka.";
        status.style.color = "#ef4444";
    } finally {
        loader.style.display = "none";
    }
}

function copyText(id) {
    const input = document.getElementById(id);
    if (!input.value) return;

    // Clipboard copy logic
    navigator.clipboard.writeText(input.value).then(() => {
        const box = input.parentElement;
        const btn = box.querySelector('.copy-btn');
        const originalText = btn.innerText;
        
        btn.innerText = "Copied!";
        btn.style.background = "#4ade80";
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "#0284c7";
        }, 1200);
    });
}
</script>

</body>
</html>
