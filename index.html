<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad Mart Scanner</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Top Bar */
        .header { padding: 15px; background: var(--card); text-align: center; border-bottom: 2px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10; }
        .mart-name { font-size: 22px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 1px; text-transform: uppercase; }
        
        /* Scanner View */
        .scanner-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #reader { width: 100% !important; height: 100% !important; border: none !important; object-fit: cover; }
        
        /* Product Result Popup */
        .result-overlay { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--card); border-radius: 25px 25px 0 0; 
            padding: 25px; display: none; 
            box-shadow: 0 -5px 30px rgba(0,0,0,0.6); 
            animation: slideUp 0.3s ease-out; z-index: 20;
            text-align: center;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Product Details */
        .prod-img { width: 100px; height: 100px; border-radius: 15px; border: 2px solid var(--accent); object-fit: cover; margin-top: -60px; background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .p-en { font-size: 20px; font-weight: bold; margin-top: 10px; color: white; }
        .p-ur { font-size: 22px; color: #94a3b8; font-family: 'Segoe UI', sans-serif; margin-bottom: 10px; }
        .price-tag { font-size: 48px; font-weight: 900; color: var(--accent); margin: 5px 0; }
        .unit-tag { font-size: 14px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .btn-scan { width: 100%; background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .mgr-link { display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 12px; }

    </style>
</head>
<body>

    <div class="header">
        <h1 class="mart-name">Hammad Mart</h1>
    </div>

    <div class="scanner-container">
        <div id="reader"></div>
    </div>

    <div id="result" class="result-overlay">
        <img id="p-img" class="prod-img" src="https://via.placeholder.com/150" alt="Product">
        <div class="p-en" id="p-en">Scanning...</div>
        <div class="p-ur" id="p-ur">...</div>
        <div class="price-tag" id="p-price">---</div>
        <div class="unit-tag" id="p-unit"></div>
        
        <button class="btn-scan" onclick="resetScanner()">Scan Next Item</button>
        <a href="https://hammad57.github.io/POS/manager.html" class="mgr-link">Open Manager</a>
    </div>

    <script>
        // NEW VERSION 5 URL
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            document.getElementById('result').style.display = "block";
            document.getElementById('p-en').innerText = "Fetching Data...";
            document.getElementById('p-price').innerText = "...";
            
            fetch(`${API}?action=getDetails&id=${decodedText}`)
                .then(res => res.json())
                .then(data => {
                    if(!data.error) {
                        document.getElementById('p-en').innerText = data.enName;
                        document.getElementById('p-ur').innerText = data.urName || "";
                        document.getElementById('p-price').innerText = "Rs. " + data.price;
                        document.getElementById('p-unit').innerText = data.unit || "Per Item";
                        document.getElementById('p-img').src = data.img || "https://via.placeholder.com/150?text=No+Image";
                    } else {
                        document.getElementById('p-en').innerText = "Item Not Found";
                        document.getElementById('p-price').innerText = "---";
                    }
                })
                .catch(err => {
                    document.getElementById('p-en').innerText = "Network Error";
                });
        }

        function resetScanner() {
            document.getElementById('result').style.display = "none";
            location.reload();
        }

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
