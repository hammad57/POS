<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammad Mart Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #0f172a; --accent: #22c55e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--primary); color: white; margin: 0; text-align: center; }
        .header { padding: 20px; background: #1e293b; border-bottom: 3px solid var(--accent); }
        .mart-name { font-size: 28px; font-weight: 800; color: var(--accent); margin: 0; }
        
        #reader { width: 90%; max-width: 400px; margin: 20px auto; border-radius: 20px; overflow: hidden; }
        
        .product-card { 
            background: #1e293b; margin: 20px; padding: 20px; border-radius: 25px; 
            display: none; animation: popIn 0.3s ease; 
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .prod-img { width: 120px; height: 120px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--accent); }
        .name-en { font-size: 22px; font-weight: bold; }
        .name-ur { font-size: 24px; color: #94a3b8; margin: 5px 0; font-family: 'Urdu Typesetting', serif; }
        .price-box { font-size: 45px; font-weight: 900; color: var(--accent); }
        .unit-text { font-size: 16px; color: #64748b; }
        
        .nav-link { display: block; margin-top: 30px; color: #3b82f6; text-decoration: none; font-size: 14px; }
        .btn-next { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="mart-name">HAMMAD MART</h1>
        <small style="color: #94a3b8;">Smart Inventory System</small>
    </div>

    <div id="reader"></div>

    <div id="product-card" class="product-card">
        <img id="p-img" class="prod-img" src="" alt="Product">
        <div class="name-en" id="p-en">Product Name</div>
        <div class="name-ur" id="p-ur">اردو نام</div>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <div class="price-box">Rs. <span id="p-price">0</span></div>
        <div class="unit-text" id="p-unit">Per Item</div>
        <button class="btn-next" onclick="location.reload()">SCAN NEXT</button>
    </div>

    <a href="https://hammad57.github.io/POS/manager.html" class="nav-link">Open Manager Settings</a>

    <script>
        const API = "APNA_NEW_WEB_APP_URL_YAHAN_DAALEIN";

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            const card = document.getElementById('product-card');
            card.style.display = "block";
            
            fetch(`${API}?action=getDetails&id=${decodedText}`)
                .then(res => res.json())
                .then(data => {
                    if(!data.error) {
                        document.getElementById('p-en').innerText = data.enName;
                        document.getElementById('p-ur').innerText = data.urName;
                        document.getElementById('p-price').innerText = data.price;
                        document.getElementById('p-unit').innerText = data.unit;
                        document.getElementById('p-img').src = data.img || "https://via.placeholder.com/150?text=No+Image";
                    } else {
                        document.getElementById('p-en').innerText = "Not Found!";
                    }
                });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
