<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Smart Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #22c55e;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            padding: 20px;
            text-align: center;
        }
        #reader {
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--card) !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .result-container {
            width: 85%;
            max-width: 400px;
            margin-top: 30px;
            padding: 25px;
            background: var(--card);
            border-radius: 24px;
            display: none;
            border-bottom: 6px solid var(--accent);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .p-label { font-size: 14px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .p-name { font-size: 24px; font-weight: 700; margin-bottom: 15px; }
        .p-price { font-size: 48px; color: var(--accent); font-weight: 900; }
        .btn-next {
            margin-top: 25px;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        #reader__dashboard_section_csr button {
            background: var(--accent) !important;
            color: white !important;
            border-radius: 8px !important;
            padding: 10px !important;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; color:#3b82f6;">POS Scanner</h2>
        <p style="color:#94a3b8; font-size:14px;">Scan QR to see live price</p>
    </div>

    <div id="reader"></div>

    <div id="result-card" class="result-container">
        <div class="p-label">Product Name</div>
        <div id="res-name" class="p-name">---</div>
        <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
        <div class="p-label">Retail Price</div>
        <div id="res-price" class="p-price">Rs. 0</div>
        <button class="btn-next" onclick="resetScanner()">SCAN NEXT</button>
    </div>

    <script>
        // Aapka provide karda URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzILPEE8uDgmmZD_rTY5oaf64uEOgsQXyWo03pwxdkGwu7Fw-SYfr_s_XJzD8GtYVRSw/exec";

        let scanner = new Html5QrcodeScanner("reader", { 
            fps: 20, 
            qrbox: {width: 250, height: 250},
            aspectRatio: 1.0 
        });

        function onScanSuccess(decodedText) {
            // Scanner ko roko taake bar bar fetch na kare
            scanner.clear();
            
            const card = document.getElementById('result-card');
            const nameEl = document.getElementById('res-name');
            const priceEl = document.getElementById('res-price');

            card.style.display = "block";
            nameEl.innerText = "Searching Sheet...";
            priceEl.innerText = "...";

            // Live Fetch from Google Sheets
            fetch(`${SCRIPT_URL}?action=getDetails&id=${decodedText}`)
                .then(response => response.json())
                .then(data => {
                    if(data.error) {
                        nameEl.innerText = "Not Found!";
                        priceEl.innerText = "N/A";
                    } else {
                        nameEl.innerText = data.name;
                        priceEl.innerText = "Rs. " + data.price;
                    }
                })
                .catch(err => {
                    nameEl.innerText = "Network Error";
                    console.error(err);
                });
        }

        function resetScanner() {
            document.getElementById('result-card').style.display = "none";
            location.reload(); // Simple and clean reset
        }

        scanner.render(onScanSuccess);
    </script>
</body>
</html>
