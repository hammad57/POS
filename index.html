<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad Mart Scanner</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; --blue: #3b82f6; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header Styling */
        .header { padding: 15px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); z-index: 10; }
        .mart-name { font-size: 18px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 1px; }
        
        .nav-btns { display: flex; gap: 8px; }
        .btn { border: none; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-block; }
        .admin-btn { background: var(--blue); }
        .order-btn { background: #f59e0b; }
        .order-btn:hover { background: #d97706; }
        
        .view { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }

        /* Search Section */
        .search-container { padding: 10px; background: var(--card); position: relative; z-index: 100; }
        #searchInput { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 16px; }
        #searchDropdown { display: none; position: absolute; top: 100%; left: 10px; right: 10px; background: #1e293b; border: 1px solid var(--accent); border-radius: 0 0 10px 10px; max-height: 300px; overflow-y: auto; z-index: 200; }
        .search-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-bottom: 1px solid #334155; }

        #reader { width: 100% !important; background: black; flex-grow: 1; }

        /* Result Card */
        .result-card { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 25px; border-radius: 30px 30px 0 0; z-index: 2000; text-align: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); box-sizing: border-box; }
        .p-img { width: 130px; height: 130px; object-fit: contain; background: white; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="mart-name">HAMMAD MART</div>
        <div class="nav-btns">
            <a href="https://hammad57.github.io/POS/order.html" class="btn order-btn">ORDERS 📦</a>
            <a href="manager.html" class="btn admin-btn">ADMIN ⚙️</a>
        </div>
    </div>

    <div id="scanner-view" class="view">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Item..." oninput="handleSearch()" onclick="closeResult()">
            <div id="searchDropdown"></div>
        </div>
        <div id="reader"></div>
    </div>

    <div id="result" class="result-card">
        <img id="p-img" class="p-img" src="">
        <div id="p-en" style="font-size:20px; font-weight:bold; margin-top:10px;"></div>
        <div id="p-price" style="font-size:35px; color:var(--accent); font-weight:900;"></div>
        <button class="btn" style="background:var(--accent); width:100%; padding:15px; border-radius:12px; font-size:18px; margin-top:15px;" onclick="closeResult()">SCAN NEXT 🔄</button>
    </div>

    <script>
        // --- Scanner & Search Logic ---
        // LocalStorage se data uthayega jo Manager page ne save kiya tha
        
        const scanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
        scanner.render((id) => {
            const data = JSON.parse(localStorage.getItem('mart_data') || "[]");
            const product = data.find(p => p.id == id);
            if (product) {
                showProduct(product);
            } else {
                alert("Product not found! ID: " + id);
            }
        });

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            const data = JSON.parse(localStorage.getItem('mart_data') || "[]");
            dropdown.innerHTML = '';
            if (query.length < 1) { dropdown.style.display = 'none'; return; }
            
            const matches = data.filter(p => p.en && p.en.toLowerCase().includes(query));
            if (matches.length > 0) {
                matches.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<div><b>${p.en}</b></div> <div style="margin-left:auto; color:var(--accent)">Rs.${p.price}</div>`;
                    item.onclick = () => { showProduct(p); dropdown.style.display = 'none'; document.getElementById('searchInput').value = ''; };
                    dropdown.appendChild(item);
                });
                dropdown.style.display = 'block';
            } else { dropdown.style.display = 'none'; }
        }

        function showProduct(p) {
            document.getElementById('p-en').innerText = p.en;
            document.getElementById('p-price').innerText = "Rs. " + p.price;
            document.getElementById('p-img').src = (p.img && p.img.length > 5) ? p.img : "https://via.placeholder.com/150?text=No+Image";
            document.getElementById('result').style.display = "block";
            scanner.pause();
        }

        function closeResult() {
            document.getElementById('result').style.display = "none";
            try { scanner.resume(); } catch(e) {}
        }
    </script>
</body>
</html>
