<script>
    const API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";

    function onScanSuccess(decodedText) {
        console.log("Scanned ID:", decodedText);
        
        // 1. Pehle Mobile Memory (Offline) check karein
        const local = localStorage.getItem('mart_data');
        if(local) {
            const products = JSON.parse(local);
            const item = products.find(p => p.id.toString().trim() == decodedText.toString().trim());
            if(item) {
                showItem(item);
                return; // Agar offline mil gaya to yahin ruk jayein
            }
        }

        // 2. Agar offline nahi mila to Online check karein
        fetch(API + "?action=getDetails&id=" + decodedText)
            .then(r => r.json())
            .then(data => {
                if(!data.error) {
                    showItem(data);
                } else {
                    alert("Product not found in Sheet or Offline!");
                }
            })
            .catch(err => alert("Internet connection error!"));
    }

    function showItem(data) {
        document.getElementById('result').style.display = "block";
        document.getElementById('p-en').innerText = data.en;
        document.getElementById('p-ur').innerText = data.ur || "";
        document.getElementById('p-price').innerText = "Rs. " + (data.price || data.pr);
        document.getElementById('p-unit').innerText = data.unit || data.un || "";
        document.getElementById('p-img').src = data.img || "https://via.placeholder.com/150";
        
        // Vibration feedback (agar mobile support kare)
        if(navigator.vibrate) navigator.vibrate(100);
    }

    // Scanner start
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
