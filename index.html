<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muluk Hussain - Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f1f5f9; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        
        .app-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255, 255, 255, 0.05); position: relative; z-index: 10; overflow: hidden; }
        .app-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(59,130,246,0.1), transparent); opacity: 0; transition: opacity 0.3s ease; }
        .app-card:active { transform: scale(0.92); }
        .app-card:active::before { opacity: 1; }
        
        #appOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 99998; display: none; opacity: 0; transition: opacity 0.3s ease; }
        #appOverlay.active { opacity: 1; display: block; }
        #closeAppBtn { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); z-index: 99999; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #closeAppBtn.active { transform: translateX(-50%) translateY(0); }
        
        .notify-badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: 800; border: 2px solid #1e293b; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .req-badge { position: absolute; top: -4px; right: -4px; background: #eab308; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: 800; border: 2px solid #1e293b; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
        
        #notifDropdown, #requestsDropdown { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 60px; 
            width: calc(100vw - 32px); 
            max-width: 380px; 
            z-index: 100000 !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-origin: top right;
        }
        #notifDropdown.active, #requestsDropdown.active { display: block; animation: scaleIn 0.2s ease-out forwards; }
        
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .balance-hidden { filter: blur(12px); pointer-events: none; user-select: none; transition: filter 0.4s ease; opacity: 0.5; }
        
        /* Modal Animation */
        #addAppModal { opacity: 0; transition: opacity 0.3s ease; }
        #addAppModal.active { opacity: 1; display: flex !important; }
        #addAppModal > div { transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #addAppModal.active > div { transform: scale(1); }
        
        /* Icon Selector Active State */
        .icon-option.selected { background: #2563eb; color: white; border-color: #3b82f6; transform: scale(1.1); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-6 lg:max-w-4xl lg:mx-auto">

    <!-- Install Banner -->
    <div id="installBanner" class="fixed bottom-6 left-4 right-4 glass p-4 rounded-2xl shadow-2xl border-t-2 border-blue-500 hidden items-center justify-between gap-4 z-[100001]">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-rocket text-white text-xl"></i></div>
            <div><p class="text-sm font-bold text-white">Install Hub</p><p class="text-[11px] text-slate-400 mt-0.5">Add to your home screen</p></div>
        </div>
        <div class="flex gap-3">
            <button id="installBtn" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl text-xs font-bold transition-colors">Install</button>
            <button onclick="document.getElementById('installBanner').style.display='none'" class="text-slate-400 hover:text-white p-2 transition-colors"><i class="fas fa-times text-lg"></i></button>
        </div>
    </div>

    <!-- App Overlay -->
    <div id="appOverlay">
        <iframe id="appFrame" class="w-full h-full border-none bg-slate-900"></iframe>
    </div>
    <button id="closeAppBtn" onclick="closeApp()" class="bg-slate-800 text-white px-6 py-3.5 rounded-full shadow-2xl font-semibold flex items-center gap-3 border border-slate-700 hover:bg-slate-700 active:scale-95 transition-all">
        <div class="bg-red-500/20 p-1.5 rounded-full"><i class="fas fa-arrow-left text-red-500"></i></div>
        Back to Dashboard
    </button>

    <!-- Header -->
    <header class="flex justify-between items-center mb-8 glass p-5 rounded-3xl relative z-[50]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-user-astronaut text-white text-sm"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-tight">Muluk Hussain</h1>
                <p class="text-[10px] text-blue-400 font-medium uppercase tracking-widest">Dashboard Hub</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- New: Live Pending Requests (Egg Sale / Purchase) -->
            <div class="relative">
                <button class="w-11 h-11 bg-slate-800/80 hover:bg-slate-700 rounded-2xl flex items-center justify-center transition-colors border border-white/5" onclick="toggleRequests()">
                    <i class="fas fa-clipboard-list text-emerald-400"></i>
                    <span id="requestsBadge" class="req-badge" style="display: none;">0</span>
                </button>
                
                <div id="requestsDropdown" class="glass rounded-3xl overflow-hidden shadow-2xl">
                    <div class="p-4 border-b border-white/10 bg-slate-800/80 flex justify-between items-center backdrop-blur-md">
                        <span class="font-bold text-sm text-white flex items-center gap-2"><i class="fas fa-clipboard-check text-emerald-400"></i> Pending Requests</span>
                        <button onclick="toggleRequests()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center hover:bg-slate-600"><i class="fas fa-times text-slate-300 text-xs"></i></button>
                    </div>
                    <div id="requestsList" class="max-h-[60vh] overflow-y-auto p-3 space-y-2 bg-slate-900/95">
                        <!-- Pending requests will load here automatically -->
                    </div>
                </div>
            </div>

            <!-- Existing: General Notifications -->
            <div class="relative">
                <button class="w-11 h-11 bg-slate-800/80 hover:bg-slate-700 rounded-2xl flex items-center justify-center transition-colors border border-white/5" onclick="toggleNotif()">
                    <i class="fas fa-bell text-slate-300"></i>
                    <span id="notifBadge" class="notify-badge">0</span>
                </button>
                
                <div id="notifDropdown" class="glass rounded-3xl overflow-hidden shadow-2xl">
                    <div class="p-4 border-b border-white/10 bg-slate-800/80 flex justify-between items-center backdrop-blur-md">
                        <span class="font-bold text-sm text-white flex items-center gap-2"><i class="fas fa-inbox text-blue-400"></i> Notifications</span>
                        <button onclick="toggleNotif()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center hover:bg-slate-600"><i class="fas fa-times text-slate-300 text-xs"></i></button>
                    </div>
                    <div id="notifList" class="max-h-[60vh] overflow-y-auto p-3 space-y-2 bg-slate-900/95">
                        <!-- Notifications load here -->
                    </div>
                </div>
            </div>
            
            <button onclick="toggleModal('addAppModal')" class="bg-blue-600 hover:bg-blue-500 w-11 h-11 rounded-2xl shadow-lg shadow-blue-600/30 flex items-center justify-center transition-all active:scale-95">
                <i class="fas fa-plus text-white"></i>
            </button>
        </div>
    </header>

    <main class="space-y-8">
        
        <!-- Balance Card -->
        <div class="glass p-8 rounded-[2.5rem] bg-gradient-to-br from-blue-600/10 via-transparent to-purple-600/10 border border-white/10 text-center relative z-10 overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-purple-500/10 rounded-full blur-3xl"></div>
            
            <h3 class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-[0.15em] flex justify-center items-center gap-2">
                Total Net Balance
                <button onclick="togglePrivacy()" class="w-8 h-8 rounded-full hover:bg-slate-800/50 flex items-center justify-center transition-colors">
                    <i id="eyeIcon" class="fas fa-eye-slash text-slate-300 text-sm"></i>
                </button>
            </h3>
            <p id="mainNetBalance" class="text-4xl md:text-5xl font-black balance-hidden tracking-tight text-white mt-2">Rs. 0</p>
        </div>

        <!-- Apps Grid Section -->
        <div>
            <h2 class="text-sm font-semibold text-slate-400 mb-4 px-2 flex items-center gap-2">
                <i class="fas fa-border-all text-slate-500"></i> My Applications
            </h2>
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 md:gap-4" id="appsGrid">
                <!-- Apps will be populated here -->
            </div>
        </div>

        <!-- Bottom Install Area -->
        <div class="flex justify-center mt-10 pb-8">
            <button id="bottomInstallBtn" class="bg-slate-800/80 text-slate-300 border border-slate-700 px-6 py-3 rounded-2xl text-xs font-bold hidden items-center gap-3 hover:bg-slate-700 transition-all shadow-xl">
                <div class="bg-blue-500/20 p-2 rounded-lg"><i class="fas fa-download text-blue-400"></i></div> 
                Install Hub App
            </button>
        </div>
    </main>

    <!-- Add Shortcut Modal -->
    <div id="addAppModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center p-4 z-[200000]">
        <div class="glass p-6 md:p-8 rounded-[2.5rem] w-full max-w-sm border border-slate-700 shadow-2xl relative">
            <button onclick="toggleModal('addAppModal')" class="absolute top-6 right-6 w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <i class="fas fa-times"></i>
            </button>
            
            <h2 class="text-xl font-bold mb-6 text-white flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center"><i class="fas fa-link text-blue-400"></i></div>
                Add Shortcut
            </h2>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs font-semibold text-slate-400 mb-1.5 block ml-1">Application Name</label>
                    <input type="text" id="newAppName" placeholder="e.g. Sales Report" class="w-full p-4 bg-slate-900/80 rounded-2xl outline-none text-sm text-white border border-slate-700 focus:border-blue-500 transition-colors shadow-inner">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 mb-1.5 block ml-1">File Link / URL</label>
                    <input type="text" id="newAppLink" placeholder="e.g. data.html" class="w-full p-4 bg-slate-900/80 rounded-2xl outline-none text-sm text-white border border-slate-700 focus:border-blue-500 transition-colors shadow-inner">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 mb-1.5 block ml-1">Select Icon</label>
                    <div id="iconGrid" class="grid grid-cols-5 gap-2 max-h-40 overflow-y-auto p-3 bg-slate-900/80 rounded-2xl border border-slate-700"></div>
                </div>
            </div>
            
            <input type="hidden" id="selectedIcon" value="fa-cube">
            <button onclick="saveApp()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl font-bold text-white shadow-lg shadow-blue-600/20 transition-all active:scale-95">
                Save Application
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com/" };
        const fbApp = initializeApp(firebaseConfig);
        const db = getDatabase(fbApp);

        // --- Core Functions ---
        window.openApp = (url) => {
            window.open(url, '_blank');
        };
        
        window.closeApp = () => {
            const overlay = document.getElementById('appOverlay');
            const closeBtn = document.getElementById('closeAppBtn');
            const frame = document.getElementById('appFrame');
            
            closeBtn.classList.remove('active');
            overlay.classList.remove('active');
            
            setTimeout(() => {
                overlay.style.display = 'none';
                closeBtn.style.display = 'none';
                frame.src = '';
                document.body.style.overflow = 'auto';
            }, 300);
        };
        
        window.toggleModal = (id) => {
            const modal = document.getElementById(id);
            if(modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.add('active'), 10);
            } else {
                modal.classList.remove('active');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        };
        
        window.toggleNotif = () => document.getElementById('notifDropdown').classList.toggle('active');
        window.toggleRequests = () => document.getElementById('requestsDropdown').classList.toggle('active');

        // Delete Function
        window.deleteApp = (e, key) => {
            e.stopPropagation();
            if(confirm("Kya aap waqai is shortcut ko delete karna chahte hain?")) {
                remove(ref(db, `cpanel_apps/${key}`));
            }
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const notifDropdown = document.getElementById('notifDropdown');
            const notifBtn = e.target.closest('button[onclick="toggleNotif()"]');
            if (notifDropdown && notifDropdown.classList.contains('active') && !notifDropdown.contains(e.target) && !notifBtn) {
                notifDropdown.classList.remove('active');
            }
            
            const reqDropdown = document.getElementById('requestsDropdown');
            const reqBtn = e.target.closest('button[onclick="toggleRequests()"]');
            if (reqDropdown && reqDropdown.classList.contains('active') && !reqDropdown.contains(e.target) && !reqBtn) {
                reqDropdown.classList.remove('active');
            }
        });

        // Privacy Toggle
        let isHidden = true;
        window.togglePrivacy = () => {
            isHidden = !isHidden;
            const bal = document.getElementById('mainNetBalance');
            const icon = document.getElementById('eyeIcon');
            if(isHidden) {
                bal.classList.add('balance-hidden');
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                bal.classList.remove('balance-hidden');
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        // --- Data Handling ---
        
        // 1. Regular Notifications listener
        onValue(ref(db, 'notifications'), snap => {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            list.innerHTML = '';
            if(snap.exists()) {
                const data = Object.values(snap.val()).reverse();
                badge.innerText = data.length > 99 ? '99+' : data.length;
                data.forEach(n => {
                    list.innerHTML += `<div class="p-4 bg-slate-800 border-l-4 border-blue-500 rounded-2xl text-[12px] mb-2 shadow-md">
                        <p class="text-slate-200 leading-relaxed font-medium">${n.text}</p>
                        <div class="flex justify-between items-center mt-3 opacity-50 text-[10px] uppercase font-bold tracking-wider">
                            <span><i class="far fa-calendar-alt mr-1"></i> ${n.date || ''}</span>
                            <span><i class="far fa-clock mr-1"></i> ${n.time || ''}</span>
                        </div>
                    </div>`;
                });
            } else {
                badge.innerText = "0";
                list.innerHTML = `<div class="py-12 text-center flex flex-col items-center justify-center opacity-40">
                    <i class="fas fa-inbox text-3xl mb-3"></i>
                    <span class="italic text-sm">No new updates</span>
                </div>`;
            }
        });

        // 2. Pending Admin Requests logic (Egg Sale / Egg Purchase)
        let usersData = {};
        let pendingPurchases = {};
        let pendingWithdrawals = {};

        onValue(ref(db, 'users'), snap => {
            usersData = snap.val() || {};
            renderRequests();
        });

        onValue(ref(db, 'purchase_requests'), snap => {
            pendingPurchases = snap.val() || {};
            renderRequests();
        });

        onValue(ref(db, 'withdraw_requests'), snap => {
            pendingWithdrawals = snap.val() || {};
            renderRequests();
        });

        function renderRequests() {
            const list = document.getElementById('requestsList');
            const badge = document.getElementById('requestsBadge');
            if(!list || !badge) return;
            
            list.innerHTML = '';
            let pendingItems = [];

            // Check Hen/Egg Purchases
            for (let key in pendingPurchases) {
                let req = pendingPurchases[key];
                if (req.status === 'pending') {
                    let uName = usersData[req.uid]?.name || 'Unknown User';
                    pendingItems.push({
                        type: 'purchase',
                        title: 'Egg Purchase Request',
                        desc: `${uName} wants to purchase ${req.quantity} Hens`,
                        time: req.timestamp || 0
                    });
                }
            }

            // Check Egg Sales / Withdrawals
            for (let key in pendingWithdrawals) {
                let req = pendingWithdrawals[key];
                if (req.status === 'pending') {
                    let uName = usersData[req.uid]?.name || 'Unknown User';
                    let amt = req.amount || req.totalPayout || 0;
                    let eggs = req.eggsSold || req.eggsDeductedCount || 0;
                    pendingItems.push({
                        type: 'sale',
                        title: 'Egg Sale Request',
                        desc: `${uName} wants to sell ${eggs} eggs (Rs. ${amt})`,
                        time: req.timestamp || 0
                    });
                }
            }

            // Sort newest first
            pendingItems.sort((a, b) => b.time - a.time);

            if (pendingItems.length > 0) {
                badge.innerText = pendingItems.length > 99 ? '99+' : pendingItems.length;
                badge.style.display = 'block';
                
                pendingItems.forEach(item => {
                    let icon = item.type === 'purchase' ? '<i class="fas fa-shopping-bag text-emerald-400 text-lg"></i>' : '<i class="fas fa-hand-holding-dollar text-yellow-400 text-lg"></i>';
                    let dateStr = item.time ? new Date(item.time).toLocaleString() : 'N/A';
                    
                    // Clicking element directly opens admin file
                    list.innerHTML += `<div class="p-3 bg-slate-800/80 border border-slate-700 rounded-xl mb-2 shadow-md cursor-pointer hover:bg-slate-700 transition" onclick="openApp('admin.html')">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center shrink-0 shadow-inner border border-white/5">
                                ${icon}
                            </div>
                            <div>
                                <p class="text-slate-200 font-bold text-xs">${item.title}</p>
                                <p class="text-blue-300 text-[11px] mt-0.5">${item.desc}</p>
                                <p class="text-slate-500 text-[9px] mt-1 font-mono">${dateStr}</p>
                            </div>
                        </div>
                    </div>`;
                });
            } else {
                badge.style.display = 'none';
                list.innerHTML = `<div class="py-12 text-center flex flex-col items-center justify-center opacity-40">
                    <i class="fas fa-check-circle text-3xl mb-3 text-emerald-500"></i>
                    <span class="italic text-xs">No pending requests</span>
                </div>`;
            }
        }

        // 3. Main Bank Balance listener
        onValue(ref(db, 'bank_accounts'), snapBanks => {
            onValue(ref(db, 'bank_transactions'), snapTrans => {
                let total = 0;
                if(snapBanks.exists()) {
                    snapBanks.forEach(bSnap => {
                        const bId = bSnap.key;
                        const bankData = bSnap.val();
                        
                        if (bankData.excludeFromBalance || bankData.isHidden) return;
                        
                        let bBal = 0;
                        if(snapTrans.exists() && snapTrans.val()[bId]) {
                            Object.values(snapTrans.val()[bId]).forEach(t => {
                                if (t.excludeFromBalance) return;
                                
                                const amt = parseFloat(t.amount || 0);
                                if(t.type === 'Income' || t.type === 'Adjustment In') {
                                    bBal += amt;
                                } else if (t.type === 'Expense' || t.type === 'Adjustment Out') {
                                    bBal -= amt;
                                }
                            });
                        }
                        total += bBal;
                    });
                }
                document.getElementById('mainNetBalance').innerText = "Rs. " + total.toLocaleString();
            });
        });

        // --- UI Rendering ---
        const iconsList = ['fa-barcode', 'fa-vault', 'fa-chart-line', 'fa-user-gear', 'fa-store', 'fa-hand-holding-dollar', 'fa-users', 'fa-sync', 'fa-wallet', 'fa-receipt', 'fa-file-invoice', 'fa-box', 'fa-calculator', 'fa-calendar-alt', 'fa-clipboard-list', 'fa-cogs', 'fa-database', 'fa-envelope', 'fa-folder-open', 'fa-globe'];
        
        const renderIconGrid = () => {
            const grid = document.getElementById('iconGrid');
            grid.innerHTML = iconsList.map(i => `
                <div id="icon-${i}" onclick="selectIcon('${i}')" class="icon-option p-3 bg-slate-800 rounded-xl text-center cursor-pointer hover:bg-slate-700 transition-colors border border-transparent">
                    <i class="fas ${i} text-lg"></i>
                </div>
            `).join('');
            selectIcon('fa-cube');
        };

        window.selectIcon = (iconName) => { 
            document.getElementById('selectedIcon').value = iconName; 
            document.querySelectorAll('.icon-option').forEach(el => el.classList.remove('selected'));
            const selectedEl = document.getElementById(`icon-${iconName}`);
            if(selectedEl) selectedEl.classList.add('selected');
        };

        renderIconGrid();

        // App Card Rendering Helper
        const renderAppCard = (a, key) => {
            const d = document.createElement('div');
            d.className = 'app-card glass p-4 md:p-5 rounded-3xl flex flex-col items-center justify-center gap-3 text-center cursor-pointer group relative';
            d.onclick = () => openApp(a.link);
            
            const deleteBtnHtml = `
            <button onclick="deleteApp(event, '${key}')" class="absolute top-2 right-2 w-6 h-6 bg-slate-800/80 border border-slate-600 text-red-400 hover:bg-red-500 hover:text-white rounded-full flex items-center justify-center transition-all z-20 shadow-md">
                <i class="fas fa-times text-[10px]"></i>
            </button>`;

            d.innerHTML = `
                ${deleteBtnHtml}
                <div class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-slate-800/80 group-hover:bg-blue-600 group-hover:scale-110 transition-all duration-300 flex items-center justify-center shadow-inner border border-white/5">
                    <i class="fas ${a.icon || 'fa-cube'} text-2xl md:text-3xl text-blue-400 group-hover:text-white transition-colors"></i>
                </div>
                <span class="text-[10px] md:text-[11px] font-bold uppercase tracking-wider text-slate-300 group-hover:text-white transition-colors line-clamp-1 w-full">${a.name}</span>
            `;
            return d;
        };

        // Render Apps (Only from Firebase)
        onValue(ref(db, 'cpanel_apps'), snap => {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            
            if(snap.exists()) {
                snap.forEach(child => {
                    grid.appendChild(renderAppCard(child.val(), child.key));
                });
            } else {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-xs italic">Koi application add nahi ki gayi. Naya shortcut bananay ke liye '+' dabayen.</div>`;
            }
        });

        window.saveApp = () => {
            const name = document.getElementById('newAppName').value.trim();
            const link = document.getElementById('newAppLink').value.trim();
            const icon = document.getElementById('selectedIcon').value;
            
            if(name && link) { 
                push(ref(db, 'cpanel_apps'), {name, link, icon}).then(() => {
                    document.getElementById('newAppName').value = '';
                    document.getElementById('newAppLink').value = '';
                    selectIcon('fa-cube');
                    toggleModal('addAppModal'); 
                });
            } else {
                alert("Please enter both Name and Link.");
            }
        };

        // --- PWA Installation Logic ---
        let deferredPrompt;
        const bottomBtn = document.getElementById('bottomInstallBtn');
        const topBannerBtn = document.getElementById('installBtn');
        const installBanner = document.getElementById('installBanner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            bottomBtn.classList.remove('hidden');
            bottomBtn.classList.add('flex');
            installBanner.classList.remove('hidden');
            installBanner.classList.add('flex');
        });

        const handleInstallClick = async () => {
            if (deferredPrompt !== null) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                    bottomBtn.classList.add('hidden');
                    bottomBtn.classList.remove('flex');
                    installBanner.classList.add('hidden');
                    installBanner.classList.remove('flex');
                }
            }
        };

        bottomBtn.addEventListener('click', handleInstallClick);
        if(topBannerBtn) topBannerBtn.addEventListener('click', handleInstallClick);

    </script>
</body>
</html>
