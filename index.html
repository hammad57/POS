<style>
    /* Naya Search UI */
    .search-box { padding: 10px; background: var(--card); margin: 10px; border-radius: 10px; }
    #searchInput { 
        width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--accent);
        background: #0f172a; color: white; box-sizing: border-box;
    }
    .search-results { 
        max-height: 300px; overflow-y: auto; margin-top: 10px; display: none;
        background: var(--card); border-radius: 10px;
    }
    .search-item {
        display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #334155;
        cursor: pointer;
    }
    .search-item img { width: 40px; height: 40px; border-radius: 5px; margin-right: 10px; }
    .search-info { flex: 1; }
    .search-info div { font-size: 14px; font-weight: bold; }
    .search-info span { font-size: 12px; color: #94a3b8; }
</style>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by Name (Eng/Urdu)..." oninput="liveSearch(this.value)">
    <div id="searchResults" class="search-results"></div>
</div>

<script>
    // URL of your Google Apps Script API (Keep your existing one)
    const API_URL = "YOUR_SCRIPT_URL_HERE"; 

    function onScanSuccess(decodedText) {
        processProduct(decodedText);
    }

    async function processProduct(barcode) {
        document.getElementById('loading-overlay').style.display = 'flex';
        
        // 1. Pehle Offline Data check karein (For speed and offline support)
        const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
        const offlineItem = localData.find(p => p.id == barcode || p.pID == barcode);

        try {
            // 2. Online fetch try karein
            const response = await fetch(API_URL + "?id=" + barcode);
            const onlineData = await response.json();
            if (onlineData && onlineData.id) {
                showProduct(onlineData);
                return;
            }
        } catch (error) {
            console.log("Offline mode or network error");
        }

        // 3. Agar online nahi mila ya net band hai, to offline item dikhayein
        if (offlineItem) {
            showProduct(offlineItem);
        } else {
            showError("Item Not Found (Offline & Online)");
        }
    }

    function liveSearch(query) {
        const resultsDiv = document.getElementById('searchResults');
        if (query.length < 2) { resultsDiv.style.display = 'none'; return; }

        const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
        const filtered = localData.filter(p => 
            (p.enName && p.enName.toLowerCase().includes(query.toLowerCase())) ||
            (p.urName && p.urName.includes(query)) ||
            (p.id && p.id.includes(query))
        );

        resultsDiv.innerHTML = "";
        if (filtered.length > 0) {
            resultsDiv.style.display = 'block';
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.onclick = () => { 
                    showProduct(p); 
                    resultsDiv.style.display = 'none';
                    document.getElementById('searchInput').value = "";
                };
                div.innerHTML = `
                    <img src="${p.img || 'https://via.placeholder.com/50'}">
                    <div class="search-info">
                        <div>${p.enName || p.en || 'No Name'}</div>
                        <span>${p.urName || p.ur || ''} | Rs. ${p.price || p.pr}</span>
                    </div>
                    <div style="font-size:10px; color:var(--accent)">${p.id || p.pID}</div>
                `;
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    }

    // Is function ko thora update kiya hai taake dono formats (API/Local) handle ho sakein
    function showProduct(data) {
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('p-en').innerText = data.enName || data.en || "No Name";
        document.getElementById('p-ur').innerText = data.urName || data.ur || "";
        document.getElementById('p-price').innerText = "Rs. " + (data.price || data.pr || "0");
        document.getElementById('p-unit').innerText = "Unit: " + (data.unit || data.un || "pc");
        document.getElementById('p-img').src = (data.img && data.img.length > 5) ? data.img : "https://via.placeholder.com/150?text=Hammad+Mart";
        
        // Barcode display ke liye agar canvas hai to:
        if(window.JsBarcode) {
            JsBarcode("#barcodeCanvas", data.id || data.pID, {format: "CODE128", height: 30});
        }

        document.getElementById('result').style.display = "block";
        html5QrcodeScanner.pause();
    }
</script>
