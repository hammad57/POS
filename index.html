<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad Mart Scanner</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Header - Hammad Mart */
        .header { padding: 18px; background: var(--card); text-align: center; border-bottom: 3px solid var(--accent); z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .mart-name { font-size: 26px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        
        /* Scanner Area */
        .scanner-container { flex: 1; position: relative; background: black; }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        
        /* Result Overlay */
        .result-overlay { 
            position: fixed; bottom: 0; left: 0; right: 0; top: 0;
            background: rgba(15, 23, 42, 0.98); 
            display: none; 
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* BIG Image Style */
        .prod-img { 
            width: 80%; 
            max-width: 300px; 
            aspect-ratio: 1/1; 
            border-radius: 20px; 
            border: 4px solid var(--accent); 
            object-fit: cover; 
            background: white; 
            box-shadow: 0 10px 40px rgba(34, 197, 94, 0.3);
            margin-bottom: 20px;
        }

        /* Names Styling */
        .name-box { text-align: center; margin-bottom: 10px; width: 100%; }
        .p-en { font-size: 22px; font-weight: bold; color: white; margin-bottom: 5px; text-transform: uppercase; }
        .p-ur { font-size: 30px; color: var(--accent); font-weight: 600; direction: rtl; }

        /* Price Styling */
        .price-tag { font-size: 64px; font-weight: 900; color: white; margin: 5px 0; letter-spacing: -2px; }
        .unit-tag { font-size: 18px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }

        /* Button */
        .btn-scan { 
            width: 90%; max-width: 350px; background: var(--accent); color: white; border: none; 
            padding: 20px; border-radius: 50px; font-size: 18px; font-weight: 900; 
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4); cursor: pointer; transition: 0.2s;
        }
        .btn-scan:active { transform: scale(0.95); }
        
        .mgr-link { position: absolute; bottom: 15px; color: #475569; text-decoration: none; font-size: 12px; font-weight: bold; }

    </style>
</head>
<body>

    <div class="header">
        <h1 class="mart-name">Hammad Mart</h1>
    </div>

    <div class="scanner-container">
        <div id="reader"></div>
    </div>

    <div id="result" class="result-overlay">
        
        <img id="p-img" class="prod-img" src="" alt="Product">
        
        <div class="name-box">
            <div class="p-en" id="p-en">Loading...</div>
            <div class="p-ur" id="p-ur">...</div>
        </div>

        <div class="price-tag" id="p-price">---</div>
        <div class="unit-tag" id="p-unit"></div>
        
        <button class="btn-scan" onclick="resetScanner()">SCAN NEXT ITEM</button>
        
        <a href="https://hammad57.github.io/POS/manager.html" class="mgr-link">ADMIN MANAGER</a>
    </div>

    <script>
        // AAPKA WEB APP URL (Version 5)
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
        
        function onScanSuccess(decodedText) {
            if (navigator.vibrate) navigator.vibrate(100); // Beep ki jagah vibration
            html5QrcodeScanner.clear();
            
            document.getElementById('result').style.display = "flex";
            document.getElementById('p-en').innerText = "FETCHING...";
            document.getElementById('p-ur').innerText = "";
            document.getElementById('p-price').innerText = "...";
            document.getElementById('p-img').src = "https://i.gifer.com/ZZ5H.gif"; // Professional loader

            fetch(`${API}?action=getDetails&id=${decodedText}`)
                .then(res => res.json())
                .then(data => {
                    if(!data.error) {
                        document.getElementById('p-en').innerText = data.enName;
                        document.getElementById('p-ur').innerText = data.urName || ""; 
                        document.getElementById('p-price').innerText = "Rs. " + data.price;
                        document.getElementById('p-unit').innerText = data.unit || "Per Item";
                        document.getElementById('p-img').src = data.img || "https://via.placeholder.com/400/1e293b/ffffff?text=Hammad+Mart";
                    } else {
                        document.getElementById('p-en').innerText = "PRODUCT NOT FOUND";
                        document.getElementById('p-price').innerText = "---";
                        document.getElementById('p-img').src = "https://via.placeholder.com/400/1e293b/ff0000?text=Error";
                    }
                })
                .catch(err => {
                    document.getElementById('p-en').innerText = "CONNECTION ERROR";
                });
        }

        function resetScanner() {
            document.getElementById('result').style.display = "none";
            location.reload();
        }

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
