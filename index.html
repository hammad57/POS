<div style="margin-bottom: 20px; padding: 10px; background: var(--white); border-radius: 10px; border: 1px solid #ddd;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Quick Find (Search to Edit/Delete):</label>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="mSearchInput" placeholder="Enter Product Name..." 
               style="flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px;">
        <button onclick="managerSearch()" style="background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 5px;">Search</button>
    </div>
    <div id="mSearchDropdown" style="display: none; position: absolute; width: calc(100% - 40px); background: white; z-index: 1000; border: 1px solid #ddd; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
</div>

<script>
// Search logic for manager.html
function managerSearch() {
    const query = document.getElementById('mSearchInput').value.toLowerCase();
    const dropdown = document.getElementById('mSearchDropdown');
    dropdown.innerHTML = '';

    if (query.length < 1) {
        dropdown.style.display = 'none';
        return;
    }

    // currentMode check: Online or Offline data
    const sourceData = (currentMode === 'online') ? allProducts : JSON.parse(localStorage.getItem('mart_data') || "[]");

    const matches = sourceData.filter(p => 
        (p.en && p.en.toLowerCase().includes(query)) || 
        (p.ur && p.ur.toLowerCase().includes(query)) ||
        (p.id && p.id.includes(query))
    );

    if (matches.length > 0) {
        matches.forEach(p => {
            const item = document.createElement('div');
            item.style = "display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer;";
            const imgSrc = (p.img && p.img.length > 5) ? p.img : "https://via.placeholder.com/50";
            item.innerHTML = `
                <img src="${imgSrc}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;">
                <div style="flex: 1;">
                    <div style="font-weight: 600;">${p.en}</div>
                    <div style="font-size: 11px; color: #666;">${p.ur || ''} | ${p.id}</div>
                </div>
                <div style="font-weight: bold; color: #22c55e;">Rs. ${p.price}</div>
            `;
            item.onclick = () => {
                editProduct(p.id); // Call existing edit function
                dropdown.style.display = 'none';
                document.getElementById('mSearchInput').value = '';
                // Focus on tab 1 if not already there
                switchTab(1); 
            };
            dropdown.appendChild(item);
        });
        dropdown.style.display = 'block';
    } else {
        dropdown.style.display = 'none';
    }
}

// Close manager dropdown on click outside
document.addEventListener('click', function(e) {
    if (!e.target.closest('#mSearchInput')) {
        document.getElementById('mSearchDropdown').style.display = 'none';
    }
});
</script>
