<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad Mart Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { padding: 15px; background: var(--card); text-align: center; border-bottom: 2px solid var(--accent); }
        .mart-name { font-size: 24px; font-weight: 800; color: var(--accent); margin: 0; text-transform: uppercase; }
        .scanner-container { flex: 1; position: relative; background: black; }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        .result-overlay { position: fixed; bottom: 0; left: 0; right: 0; top: 0; background: rgba(15, 23, 42, 0.96); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
        .prod-img { width: 75%; max-width: 280px; aspect-ratio: 1/1; border-radius: 20px; border: 4px solid var(--accent); object-fit: cover; background: white; margin-bottom: 15px; }
        .p-en { font-size: 24px; font-weight: bold; color: white; margin-bottom: 5px; }
        .p-ur { font-size: 28px; color: var(--accent); font-weight: 500; }
        .price-tag { font-size: 60px; font-weight: 900; color: white; margin: 5px 0; }
        .unit-tag { font-size: 16px; color: #94a3b8; text-transform: uppercase; margin-bottom: 20px; }
        .btn-scan { width: 90%; max-width: 350px; background: var(--accent); color: white; border: none; padding: 18px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header"><h1 class="mart-name">Hammad Mart</h1></div>
    <div class="scanner-container"><div id="reader"></div></div>
    <div id="result" class="result-overlay">
        <img id="p-img" class="prod-img" src="" alt="Product Image">
        <div style="text-align: center;">
            <div class="p-en" id="p-en">Loading...</div>
            <div class="p-ur" id="p-ur">...</div>
        </div>
        <div class="price-tag" id="p-price">---</div>
        <div class="unit-tag" id="p-unit"></div>
        <button class="btn-scan" onclick="resetScanner()">SCAN NEXT ITEM</button>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
        
        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            document.getElementById('result').style.display = "flex";
            
            fetch(`${API}?action=getDetails&id=${decodedText.trim()}`)
                .then(res => res.json())
                .then(data => {
                    if(!data.error) {
                        document.getElementById('p-en').innerText = data.enName;
                        document.getElementById('p-ur').innerText = data.urName || ""; 
                        document.getElementById('p-price').innerText = "Rs. " + data.price;
                        document.getElementById('p-unit').innerText = data.unit || "Per Item";
                        document.getElementById('p-img').src = data.img || "https://via.placeholder.com/400?text=No+Image";
                    } else {
                        document.getElementById('p-en').innerText = "Item Not Found";
                        document.getElementById('p-price').innerText = "---";
                    }
                }).catch(() => { document.getElementById('p-en').innerText = "Error Connecting"; });
        }
        function resetScanner() { location.reload(); }
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
