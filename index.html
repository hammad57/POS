<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Hammad Mart">
    <meta name="apple-mobile-web-app-title" content="Hammad Mart">
    <meta name="theme-color" content="#0f172a">
    
    <title>Hammad Mart Scanner & Live Orders</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; --blue: #3b82f6; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { padding: 15px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); z-index: 10; }
        .mart-name { font-size: 18px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 1px; }
        
        .nav-btns { display: flex; gap: 8px; }
        .btn { border: none; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-block; }
        .admin-btn { background: var(--blue); }
        .order-btn { background: #f59e0b; }
        .active-nav { outline: 2px solid white; box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        .view { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .hidden { display: none !important; }

        .search-container { padding: 10px; background: var(--card); position: relative; z-index: 100; }
        #searchInput { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 16px; }
        #searchDropdown { display: none; position: absolute; top: 100%; left: 10px; right: 10px; background: #1e293b; border: 1px solid var(--accent); border-radius: 0 0 10px 10px; max-height: 300px; overflow-y: auto; z-index: 200; }
        .search-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-bottom: 1px solid #334155; }
        #reader { width: 100% !important; background: black; }

        .result-card { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 25px; border-radius: 30px 30px 0 0; z-index: 2000; text-align: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .p-img { width: 130px; height: 130px; object-fit: contain; background: white; border-radius: 10px; }

        .order-container { padding: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; color: black; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #eee; }
        .delete-btn { background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite;"></div>
        <p>Syncing Data Please Wait...</p>
    </div>

    <div class="header">
        <div class="mart-name">HAMMAD MART</div>
        <div class="nav-btns">
            <button id="nav-scan" onclick="switchView('scanner')" class="btn order-btn active-nav">SCANNER</button>
            <a href="https://hammad57.github.io/POS/order.html" class="btn order-btn">ORDERS 📦</a>
            <a href="manager.html" class="btn admin-btn">ADMIN ⚙️</a>
        </div>
    </div>

    <div id="scanner-view" class="view">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Item..." oninput="handleSearch()" onclick="closeResult()">
            <div id="searchDropdown"></div>
        </div>
        <div id="reader"></div>
    </div>

    <div id="order-view" class="view hidden">
        <div class="order-container" id="export-area">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0;">Current Orders</h2>
                <div class="no-export">
                    <button onclick="exportImage()" class="btn" style="background:var(--blue); font-size:10px;">IMG</button>
                    <button onclick="exportPDF()" class="btn" style="background:var(--red); font-size:10px;">PDF</button>
                </div>
            </div>
            <table>
                <thead><tr><th>Item</th><th>Qty</th><th class="no-export">Action</th></tr></thead>
                <tbody id="order-list"></tbody>
            </table>
        </div>
    </div>

    <div id="result" class="result-card">
        <img id="p-img" class="p-img" src="">
        <div id="p-en" style="font-size:20px; font-weight:bold; margin-top:10px;"></div>
        <div id="p-ur" style="font-size:24px; color:#94a3b8;"></div>
        <div id="p-price" style="font-size:35px; color:var(--accent); font-weight:900;"></div>
        <button class="btn" style="background:var(--accent); width:100%; padding:15px; border-radius:12px; font-size:18px; margin-top:15px; font-weight:bold;" onclick="closeResult()">SCAN NEXT 🔄</button>
    </div>

    <script>
        // --- 1. Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", 
            projectId: "own-live-steam-web",
            storageBucket: "own-live-steam-web.appspot.com",
            messagingSenderId: "931557929949",
            appId: "1:931557929949:web:e2b28c8644369e8f49646b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. Corrected Auto Sync (No Loop) ---
        function autoSyncData() {
            const isSynced = localStorage.getItem('initial_sync_done');
            
            // Sirf tab sync karega agar pehli baar ho ya flag na ho
            if (isSynced !== 'true') {
                document.getElementById('sync-overlay').style.display = 'flex';
                db.ref('products').once('value', (snapshot) => {
                    const products = [];
                    snapshot.forEach((child) => {
                        products.push({ id: child.key, ...child.val() });
                    });
                    localStorage.setItem('mart_data', JSON.stringify(products));
                    localStorage.setItem('initial_sync_done', 'true'); // Flag set kar diya
                    document.getElementById('sync-overlay').style.display = 'none';
                    console.log("Auto sync completed.");
                }).catch(err => {
                    console.error("Sync Error:", err);
                    document.getElementById('sync-overlay').style.display = 'none';
                });
            }
        }
        window.onload = autoSyncData;

        // --- 3. Navigation ---
        function switchView(view) {
            document.getElementById('scanner-view').classList.add('hidden');
            document.getElementById('order-view').classList.add('hidden');
            document.getElementById('nav-scan').classList.remove('active-nav');
            if(view === 'scanner') {
                document.getElementById('scanner-view').classList.remove('hidden');
                document.getElementById('nav-scan').classList.add('active-nav');
            } else if(view === 'order') {
                document.getElementById('order-view').classList.remove('hidden');
            }
        }

        // --- 4. Scanner Logic ---
        const scanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
        scanner.render((id) => {
            const data = JSON.parse(localStorage.getItem('mart_data') || "[]");
            const product = data.find(p => p.id == id);
            if (product) showProduct(product);
        });

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            const data = JSON.parse(localStorage.getItem('mart_data') || "[]");
            dropdown.innerHTML = '';
            if (query.length < 1) { dropdown.style.display = 'none'; return; }
            const matches = data.filter(p => (p.en && p.en.toLowerCase().includes(query)) || (p.ur && p.ur.toLowerCase().includes(query)));
            if (matches.length > 0) {
                matches.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<img src="${p.img || 'https://via.placeholder.com/50'}" width="40"> <div><b>${p.en}</b><br><small>${p.ur}</small></div> <div style="margin-left:auto; color:var(--accent)">Rs.${p.price}</div>`;
                    item.onclick = () => { showProduct(p); dropdown.style.display = 'none'; document.getElementById('searchInput').value = ''; };
                    dropdown.appendChild(item);
                });
                dropdown.style.display = 'block';
            } else { dropdown.style.display = 'none'; }
        }

        function showProduct(p) {
            document.getElementById('p-en').innerText = p.en || "No Name";
            document.getElementById('p-ur').innerText = p.ur || "";
            document.getElementById('p-price').innerText = "Rs. " + (p.price || "0");
            document.getElementById('p-img').src = (p.img && p.img.length > 5) ? p.img : "https://via.placeholder.com/150?text=No+Image";
            document.getElementById('result').style.display = "block";
            scanner.pause();
        }

        function closeResult() {
            document.getElementById('result').style.display = "none";
            try { scanner.resume(); } catch(e) {}
        }

        function loadOrders() {
            db.ref('orders').on('value', (snap) => {
                const list = document.getElementById('order-list');
                list.innerHTML = '';
                snap.forEach((child) => {
                    const val = child.val();
                    list.innerHTML += `<tr><td>${val.itemName}</td><td>${val.quantity}</td><td class="no-export"><button class="delete-btn" onclick="deleteOrder('${child.key}')">🗑️</button></td></tr>`;
                });
            });
        }
        function deleteOrder(id) { if(confirm('Delete?')) db.ref('orders/'+id).remove(); }
        loadOrders();

        async function exportImage() {
            const el = document.getElementById('export-area');
            document.querySelectorAll('.no-export').forEach(e => e.style.opacity = '0');
            const canvas = await html2canvas(el);
            document.querySelectorAll('.no-export').forEach(e => e.style.opacity = '1');
            const link = document.createElement('a');
            link.download = 'Demand_List.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            document.querySelectorAll('.no-export').forEach(e => e.style.opacity = '0');
            html2canvas(document.getElementById('export-area')).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const imgProps = doc.getImageProperties(imgData);
                const pdfWidth = doc.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                doc.save("Demand_List.pdf");
                document.querySelectorAll('.no-export').forEach(e => e.style.opacity = '1');
            });
        }
    </script>
</body>
</html>
