<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <title>Hammad Mart - Hybrid POS</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; --blue: #3b82f6; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { padding: 15px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); z-index: 10; }
        .mart-name { font-size: 18px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 1px; }
        
        .nav-btns { display: flex; gap: 8px; }
        .btn { border: none; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-block; }
        .admin-btn { background: var(--blue); }
        .order-btn { background: #f59e0b; }
        .sync-btn { background: #8b5cf6; }
        /* C Panel Button Style */
        .cpanel-btn { background: #10b981; } 
        .active-nav { outline: 2px solid white; box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        .view { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .hidden { display: none !important; }

        .search-container { padding: 10px; background: var(--card); position: relative; z-index: 100; }
        #searchInput { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 16px; }
        #searchDropdown { display: none; position: absolute; top: 100%; left: 10px; right: 10px; background: #1e293b; border: 1px solid var(--accent); border-radius: 0 0 10px 10px; max-height: 300px; overflow-y: auto; z-index: 200; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .search-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-bottom: 1px solid #334155; cursor: pointer; }
        .status-msg { padding: 15px; font-size: 14px; text-align: center; color: #94a3b8; font-style: italic; }

        #reader { width: 100% !important; background: black; border-radius: 0 0 20px 20px; overflow: hidden; }

        .result-card { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 25px; border-radius: 30px 30px 0 0; z-index: 2000; text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.7); box-sizing: border-box; border-top: 3px solid var(--accent); }
        .p-img { width: 130px; height: 130px; object-fit: contain; background: white; border-radius: 15px; margin-bottom: 10px; }

        .order-container { padding: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; color: black; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #eee; }

        #install-prompt { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,255,0,0.4); z-index: 3000; cursor: pointer; border:none; }
    </style>
</head>
<body>

    <button id="install-prompt" onclick="installApp()">📲 Install App</button>

    <div class="header">
        <div class="mart-name">HAMMAD MART</div>
        <div class="nav-btns">
            <a href="https://hammad57.github.io/POS/dashboard.html" class="btn cpanel-btn">C PANEL 🖥️</a>
            <a href="https://hammad57.github.io/POS/data.html" class="btn sync-btn">DATA 🔄</a>
            <button id="nav-scan" onclick="switchView('scanner')" class="btn order-btn active-nav">SCANNER</button>
            <a href="order.html" class="btn order-btn">ORDERS 📦</a>
            <a href="manager.html" class="btn admin-btn">ADMIN ⚙️</a>
        </div>
    </div>

    <div id="scanner-view" class="view">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Name or Code..." oninput="handleSearch()" onclick="closeResult()">
            <div id="searchDropdown"></div>
        </div>
        <div id="reader"></div>
    </div>

    <div id="order-view" class="view hidden">
        <div class="order-container" id="export-area">
            <h2 style="color: black; margin-bottom:10px;">Live Demand List</h2>
            <table>
                <thead><tr><th>Item</th><th>Qty</th><th class="no-export">Action</th></tr></thead>
                <tbody id="order-list"></tbody>
            </table>
        </div>
    </div>

    <div id="result" class="result-card">
        <img id="p-img" class="p-img" src="">
        <div id="p-en" style="font-size:22px; font-weight:bold; color:white;"></div>
        <div id="p-ur" style="font-size:26px; color:#94a3b8; margin: 5px 0;"></div>
        <div id="p-price" style="font-size:40px; color:var(--accent); font-weight:900;"></div>
        <button class="btn" style="background:var(--accent); width:100%; padding:15px; border-radius:12px; font-size:18px; margin-top:15px;" onclick="closeResult()">CONTINUE SCANNING 🔄</button>
    </div>

    <script>
        const SHEET_API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
            authDomain: "own-live-steam-web.firebaseapp.com",
            databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", 
            projectId: "own-live-steam-web",
            storageBucket: "own-live-steam-web.appspot.com",
            messagingSenderId: "931557929949",
            appId: "1:931557929949:web:e2b28c8644369e8f49646b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(() => console.log("SW Registered"));
            }
        };

        // --- Hybrid Data Fetcher ---
        async function fetchOnlineData() {
            try {
                const response = await fetch(SHEET_API + "?action=read");
                const onlineData = await response.json();
                if (onlineData) {
                    localStorage.setItem('mart_data', JSON.stringify(onlineData));
                    return onlineData;
                }
            } catch (error) { console.error("Offline: Cannot reach API"); }
            return null;
        }

        // --- Scanner Logic ---
        const scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
        
        scanner.render(async (decodedText) => {
            const cleanId = String(decodedText).trim();
            const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
            let product = localData.find(p => String(p.id).trim() == cleanId);
            
            if (product) {
                showProduct(product);
            } else {
                // Not in memory? Search Online immediately
                const onlineData = await fetchOnlineData();
                product = onlineData ? onlineData.find(p => String(p.id).trim() == cleanId) : null;
                
                if (product) showProduct(product);
                else {
                    alert("Not Found! Code: " + cleanId);
                    scanner.pause(true); setTimeout(() => scanner.resume(), 2000);
                }
            }
        });

        // --- Search Bar Hybrid Logic ---
        let searchTimeout;
        function handleSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            
            if (query.length < 1) { dropdown.style.display = 'none'; return; }

            const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
            const localMatches = localData.filter(p => 
                (p.en && p.en.toLowerCase().includes(query)) || 
                (p.ur && p.ur.toLowerCase().includes(query)) ||
                (p.id && String(p.id).includes(query))
            );

            renderDropdown(localMatches);

            // If no local matches, search online after a short delay
            if (localMatches.length === 0) {
                dropdown.innerHTML = '<div class="status-msg">Searching online... 🔍</div>';
                dropdown.style.display = 'block';
                
                searchTimeout = setTimeout(async () => {
                    const onlineData = await fetchOnlineData();
                    if (onlineData) {
                        const onlineMatches = onlineData.filter(p => 
                            (p.en && p.en.toLowerCase().includes(query)) || 
                            (p.ur && p.ur.toLowerCase().includes(query))
                        );
                        renderDropdown(onlineMatches);
                    } else {
                        dropdown.innerHTML = '<div class="status-msg">No results found (Offline)</div>';
                    }
                }, 800);
            }
        }

        function renderDropdown(items) {
            const dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '';
            if (items.length > 0) {
                items.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `
                        <img src="${p.img || 'https://via.placeholder.com/50'}" width="40" style="border-radius:5px;"> 
                        <div style="flex:1"><b>${p.en}</b><br><small>${p.ur || ''}</small></div> 
                        <div style="color:var(--accent); font-weight:bold;">Rs.${p.price}</div>`;
                    item.onclick = () => { showProduct(p); dropdown.style.display = 'none'; document.getElementById('searchInput').value = ''; };
                    dropdown.appendChild(item);
                });
                dropdown.style.display = 'block';
            } else {
                dropdown.innerHTML = '<div class="status-msg">Item not found.</div>';
            }
        }

        function showProduct(p) {
            document.getElementById('p-en').innerText = p.en || "No Name";
            document.getElementById('p-ur').innerText = p.ur || "";
            document.getElementById('p-price').innerText = "Rs. " + (p.price || "0");
            document.getElementById('p-img').src = (p.img && p.img.length > 20) ? p.img : "https://via.placeholder.com/150?text=No+Image";
            document.getElementById('result').style.display = "block";
            try { scanner.pause(true); } catch(e) {}
        }

        function closeResult() {
            document.getElementById('result').style.display = "none";
            try { scanner.resume(); } catch(e) {}
        }

        function switchView(view) {
            document.getElementById('scanner-view').classList.toggle('hidden', view !== 'scanner');
            document.getElementById('order-view').classList.toggle('hidden', view !== 'order');
        }

        // --- Firebase Demand List ---
        db.ref('orders').on('value', (snap) => {
            const list = document.getElementById('order-list');
            list.innerHTML = '';
            if(snap.exists()){
                snap.forEach((child) => {
                    const val = child.val();
                    list.innerHTML += `<tr><td>${val.itemName}</td><td>${val.quantity}</td><td><button style="background:red; color:white; border:none; padding:5px; border-radius:4px;" onclick="db.ref('orders/${child.key}').remove()">🗑️</button></td></tr>`;
                });
            }
        });
    </script>
</body>
</html>
