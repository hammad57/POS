<div class="nav-bar">
    <div class="page-title">Hammad Mart Manager</div>
    <div style="text-align: right;">
        <button onclick="syncDataToMobile()" style="background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;">
            Update Offline Data 🔄
        </button>
        <div id="sync-time" style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">Last Sync: Never</div>
    </div>
</div>

<script>
    // URL wahi rahe ga jo aapne pehle lagaya tha
    const API = "APNA_G_SCRIPT_URL_YAHAN_RAHNE_DEN"; 

    // Mobile mein data save karne ka function
    async function syncDataToMobile() {
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "Syncing...";
        btn.disabled = true;

        try {
            const response = await fetch(API + "?action=read");
            const data = await response.json();
            
            // Local Storage mein save karna
            localStorage.setItem('mart_products', JSON.stringify(data));
            const now = new Date().toLocaleString();
            localStorage.setItem('last_sync_time', now);
            
            updateSyncUI();
            alert("Data Mobile mein save ho gaya hai! Ab aap internet ke baghair bhi scan kar sakte hain.");
        } catch (error) {
            alert("Sync fail! Internet check karein.");
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    function updateSyncUI() {
        const time = localStorage.getItem('last_sync_time');
        if(time) {
            document.getElementById('sync-time').innerText = "Last Sync: " + time;
        }
    }

    // Page load hote hi time dikhao
    window.addEventListener('load', () => {
        updateSyncUI();
        loadData(); // Purana function
    });
</script>
