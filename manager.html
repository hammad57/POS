<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 15px; }
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
        .login-box { background:white; padding:30px; border-radius:15px; text-align:center; }
        
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-save { background: #22c55e; color: white; }
        .btn-print { background: #3b82f6; color: white; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; }
        tr:hover { background: #f8fafc; cursor: pointer; }
        .del-btn { color: red; font-size: 18px; cursor: pointer; }
        .edit-btn { color: blue; font-size: 18px; cursor: pointer; margin-right: 15px; }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:20px; border-radius:15px; text-align:center; width:90%; max-width:350px; }
        #print-area { display: none; }

        @media print {
            .no-print { display: none; }
            #print-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .sticker { border: 1px solid #000; padding: 5px; text-align: center; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h2>Hammad Mart</h2>
            <input type="number" id="pin" placeholder="Enter PIN (0309)" style="font-size:20px; text-align:center;">
            <button class="btn btn-save" onclick="checkPin()">Login</button>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <div class="box no-print">
            <button class="btn btn-print" onclick="printAllLabels()">🖨️ Download All QR Labels (PDF)</button>
            <h3 id="form-title">Add/Edit Product</h3>
            <input type="hidden" id="isEdit" value="false">
            <input type="text" id="pID" placeholder="ID (e.g. 101)">
            <input type="text" id="enName" placeholder="English Name">
            <input type="text" id="urName" placeholder="Urdu Name" dir="rtl">
            <input type="number" id="price" placeholder="Price">
            <select id="unit"><option>Per Item</option><option>Per Kg</option><option>Per Liter</option></select>
            <input type="text" id="img" placeholder="Image URL">
            <button class="btn btn-save" onclick="saveData()">Save Product</button>
            <button onclick="resetForm()" style="border:none; background:none; color:blue; width:100%; margin-top:10px;">+ Clear / Add New</button>
        </div>

        <div class="box no-print">
            <h3>Inventory (Click to view QR)</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="qrModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="m-img" style="width:100px; height:100px; border-radius:10px;">
            <h3 id="m-en"></h3>
            <h4 id="m-ur" style="color:green;"></h4>
            <div id="m-qr" style="display:flex; justify-content:center; margin:15px 0;"></div>
            <p id="m-price" style="font-size:20px; font-weight:bold;"></p>
            <button class="btn" onclick="document.getElementById('qrModal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";
        let products = [];

        function checkPin() {
            if(document.getElementById('pin').value === "0309") {
                document.getElementById('auth-screen').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                loadData();
            } else { alert("Wrong PIN"); }
        }

        async function loadData() {
            const res = await fetch(API + "?action=listAll");
            products = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.onclick = () => showModal(p);
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.en}<br><small>${p.ur}</small></td>
                    <td>${p.pr}</td>
                    <td>
                        <span class="edit-btn" onclick="event.stopPropagation(); editP(${JSON.stringify(p)})">✏️</span>
                        <span class="del-btn" onclick="event.stopPropagation(); deleteP('${p.id}')">🗑️</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showModal(p) {
            document.getElementById('m-en').innerText = p.en;
            document.getElementById('m-ur').innerText = p.ur;
            document.getElementById('m-price').innerText = "Rs. " + p.pr;
            document.getElementById('m-img').src = p.img || "https://via.placeholder.com/100";
            document.getElementById('m-qr').innerHTML = "";
            new QRCode(document.getElementById('m-qr'), {text: p.id.toString(), width: 150, height: 150});
            document.getElementById('qrModal').style.display = 'flex';
        }

        function saveData() {
            const data = {
                action: document.getElementById('isEdit').value === "true" ? "update" : "add",
                id: document.getElementById('pID').value,
                enName: document.getElementById('enName').value,
                urName: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify(data)}).then(() => {
                alert("Success!");
                resetForm();
                loadData();
            });
        }

        function editP(p) {
            document.getElementById('form-title').innerText = "Edit Product";
            document.getElementById('isEdit').value = "true";
            document.getElementById('pID').value = p.id;
            document.getElementById('pID').readOnly = true;
            document.getElementById('enName').value = p.en;
            document.getElementById('urName').value = p.ur;
            document.getElementById('price').value = p.pr;
            document.getElementById('unit').value = p.un;
            document.getElementById('img').value = p.img;
        }

        function deleteP(id) {
            if(confirm("Delete this?")) {
                fetch(API, {method:'POST', mode:'no-cors', body:JSON.stringify({action:'delete', id:id})}).then(() => loadData());
            }
        }

        function resetForm() {
            document.getElementById('form-title').innerText = "Add Product";
            document.getElementById('isEdit').value = "false";
            document.getElementById('pID').value = "";
            document.getElementById('pID').readOnly = false;
            document.getElementById('enName').value = "";
            document.getElementById('urName').value = "";
            document.getElementById('price').value = "";
            document.getElementById('img').value = "";
        }

        function printAllLabels() {
            const area = document.getElementById('print-area');
            area.innerHTML = "";
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = "sticker";
                const qid = "q" + p.id;
                div.innerHTML = `<div style="font-size:10px;">${p.en}</div><div id="${qid}"></div><div style="font-size:12px;">${p.ur}</div>`;
                area.appendChild(div);
                new QRCode(document.getElementById(qid), {text: p.id.toString(), width: 80, height: 80});
            });
            setTimeout(() => window.print(), 1000);
        }
    </script>
</body>
</html>
