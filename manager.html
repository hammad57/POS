<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #22c55e; --light: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 0; margin: 0; padding-bottom: 80px;}
        
        .nav-bar { 
            background: var(--primary); padding: 15px; color: white; 
            display: flex; align-items: center; position: sticky; top: 0; z-index: 100; 
        }
        .back-btn { color: white; text-decoration: none; font-size: 24px; margin-right: 15px; cursor: pointer; }
        
        .container { max-width: 800px; margin: 15px auto; padding: 0 15px; }
        
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
        
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 14px; }
        .btn-save { background: var(--accent); }
        .btn-pdf { background: #f59e0b; grid-column: span 2; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-del { background: #ef4444; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #f8fafc; padding: 12px; text-align: left; color: #64748b; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #1e293b; cursor: pointer; }
        tr:hover { background-color: #f8fafc; }
        
        #loading { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:999; align-items:center; justify-content:center; flex-direction:column; }
        
        .barcode-preview { font-family: 'Libre Barcode 39', cursive; font-size: 30px; }
    </style>
</head>
<body>

    <div id="loading">
        <div style="border:4px solid #f3f3f3; border-top:4px solid var(--accent); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;"></div>
        <p>Working...</p>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">←</a>
        <h2 class="page-title">Hammad Mart Manager</h2>
    </div>

    <div class="container">
        <div class="box">
            <h3 id="form-header" style="margin-top:0; color:var(--primary)">Add/Edit Product</h3>
            <input type="text" id="pID" placeholder="Scan or Enter Barcode">
            <input type="text" id="enName" placeholder="Product Name (English)">
            <input type="text" id="urName" placeholder="Product Name (Urdu)">
            <input type="number" id="price" placeholder="Price (Rs.)">
            <input type="text" id="unit" placeholder="Unit (e.g. 1kg, 1pc)">
            <input type="text" id="img" placeholder="Image URL (Optional)">
            
            <div class="btn-row">
                <button class="btn btn-save" onclick="saveData()">SAVE / UPDATE</button>
                <button class="btn btn-del" onclick="deleteItem()">DELETE</button>
                <button class="btn btn-pdf" onclick="generatePDF()">📄 DOWNLOAD BARCODE LABELS (PDF)</button>
            </div>
        </div>

        <div class="box" style="padding:0; overflow-x:auto;">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID/Code</th>
                        <th>Product Name</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="productBody">
                    </tbody>
            </table>
        </div>
    </div>

    <canvas id="barcodeCanvas" style="display:none;"></canvas>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        let allProducts = [];

        async function loadData() {
            document.getElementById('loading').style.display = "flex";
            try {
                const res = await fetch(API + "?action=read");
                allProducts = await res.json();
                renderTable(allProducts);
                // Save for Offline Use
                localStorage.setItem('mart_data', JSON.stringify(allProducts));
            } catch(e) {
                console.log("Offline mode");
                allProducts = JSON.parse(localStorage.getItem('mart_data') || "[]");
                renderTable(allProducts);
            }
            document.getElementById('loading').style.display = "none";
        }

        function renderTable(data) {
            const body = document.getElementById('productBody');
            body.innerHTML = data.map(p => `
                <tr onclick="editItem('${p.id}')">
                    <td style="font-weight:bold; color:var(--accent)">${p.id}</td>
                    <td>
                        <div style="font-weight:600">${p.en}</div>
                        <div style="font-size:12px; color:#64748b">${p.ur || ''}</div>
                    </td>
                    <td>Rs. ${p.price}</td>
                </tr>
            `).join('');
        }

        function editItem(id) {
            const p = allProducts.find(item => item.id == id);
            if(p) {
                document.getElementById('pID').value = p.id;
                document.getElementById('enName').value = p.en;
                document.getElementById('urName').value = p.ur;
                document.getElementById('price').value = p.price;
                document.getElementById('unit').value = p.unit;
                document.getElementById('img').value = p.img;
                document.getElementById('form-header').innerText = "Editing: " + p.en;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function saveData() {
            const id = document.getElementById('pID').value;
            if(!id) return alert("Barcode/ID is required!");

            const payload = {
                action: 'update', // Google script handles both add/update in this logic
                id: id,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            
            document.getElementById('loading').style.display = "flex";
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            resetForm();
            loadData();
        }

        async function deleteItem() {
            const id = document.getElementById('pID').value;
            if(!id || !confirm("Delete this item?")) return;

            document.getElementById('loading').style.display = "flex";
            await fetch(API, { method: 'POST', body: JSON.stringify({action:'delete', id: id}) });
            resetForm();
            loadData();
        }

        function resetForm() {
            ['pID', 'enName', 'urName', 'price', 'unit', 'img'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('form-header').innerText = "Add/Edit Product";
        }

        // PDF GENERATION LOGIC
        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("HAMMAD MART - PRODUCT LABELS", 10, 10);
            
            let x = 10;
            let y = 20;
            const cardWidth = 60;
            const cardHeight = 40;

            document.getElementById('loading').style.display = "flex";

            for (let i = 0; i < allProducts.length; i++) {
                const p = allProducts[i];
                
                // Draw Label Box
                doc.rect(x, y, cardWidth, cardHeight);
                
                // Product Name
                doc.setFontSize(10);
                doc.text(p.en.substring(0, 25), x + 2, y + 5);
                doc.setFontSize(8);
                doc.text("Rs. " + p.price, x + 2, y + 10);

                // Generate Barcode Image using JsBarcode
                const canvas = document.getElementById('barcodeCanvas');
                JsBarcode(canvas, p.id, { format: "CODE128", width: 2, height: 40, displayValue: true });
                const imgData = canvas.toDataURL("image/jpeg");
                
                doc.addImage(imgData, 'JPEG', x + 2, y + 12, cardWidth - 4, 25);

                // Move to next position
                x += cardWidth + 5;
                if (x > 150) {
                    x = 10;
                    y += cardHeight + 5;
                }
                
                // New page if needed
                if (y > 250) {
                    doc.addPage();
                    y = 20;
                    x = 10;
                }
            }

            doc.save("Hammad_Mart_Barcodes.pdf");
            document.getElementById('loading').style.display = "none";
        }

        window.onload = loadData;
    </script>
</body>
</html>
