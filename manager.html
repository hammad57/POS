<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager (Background Sync)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #22c55e; --light: #f1f5f9; --white: #ffffff; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 80px; }
        
        /* Non-Blocking Loading Notification */
        #loading { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: var(--primary); 
            color: white; 
            padding: 12px 24px; 
            border-radius: 12px; 
            display: none; 
            align-items: center; 
            gap: 12px; 
            z-index: 9999; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-left: 5px solid var(--accent);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--accent); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .nav-bar { background: var(--primary); padding: 15px; color: white; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; font-weight: bold; }
        
        .tabs { display: flex; background: var(--primary); }
        .tab { flex: 1; padding: 15px; text-align: center; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; font-weight: bold; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }

        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #64748b; font-size: 13px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 10px; }
        .btn-secondary { background: #64748b; color: white; }
        .btn:active { transform: scale(0.98); }

        /* Product List Styles */
        .product-item { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #f1f5f9; gap: 12px; }
        .product-img { width: 50px; height: 50px; object-fit: contain; background: #f8fafc; border-radius: 8px; }
        .product-info { flex: 1; }
        .product-info h4 { margin: 0; color: #1e293b; font-size: 15px; }
        .product-info p { margin: 2px 0; color: #64748b; font-size: 12px; }
        .price-tag { color: var(--accent); font-weight: 800; font-size: 14px; }
        
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #3b82f6; color: white; padding: 8px; border-radius: 6px; border:none; font-size: 12px; }
        .del-btn { background: var(--red); color: white; padding: 8px; border-radius: 6px; border:none; font-size: 12px; }

        .search-box { position: sticky; top: 115px; z-index: 90; background: var(--light); padding: 10px 0; }
        
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span id="loading-text">Processing...</span>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Hammad Mart</a>
        <div style="font-size: 12px; opacity: 0.8;" id="sync-status">Mode: Online</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('add')">Add / Edit</div>
        <div class="tab" onclick="switchTab('list')">All Products</div>
    </div>

    <div id="add-view" class="container">
        <div class="card">
            <h3 id="form-header" style="margin-top:0; color: var(--primary);">Add New Product</h3>
            
            <button class="btn btn-secondary" style="width:100%; margin-bottom:15px;" onclick="toggleScanner()">📷 Scan Barcode</button>
            <div id="reader"></div>

            <div class="form-group">
                <label>Product ID (Barcode)</label>
                <input type="text" id="pID" placeholder="Scan or Enter ID">
            </div>

            <div class="form-group">
                <label>English Name</label>
                <input type="text" id="enName" placeholder="e.g. Sugar">
            </div>

            <div class="form-group">
                <label>Urdu Name (Urdu Keyboard Support)</label>
                <input type="text" id="urName" placeholder="مثال: چینی" dir="rtl">
            </div>

            <div class="btn-grid">
                <div class="form-group">
                    <label>Purchase Price</label>
                    <input type="number" id="purchasePrice" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Sale Price</label>
                    <input type="number" id="price" placeholder="0.00">
                </div>
            </div>

            <div class="form-group">
                <label>Unit</label>
                <select id="unit">
                    <option value="kg">KG</option>
                    <option value="piece">Piece</option>
                    <option value="pack">Pack</option>
                    <option value="ltr">Litre</option>
                </select>
            </div>

            <div class="form-group">
                <label>Image URL (Optional)</label>
                <input type="text" id="img" placeholder="https://image-link.com">
            </div>

            <button class="btn btn-primary" onclick="saveProduct()">SAVE PRODUCT ✓</button>
            <button class="btn btn-secondary" style="width:100%; margin-top:10px; background:#e2e8f0; color:#475569;" onclick="resetForm()">CLEAR FORM</button>
        </div>
    </div>

    <div id="list-view" class="container" style="display:none;">
        <div class="search-box">
            <input type="text" id="listSearch" placeholder="Search by name or ID..." oninput="filterList()">
        </div>
        <div class="card" style="padding:0; overflow:hidden;" id="product-list">
            </div>
        
        <div style="margin-top:20px;">
            <button class="btn btn-primary" style="background:#3b82f6;" onclick="generatePDF()">Download Barcode PDF 🖨️</button>
            <canvas id="barcodeCanvas" style="display:none;"></canvas>
        </div>
    </div>

    <script>
        const SHEET_API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        let allProducts = [];
        let selectedID = null;
        let scanner = null;

        // --- Tab Switching ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if(tab === 'add') {
                document.getElementById('add-view').style.display = 'block';
                document.getElementById('list-view').style.display = 'none';
            } else {
                document.getElementById('add-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                loadData();
            }
        }

        // --- Scanner Logic ---
        function toggleScanner() {
            const readerDiv = document.getElementById('reader');
            if(readerDiv.style.display === 'block') {
                scanner.clear();
                readerDiv.style.display = 'none';
            } else {
                readerDiv.style.display = 'block';
                scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                scanner.render((id) => {
                    document.getElementById('pID').value = id;
                    toggleScanner();
                });
            }
        }

        // --- Background Loader Toggle ---
        function showLoader(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading').style.display = 'flex';
        }
        function hideLoader() {
            document.getElementById('loading').style.display = 'none';
        }

        // --- CRUD Operations ---
        async function loadData() {
            showLoader("Refreshing List...");
            try {
                const res = await fetch(SHEET_API + "?action=read");
                allProducts = await res.json();
                localStorage.setItem('mart_data', JSON.stringify(allProducts));
                renderList(allProducts);
            } catch(e) {
                console.log("Offline or Error");
                const local = localStorage.getItem('mart_data');
                if(local) renderList(JSON.parse(local));
            } finally {
                hideLoader();
            }
        }

        function renderList(data) {
            const listDiv = document.getElementById('product-list');
            listDiv.innerHTML = data.map(p => `
                <div class="product-item">
                    <img class="product-img" src="${p.img || 'https://via.placeholder.com/50'}">
                    <div class="product-info">
                        <h4>${p.en}</h4>
                        <p>${p.ur || ''}</p>
                        <span class="price-tag">Rs. ${p.price}</span> <small style="color:#94a3b8">(${p.id})</small>
                    </div>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editProduct('${p.id}')">✏️</button>
                        <button class="del-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function saveProduct() {
            const data = {
                action: selectedID ? "update" : "add",
                id: document.getElementById('pID').value,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                pp: document.getElementById('purchasePrice').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };

            if(!data.id || !data.en || !data.price) { alert("ID, Name and Price are required!"); return; }

            // Step 1: Show background loader
            showLoader("Saving to Sheet...");
            
            // Step 2: Clear form immediately so user can keep working
            resetForm();
            
            // Step 3: Send data in background
            try {
                await fetch(SHEET_API, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                console.log("Product Saved Successfully");
                loadData(); // Background refresh
            } catch(e) {
                alert("Network Error! Product might not have saved.");
            } finally {
                hideLoader();
            }
        }

        async function deleteProduct(id) {
            if(!confirm("Are you sure you want to delete this?")) return;
            
            showLoader("Deleting Item...");
            try {
                await fetch(SHEET_API, {
                    method: "POST",
                    body: JSON.stringify({action: "delete", id: id})
                });
                loadData();
            } catch(e) { alert("Delete Failed"); }
            finally { hideLoader(); }
        }

        function editProduct(id) {
            const p = allProducts.find(item => item.id == id);
            if(p) {
                selectedID = p.id;
                document.getElementById('pID').value = p.id;
                document.getElementById('enName').value = p.en;
                document.getElementById('urName').value = p.ur || "";
                document.getElementById('purchasePrice').value = p.pp || "";
                document.getElementById('price').value = p.price;
                document.getElementById('unit').value = p.unit || "kg";
                document.getElementById('img').value = p.img || "";
                
                document.getElementById('form-header').innerText = "Update Product";
                switchTab('add');
            }
        }

        function resetForm() {
            selectedID = null;
            ['pID', 'enName', 'urName', 'purchasePrice', 'price', 'img'].forEach(i => document.getElementById(i).value = "");
            document.getElementById('unit').value = "kg";
            document.getElementById('form-header').innerText = "Add New Product";
        }

        function filterList() {
            const q = document.getElementById('listSearch').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.en.toLowerCase().includes(q) || 
                (p.ur && p.ur.toLowerCase().includes(q)) || 
                p.id.toString().includes(q)
            );
            renderList(filtered);
        }

        // --- PDF Generation ---
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let x = 10, y = 10;
            
            showLoader("Preparing PDF...");
            
            allProducts.forEach((p, index) => {
                doc.setFontSize(8);
                doc.text(p.en.substring(0, 20), x, y);
                doc.text("Rs. " + p.price, x, y + 3);
                
                const canvas = document.getElementById('barcodeCanvas');
                try {
                    JsBarcode(canvas, p.id, {format: "CODE128", height: 25, displayValue: false});
                    doc.addImage(canvas.toDataURL(), 'PNG', x, y + 4, 30, 10);
                } catch(err) { console.error("Barcode Error", err); }

                x += 40;
                if(x > 170) { x = 10; y += 25; }
                if(y > 270) { doc.addPage(); y = 10; }
            });
            
            doc.save("Hammad_Mart_Barcodes.pdf");
            hideLoader();
        }

        // Initial Load
        window.onload = loadData;
    </script>
</body>
</html>
