<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 15px; }
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; }
        .btn-save { background: #22c55e; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #1e293b; color: white; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🛒 Add Product</h2>
        <input type="number" id="pID" placeholder="Product Barcode / ID">
        <input type="text" id="enName" placeholder="English Name">
        <input type="text" id="urName" placeholder="Urdu Name">
        <input type="number" id="price" placeholder="Price (Rs.)">
        <input type="text" id="unit" placeholder="Unit (e.g. 1kg)">
        <input type="text" id="img" placeholder="Image URL">
        <button class="btn btn-save" onclick="saveData()">SAVE PRODUCT</button>
    </div>

    <div class="box" style="overflow-x: auto;">
        <h3>Live Product List</h3>
        <table>
            <thead><tr><th>ID</th><th>Img</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";

        function loadData() {
            fetch(`${API}?action=read`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('table-body');
                    tbody.innerHTML = data.map(p => `
                        <tr>
                            <td>${p.id}</td>
                            <td><img src="${p.img}" class="img-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                            <td>${p.en}<br><small>${p.ur}</small></td>
                            <td>Rs. ${p.price}</td>
                            <td><button style="background:red; color:white; border:none; padding:5px; border-radius:5px;" onclick="deleteItem('${p.id}')">Del</button></td>
                        </tr>
                    `).join('');
                });
        }

        function saveData() {
            const payload = {
                action: 'add',
                id: document.getElementById('pID').value,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            fetch(API, { method: 'POST', body: JSON.stringify(payload) }).then(() => { alert("Saved!"); loadData(); });
        }

        function deleteItem(id) {
            if(confirm("Delete it?")) {
                fetch(API, { method: 'POST', body: JSON.stringify({action:'delete', id:id}) }).then(() => loadData());
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
