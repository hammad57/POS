<div style="margin-bottom: 20px; padding: 15px; background: var(--white); border-radius: 12px; border: 2px solid var(--primary); position: relative;">
    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary);">🔍 Quick Search (Edit/Delete):</label>
    <div style="display: flex; gap: 8px;">
        <input type="text" id="mSearchInput" placeholder="Type Product Name (Urdu/English)..." 
               style="flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;" oninput="managerSearch()">
    </div>
    <div id="mSearchDropdown" style="display: none; position: absolute; left: 0; right: 0; top: 100%; background: white; z-index: 1000; border: 1px solid #ddd; max-height: 250px; overflow-y: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 0 0 10px 10px;"></div>
</div>

<script>
function managerSearch() {
    const query = document.getElementById('mSearchInput').value.toLowerCase();
    const dropdown = document.getElementById('mSearchDropdown');
    dropdown.innerHTML = '';

    if (query.length < 1) {
        dropdown.style.display = 'none';
        return;
    }

    // Checking currentMode (Assuming allProducts is your global data array)
    const sourceData = (typeof currentMode !== 'undefined' && currentMode === 'online') ? allProducts : JSON.parse(localStorage.getItem('mart_data') || "[]");

    const matches = sourceData.filter(p => 
        (p.en && p.en.toLowerCase().includes(query)) || 
        (p.ur && p.ur.toLowerCase().includes(query)) ||
        (p.id && p.id.toString().includes(query))
    );

    if (matches.length > 0) {
        matches.forEach(p => {
            const item = document.createElement('div');
            item.style = "display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer;";
            const imgSrc = (p.img && p.img.length > 5) ? p.img : "https://via.placeholder.com/50";
            item.innerHTML = `
                <img src="${imgSrc}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #f0f0f0;">
                <div style="flex: 1;">
                    <div style="font-weight: bold; color: #333;">${p.en}</div>
                    <div style="font-size: 12px; color: #666;">${p.ur || ''} | Code: ${p.id}</div>
                </div>
                <div style="font-weight: 800; color: #22c55e;">Rs. ${p.price || p.pr}</div>
            `;
            item.onclick = () => {
                // Clicking will fill the full detail into your existing form
                if(typeof editProduct === 'function') {
                    editProduct(p.id); 
                } else {
                    // Fallback: Manually fill if editProduct is not accessible
                    document.getElementById('pID').value = p.id;
                    document.getElementById('enName').value = p.en;
                    document.getElementById('urName').value = p.ur || '';
                    document.getElementById('price').value = p.price || p.pr;
                    document.getElementById('img').value = p.img || '';
                    if(document.getElementById('unit')) document.getElementById('unit').value = p.unit || p.un || '';
                }
                dropdown.style.display = 'none';
                document.getElementById('mSearchInput').value = '';
            };
            dropdown.appendChild(item);
        });
        dropdown.style.display = 'block';
    } else {
        dropdown.style.display = 'none';
    }
}

// Close dropdown when clicking elsewhere
document.addEventListener('click', function(e) {
    if (!e.target.closest('#mSearchInput')) {
        document.getElementById('mSearchDropdown').style.display = 'none';
    }
});
</script>
