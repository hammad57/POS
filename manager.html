<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad Mart Scanner</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); 
            color: var(--text); margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden;
        }
        
        .header { 
            padding: 15px; background: var(--card); 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--accent); z-index: 10;
        }
        .mart-name { font-size: 20px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 1px; }
        .admin-btn { background: #3b82f6; color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; }

        #reader { width: 100% !important; border: none !important; flex-grow: 1; }
        #reader__scan_region { background: #000; }
        #reader__dashboard { display: none !important; }

        .result-card {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); padding: 25px;
            border-top-left-radius: 25px; border-top-right-radius: 25px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
            display: none; z-index: 100; animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .p-img { width: 120px; height: 120px; object-fit: cover; border-radius: 15px; background: #fff; margin: 0 auto 15px; display: block; border: 3px solid var(--accent); }
        .p-name { font-size: 22px; font-weight: bold; text-align: center; margin: 5px 0; color: var(--accent); }
        .p-ur { font-size: 20px; text-align: center; margin-bottom: 10px; color: #94a3b8; }
        .price-tag { font-size: 28px; font-weight: 800; text-align: center; color: #fff; background: var(--accent); padding: 10px; border-radius: 12px; margin: 15px 0; }
        .p-info { display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 15px; color: #94a3b8; font-size: 14px; }

        .close-btn { width: 100%; padding: 15px; background: #334155; color: white; border: none; border-radius: 10px; margin-top: 15px; font-weight: 600; cursor: pointer; }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); display: none;
            justify-content: center; align-items: center; z-index: 200; flex-direction: column;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #error-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #ef4444; color: white; padding: 20px; border-radius: 15px;
            display: none; z-index: 300; text-align: center; width: 80%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="mart-name">HAMMAD MART</h1>
        <a href="manager.html" class="admin-btn">Manager</a>
    </div>

    <div id="reader"></div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Checking Inventory...</p>
    </div>

    <div id="error-popup">
        <h3 style="margin: 0 0 10px 0;">Item Not Found!</h3>
        <p id="error-msg">Product detail not available in local data.</p>
        <button onclick="hideError()" style="margin-top: 10px; padding: 10px 20px; border-radius: 5px; border: none; background: white; color: #ef4444; font-weight: bold;">SCAN AGAIN</button>
    </div>

    <div id="result" class="result-card">
        <img id="p-img" src="" class="p-img">
        <div id="p-en" class="p-name">Product Name</div>
        <div id="p-ur" class="p-ur">نام</div>
        <div id="p-price" class="price-tag">Rs. 00</div>
        <div class="p-info">
            <span id="p-id">Barcode: 000</span>
            <span id="p-unit">Unit: pc</span>
        </div>
        <button class="close-btn" onclick="closeResult()">SCAN NEXT ITEM</button>
    </div>

    <audio id="beep" src="https://www.soundjay.com/buttons/beep-07a.mp3"></audio>

    <script>
        // Service Worker Registration for Offline Refresh
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log("SW error", err));
        }

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQp7W6L-x-F_yRz9A8z4F5q_K_mX9zO5_g/exec"; 

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 20, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        });

        function onScanSuccess(decodedText) {
            document.getElementById('beep').play();
            html5QrcodeScanner.pause();
            fetchProduct(decodedText);
        }

        async function fetchProduct(id) {
            document.getElementById('loading-overlay').style.display = 'flex';
            
            // 1. Pehly LOCAL DATA check karein (LocalStorage)
            const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
            const localProduct = localData.find(p => String(p.id) === String(id) || String(p.pID) === String(id));

            if (localProduct) {
                console.log("Showing from local storage");
                showProduct(localProduct);
                return;
            }

            // 2. Agar local nahi mila to INTERNET check karein
            if (navigator.onLine) {
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=read&id=${id}`);
                    const data = await response.json();
                    if (data.status === "success") {
                        showProduct(data.data);
                    } else {
                        showError("Product not found in system.");
                    }
                } catch (error) {
                    showError("Error connecting to server.");
                }
            } else {
                showError("Offline: Product not saved locally.");
            }
        }

        function showProduct(data) {
            document.getElementById('loading-overlay').style.display = 'none';
            
            // Naming mapping for Local vs API
            document.getElementById('p-en').innerText = data.en || data.enName || "No Name";
            document.getElementById('p-ur').innerText = data.ur || data.urName || "";
            document.getElementById('p-price').innerText = "Rs. " + (data.pr || data.price || "0");
            document.getElementById('p-unit').innerText = "Unit: " + (data.un || data.unit || "pc");
            document.getElementById('p-id').innerText = "Barcode: " + (data.id || data.pID || "");
            
            let imgUrl = data.img || "";
            document.getElementById('p-img').src = (imgUrl.length > 10) ? imgUrl : "https://via.placeholder.com/150?text=No+Image";
            
            document.getElementById('result').style.display = "block";
        }

        function showError(msg) {
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('error-msg').innerText = msg;
            document.getElementById('error-popup').style.display = "block";
        }

        function hideError() {
            document.getElementById('error-popup').style.display = "none";
            html5QrcodeScanner.resume();
        }

        function closeResult() {
            document.getElementById('result').style.display = "none";
            html5QrcodeScanner.resume();
        }

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
