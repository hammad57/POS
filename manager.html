<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --primary: #1e293b; --accent: #22c55e; --light: #f1f5f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 80px; }
        
        .nav-bar { background: var(--primary); padding: 15px; color: white; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; margin-right: 10px; }
        
        .tabs { display: flex; background: var(--primary); border-bottom: 1px solid #334155; }
        .tab { flex: 1; padding: 15px; text-align: center; color: #94a3b8; cursor: pointer; font-weight: bold; }
        .tab.active { color: var(--accent); border-bottom: 3px solid var(--accent); }

        .container { max-width: 800px; margin: 15px auto; padding: 0 15px; }
        .box { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; color: white; }
        .btn-save { background: var(--accent); }
        .btn-sync { background: #3b82f6; margin-top: 10px; }
        .btn-pdf { background: #f59e0b; margin-top: 15px; }
        /* Camera Button Style */
        .btn-cam { background: #64748b; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .sync-info { font-size: 12px; color: #64748b; text-align: center; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .p-name-cell { font-weight: 600; color: #1e293b; }
        .p-price-cell { color: var(--accent); font-weight: bold; text-align: right; }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index: 2000; align-items:center; justify-content:center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; text-align: center; position: relative; }
        .modal-img { width: 120px; height: 120px; object-fit: contain; border-radius: 10px; border: 1px solid #eee; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; }
        .modal-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-edit { background: #3b82f6; }
        .btn-del { background: #ef4444; }

        /* Camera Overlay Styles */
        #camOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 3000; flex-direction: column; }
        #videoFeed { width: 100%; height: 70%; object-fit: cover; }
        #capturedCanvas { display: none; width: 100%; height: 70%; object-fit: contain; background: black; }
        .cam-controls { height: 30%; background: #1e293b; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding: 20px; }
        .cam-btn { padding: 12px 30px; border-radius: 30px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: white; width: 80%; }
        .btn-snap { background: white; color: black; height: 60px; width: 60px; border-radius: 50%; padding: 0; border: 4px solid #ccc; }
        .btn-retake { background: #ef4444; }
        .btn-approve { background: var(--accent); }
        .btn-close-cam { background: transparent; color: #94a3b8; margin-top: 10px; }

        #loading { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; align-items:center; justify-content:center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loading">
        <div style="border:4px solid #f3f3f3; border-top:4px solid var(--accent); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;"></div>
        <p>Syncing Data...</p>
    </div>

    <div id="camOverlay">
        <video id="videoFeed" autoplay playsinline></video>
        <canvas id="capturedCanvas"></canvas>
        
        <div class="cam-controls">
            <div id="state-capture" style="display:flex; flex-direction:column; align-items:center; width:100%;">
                <button class="btn-snap" onclick="takePicture()"></button>
                <button class="btn-close-cam" onclick="closeCamera()">Cancel</button>
            </div>
            
            <div id="state-review" style="display:none; flex-direction:column; align-items:center; width:100%; gap:10px;">
                <button class="cam-btn btn-approve" onclick="approvePicture()">✅ Approve</button>
                <button class="cam-btn btn-retake" onclick="retakePicture()">🔄 Retake</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">←</a>
        <h2 style="margin:0; font-size: 18px;">Hammad Mart Manager</h2>
    </div>

    <div class="tabs">
        <div id="tab-online" class="tab active" onclick="switchTab('online')">ONLINE LIST</div>
        <div id="tab-offline" class="tab" onclick="switchTab('offline')">OFFLINE (Local)</div>
    </div>

    <div class="container">
        <div class="box">
            <h3 id="form-header" style="margin-top:0;">Add New Product</h3>
            <input type="text" id="pID" placeholder="Barcode ID">
            <input type="text" id="enName" placeholder="English Name">
            <input type="text" id="urName" placeholder="Urdu Name">
            <input type="number" id="price" placeholder="Price">
            <input type="text" id="unit" placeholder="Unit (e.g 1kg)">
            
            <div style="display: flex; gap: 5px;">
                <input type="text" id="img" placeholder="Image URL (or take photo)" style="margin-bottom: 0;">
                <button class="btn btn-cam" style="width: auto; margin-bottom: 0;" onclick="openCamera()">📸</button>
            </div>
            <p style="font-size: 10px; color: #64748b; margin-top: 5px; margin-bottom: 10px;">Click Camera to take photo or paste URL manually.</p>

            <button class="btn btn-save" onclick="saveData()">SAVE TO CLOUD</button>
            
            <button class="btn btn-sync" onclick="loadData()">🔄 SYNC GOOGLE SHEET</button>
            <div id="lastSync" class="sync-info">Last Update: Never</div>
            
            <button class="btn btn-pdf" onclick="generatePDF()">📄 PRINT ALL BARCODE LABELS</button>
        </div>

        <div class="box" style="padding:0;">
            <table id="productTable">
                <tbody id="productBody"></tbody>
            </table>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="mImg" class="modal-img" src="">
            <h2 id="mEn" style="margin:10px 0 5px 0;"></h2>
            <h3 id="mUr" style="color:#64748b; margin:0;"></h3>
            <h1 id="mPrice" style="color:var(--accent); margin:15px 0;"></h1>
            <p id="mUnit" style="color:#94a3b8;"></p>
            <div class="modal-btn-row">
                <button class="btn btn-edit" onclick="startEdit()">EDIT</button>
                <button class="btn btn-del" onclick="deleteItem()">DELETE</button>
            </div>
        </div>
    </div>

    <canvas id="barcodeCanvas" style="display:none;"></canvas>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        let allProducts = [];
        let currentEditingId = null;
        let currentMode = 'online';

        // --- CAMERA LOGIC START ---
        let videoStream = null;

        async function openCamera() {
            const overlay = document.getElementById('camOverlay');
            const video = document.getElementById('videoFeed');
            
            overlay.style.display = 'flex';
            document.getElementById('state-capture').style.display = 'flex';
            document.getElementById('state-review').style.display = 'none';
            document.getElementById('capturedCanvas').style.display = 'none';
            video.style.display = 'block';

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = videoStream;
            } catch (err) {
                alert("Camera Access Denied or Not Available");
                closeCamera();
            }
        }

        function takePicture() {
            const video = document.getElementById('videoFeed');
            const canvas = document.getElementById('capturedCanvas');
            const context = canvas.getContext('2d');

            // Set canvas dimensions to match video (Resizing for Google Sheet Limit)
            // We limit width to 300px to keep the Base64 string small enough for Sheets
            const scaleFactor = 300 / video.videoWidth;
            canvas.width = 300;
            canvas.height = video.videoHeight * scaleFactor;

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Switch UI to Review Mode
            video.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('state-capture').style.display = 'none';
            document.getElementById('state-review').style.display = 'flex';
        }

        function retakePicture() {
            document.getElementById('videoFeed').style.display = 'block';
            document.getElementById('capturedCanvas').style.display = 'none';
            document.getElementById('state-capture').style.display = 'flex';
            document.getElementById('state-review').style.display = 'none';
        }

        function approvePicture() {
            const canvas = document.getElementById('capturedCanvas');
            // Low quality (0.6) to reduce size further
            const dataURL = canvas.toDataURL('image/jpeg', 0.6); 
            
            document.getElementById('img').value = dataURL;
            closeCamera();
        }

        function closeCamera() {
            const overlay = document.getElementById('camOverlay');
            overlay.style.display = 'none';
            
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }
        // --- CAMERA LOGIC END ---

        async function loadData() {
            document.getElementById('loading').style.display = "flex";
            try {
                const res = await fetch(API + "?action=read");
                allProducts = await res.json();
                
                // Local Storage Update
                localStorage.setItem('mart_data', JSON.stringify(allProducts));
                const now = new Date().toLocaleString();
                localStorage.setItem('last_sync', now);
                
                updateSyncUI(now);
                renderTable(allProducts);
            } catch(e) {
                alert("Internet connection error! Switching to Offline.");
                switchTab('offline');
            }
            document.getElementById('loading').style.display = "none";
        }

        function updateSyncUI(time) {
            document.getElementById('lastSync').innerText = "Last Update: " + (time || "Never");
        }

        function renderTable(data) {
            const body = document.getElementById('productBody');
            body.innerHTML = data.map(p => `
                <tr onclick="openModal('${p.id}')">
                    <td class="p-name-cell">${p.en}<br><small style="color:#64748b">${p.id}</small></td>
                    <td class="p-price-cell">Rs. ${p.price}</td>
                </tr>
            `).join('');
        }

        function switchTab(type) {
            currentMode = type;
            document.getElementById('tab-online').classList.toggle('active', type === 'online');
            document.getElementById('tab-offline').classList.toggle('active', type === 'offline');
            
            if(type === 'offline') {
                allProducts = JSON.parse(localStorage.getItem('mart_data') || "[]");
                updateSyncUI(localStorage.getItem('last_sync'));
                renderTable(allProducts);
            } else {
                loadData();
            }
        }

        function openModal(id) {
            const p = allProducts.find(item => item.id == id);
            if(!p) return;
            currentEditingId = id;
            document.getElementById('mImg').src = p.img || "https://via.placeholder.com/150";
            document.getElementById('mEn').innerText = p.en;
            document.getElementById('mUr').innerText = p.ur || "";
            document.getElementById('mPrice').innerText = "Rs. " + p.price;
            document.getElementById('mUnit').innerText = "Unit: " + (p.unit || "1pc");
            document.getElementById('detailModal').style.display = "flex";
        }

        function closeModal() { document.getElementById('detailModal').style.display = "none"; }

        function startEdit() {
            const p = allProducts.find(item => item.id == currentEditingId);
            document.getElementById('pID').value = p.id;
            document.getElementById('enName').value = p.en;
            document.getElementById('urName').value = p.ur;
            document.getElementById('price').value = p.price;
            document.getElementById('unit').value = p.unit;
            document.getElementById('img').value = p.img;
            document.getElementById('form-header').innerText = "Editing: " + p.en;
            closeModal();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function saveData() {
            const payload = {
                action: 'update',
                id: document.getElementById('pID').value,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            document.getElementById('loading').style.display = "flex";
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            loadData();
            resetForm();
        }

        async function deleteItem() {
            if(!confirm("Delete this item permanently?")) return;
            document.getElementById('loading').style.display = "flex";
            await fetch(API, { method: 'POST', body: JSON.stringify({action:'delete', id: currentEditingId}) });
            closeModal();
            loadData();
        }

        function resetForm() {
            ['pID', 'enName', 'urName', 'price', 'unit', 'img'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('form-header').innerText = "Add New Product";
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let x = 10, y = 10;
            allProducts.forEach((p) => {
                doc.setFontSize(8);
                doc.text(p.en.substring(0,20), x, y);
                doc.text("Rs." + p.price, x, y + 4);
                const canvas = document.getElementById('barcodeCanvas');
                JsBarcode(canvas, p.id, {format: "CODE128", height: 30, displayValue: false});
                doc.addImage(canvas.toDataURL("image/jpeg"), 'JPEG', x, y + 5, 35, 15);
                x += 45;
                if(x > 160) { x = 10; y += 30; }
                if(y > 270) { doc.addPage(); y = 10; x = 10; }
            });
            doc.save("Hammad_Mart_Labels.pdf");
        }

        window.onload = () => {
            const savedTime = localStorage.getItem('last_sync');
            updateSyncUI(savedTime);
            switchTab('offline'); // Pehle offline data dikhao for speed
        };
    </script>
</body>
</html>
