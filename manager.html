<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hammad Mart - Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e293b; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #22c55e; padding-bottom: 10px; }
        label { font-size: 13px; font-weight: bold; color: #475569; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        .btn-add { background: #22c55e; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.2s; }
        .btn-add:hover { background: #16a34a; }
        
        /* Grid for Stickers */
        #print-area { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .sticker { border: 1px solid #e2e8f0; padding: 10px; text-align: center; background: white; border-radius: 8px; page-break-inside: avoid; }
        
        @media print { 
            .no-print { display: none; } 
            body { background: white; padding: 0; }
            #print-area { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        }
    </style>
</head>
<body>
    <div class="box no-print">
        <h2>🛒 Hammad Mart Manager</h2>
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>Product ID (Code)</label>
                <input type="text" id="pID" placeholder="101">
            </div>
            <div style="flex:1;">
                <label>Retail Price (Rs)</label>
                <input type="number" id="price" placeholder="0">
            </div>
        </div>
        
        <label>English Name</label>
        <input type="text" id="enName" placeholder="e.g. LUX SOAP">
        
        <label>Urdu Name (اردو نام)</label>
        <input type="text" id="urName" placeholder="مثلاً لکس صابن" dir="rtl">
        
        <label>Unit</label>
        <select id="unit">
            <option value="Per Item">Per Item (دانہ)</option>
            <option value="Per Kg">Per Kg (کلو)</option>
            <option value="Per Liter">Per Liter (لیٹر)</option>
            <option value="Per Pack">Per Pack (پیکٹ)</option>
            <option value="Per Dozen">Per Dozen (درجن)</option>
        </select>
        
        <label>Image URL (Optional)</label>
        <input type="text" id="img" placeholder="https://...">
        
        <button class="btn-add" onclick="save()">✅ Add Product & Print</button>
        <button onclick="window.print()" style="margin-top:10px; width:100%; padding:12px; border-radius:8px; border:1px solid #94a3b8; cursor:pointer; background: #64748b; color: white; font-weight:bold;">🖨️ Print Labels</button>
    </div>

    <div id="print-area"></div>

    <script>
        // NEW VERSION 5 URL
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";

        function save() {
            const id = document.getElementById('pID').value;
            const en = document.getElementById('enName').value;
            const ur = document.getElementById('urName').value;
            const pr = document.getElementById('price').value;
            const un = document.getElementById('unit').value;
            const im = document.getElementById('img').value;

            if(!id || !en || !pr) return alert("ID, Name aur Price likhna zaroori hai!");

            const data = { id: id, enName: en, urName: ur, price: pr, unit: un, img: im };

            // Data Google Sheet bhejna
            fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });

            // Sticker Banana
            const div = document.createElement('div');
            div.className = 'sticker';
            div.innerHTML = `
                <div style="font-size:11px; font-weight:bold; height:20px; overflow:hidden; margin-bottom:5px;">${en}</div>
                <div id="q-${id}" style="display:flex; justify-content:center;"></div>
                <div style="font-size:9px; color:gray; margin-top:5px;">SCAN FOR PRICE</div>
            `;
            document.getElementById('print-area').appendChild(div);
            
            new QRCode(document.getElementById(`q-${id}`), { text: id, width: 90, height: 90 });

            // Clear inputs
            document.getElementById('pID').value = '';
            document.getElementById('enName').value = '';
            document.getElementById('price').value = '';
        }
    </script>
</body>
</html>
