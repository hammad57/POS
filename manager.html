<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 15px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e293b; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-add { background: #22c55e; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #print-area { margin-top: 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .sticker { border: 1px solid #ccc; padding: 10px; text-align: center; background: white; }
    </style>
</head>
<body>
    <div class="box no-print">
        <h2>🛒 Hammad Mart Manager</h2>
        <input type="text" id="pID" placeholder="Product ID (e.g. 101)">
        <input type="text" id="enName" placeholder="English Name">
        <input type="text" id="urName" placeholder="اردو نام (Urdu Name)" dir="rtl">
        <input type="number" id="price" placeholder="Price (Rs)">
        <select id="unit">
            <option value="Per Kg">Per Kg</option>
            <option value="Per Item">Per Item</option>
            <option value="Per Liter">Per Liter</option>
            <option value="Per Pack">Per Pack</option>
        </select>
        <input type="text" id="img" placeholder="Image Link (Direct URL)">
        <button class="btn-add" onclick="save()">Save & Generate QR</button>
        <button onclick="window.print()" style="margin-top:10px; width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; cursor:pointer;">Print Labels</button>
    </div>
    <div id="print-area"></div>

    <script>
        const API = "APNA_NEW_WEB_APP_URL_YAHAN_DAALEIN";

        function save() {
            const data = {
                id: document.getElementById('pID').value,
                enName: document.getElementById('enName').value,
                urName: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };

            fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });

            const div = document.createElement('div');
            div.className = 'sticker';
            div.innerHTML = `<div style="font-size:10px; font-weight:bold;">${data.enName}</div><div id="q-${data.id}"></div>`;
            document.getElementById('print-area').appendChild(div);
            new QRCode(document.getElementById(`q-${data.id}`), { text: data.id, width: 80, height: 80 });
        }
    </script>
</body>
</html>
