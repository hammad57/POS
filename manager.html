<!DOCTYPE html>
<html>
<head>
    <title>Manager - Hammad Mart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 15px; }
        .nav { background: #1e293b; color: white; padding: 15px; margin: -15px -15px 20px -15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-sync { background: #22c55e; color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-save { background: #1e293b; color: white; width: 100%; padding: 15px; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <span>Manager Panel</span>
        <button class="btn-sync" onclick="sync()">UPDATE DATA 🔄</button>
    </div>

    <div class="card">
        <input type="text" id="id" placeholder="Barcode ID">
        <input type="text" id="en" placeholder="English Name">
        <input type="text" id="ur" placeholder="Urdu Name">
        <input type="text" id="pr" placeholder="Price">
        <input type="text" id="un" placeholder="Unit (kg/pc)">
        <input type="text" id="im" placeholder="Image Link">
        <button class="btn-save" onclick="save()">SAVE TO CLOUD</button>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";

        async function sync() {
            const btn = document.querySelector('.btn-sync');
            btn.innerText = "Syncing...";
            try {
                const res = await fetch(API + "?action=read");
                const data = await res.json();
                localStorage.setItem('mart_data', JSON.stringify(data));
                alert("Data Updated! " + data.length + " items saved offline.");
            } catch (e) {
                alert("Sync Error: Check Internet or Google Script Permissions.");
            }
            btn.innerText = "UPDATE DATA 🔄";
        }

        async function save() {
            const payload = {
                action: 'add',
                id: document.getElementById('id').value,
                en: document.getElementById('en').value,
                ur: document.getElementById('ur').value,
                price: document.getElementById('pr').value,
                unit: document.getElementById('un').value,
                img: document.getElementById('im').value
            };
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("Saved to Cloud! Now click Update Data.");
        }
    </script>
</body>
</html>
