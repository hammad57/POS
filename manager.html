<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#1e293b; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
        .login-box { background:white; padding:30px; border-radius:15px; text-align:center; }
        
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #22c55e; color: white; width: 100%; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; }
        th { background: #f8fafc; }
        .action-btns { display: flex; gap: 10px; }
        .edit-btn { color: blue; cursor: pointer; }
        .del-btn { color: red; cursor: pointer; }
        
        #print-area { display: none; margin-top: 20px; }
        @media print { .no-print { display: none; } #print-area { display: block; } }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h3>Hammad Mart Admin</h3>
            <p>Enter 4-Digit PIN</p>
            <input type="number" id="pin" pattern="\d*" inputmode="numeric" style="font-size:24px; text-align:center; width:150px;" maxlength="4">
            <button class="btn btn-save" onclick="checkPin()">Unlock</button>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <div class="box no-print">
            <h2 id="form-title">🛒 Add New Product</h2>
            <input type="hidden" id="isEdit" value="false">
            <input type="text" id="pID" placeholder="Product ID (e.g. 101)">
            <input type="text" id="enName" placeholder="English Name">
            <input type="text" id="urName" placeholder="Urdu Name" dir="rtl">
            <input type="number" id="price" placeholder="Price (Rs)">
            <select id="unit">
                <option value="Per Item">Per Item</option>
                <option value="Per Kg">Per Kg</option>
                <option value="Per Liter">Per Liter</option>
            </select>
            <input type="text" id="img" placeholder="Image URL">
            <button class="btn btn-save" onclick="saveData()">Save Product</button>
            <button onclick="resetForm()" style="width:100%; margin-top:5px; border:none; background:none; color:gray; cursor:pointer;">Clear / Add New</button>
        </div>

        <div class="box" style="margin-top:20px;">
            <h3>Inventory List</h3>
            <div style="overflow-x:auto;">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";

        function checkPin() {
            if(document.getElementById('pin').value === "0309") {
                document.getElementById('auth-screen').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                loadTable();
            } else {
                alert("Wrong PIN!");
            }
        }

        async function loadTable() {
            const res = await fetch(`${API}?action=listAll`);
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.en}<br><small>${item.ur}</small></td>
                        <td>${item.pr}</td>
                        <td class="action-btns">
                            <span class="edit-btn" onclick='editRow(${JSON.stringify(item)})'>✏️</span>
                            <span class="del-btn" onclick='deleteRow("${item.id}")'>🗑️</span>
                        </td>
                    </tr>
                `;
            });
        }

        function saveData() {
            const isEdit = document.getElementById('isEdit').value === "true";
            const data = {
                action: isEdit ? "update" : "add",
                id: document.getElementById('pID').value,
                enName: document.getElementById('enName').value,
                urName: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };

            fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => {
                alert("Done!");
                resetForm();
                loadTable();
            });
        }

        function editRow(item) {
            document.getElementById('form-title').innerText = "📝 Edit Product";
            document.getElementById('isEdit').value = "true";
            document.getElementById('pID').value = item.id;
            document.getElementById('pID').readOnly = true;
            document.getElementById('enName').value = item.en;
            document.getElementById('urName').value = item.ur;
            document.getElementById('price').value = item.pr;
            document.getElementById('unit').value = item.un;
            document.getElementById('img').value = item.img;
            window.scrollTo(0,0);
        }

        function deleteRow(id) {
            if(confirm("Are you sure?")) {
                fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: "delete", id: id}) })
                .then(() => loadTable());
            }
        }

        function resetForm() {
            document.getElementById('form-title').innerText = "🛒 Add New Product";
            document.getElementById('isEdit').value = "false";
            document.getElementById('pID').value = "";
            document.getElementById('pID').readOnly = false;
            document.getElementById('enName').value = "";
            document.getElementById('urName').value = "";
            document.getElementById('price').value = "";
            document.getElementById('img').value = "";
        }
    </script>
</body>
</html>
