<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#1e293b; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
        .login-box { background:white; padding:30px; border-radius:15px; text-align:center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 850px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save { background: #22c55e; color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-download { background: #3b82f6; color: white; width: 100%; margin-bottom: 15px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: white; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 12px; }
        tbody tr { cursor: pointer; transition: background 0.2s; }
        tbody tr:hover { background: #f1f5f9; }
        
        .action-btns { display: flex; gap: 15px; font-size: 18px; }
        .edit-btn { color: #3b82f6; }
        .del-btn { color: #ef4444; }

        /* Modal / Popup Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: #94a3b8; }
        #modal-qr { display: flex; justify-content: center; margin: 20px 0; }
        .modal-img { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; border: 2px solid #22c55e; margin-bottom: 10px; }

        /* Print Layout for Labels */
        #print-labels-container { display: none; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px; background: white; }
        .print-sticker { border: 1px solid #ddd; padding: 8px; text-align: center; background: white; page-break-inside: avoid; border-radius: 5px; }
        .print-name-en { font-size: 11px; font-weight: bold; margin-bottom: 2px; height: 14px; overflow: hidden; }
        .print-name-ur { font-size: 13px; color: #444; margin-top: 2px; height: 18px; overflow: hidden; }
        
        @media print { 
            body * { visibility: hidden; } 
            #print-labels-container, #print-labels-container * { visibility: visible; }
            #print-labels-container { display: grid !important; position: absolute; top: 0; left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h2 style="margin-top:0; color:#1e293b;">Hammad Mart</h2>
            <p style="color:#64748b;">Enter Admin PIN</p>
            <input type="password" id="pin" pattern="\d*" inputmode="numeric" style="font-size:24px; text-align:center; width:160px; letter-spacing:8px;" maxlength="4">
            <button class="btn btn-save" onclick="checkPin()">Unlock Access</button>
        </div>
    </div>

    <div id="qrModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-img" class="modal-img" src="">
            <h2 id="modal-en" style="margin:5px 0;"></h2>
            <h3 id="modal-ur" style="margin:0; color:#22c55e;"></h3>
            <div id="modal-qr"></div>
            <p id="modal-price" style="font-size:24px; font-weight:900; margin:10px 0;"></p>
            <p id="modal-id" style="color:#94a3b8; font-size:12px;"></p>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <div class="box">
            <button class="btn btn-download" onclick="prepareAndPrint()">
                <span>📄</span> Download QR Labels (PDF)
            </button>

            <h2 id="form-title" style="margin-top:0;">🛒 Add New Product</h2>
            <input type="hidden" id="isEdit" value="false">
            <input type="text" id="pID" placeholder="Product ID (e.g. 101)">
            <input type="text" id="enName" placeholder="English Name">
            <input type="text" id="urName" placeholder="Urdu Name" dir="rtl">
            <input type="number" id="price" placeholder="Price (Rs)">
            <select id="unit">
                <option value="Per Item">Per Item</option>
                <option value="Per Kg">Per Kg</option>
                <option value="Per Liter">Per Liter</option>
                <option value="Per Pack">Per Pack</option>
            </select>
            <input type="text" id="img" placeholder="Image URL (Link)">
            <button class="btn btn-save" id="saveBtn" onclick="saveData()">Save Product</button>
            <button onclick="resetForm()" style="width:100%; margin-top:10px; border:none; background:none; color:#94a3b8; cursor:pointer; font-size:14px;">Clear Form / Add New Item</button>
        </div>

        <div class="box">
            <h3 style="margin-top:0;">Inventory List <small style="font-weight:normal; color:#94a3b8; font-size:12px;">(Click row to view QR)</small></h3>
            <div style="overflow-x:auto;">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Details</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="print-labels-container"></div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx_QoHQzoG7laQkuFHNCKWpMn2z-yPcTak-OJ4AnnRcmCdGBgDRdKJUngwLimgKcoFu1Q/exec";
        let allProducts = [];

        function checkPin() {
            if(document.getElementById('pin').value === "0309") {
                document.getElementById('auth-screen').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                loadTable();
            } else { alert("Incorrect PIN!"); }
        }

        async function loadTable() {
            const res = await fetch(`${API}?action=listAll`);
            allProducts = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            allProducts.forEach(item => {
                const tr = document.createElement('tr');
                tr.onclick = () => showQRModal(item);
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td><b>${item.en}</b><br><span style="color:#22c55e">${item.ur || ''}</span></td>
                    <td>Rs. ${item.pr}</td>
                    <td class="action-btns">
                        <span class="edit-btn" onclick='event.stopPropagation(); editRow(${JSON.stringify(item)})'>✏️</span>
                        <span class="del-btn" onclick='event.stopPropagation(); deleteRow("${item.id}")'>🗑️</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showQRModal(item) {
            document.getElementById('modal-en').innerText = item.en;
            document.getElementById('modal-ur').innerText = item.ur || "";
            document.getElementById('modal-price').innerText = "Rs. " + item.pr;
            document.getElementById('modal-id').innerText = "Product ID: " + item.id;
            document.getElementById('modal-img').src = item.img || "https://via.placeholder.com/150?text=No+Image";
            
            const qrContainer = document.getElementById('modal-qr');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: item.id.toString(), width: 180, height: 180 });
            
            document.getElementById('qrModal').style.display = "flex";
        }

        function closeModal() { document.getElementById('qrModal').style.display = "none"; }

        function prepareAndPrint() {
            const container = document.getElementById('print-labels-container');
            container.innerHTML = "";
            allProducts.forEach(item => {
                const sticker = document.createElement('div');
                sticker.className = 'print-sticker';
                const qrId = "print-qr-" + item.id;
                sticker.innerHTML = `
                    <div class="print-name-en">${item.en}</div>
                    <div id="${qrId}" style="display:flex; justify-content:center;"></div>
                    <div class="print-name-ur">${item.ur || ''}</div>
                `;
                container.appendChild(sticker);
                new QRCode(document.getElementById(qrId), { text: item.id.toString(), width: 90, height: 90 });
            });
            setTimeout(() => { window.print(); }, 1000);
        }

        function saveData() {
            const isEdit = document.getElementById('isEdit').value === "true";
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const data = {
                action: isEdit ? "update" : "add",
                id: document.getElementById('pID').value,
                enName: document.getElementById('enName').value,
                urName: document.getElementById('urName').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };

            fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => {
                alert("Product Saved Successfully!");
                resetForm();
                loadTable();
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = "Save Product";
            });
        }

        function editRow(item) {
            document.getElementById('form-title').innerText = "📝 Edit Product";
            document.getElementById('isEdit').value = "true";
            document.getElementById('pID').value = item.id;
            document.getElementById('pID').readOnly = true;
            document.getElementById('enName').value = item.en;
            document.getElementById('urName').value = item.ur;
            document.getElementById('price').value = item.pr;
            document.getElementById('unit').value = item.un;
            document.getElementById('img').value = item.img;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function deleteRow(id) {
            if(confirm("Are you sure you want to delete this product?")) {
                fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: "delete", id: id}) })
                .then(() => loadTable());
            }
        }

        function resetForm() {
            document.getElementById('form-title').innerText = "🛒 Add New Product";
            document.getElementById('isEdit').value = "false";
            document.getElementById('pID').value = "";
            document.getElementById('pID').readOnly = false;
            document.getElementById('enName').value = "";
            document.getElementById('urName').value = "";
            document.getElementById('price').value = "";
            document.getElementById('img').value = "";
        }
    </script>
</body>
</html>
