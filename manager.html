<script>
    const API = "APNA_NEW_DEPLOYMENT_URL_YAHAN_DAALEIN";
    let allProducts = [];

    async function loadData() {
        showLoading(true);
        try {
            // "read" action ab script mein handle ho raha hai
            const res = await fetch(`${API}?action=read`);
            allProducts = await res.json();
            renderTable(allProducts);
        } catch (e) { 
            console.error(e);
            alert("Data load nahi ho saka. Deployment URL check karein."); 
        }
        showLoading(false);
    }

    async function saveData() {
        const id = document.getElementById('pID').value;
        if(!id) return alert("ID zaroori hai!");

        showLoading(true);
        const payload = {
            action: 'add',
            id: id,
            en: document.getElementById('enName').value,
            ur: document.getElementById('urName').value,
            price: document.getElementById('price').value,
            unit: document.getElementById('unit').value,
            img: document.getElementById('img').value
        };

        try {
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            resetForm();
            loadData();
        } catch (e) {
            alert("Save karte waqt error aaya.");
        }
        showLoading(false);
    }
    // Baaki functions (renderTable, deleteItem etc.) wahi rahen ge
</script>
