<!DOCTYPE html>
<html>
<head>
    <title>Hammad Mart - Manager (Barcode System)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #22c55e; --light: #f1f5f9; --white: #ffffff; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 80px; }
        
        #loading { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: var(--primary); 
            color: white; 
            padding: 12px 24px; 
            border-radius: 12px; 
            display: none; 
            align-items: center; 
            gap: 12px; 
            z-index: 9999; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-left: 5px solid var(--accent);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--accent); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .nav-bar { background: var(--primary); padding: 15px; color: white; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; font-weight: bold; }
        
        .tabs { display: flex; background: var(--primary); }
        .tab { flex: 1; padding: 15px; text-align: center; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; font-weight: bold; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }

        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #64748b; font-size: 13px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 10px; }
        .btn-secondary { background: #64748b; color: white; }
        .btn:active { transform: scale(0.98); }

        .product-item { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #f1f5f9; gap: 12px; }
        .product-img { width: 50px; height: 50px; object-fit: contain; background: #f8fafc; border-radius: 8px; }
        .product-info { flex: 1; }
        .product-info h4 { margin: 0; color: #1e293b; font-size: 15px; }
        .product-info p { margin: 2px 0; color: #64748b; font-size: 12px; }
        .price-tag { color: var(--accent); font-weight: 800; font-size: 14px; }
        
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #3b82f6; color: white; padding: 8px; border-radius: 6px; border:none; font-size: 12px; }
        .del-btn { background: var(--red); color: white; padding: 8px; border-radius: 6px; border:none; font-size: 12px; }

        .search-box { position: sticky; top: 115px; z-index: 90; background: var(--light); padding: 10px 0; }
        
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; }

        /* Camera UI */
        #camera-preview { width: 100%; border-radius: 10px; display: none; margin-top: 10px; background: #000; }
        #capture-btn { display: none; background: #ef4444; margin-top: 10px; }
        #img-preview-container { margin-top: 10px; display: none; text-align: center; }
        #img-preview-container img { max-width: 100px; border-radius: 8px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span id="loading-text">Processing...</span>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Hammad Mart</a>
        <div style="font-size: 12px; opacity: 0.8;" id="sync-status">Mode: Online</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('add')">Add / Edit</div>
        <div class="tab" onclick="switchTab('list')">All Products</div>
    </div>

    <div id="add-view" class="container">
        <div class="card">
            <h3 id="form-header" style="margin-top:0; color: var(--primary);">Add New Product</h3>
            
            <button class="btn btn-secondary" style="width:100%; margin-bottom:15px;" onclick="toggleScanner()">📷 Scan Barcode</button>
            <div id="reader"></div>

            <div class="form-group">
                <label>Product ID (Barcode)</label>
                <input type="text" id="pID" placeholder="Scan or Enter ID">
            </div>

            <div class="form-group">
                <label>English Name</label>
                <input type="text" id="enName" placeholder="e.g. Sugar">
            </div>

            <div class="form-group">
                <label>Urdu Name</label>
                <input type="text" id="urName" placeholder="مثال: چینی" dir="rtl">
            </div>

            <div class="btn-grid">
                <div class="form-group">
                    <label>Purchase Price</label>
                    <input type="number" id="purchasePrice" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Sale Price</label>
                    <input type="number" id="price" placeholder="0.00">
                </div>
            </div>

            <div class="form-group">
                <label>Unit</label>
                <select id="unit">
                    <option value="kg">KG</option>
                    <option value="piece">Piece</option>
                    <option value="pack">Pack</option>
                    <option value="ltr">Litre</option>
                </select>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="img" placeholder="URL or Captured Data">
                    <button class="btn btn-secondary" onclick="startCamera()" style="white-space:nowrap; padding: 10px;">📷 Take Photo</button>
                </div>
                
                <video id="camera-preview" autoplay playsinline></video>
                <button id="capture-btn" class="btn btn-primary" onclick="capturePhoto()">SURE! CAPTURE NOW 📸</button>
                <canvas id="photo-canvas" style="display:none;"></canvas>
                
                <div id="img-preview-container">
                    <p style="font-size:11px; margin:5px 0;">Preview:</p>
                    <img id="img-preview" src="">
                </div>
            </div>

            <button class="btn btn-primary" onclick="saveProduct()">SAVE PRODUCT ✓</button>
            <button class="btn btn-secondary" style="width:100%; margin-top:10px; background:#e2e8f0; color:#475569;" onclick="resetForm()">CLEAR FORM</button>
        </div>
    </div>

    <div id="list-view" class="container" style="display:none;">
        <div class="search-box">
            <input type="text" id="listSearch" placeholder="Search by name or ID..." oninput="filterList()">
        </div>
        <div class="card" style="padding:0; overflow:hidden;" id="product-list"></div>
        
        <div style="margin-top:20px;">
            <button class="btn btn-primary" style="background:#3b82f6; width:100%;" onclick="generateBarcodePDF()">Download Barcode Catalog PDF 🖨️</button>
            <canvas id="barcodeCanvasHelper" style="display:none;"></canvas>
        </div>
    </div>

    <script>
        const SHEET_API = "https://script.google.com/macros/s/AKfycbzX73LEA1QPzu_n-oikZH46w3sK8XLx_teqF3UrpobrKMADJHifzyDOKJTC0As8ys6o/exec";
        let allProducts = [];
        let selectedID = null;
        let scanner = null;
        let stream = null;

        // --- Camera Management ---
        async function startCamera() {
            const video = document.getElementById('camera-preview');
            const btn = document.getElementById('capture-btn');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
                video.style.display = 'block';
                btn.style.display = 'block';
            } catch (err) { alert("Camera Error: " + err); }
        }

        function capturePhoto() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('photo-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
            document.getElementById('img').value = dataUrl;
            document.getElementById('img-preview').src = dataUrl;
            document.getElementById('img-preview-container').style.display = 'block';
            stopCamera();
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('camera-preview').style.display = 'none';
            document.getElementById('capture-btn').style.display = 'none';
        }

        // --- Basic UI Logic ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            if(tab === 'add') {
                document.getElementById('add-view').style.display = 'block';
                document.getElementById('list-view').style.display = 'none';
            } else {
                document.getElementById('add-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                loadData();
            }
        }

        function showLoader(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading').style.display = 'flex';
        }
        function hideLoader() { document.getElementById('loading').style.display = 'none'; }

        async function loadData() {
            showLoader("Loading items...");
            try {
                const res = await fetch(SHEET_API + "?action=read");
                allProducts = await res.json();
                localStorage.setItem('mart_data', JSON.stringify(allProducts));
                renderList(allProducts);
            } catch(e) {
                const local = localStorage.getItem('mart_data');
                if(local) renderList(JSON.parse(local));
            } finally { hideLoader(); }
        }

        function renderList(data) {
            const listDiv = document.getElementById('product-list');
            listDiv.innerHTML = data.map(p => `
                <div class="product-item">
                    <img class="product-img" src="${p.img || 'https://via.placeholder.com/50'}">
                    <div class="product-info">
                        <h4>${p.en}</h4>
                        <span class="price-tag">Rs. ${p.price}</span>
                    </div>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editProduct('${p.id}')">✏️</button>
                        <button class="del-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function saveProduct() {
            const data = {
                action: selectedID ? "update" : "add",
                id: document.getElementById('pID').value,
                en: document.getElementById('enName').value,
                ur: document.getElementById('urName').value,
                pp: document.getElementById('purchasePrice').value,
                price: document.getElementById('price').value,
                unit: document.getElementById('unit').value,
                img: document.getElementById('img').value
            };
            if(!data.id || !data.en || !data.price) { alert("ID, Name, and Price are required!"); return; }
            showLoader("Saving...");
            resetForm();
            try {
                await fetch(SHEET_API, { method: "POST", body: JSON.stringify(data) });
                loadData();
            } catch(e) { alert("Failed to save."); }
            finally { hideLoader(); }
        }

        function editProduct(id) {
            const p = allProducts.find(item => item.id == id);
            if(p) {
                selectedID = p.id;
                document.getElementById('pID').value = p.id;
                document.getElementById('enName').value = p.en;
                document.getElementById('urName').value = p.ur || "";
                document.getElementById('purchasePrice').value = p.pp || "";
                document.getElementById('price').value = p.price;
                document.getElementById('unit').value = p.unit || "kg";
                document.getElementById('img').value = p.img || "";
                if(p.img) {
                    document.getElementById('img-preview').src = p.img;
                    document.getElementById('img-preview-container').style.display = 'block';
                }
                document.getElementById('form-header').innerText = "Update Product";
                switchTab('add');
            }
        }

        function resetForm() {
            selectedID = null;
            ['pID', 'enName', 'urName', 'purchasePrice', 'price', 'img'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('img-preview-container').style.display = 'none';
            document.getElementById('form-header').innerText = "Add New Product";
            stopCamera();
        }

        function filterList() {
            const q = document.getElementById('listSearch').value.toLowerCase();
            const filtered = allProducts.filter(p => p.en.toLowerCase().includes(q) || p.id.toString().includes(q));
            renderList(filtered);
        }

        function toggleScanner() {
            const div = document.getElementById('reader');
            if(div.style.display === 'block') {
                scanner.clear(); div.style.display = 'none';
            } else {
                div.style.display = 'block';
                scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                scanner.render((id) => { document.getElementById('pID').value = id; toggleScanner(); });
            }
        }

        // --- Barcode PDF System (No Price Written) ---
        async function generateBarcodePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const canvas = document.getElementById('barcodeCanvasHelper');
            
            showLoader("Generating Barcodes...");

            let x = 10;
            let y = 15;
            const cardWidth = 60;
            const cardHeight = 70; // Adjusted height (no price space needed)
            const margin = 5;

            for (let i = 0; i < allProducts.length; i++) {
                const p = allProducts[i];

                // Card Border
                doc.setDrawColor(220);
                doc.rect(x, y, cardWidth, cardHeight);

                // 1. Product Image
                if (p.img) {
                    try {
                        doc.addImage(p.img, 'JPEG', x + 5, y + 5, 50, 30);
                    } catch(e) { doc.text("[No Image]", x + 20, y + 20); }
                }

                // 2. Product Name (BOLD)
                doc.setFontSize(10);
                doc.setFont(undefined, 'bold');
                doc.setTextColor(40);
                doc.text(p.en.substring(0, 25), x + 5, y + 42);

                // 3. Barcode (This will show the price when scanned in system)
                try {
                    JsBarcode(canvas, p.id, {
                        format: "CODE128",
                        width: 2,
                        height: 40,
                        displayValue: true, // Shows ID below barcode
                        fontSize: 14
                    });
                    const barcodeImg = canvas.toDataURL("image/png");
                    doc.addImage(barcodeImg, 'PNG', x + 5, y + 45, 50, 20);
                } catch(err) { console.error(err); }

                // Grid Math (3 columns)
                x += cardWidth + margin;
                if (x > 180) {
                    x = 10;
                    y += cardHeight + margin;
                }

                // New Page if space ends
                if (y > 240 && i < allProducts.length - 1) {
                    doc.addPage();
                    y = 15;
                    x = 10;
                }
            }

            doc.save("Hammad_Mart_Barcodes.pdf");
            hideLoader();
        }

        window.onload = loadData;
    </script>
</body>
</html>
