<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad Mart Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f1f5f9; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); 
            color: var(--text); margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden;
        }
        
        .header { 
            padding: 15px; background: var(--card); 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--accent); z-index: 10;
        }
        .mart-name { font-size: 20px; font-weight: 800; color: var(--accent); margin: 0; letter-spacing: 1px; }
        .admin-btn { background: #3b82f6; color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; }

        /* Search Styles */
        .search-container { padding: 10px; background: var(--card); margin: 5px; border-radius: 12px; }
        .search-input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; 
            background: #0f172a; color: white; box-sizing: border-box; outline: none;
        }
        .search-input:focus { border-color: var(--accent); }
        
        .search-results { 
            position: absolute; width: calc(100% - 30px); left: 15px; 
            max-height: 300px; overflow-y: auto; background: var(--card); 
            border-radius: 10px; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none; border: 1px solid #334155; margin-top: 5px;
        }
        .search-item {
            display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #334155;
            cursor: pointer;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; margin-right: 12px; border: 1px solid #475569; }
        .search-info { flex: 1; overflow: hidden; }
        .search-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-sub { font-size: 12px; color: #94a3b8; }
        .search-price { color: var(--accent); font-weight: bold; font-size: 14px; }

        #reader-container { flex: 1; position: relative; display: flex; flex-direction: column; }
        #reader { width: 100% !important; border: none !important; }
        #reader__dashboard_section_csr button { background: var(--accent) !important; color: white !important; border-radius: 5px !important; padding: 8px !important; border: none !important; }

        .result-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 5000; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .product-card { background: var(--card); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .product-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 15px; margin-bottom: 15px; background: white; }
        .price-tag { font-size: 32px; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .en-name { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
        .ur-name { font-size: 24px; font-weight: 700; color: #3b82f6; margin-bottom: 15px; }
        .detail-row { display: flex; justify-content: space-between; border-top: 1px solid #334155; padding: 10px 0; color: #94a3b8; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: 700; margin-top: 20px; cursor: pointer; }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); z-index: 6000; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner { border: 4px solid #334155; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #error-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ef4444; color: white; padding: 20px; border-radius: 15px; z-index: 7000; display: none; text-align: center; width: 80%; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="mart-name">HAMMAD MART</h1>
        <a href="manager.html" class="admin-btn">MANAGER</a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Name (English/Urdu)..." oninput="handleSearch(this.value)">
        <div id="searchResults" class="search-results"></div>
    </div>

    <div id="reader-container">
        <div id="reader"></div>
    </div>

    <div id="result" class="result-overlay">
        <div class="product-card">
            <img id="p-img" class="product-img" src="" alt="Product">
            <div id="p-en" class="en-name"></div>
            <div id="p-ur" class="ur-name"></div>
            <div id="p-price" class="price-tag"></div>
            <div class="detail-row">
                <span>Unit/Size:</span>
                <span id="p-unit"></span>
            </div>
            <div class="detail-row">
                <span>Barcode:</span>
                <span id="p-id"></span>
            </div>
            <button class="close-btn" onclick="closeResult()">TAP TO SCAN AGAIN</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Finding Product...</p>
    </div>

    <div id="error-popup">
        <h3 style="margin: 0 0 10px 0;">NOT FOUND!</h3>
        <p id="error-msg" style="margin: 0 0 15px 0;"></p>
        <button onclick="hideError()" style="padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; background: white; color: #ef4444;">TRY AGAIN</button>
    </div>

    <script>
        // Use your existing Apps Script URL
        const API_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true
        });

        html5QrcodeScanner.render(onScanSuccess);

        function onScanSuccess(decodedText) {
            processItem(decodedText);
        }

        async function processItem(barcode) {
            document.getElementById('loading-overlay').style.display = 'flex';
            
            // Step 1: Check Online (if internet is available)
            if (navigator.onLine) {
                try {
                    const response = await fetch(API_URL + "?id=" + barcode);
                    const data = await response.json();
                    if (data && data.id) {
                        showProduct(data);
                        return;
                    }
                } catch (e) {
                    console.log("Online fetch failed, switching to local.");
                }
            }

            // Step 2: Offline/Fallback Mode (Check Local Storage)
            const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
            const item = localData.find(p => p.id == barcode || p.pID == barcode);

            if (item) {
                showProduct(item);
            } else {
                showError("Barcode " + barcode + " is not in records.");
            }
        }

        function handleSearch(query) {
            const resultsDiv = document.getElementById('searchResults');
            if (!query || query.length < 2) { 
                resultsDiv.style.display = 'none'; 
                return; 
            }

            const localData = JSON.parse(localStorage.getItem('mart_data') || "[]");
            const filtered = localData.filter(p => {
                const en = (p.enName || p.en || "").toLowerCase();
                const ur = (p.urName || p.ur || "");
                const code = (p.id || p.pID || "");
                return en.includes(query.toLowerCase()) || ur.includes(query) || code.includes(query);
            });

            if (filtered.length > 0) {
                resultsDiv.innerHTML = "";
                filtered.forEach(p => {
                    const name = p.enName || p.en || "No Name";
                    const urName = p.urName || p.ur || "";
                    const price = p.price || p.pr || "0";
                    const code = p.id || p.pID || "---";
                    const img = (p.img && p.img.length > 10) ? p.img : "https://via.placeholder.com/50";

                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.onclick = () => {
                        showProduct(p);
                        resultsDiv.style.display = 'none';
                        document.getElementById('searchInput').value = "";
                    };
                    div.innerHTML = `
                        <img src="${img}">
                        <div class="search-info">
                            <div class="search-name">${name}</div>
                            <div class="search-sub">${urName} | ID: ${code}</div>
                        </div>
                        <div class="search-price">Rs.${price}</div>
                    `;
                    resultsDiv.appendChild(div);
                });
                resultsDiv.style.display = 'block';
            } else {
                resultsDiv.style.display = 'none';
            }
        }

        function showProduct(data) {
            document.getElementById('loading-overlay').style.display = 'none';
            
            // Handle both Local keys (pr, un, en) and API keys (price, unit, enName)
            document.getElementById('p-en').innerText = data.enName || data.en || "No Name";
            document.getElementById('p-ur').innerText = data.urName || data.ur || "";
            document.getElementById('p-price').innerText = "Rs. " + (data.price || data.pr || "0");
            document.getElementById('p-unit').innerText = (data.unit || data.un || "pc");
            document.getElementById('p-id').innerText = data.id || data.pID || "N/A";
            
            const img = (data.img && data.img.length > 10) ? data.img : "https://via.placeholder.com/150?text=No+Image";
            document.getElementById('p-img').src = img;
            
            document.getElementById('result').style.display = "block";
            html5QrcodeScanner.pause();
        }

        function showError(msg) {
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('error-msg').innerText = msg;
            document.getElementById('error-popup').style.display = "block";
        }

        function hideError() {
            document.getElementById('error-popup').style.display = "none";
            html5QrcodeScanner.resume();
        }

        function closeResult() {
            document.getElementById('result').style.display = "none";
            html5QrcodeScanner.resume();
        }
    </script>
</body>
</html>
